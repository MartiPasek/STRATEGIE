<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>🏦 Banka — STRATEGIE</title>
<style>
  :root{--bg:#0a1020;--card:#111a2e;--bord:#243049;--tx:#e6eefb;--mut:#90a0bd;--accent:#5b9dff;--ok:#22c55e;--warn:#f59e0b;--bad:#ef4444}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--tx);font-family:-apple-system,Segoe UI,Roboto,sans-serif;font-size:14px}
  .wrap{max-width:880px;margin:0 auto;padding:16px}
  h1{font-size:21px;margin:0 0 2px}
  .sub{color:var(--mut);font-size:13px;margin-bottom:14px}
  .tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px;border-bottom:1px solid var(--bord);padding-bottom:10px}
  .tab{background:transparent;border:1px solid var(--bord);color:var(--tx);border-radius:9px;padding:7px 14px;font-size:13px;font-weight:700;cursor:pointer}
  .tab.on{background:var(--accent);border-color:var(--accent);color:#06101f}
  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:18px}
  .stat{background:var(--card);border:1px solid var(--bord);border-radius:12px;padding:12px 14px}
  .stat .n{font-size:21px;font-weight:800}
  .stat .l{color:var(--mut);font-size:12px;margin-top:2px}
  .stat.warn .n{color:var(--warn)} .stat.ok .n{color:var(--ok)}
  .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}
  .ca{background:var(--card);border:1px solid var(--bord);border-radius:14px;padding:16px;cursor:pointer;display:flex;gap:12px;align-items:flex-start;transition:border-color .15s}
  .ca:hover{border-color:var(--accent)} .ca .ic{font-size:26px;line-height:1}
  .ca .t{font-weight:700;font-size:15px} .ca .d{color:var(--mut);font-size:12.5px;margin-top:3px} .ca .b{margin-top:6px;font-size:12px;color:var(--accent);font-weight:600}
  table{width:100%;border-collapse:collapse;margin-top:6px}
  th,td{border:1px solid var(--bord);padding:6px 8px;font-size:12.5px;text-align:left;vertical-align:top}
  th{background:#0f1830;color:#9fb2d4;position:sticky;top:0}
  td.r,th.r{text-align:right} tr.clik{cursor:pointer} tr.clik:hover td{background:#16213a}
  .pill{display:inline-block;padding:1px 7px;border-radius:8px;font-size:11px;font-weight:700}
  .pill.ok{background:rgba(34,197,94,.18);color:#86efac} .pill.no{background:rgba(245,158,11,.18);color:#fcd9a0}
  .sec{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--mut);font-weight:700;margin:16px 0 6px}
  .hint{color:var(--mut);padding:18px;text-align:center} .err{color:var(--bad);padding:18px}
  .mdbody{line-height:1.55;font-size:14px} .mdbody h1{font-size:20px;margin:14px 0 6px} .mdbody h2{font-size:17px;margin:18px 0 6px;border-bottom:1px solid var(--bord);padding-bottom:4px} .mdbody h3{font-size:15px;margin:14px 0 4px;color:#cfe0fb}
  .mdbody code{background:#0f1830;padding:1px 5px;border-radius:5px;font-size:12.5px} .mdbody blockquote{border-left:3px solid var(--accent);margin:8px 0;padding:4px 12px;color:var(--mut)} .mdbody ul,.mdbody ol{padding-left:22px} .mdbody hr{border:0;border-top:1px solid var(--bord);margin:16px 0}
  .back{background:transparent;border:1px solid var(--bord);color:var(--accent);border-radius:8px;padding:5px 12px;font-size:13px;font-weight:700;cursor:pointer;margin-bottom:8px}
</style>
</head>
<body>
<div class="wrap"><h1>🏦 Banka</h1><div class="sub">Bankovní výpisy, párování plateb, daně/poplatky, účetní deník a doklady. Vlastník: Petra Šafránková (účetní).</div>
<div class="tabs" id="tabs"></div>
<div id="view"><div class="hint">Načítám…</div></div>
</div>
<script>
function esc(s){return(s==null?"":String(s)).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c];});}
function fmt(n){return (n==null?0:Number(n)).toLocaleString("cs-CZ");}
function kc(n,m){return fmt(Math.round(n||0))+" "+(m||"Kč");}
var inApp=(window.self!==window.top);
function goTo(path){ if(inApp){ try{parent.postMessage({stgOpen:path},"*");}catch(e){location.href=path;} } else { location.href=path; } }
function api(p){return fetch(p,{credentials:"include"}).then(function(r){
  if(!r.ok){var m=r.status===403?"Bankovní sekci vidí jen účetní (Petra) a vedení.":(r.status===401?"Nejsi přihlášen.":"Chyba HTTP "+r.status);return{ok:false,error:m};}
  return r.json();}).catch(function(){return{ok:false,error:"Spojení se serverem selhalo."};});}
var V=document.getElementById("view");
var TABS=[["prehled","📊 Přehled"],["saldo","💰 Saldo"],["zarazeni","🧮 Zařazení 2026"],["ucty","🏛️ Účty"],["vypisy","🧾 Výpisy"],["parovani","🔗 Návrhy párování"],["mustr","📐 Mustr 2025"],["prirucka","📖 Průvodce"],["nastroje","🔧 Nástroje"]];
var cur="prehled";
function renderTabs(){document.getElementById("tabs").innerHTML=TABS.map(function(t){return '<button class="tab'+(t[0]===cur?' on':'')+'" data-t="'+t[0]+'">'+t[1]+'</button>';}).join("");
  Array.prototype.forEach.call(document.querySelectorAll(".tab"),function(b){b.onclick=function(){cur=b.getAttribute("data-t");renderTabs();load();};});}
function load(){V.innerHTML='<div class="hint">Načítám…</div>'; ({prehled:tPrehled,saldo:tSaldo,zarazeni:tZarazeni,ucty:tUcty,vypisy:tVypisy,parovani:tParovani,mustr:tMustr,prirucka:tPrirucka,nastroje:tNastroje}[cur])();}

var _MAPABLE={"Mzda":1,"Úhrada dodavateli":1,"Úhrada OSVČ (dodavatel)":1,"Příjem od odběratele":1,"Záloha/náhrada zaměstnanci":1};
function tZarazeni(katDetail){
  if(katDetail){ return api("/api/v1/erp/app/banka/zarazeni?kat="+encodeURIComponent(katDetail)).then(function(j){
    if(!j.ok){V.innerHTML='<div class="err">'+esc(j.error)+'</div>';return;}
    var h='<button class="back" id="bk">← Zařazení</button><div class="sec">'+esc(katDetail)+'</div>';
    h+='<table><tr><th>Datum</th><th class="r">Částka</th><th>Vlastník</th><th>VS</th><th>KS</th><th>MD</th><th>DAL</th></tr>';
    (j.polozky||[]).forEach(function(p){h+='<tr><td>'+esc(p.dat||"")+'</td><td class="r">'+kc(p.castka,p.mena)+'</td><td>'+esc(p.vlastnik||"")+'</td><td>'+esc(p.vs||"")+'</td><td>'+esc(p.ks||"")+'</td><td>'+esc(p.ucet_md||"")+'</td><td>'+esc(p.ucet_dal||"")+'</td></tr>';});
    h+='</table>';V.innerHTML=h;document.getElementById("bk").onclick=function(){tZarazeni();};});
  }
  api("/api/v1/erp/app/banka/zarazeni").then(function(j){
    if(!j.ok){V.innerHTML='<div class="err">'+esc(j.error)+'</div>';return;}
    var h='<div class="sub">Letošní nezaúčtované platby zařazené podle <b>vlastníka účtu + pracovního vztahu</b> (OSVČ → dodavatel, ne mzda!). Předkontace je <b>porovnaná s rokem 2025</b> — kde realitu známe, účtuje se rovnou (podpis Marti‑AI), bez návrhu.</div>';
    h+='<table><tr><th>Kategorie</th><th class="r">Počet</th><th class="r">Suma</th><th>Předkontace</th><th class="r">2025</th><th></th></tr>';
    (j.souhrn||[]).forEach(function(c){
      var pk=(c.ucet_md?(c.ucet_md+' / '+c.ucet_dal):'<span class="kmut" style="color:var(--mut)">— určí účetní —</span>');
      var p25=(c.potvrzeno_2025>0?('<span class="pill ok">✓ '+fmt(c.potvrzeno_2025)+'×</span>'):(c.ucet_md?'<span class="pill no">nové</span>':'—'));
      var btn=_MAPABLE[c.kat]?('<button class="tab gen" data-k="'+esc(c.kat)+'">Zaúčtovat rovnou</button>'):'';
      h+='<tr class="clik" data-kat="'+esc(c.kat)+'"><td>'+esc(c.kat)+'</td><td class="r">'+fmt(c.n)+'</td><td class="r">'+kc(c.suma)+'</td><td>'+pk+'</td><td class="r">'+p25+'</td><td>'+btn+'</td></tr>';
    });
    h+='</table><div class="sub" style="margin-top:8px">Sloupec 2025 = kolikrát se ta předkontace reálně zaúčtovala loni (potvrzení reality). Klik na kategorii → položky.</div>';
    V.innerHTML=h;
    Array.prototype.forEach.call(V.querySelectorAll(".gen"),function(b){b.onclick=function(e){e.stopPropagation();var k=b.getAttribute("data-k");b.textContent="…";
      fetch("/api/v1/erp/app/banka/zarazeni/generovat",{method:"POST",credentials:"include",headers:{"Content-Type":"application/json"},body:JSON.stringify({kat:k})}).then(function(r){return r.json();}).then(function(x){alert(x.ok?("Zaúčtováno rovnou: "+x.vytvoreno+" (podpis Marti‑AI). Najdeš v Účetnictví → Deník."):("Chyba: "+(x.error||"")));tZarazeni();});};});
    Array.prototype.forEach.call(V.querySelectorAll("tr.clik"),function(tr){tr.onclick=function(){tZarazeni(tr.getAttribute("data-kat"));};});
  });
}

var _saldoTyp="pohledavky";
function tSaldo(){api("/api/v1/erp/app/banka/saldo?typ="+_saldoTyp).then(function(j){
  if(!j.ok){V.innerHTML='<div class="err">'+esc(j.error)+'</div>';return;}
  var p=j.souhrn.pohledavky, z=j.souhrn.zavazky;
  var h='<div class="stats">';
  h+='<div class="stat ok"><div class="n">'+kc(p.suma)+'</div><div class="l">Pohledávky — kdo nám dluží ('+fmt(p.pocet)+' fa)</div></div>';
  h+='<div class="stat warn"><div class="n">'+kc(z.suma)+'</div><div class="l">Závazky — komu dlužíme ('+fmt(z.pocet)+' fa)</div></div>';
  h+='<div class="stat"><div class="n">'+kc(p.suma_po)+'</div><div class="l">pohledávky po splatnosti ('+fmt(p.pocet_po)+')</div></div>';
  h+='<div class="stat"><div class="n">'+kc(z.suma_po)+'</div><div class="l">závazky po splatnosti ('+fmt(z.pocet_po)+')</div></div>';
  h+='</div>';
  h+='<div class="tabs" style="border:0;padding:0;margin-bottom:10px"><button class="tab'+(_saldoTyp==="pohledavky"?" on":"")+'" data-st="pohledavky">📥 Kdo nám dluží</button><button class="tab'+(_saldoTyp==="zavazky"?" on":"")+'" data-st="zavazky">📤 Komu dlužíme</button></div>';
  h+='<table><tr><th>'+(_saldoTyp==="pohledavky"?"Odběratel":"Dodavatel")+'</th><th class="r">Otevřeno</th><th class="r">Faktur</th><th class="r">Po splatnosti</th><th class="r">Max dnů</th></tr>';
  (j.organizace||[]).forEach(function(o){var pd=o.max_prodleni>0;h+='<tr class="clik" data-org="'+o.cislo_org+'"><td>'+esc(o.nazev||"")+'</td><td class="r">'+kc(o.suma)+'</td><td class="r">'+fmt(o.n)+'</td><td class="r"'+(o.suma_po>0?' style="color:var(--warn)"':'')+'>'+(o.suma_po>0?kc(o.suma_po):"—")+'</td><td class="r"'+(pd?' style="color:var(--bad)"':'')+'>'+(pd?o.max_prodleni:"—")+'</td></tr>';});
  h+='</table><div class="sub" style="margin-top:8px">Klik na řádek → otevřené faktury. (311 = pohledávky, 321 = závazky, z Helios saldokonta.)</div>';
  V.innerHTML=h;
  Array.prototype.forEach.call(V.querySelectorAll(".tab[data-st]"),function(b){b.onclick=function(){_saldoTyp=b.getAttribute("data-st");tSaldo();};});
  Array.prototype.forEach.call(V.querySelectorAll("tr.clik"),function(tr){tr.onclick=function(){tSaldoFa(tr.getAttribute("data-org"),tr.querySelector("td").textContent);};});});}
function tSaldoFa(org,nazev){api("/api/v1/erp/app/banka/saldo/faktury?typ="+_saldoTyp+"&org="+org).then(function(j){
  if(!j.ok){V.innerHTML='<div class="err">'+esc(j.error)+'</div>';return;}
  var h='<button class="back" id="bk">← Saldo</button><div class="sec">'+(_saldoTyp==="pohledavky"?"Pohledávky":"Závazky")+' — '+esc(nazev||"")+'</div>';
  h+='<table><tr><th>VS / pár. znak</th><th class="r">Částka</th><th>Měna</th><th>Splatnost</th><th class="r">Dnů po spl.</th><th>Zakázka</th></tr>';
  (j.faktury||[]).forEach(function(f){var pd=f.prodleni>0;h+='<tr><td>'+esc(f.parovaci_znak||"")+'</td><td class="r">'+kc(f.saldo,f.mena)+'</td><td>'+esc(f.mena||"")+'</td><td>'+esc(f.splatno||"")+'</td><td class="r"'+(pd?' style="color:var(--bad)"':'')+'>'+(pd?f.prodleni:"—")+'</td><td>'+esc(f.cislo_zakazky||"")+'</td></tr>';});
  h+='</table>';
  V.innerHTML=h;
  document.getElementById("bk").onclick=function(){tSaldo();};});}

function tPrirucka(){
  function show(){ api("/api/v1/erp/app/kb/raw/banka_pruvodce").then(function(j){
    if(!j.ok){V.innerHTML='<div class="err">Průvodce zatím není dostupný ('+esc(j.error||"")+').</div>';return;}
    var body=(window.marked?marked.parse(j.md):('<pre style="white-space:pre-wrap">'+esc(j.md)+'</pre>'));
    V.innerHTML='<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;gap:8px"><div class="sub" style="margin:0">Příručka pro účetní — dostupná všem oprávněným kdykoli.</div><button class="tab" id="pfull">🖨 Tisk / celá stránka</button></div><div class="mdbody">'+body+'</div>';
    var pf=document.getElementById("pfull"); if(pf)pf.onclick=function(){goTo("/dokument?key=banka_pruvodce");};
  });}
  V.innerHTML='<div class="hint">Načítám průvodce…</div>';
  if(window.marked){show();}
  else{var sc=document.createElement("script");sc.src="https://cdnjs.cloudflare.com/ajax/libs/marked/9.1.6/marked.min.js";sc.onload=show;sc.onerror=show;document.head.appendChild(sc);}
}

function tParovani(){api("/api/v1/erp/app/banka/navrh-parovani?limit=250").then(function(j){
  if(!j.ok){V.innerHTML='<div class="err">'+esc(j.error)+'</div>';return;}
  var h='<div class="sub">Nespárované příchozí platby. Engine identifikuje protistranu podle <b>čísla účtu</b> (registr: dodavatelé/odběratelé/zaměstnanci/úřady, ctí přednastaveno/blokováno) a navrhne otevřenou fakturu. Identifikováno <b>'+j.identifikovano+' / '+j.celkem+'</b>.</div>';
  h+='<table><tr><th>Datum</th><th class="r">Částka</th><th>Z účtu</th><th>VS</th><th>Identifikovaná protistrana</th><th>Návrh faktury</th></tr>';
  (j.polozky||[]).forEach(function(p){
    var own=p.vlastnik?('<span class="pill ok">'+esc(p.vlastnik)+'</span> <span class="kmut" style="color:var(--mut)">'+esc(p.typ||"")+'</span>'):'<span class="pill no">neurčeno</span>';
    var fa=p.navrh_faktura?('saldo '+kc(p.navrh_faktura.saldo)+(p.navrh_faktura.cislo_zakazky?(' · '+esc(p.navrh_faktura.cislo_zakazky)):'')):'—';
    h+='<tr><td>'+esc(p.dat||"")+'</td><td class="r">'+kc(p.castka,p.mena)+'</td><td>'+esc(p.cislo_uctu||"")+(p.kod_banky?('/'+esc(p.kod_banky)):'')+'</td><td>'+esc(p.vs||"")+'</td><td>'+own+'</td><td>'+fa+'</td></tr>';
  });
  h+='</table><div class="sub" style="margin-top:8px">Pozn.: dotažení VS → přijatá objednávka → zakázka konzultuje Petra s instancí 26 (jemné doladění párování faktur).</div>';
  V.innerHTML=h;});}

function tMustr(sbornik){api("/api/v1/erp/app/uctovani/vzor"+(sbornik?("?sbornik="+encodeURIComponent(sbornik)):"")).then(function(j){
  if(!j.ok){V.innerHTML='<div class="err">'+esc(j.error)+'</div>';return;}
  var h='<div class="sub">Uzavřený rok <b>'+j.rok+'</b> = zdroj pravdy. Takto se reálně účtovalo — mustr pro účtování běžného roku. Celkem '+fmt(j.celkem_radku)+' řádků, '+kc(j.celkem_suma)+'.</div>';
  if(!j.celkem_radku){h+='<div class="hint">Deník '+j.rok+' zatím není zrcadlený — spusť v Nástrojích / plánovači „sync_ec_denik".</div>';V.innerHTML=h;return;}
  h+=(sbornik?'<button class="back" id="bk">← Všechny sborníky</button>':'');
  h+='<div class="sec">Sborníky (knihy deníku) '+j.rok+'</div><table><tr><th>Kód</th><th>Název</th><th class="r">Řádků</th><th class="r">Dokladů</th><th class="r">Suma MD</th></tr>';
  (j.sborniky||[]).forEach(function(b){h+='<tr class="clik" data-sb="'+esc(b.sbornik||"")+'"><td>'+esc(b.sbornik||"")+'</td><td>'+esc(b.nazev||"")+'</td><td class="r">'+fmt(b.n)+'</td><td class="r">'+fmt(b.dok)+'</td><td class="r">'+kc(b.suma)+'</td></tr>';});
  h+='</table>';
  h+='<div class="sec">Mustr — kombinace účtů MD / DAL'+(sbornik?(" ve sborníku "+esc(sbornik)):"")+' (dle četnosti)</div><table><tr><th>Sborník</th><th>MD</th><th>DAL</th><th class="r">Počet</th><th class="r">Suma</th></tr>';
  (j.vzory||[]).forEach(function(v){h+='<tr><td>'+esc(v.sbornik||"")+'</td><td>'+esc(v.ucet_md||"")+'</td><td>'+esc(v.ucet_dal||"")+'</td><td class="r">'+fmt(v.n)+'</td><td class="r">'+kc(v.suma)+'</td></tr>';});
  h+='</table>';
  V.innerHTML=h;
  var bk=document.getElementById("bk"); if(bk)bk.onclick=function(){tMustr();};
  Array.prototype.forEach.call(V.querySelectorAll("tr.clik"),function(tr){tr.onclick=function(){tMustr(tr.getAttribute("data-sb"));};});});}

function tPrehled(){api("/api/v1/erp/app/banka/prehled").then(function(j){
  if(!j.ok){V.innerHTML='<div class="err">'+esc(j.error)+'</div>';return;}
  function st(n,l,cls,go){return '<div class="stat '+(cls||"")+(go?' clik':'')+'"'+(go?' data-go="'+go+'" style="cursor:pointer"':'')+'><div class="n">'+n+'</div><div class="l">'+esc(l)+(go?' ›':'')+'</div></div>';}
  var h='<div class="stats">';
  h+=st(fmt(j.vypisy),"výpisy (hlavičky)",null,"tab:vypisy")+st(fmt(j.radky),"řádky výpisů",null,"tab:vypisy");
  h+=st(fmt(j.nesparovano),"nespárováno",(j.nesparovano>0?"warn":"ok"),"drill:nesparovano")+st(kc(j.nesparovano_castka),"nespárovaná částka",null,"drill:nesparovano");
  h+=st(fmt(j.uhrady),"úhrady (Centrála)",null,"drill:uhrady")+st(fmt(j.navrhy),"návrhy zaúčtování",(j.navrhy>0?"warn":""),"tab:zarazeni");
  h+=st(fmt(j.zauctovano),"zaúčtováno","ok","ext:/uctovani")+st(fmt(j.denik),"řádky deníku",null,"ext:/uctovani");
  h+=st(fmt(j.saldo),"otevřené faktury",null,"tab:saldo")+st(fmt(j.doklady),"účetní doklady",null,"ext:/uctovani");
  h+='</div><div class="sub">Klikni na dlaždici → detail (›).</div>';
  V.innerHTML=h;
  Array.prototype.forEach.call(V.querySelectorAll(".stat.clik"),function(el){el.onclick=function(){
    var g=el.getAttribute("data-go")||"";
    if(g.indexOf("tab:")===0){cur=g.slice(4);renderTabs();load();}
    else if(g.indexOf("ext:")===0){goTo(g.slice(4));}
    else if(g==="drill:nesparovano"){tNesparovane();}
    else if(g==="drill:uhrady"){tUhrady();}
  };});});}

function tNesparovane(){
  V.innerHTML='<div class="hint">Načítám nespárované…</div>';
  api("/api/v1/erp/app/parovani/prehled?stav=ne&limit=5000").then(function(j){
    if(!j.ok){V.innerHTML='<div class="err">'+esc(j.error)+'</div>';return;}
    var s=j.summary||{};
    var h='<button class="back" id="bk">← Přehled</button><div class="sec">Nespárované platby — '+fmt(s.nesparovano)+' ('+kc(s.nesparovano_castka)+')</div>';
    h+='<div class="sub">„Nespárováno" = Centrála to nenapojila na fakturu (mzdy/daně/poplatky fakturu nemají). Sloupec Zaúčtováno ukazuje, co o platbě víme.</div>';
    h+='<table><tr><th>Datum</th><th class="r">Částka</th><th>Měna</th><th>Protistrana</th><th>VS</th><th>Zaúčtováno / kategorie</th></tr>';
    (j.radky||[]).forEach(function(r){
      var z;
      if(r.z_stav==='zauctovano'){ z='<span class="pill ok">✓ '+esc(r.z_kat||"")+'</span> '+esc((r.z_md||"")+'/'+(r.z_dal||"")); }
      else if(r.z_stav){ z='<span class="pill no">'+esc(r.z_stav)+' '+esc(r.z_kat||"")+'</span>'; }
      else if(r.predpis||r.kategorie){ z='<span class="kmut" style="color:var(--mut)">rozpoznáno: '+esc(r.predpis||r.kategorie)+'</span>'; }
      else { z='<span class="pill no">nezařazeno</span>'; }
      h+='<tr><td>'+esc(r.dat||"")+'</td><td class="r">'+kc(r.castka,r.mena)+'</td><td>'+esc(r.mena||"")+'</td><td>'+esc(r.nazev_org||"")+'</td><td>'+esc(r.variabilni_symbol||"")+'</td><td>'+z+'</td></tr>';});
    h+='</table><div class="sub" style="margin-top:8px">Zobrazeno '+fmt((j.radky||[]).length)+' z '+fmt(s.nesparovano)+'. Zařazení a předkontaci dělej v tabu 🧮 Zařazení.</div>';
    V.innerHTML=h;
    document.getElementById("bk").onclick=function(){cur="prehled";renderTabs();load();};
  });
}

function tUhrady(){
  V.innerHTML='<div class="hint">Načítám úhrady…</div>';
  api("/api/v1/erp/app/banka/uhrady?limit=500").then(function(j){
    if(!j.ok){V.innerHTML='<div class="err">'+esc(j.error)+'</div>';return;}
    var h='<button class="back" id="bk">← Přehled</button><div class="sec">Úhrady (Centrála) — '+fmt(j.celkem)+'</div>';
    h+='<table><tr><th>Datum</th><th class="r">Částka</th><th>Měna</th><th>Popis</th><th>Faktura</th></tr>';
    (j.uhrady||[]).forEach(function(u){h+='<tr><td>'+esc(u.datum||"")+'</td><td class="r">'+kc(u.castka,u.mena)+'</td><td>'+esc(u.mena||"")+'</td><td>'+esc(u.popis||"")+'</td><td>'+esc(u.id_fak||"")+'</td></tr>';});
    h+='</table>';
    V.innerHTML=h;
    document.getElementById("bk").onclick=function(){cur="prehled";renderTabs();load();};
  });
}

function tUcty(){api("/api/v1/erp/app/banka/ucty").then(function(j){
  if(!j.ok){V.innerHTML='<div class="err">'+esc(j.error)+'</div>';return;}
  var h='<div class="sec">Naše bankovní účty (poslední zůstatek z výpisů)</div><table><tr><th>Účet</th><th>Banka</th><th>Měna</th><th class="r">Výpisů</th><th>Poslední</th><th class="r">Zůstatek</th></tr>';
  (j.ucty||[]).forEach(function(u){h+='<tr class="clik" data-u="'+esc(u.cislo_uctu||"")+'"><td>'+esc(u.cislo_uctu||"—")+'</td><td>'+esc(u.kod_banky||"")+'</td><td>'+esc(u.mena||"")+'</td><td class="r">'+fmt(u.vyp)+'</td><td>'+esc(u.posl||"")+'</td><td class="r">'+kc(u.zustatek,u.mena)+'</td></tr>';});
  h+='</table><div class="sub" style="margin-top:8px">Klikni na účet → jeho výpisy.</div>';
  V.innerHTML=h;
  Array.prototype.forEach.call(V.querySelectorAll("tr.clik"),function(tr){tr.onclick=function(){cur="vypisy";renderTabs();tVypisy(tr.getAttribute("data-u"));};});});}

function tVypisy(ucet){api("/api/v1/erp/app/banka/vypisy"+(ucet?("?ucet="+encodeURIComponent(ucet)):"")).then(function(j){
  if(!j.ok){V.innerHTML='<div class="err">'+esc(j.error)+'</div>';return;}
  var h=(ucet?'<button class="back" id="bk">← Všechny výpisy</button>':'')+'<div class="sec">Bankovní výpisy'+(ucet?(" — účet "+esc(ucet)):"")+'</div>';
  h+='<table><tr><th>Datum</th><th>Výpis</th><th>Účet</th><th>Měna</th><th class="r">Řádků</th><th class="r">Debet</th><th class="r">Kredit</th><th class="r">Zůstatek</th></tr>';
  (j.vypisy||[]).forEach(function(v){h+='<tr class="clik" data-v="'+v.src_id+'"><td>'+esc(v.dat||"")+'</td><td>'+esc(v.cislo_vypisu||"")+'</td><td>'+esc(v.cislo_uctu||"")+'</td><td>'+esc(v.mena||"")+'</td><td class="r">'+fmt(v.pocet_radku)+'</td><td class="r">'+kc(v.obrat_debet,v.mena)+'</td><td class="r">'+kc(v.obrat_kredit,v.mena)+'</td><td class="r">'+kc(v.zustatek_novy,v.mena)+'</td></tr>';});
  h+='</table><div class="sub" style="margin-top:8px">Klikni na výpis → jeho transakce.</div>';
  V.innerHTML=h;
  var bk=document.getElementById("bk"); if(bk)bk.onclick=function(){tVypisy();};
  Array.prototype.forEach.call(V.querySelectorAll("tr.clik"),function(tr){tr.onclick=function(){tVypis(tr.getAttribute("data-v"),ucet);};});});}

function tVypis(vid,ucet){api("/api/v1/erp/app/banka/vypis/"+vid).then(function(j){
  if(!j.ok){V.innerHTML='<div class="err">'+esc(j.error)+'</div>';return;}
  var hd=j.hlavicka||{};
  var h='<button class="back" id="bk">← Výpisy</button><div class="sec">Výpis '+esc(hd.cislo_vypisu||"")+' · '+esc(hd.dat||"")+' · účet '+esc(hd.cislo_uctu||"")+'</div>';
  h+='<table><tr><th>#</th><th>Protistrana</th><th class="r">Částka</th><th>VS</th><th>Splatnost</th><th>Párování</th><th>Zakázka</th></tr>';
  (j.radky||[]).forEach(function(r){var ok=(r.pu>0);h+='<tr><td>'+esc(r.cislo_radku)+'</td><td>'+esc(r.nazev_org||"")+'</td><td class="r">'+kc(r.castka,r.mena)+'</td><td>'+esc(r.variabilni_symbol||"")+'</td><td>'+esc(r.ds||"")+'</td><td><span class="pill '+(ok?'ok':'no')+'">'+(ok?'spárováno':'nespárováno')+'</span></td><td>'+esc(r.cislo_zakazky||"")+'</td></tr>';});
  h+='</table>';
  V.innerHTML=h;
  document.getElementById("bk").onclick=function(){tVypisy(ucet);};});}

function tNastroje(){var h='<div class="sec">Nástroje</div><div class="cards">';
  function ca(ic,t,d,path){return '<div class="ca" data-go="'+esc(path)+'"><div class="ic">'+ic+'</div><div><div class="t">'+esc(t)+'</div><div class="d">'+esc(d)+'</div><div class="b">Otevřít →</div></div></div>';}
  h+=ca("🔗","Párování plateb","Bankovní výpisy ↔ úhrady/faktury, daně a poplatky (template), návrhy zaúčtování.","/parovani");
  h+=ca("📒","Účetnictví & deník","Sborníky, předkontace, číselné řady, doklady a STRATEGIE deník (MD/DAL).","/uctovani");
  h+='</div><div class="sec">Poznámka</div><div class="sub">Vlastní párovací engine (VS → objednávka → zakázka) a dotažení zaúčtování přibývají v dalších fázích.</div>';
  V.innerHTML=h;
  Array.prototype.forEach.call(V.querySelectorAll(".ca[data-go]"),function(el){el.onclick=function(){goTo(el.getAttribute("data-go"));};});}

renderTabs(); load();
</script>
</body>
</html>
