<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BOZP a PO – řízení</title>
<style>
 body{font-family:Segoe UI,Arial,sans-serif;margin:0;background:#f4f6f9;color:#222}
 header{background:#2c3e50;color:#fff;padding:14px 20px}
 header h1{margin:0;font-size:20px}
 header .sub{opacity:.8;font-size:13px;margin-top:3px}
 .wrap{padding:18px 20px;max-width:1200px;margin:0 auto}
 .cards{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:16px}
 .card{background:#fff;border-radius:8px;padding:14px 18px;box-shadow:0 1px 3px rgba(0,0,0,.08);flex:1;min-width:150px}
 .card .n{font-size:26px;font-weight:700}
 .card .l{font-size:12px;color:#666;text-transform:uppercase;letter-spacing:.5px}
 .alarm{background:#fdecea;border:1px solid #f5c6cb;color:#8a1f2b;border-radius:8px;padding:10px 14px;margin-bottom:14px}
 .alarm.ok{background:#e8f5e9;border-color:#c8e6c9;color:#1b5e20}
 .tabs{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
 .tabs button{border:0;background:#e2e6ea;padding:8px 14px;border-radius:6px;cursor:pointer;font-size:14px}
 .tabs button.active{background:#2c3e50;color:#fff}
 table{width:100%;border-collapse:collapse;background:#fff;border-radius:8px;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.08)}
 th,td{text-align:left;padding:8px 10px;border-bottom:1px solid #eee;font-size:13px;vertical-align:top}
 th{background:#f0f2f5;font-size:12px;text-transform:uppercase;color:#555}
 .cat{font-size:11px;color:#888}
 .pill{display:inline-block;padding:2px 8px;border-radius:10px;font-size:11px;background:#eef}
 .pill.PO{background:#fde8cf}
 .lvl{font-weight:700;padding:2px 8px;border-radius:10px;color:#fff}
 .muted{color:#999}
 a{color:#2c6ed5;text-decoration:none}
 .late{color:#c0392b;font-weight:600}
</style>
</head>
<body>
<header>
 <h1>🛡️ BOZP a PO – řízení a evidence</h1>
 <div class="sub" id="tenantLbl">Načítám…</div>
</header>
<div class="wrap">
 <div id="alarm"></div>
 <div class="cards" id="cards"></div>
 <div class="tabs">
   <button data-t="dokumenty" class="active">📄 Dokumenty</button>
   <button data-t="povinnosti">⏰ Termíny a povinnosti</button>
   <button data-t="rizika">⚠️ Registr rizik</button>
   <button data-t="urazy">🩹 Úrazy</button>
 </div>
 <div id="content"></div>
</div>
<script>
var DATA=null, TAB="dokumenty";
function qp(k){return new URLSearchParams(location.search).get(k)||"";}
function api(p){var t=qp("tenant");return p+(t?((p.indexOf("?")>=0?"&":"?")+"tenant="+t):"");}
function esc(s){return (s==null?"":String(s)).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
function load(){
 fetch(api("/api/v1/erp/app/bozp/overview")).then(function(r){return r.json();}).then(function(d){
   if(!d.ok){
     document.getElementById("alarm").innerHTML='<div class="alarm">⏳ '+esc(d.error||"Modul se připravuje")+'</div>';
     document.getElementById("tenantLbl").textContent="—";return;
   }
   DATA=d;
   document.getElementById("tenantLbl").textContent="Organizace: "+esc(d.tenant);
   var c=d.pocty;
   document.getElementById("cards").innerHTML=
     card(c.dokumenty,"Dokumentů")+card(c.povinnosti,"Povinností")+card(c.rizika,"Rizik")+card(c.urazy,"Úrazů");
   var u=d.upominky;
   if(u.po_termine>0) document.getElementById("alarm").innerHTML='<div class="alarm">🔴 <b>'+u.po_termine+'</b> povinností je po termínu. '+(u.blizi_se>0?('Dalších <b>'+u.blizi_se+'</b> se blíží (do 60 dnů).'):'')+'</div>';
   else if(u.blizi_se>0) document.getElementById("alarm").innerHTML='<div class="alarm">🟠 <b>'+u.blizi_se+'</b> povinností se blíží (do 60 dnů).</div>';
   else document.getElementById("alarm").innerHTML='<div class="alarm ok">✓ Žádné povinnosti po termínu.</div>';
   render();
 }).catch(function(e){document.getElementById("alarm").innerHTML='<div class="alarm">Chyba načtení: '+esc(e)+'</div>';});
}
function card(n,l){return '<div class="card"><div class="n">'+n+'</div><div class="l">'+l+'</div></div>';}
function render(){
 if(!DATA)return;
 var h="";
 if(TAB=="dokumenty"){
   h='<table><tr><th>Oblast</th><th>Dokument</th><th>Kategorie</th><th>Verze</th><th>Datum</th></tr>';
   DATA.dokumenty.forEach(function(x){
     h+='<tr><td><span class="pill '+(x.oblast=="PO"?"PO":"")+'">'+esc(x.oblast)+'</span></td>'+
        '<td>'+esc(x.nazev)+'<div class="cat">'+esc(x.soubor_ro||"")+'</div></td>'+
        '<td class="cat">'+esc(x.kategorie||"")+'</td><td>'+esc(x.verze||"")+'</td><td>'+esc(x.datum||"")+'</td></tr>';
   });
   h+='</table>';
 } else if(TAB=="povinnosti"){
   if(!DATA.povinnosti.length) h='<p class="muted">Zatím žádné povinnosti. Přidávají se revize, kontroly, školení a lékařské prohlídky s termíny — pak tu hlídám upomínky.</p>';
   else{
     h='<table><tr><th>Typ</th><th>Předmět</th><th>Perioda</th><th>Poslední</th><th>Další termín</th><th>Odpovědný</th><th>Stav</th></tr>';
     DATA.povinnosti.forEach(function(x){
       var late=x.dt && x.dt<new Date().toISOString().slice(0,10);
       h+='<tr><td>'+esc(x.typ)+'</td><td>'+esc(x.predmet)+'</td><td>'+(x.perioda_mesice?esc(x.perioda_mesice)+" m":"")+'</td>'+
          '<td>'+esc(x.posledni||"")+'</td><td class="'+(late?"late":"")+'">'+esc(x.dalsi_termin||"")+'</td>'+
          '<td>'+esc(x.odpovedny||"")+'</td><td>'+esc(x.stav||"")+'</td></tr>';
     });
     h+='</table>';
   }
 } else if(TAB=="rizika"){
   if(!DATA.rizika.length) h='<p class="muted">Registr rizik je zatím prázdný (soubor Registr rizik 2025 je v dokumentech). Rizika sem lze rozepsat pro řízení opatření a termínů.</p>';
   else{
     h='<table><tr><th>Pracoviště</th><th>Nebezpečí</th><th>D×P</th><th>Úroveň</th><th>Opatření</th><th>Odpovědný</th><th>Termín</th></tr>';
     DATA.rizika.forEach(function(x){
       var col=x.uroven>=15?"#c0392b":(x.uroven>=8?"#e67e22":"#27ae60");
       h+='<tr><td>'+esc(x.pracoviste||"")+'<div class="cat">'+esc(x.cinnost||"")+'</div></td><td>'+esc(x.nebezpeci)+'</td>'+
          '<td>'+(x.dopad||"")+'×'+(x.pravdepodobnost||"")+'</td>'+
          '<td>'+(x.uroven!=null?'<span class="lvl" style="background:'+col+'">'+x.uroven+'</span>':'')+'</td>'+
          '<td>'+esc(x.opatreni||"")+'</td><td>'+esc(x.odpovedny||"")+'</td><td>'+esc(x.termin||"")+'</td></tr>';
     });
     h+='</table>';
   }
 } else if(TAB=="urazy"){
   if(!DATA.urazy.length) h='<p class="muted">Žádné evidované úrazy. Kniha úrazů a traumatologický plán jsou v dokumentech.</p>';
   else{
     h='<table><tr><th>Datum</th><th>Osoba</th><th>Popis</th><th>Stav</th></tr>';
     DATA.urazy.forEach(function(x){h+='<tr><td>'+esc(x.datum||"")+'</td><td>'+esc(x.osoba||"")+'</td><td>'+esc(x.popis||"")+'</td><td>'+esc(x.stav||"")+'</td></tr>';});
     h+='</table>';
   }
 }
 document.getElementById("content").innerHTML=h;
}
document.querySelectorAll(".tabs button").forEach(function(b){
 b.addEventListener("click",function(){
   document.querySelectorAll(".tabs button").forEach(function(x){x.classList.remove("active");});
   b.classList.add("active");TAB=b.getAttribute("data-t");render();
 });
});
load();
</script>
</body>
</html>
