<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chat s Claudem</title>
<style>
  :root{--bg:#0a1018;--card:#121a25;--bord:#1f2a38;--tx:#e6edf5;--mut:#8fa0b4;--accent:#4f8ef7;--green:#34d399;}
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;display:flex;flex-direction:column}
  header{padding:12px 16px;border-bottom:1px solid var(--bord);display:flex;align-items:center;gap:10px}
  header .av{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,#4f8ef7,#a78bfa);display:flex;align-items:center;justify-content:center;font-size:18px}
  header h1{font-size:16px;margin:0;font-weight:800}
  header .s{font-size:11.5px;color:var(--mut)}
  #feed{flex:1;overflow:auto;padding:14px;display:flex;flex-direction:column;gap:8px;max-width:900px;width:100%;margin:0 auto}
  .row{display:flex}
  .row.me{justify-content:flex-end}
  .bub{max-width:78%;padding:8px 12px;border-radius:14px;font-size:14.5px;white-space:pre-wrap;word-break:break-word}
  .me .bub{background:var(--accent);color:#06101f;border-bottom-right-radius:5px}
  .cl .bub{background:var(--card);border:1px solid var(--bord);border-bottom-left-radius:5px}
  .t{font-size:10.5px;color:var(--mut);margin-top:2px}
  .hint{color:var(--mut);text-align:center;padding:18px;font-size:13px}
  .err{color:#ff8a8a;text-align:center;padding:10px}
  footer{border-top:1px solid var(--bord);padding:10px;display:flex;gap:8px;max-width:900px;width:100%;margin:0 auto}
  textarea{flex:1;background:#0a1226;color:var(--tx);border:1px solid #2b3a5c;border-radius:12px;padding:10px 12px;font-size:15px;resize:none;font-family:inherit;max-height:120px}
  button{background:var(--accent);color:#06101f;border:0;border-radius:12px;padding:0 16px;font-size:15px;font-weight:800;cursor:pointer}
  button:disabled{opacity:.5}
</style>
</head>
<body>
<header><div class="av">🛠️</div><div><h1>Chat s Claudem</h1><div class="s" id="sub">řešení rozvrhu — piš sem, co potřebuješ</div></div></header>
<div id="feed"><div class="hint">Načítám…</div></div>
<footer>
  <textarea id="inp" rows="1" placeholder="Napiš zprávu Claudovi…"></textarea>
  <button id="snd">Poslat</button>
</footer>
<script>
function esc(s){return(s==null?"":String(s)).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c];});}
function api(m,p,b){var o={method:m,credentials:"include",headers:{}};if(b){o.headers["Content-Type"]="application/json";o.body=JSON.stringify(b);}
  return fetch(p,o).then(function(r){if(!r.ok)return{ok:false,error:r.status===401?"Nejsi přihlášen — přihlas se prosím znovu.":("HTTP "+r.status)};return r.json();}).catch(function(){return{ok:false,error:"spojení"};});}
var feed=document.getElementById("feed"), inp=document.getElementById("inp"), snd=document.getElementById("snd");
var lastCount=-1, atBottom=true;
feed.addEventListener("scroll",function(){ atBottom=(feed.scrollHeight-feed.scrollTop-feed.clientHeight)<60; });
function render(msgs){
  if(!msgs.length){ feed.innerHTML='<div class="hint">Zatím žádné zprávy.<br>Napiš Claudovi, co u rozvrhu potřebuješ změnit nebo zkontrolovat — přečte si to a odpoví ti sem.</div>'; return; }
  var h="";
  msgs.forEach(function(m){
    var me=(m.sender==="user");
    h+='<div class="row '+(me?"me":"cl")+'"><div><div class="bub">'+esc(m.msg)+'</div><div class="t" style="text-align:'+(me?"right":"left")+'">'+(me?"":"Claude · ")+esc(m.kdy)+'</div></div></div>';
  });
  feed.innerHTML=h;
  if(atBottom) feed.scrollTop=feed.scrollHeight;
}
function load(){
  api("GET","/api/v1/erp/app/claude-chat").then(function(j){
    if(!j||!j.ok){ feed.innerHTML='<div class="err">'+esc((j&&j.error)||"Chyba")+'</div>'; return; }
    if((j.messages||[]).length!==lastCount){ lastCount=(j.messages||[]).length; render(j.messages||[]); }
  });
}
function send(){
  var t=inp.value.trim(); if(!t) return;
  snd.disabled=true;
  api("POST","/api/v1/erp/app/claude-chat/send",{text:t}).then(function(r){
    snd.disabled=false;
    if(r&&r.ok){ inp.value=""; inp.style.height="auto"; atBottom=true; lastCount=-1; load(); }
    else alert("Nepodařilo se odeslat: "+((r&&r.error)||"?"));
  });
}
snd.onclick=send;
inp.addEventListener("input",function(){ this.style.height="auto"; this.style.height=Math.min(this.scrollHeight,120)+"px"; });
inp.addEventListener("keydown",function(e){ if(e.key==="Enter"&&!e.shiftKey){ e.preventDefault(); send(); } });
load(); setInterval(load,5000);
</script>
</body>
</html>
