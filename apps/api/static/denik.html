<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Účetní deník</title>
<style>
  :root{color-scheme:light dark}
  body{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;margin:0;padding:14px;background:#0f1420;color:#e8edf6}
  h1{font-size:19px;margin:0 0 2px}
  .sub{color:#9fb0c8;font-size:12px;margin-bottom:12px}
  .cards{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px}
  .kpi{background:#19202e;border:1px solid #26303f;border-radius:11px;padding:9px 13px;min-width:96px}
  .kpi .v{font-size:18px;font-weight:700}
  .kpi .l{font-size:11px;color:#8fa3bd}
  .chips{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:12px}
  .chip{background:#27313f;color:#cdd9ea;border:0;border-radius:16px;padding:6px 13px;font-size:12.5px;cursor:pointer}
  .chip.on{background:#2563eb;color:#fff}
  table{width:100%;border-collapse:collapse;font-size:12.5px}
  th,td{text-align:left;padding:6px 7px;border-bottom:1px solid #232c3b;vertical-align:top}
  th{color:#8fa3bd;font-weight:600;font-size:11.5px}
  td.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
  .ucet{font-family:ui-monospace,Menlo,monospace}
  .j{display:inline-block;min-width:38px;text-align:center;padding:1px 6px;border-radius:9px;font-weight:700;font-size:11.5px}
  .j.hi{background:#16341f;color:#74e08a}
  .j.mid{background:#3a3414;color:#f0d674}
  .j.lo{background:#3a1818;color:#ff8b8b}
  .act{font-size:11px;padding:1px 6px;border-radius:8px;background:#16243a;color:#7fb0ff}
  .act.ai{background:#2a1a3a;color:#c79bff}
  .act.human{background:#1a3320;color:#8fe0a0}
  .rev{font-size:11px;color:#9aa7ba}
  .muted{color:#8295ad}
  .popis{color:#aebdd2;max-width:340px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  #msg{color:#9fb0c8;font-size:13px}
</style>
</head>
<body>
<a href="/finance" style="display:inline-block;margin:10px 0 4px 0;color:#2dd4bf;text-decoration:none;font-size:13px;font-weight:700">← Zpět na Finance</a>
<h1>🧾 Účetní deník</h1>
<div class="sub">Živé zápisy · řazeno dle jistoty (nejistější nahoře = sem kouká účetní nejdřív)</div>
<div class="cards" id="kpis"></div>
<div class="chips" id="chips">
  <button class="chip on" data-f="">Vše</button>
  <button class="chip" data-f="pasmo=nizka">🔴 Nízká jistota</button>
  <button class="chip" data-f="pasmo=stredni">🟡 Střední</button>
  <button class="chip" data-f="pasmo=vysoka">🟢 Vysoká</button>
  <button class="chip" data-f="stav=nezkontrolovano">Čeká na kontrolu</button>
</div>
<div style="margin-bottom:12px"><button class="chip" style="background:#3a2b14;color:#f0c674" onclick="openAutomatList()">🤖 Automaty (registr)</button></div>
<div id="rulefilter" style="display:none;margin-bottom:10px;font-size:12.5px;color:#9fb0c8;background:#19202e;border:1px solid #2c3850;border-radius:8px;padding:8px 12px"></div>
<div id="msg">Načítám…</div>
<table id="tbl" style="display:none"><thead><tr>
  <th>Datum</th><th>Doklad</th><th>MD</th><th>Dal</th><th class="num">Částka</th>
  <th>Kategorie</th><th>Jistota</th><th>Autor / způsob</th><th>Základ (proč tak)</th><th>Stav</th><th>Popis</th>
</tr></thead><tbody id="rows"></tbody></table>
<div id="ov" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.62);z-index:50;padding:18px;overflow:auto" onclick="if(event.target===this)closeDetail()">
  <div style="max-width:580px;margin:24px auto;background:#19202e;border:1px solid #2c3850;border-radius:14px;padding:18px">
    <div id="ovbody">Načítám…</div>
  </div>
</div>

<script>
const API='';
let FILTER='';
function czk(n){return (n==null?0:n).toLocaleString('cs-CZ',{maximumFractionDigits:0})+' Kč';}
function jcls(j){return j>=90?'hi':(j>=70?'mid':'lo');}
function actcls(a){return a==='ai'?'ai':(a==='human'?'human':'');}
function fmtAkter(typ,id){
  const nm=(id||'').split(':')[1]||'';
  if(typ==='automat')return '🤖 <b>'+(nm||'automat')+'</b><br><span class="muted" style="font-size:10px">automaticky</span>';
  if(typ==='ai')return '✨ <b>'+(nm||'Marti-AI')+'</b><br><span class="muted" style="font-size:10px">AI</span>';
  if(typ==='human')return '👤 <b>'+(nm||'?')+'</b><br><span class="muted" style="font-size:10px">ručně</span>';
  return '<span class="muted">—</span>';
}
async function load(){
  const rf=document.getElementById('rulefilter');
  if(rf){if(FILTER.indexOf('klic=')===0){const k=decodeURIComponent(FILTER.split('=')[1]);rf.style.display='';rf.innerHTML='🔧 Zobrazuji jen zápisy pravidla <b>'+k+'</b> (jedna skupina) — <a onclick="clearRuleFilter()" style="cursor:pointer;color:#7fb0ff;text-decoration:underline">zrušit filtr</a>';}else{rf.style.display='none';}}
  document.getElementById('msg').style.display='';document.getElementById('msg').textContent='Načítám…';
  document.getElementById('tbl').style.display='none';
  const r=await fetch(API+'/api/v1/erp/app/uctovani/denik'+(FILTER?('?'+FILTER):''),{credentials:'include'}).then(x=>x.json());
  if(!r.ok){document.getElementById('msg').textContent=r.error||'Nedostupné (přihlas se jako rodič)';return;}
  const s=r.souhrn||{};
  document.getElementById('kpis').innerHTML=
    kpi(s.pocet,'zápisů')+kpi(czk(s.objem),'objem')+
    kpi(s.j_vys,'🟢 vysoká',' #74e08a')+kpi(s.j_str,'🟡 střední',' #f0d674')+
    kpi(s.j_niz,'🔴 nízká',' #ff8b8b')+kpi(s.ceka,'čeká kontrola');
  const rows=r.zapisy||[];
  document.getElementById('rows').innerHTML=rows.map(z=>`<tr onclick="openDetail(${z.id})" style="cursor:pointer">
    <td class="muted">${z.datum||''}</td>
    <td class="ucet">${z.doklad||''}</td>
    <td class="ucet">${z.ucet_md||''}</td>
    <td class="ucet">${z.ucet_dal||''}</td>
    <td class="num">${czk(z.castka)}</td>
    <td>${z.kategorie||''}</td>
    <td><span class="j ${jcls(z.jistota)}">${z.jistota==null?'?':Math.round(z.jistota)}</span></td>
    <td>${fmtAkter(z.actor_type,z.actor_id)}</td>
    <td class="muted" style="font-size:11px">${(z.jistota_zdroj||'').replace('predkontace_','')}</td>
    <td class="rev">${z.review_stav||''}</td>
    <td class="popis" title="${(z.popis||'').replace(/"/g,'&quot;')}">${z.popis||''}</td>
  </tr>`).join('');
  document.getElementById('msg').style.display='none';
  document.getElementById('tbl').style.display='';
}
function kpi(v,l,c){return `<div class="kpi"><div class="v"${c?(' style="color:'+c+'"'):''}>${v==null?'0':v}</div><div class="l">${l}</div></div>`;}
async function openDetail(id){
  const ov=document.getElementById('ov');const b=document.getElementById('ovbody');
  ov.style.display='';b.innerHTML='Ťukám na automata… 🚪';
  const r=await fetch(API+'/api/v1/erp/app/uctovani/denik/detail?id='+id,{credentials:'include'}).then(x=>x.json());
  if(!r.ok){b.innerHTML='<div style="color:#ff8b8b">'+(r.error||'chyba')+'</div>';return;}
  const z=r.zapis;const jc=jcls(z.jistota);
  let h=`<div style="display:flex;justify-content:space-between;align-items:center">
    <h2 style="margin:0;font-size:16px">🚪 Zpověď zápisu #${z.id}</h2>
    <button class="chip" onclick="closeDetail()">✕</button></div>
    <div style="margin:10px 0;font-size:13px;line-height:1.75">
    <b>Kdo zaúčtoval:</b> <span class="act ${actcls(z.actor_type)}">${z.actor_type}</span> <code>${z.actor_id||''}</code><br>
    <b>Jistota:</b> <span class="j ${jc}">${z.jistota==null?'?':Math.round(z.jistota)} %</span> &nbsp; <b>Stav:</b> ${z.review_stav||''}<br>
    <b>Na základě čeho:</b> <code>${z.jistota_zdroj||''}</code><br>
    <b>Účet:</b> <code class="ucet">${z.ucet_md} / ${z.ucet_dal}</code> &nbsp; <b>Částka:</b> ${czk(z.castka)}<br>
    <b>Doklad:</b> ${z.doklad||''} &nbsp; <b>Datum:</b> ${z.datum||''}<br>
    <b>Popis:</b> ${z.popis||''}</div>`;
  if(r.pravidla&&r.pravidla.length){h+='<div style="background:#0f1622;border:1px solid #3a3414;border-radius:9px;padding:10px;margin-bottom:10px;font-size:12.5px"><b>📖 Pravidlo z kuchařky (na základě čeho účtoval):</b><br>'+r.pravidla.map(p=>`<code>${p.klic}</code> <span class="muted">(${p.typ_klice}${p.smer?'/'+p.smer:''})</span> → <code class="ucet">${p.ucet_md} / ${p.ucet_dal}</code> @ <span class="j ${jcls(p.base_jistota)}">${Math.round(p.base_jistota)}%</span>${p.pozn?('<br><i class="muted">'+p.pozn+'</i>'):''}`).join('<br>')+'</div>';}
  if(r.log&&r.log.length){h+='<div style="font-size:12px;color:#9fb0c8;border-top:1px solid #2c3850;padding-top:8px"><b>Historie (změnový log):</b><br>'+r.log.map(l=>`${l.kdy} · <b>${l.akce}</b> · ${l.actor_id||l.actor_type}${l.poznamka?(' · '+l.poznamka):''}`).join('<br>')+'</div>';}
  h+=`<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:14px">
    <button class="chip on" onclick="doReview(${z.id},'zkontrolovano')">✓ Zkontrolováno</button>
    <button class="chip" style="background:#1a3320;color:#8fe0a0" onclick="doReview(${z.id},'schvaleno')">✓✓ Schvaluji</button>
    <button class="chip" style="background:#3a1818;color:#ff8b8b" onclick="doReview(${z.id},'vraceno')">↩ Vrátit automatu</button>
    <button class="chip" onclick="opravUcet(${z.id})">✏️ Opravit účty</button></div>
    <div id="ovmsg" class="muted" style="margin-top:8px"></div>`;
  b.innerHTML=h;
}
function closeDetail(){document.getElementById('ov').style.display='none';}
let _curKod='bank_v1';
async function openAutomatList(){
  const ov=document.getElementById('ov');const b=document.getElementById('ovbody');
  ov.style.display='';b.innerHTML='Načítám registr… 🤖';
  const r=await fetch(API+'/api/v1/erp/app/uctovani/automaty',{credentials:'include'}).then(x=>x.json());
  if(!r.ok){b.innerHTML='<div style="color:#ff8b8b">'+(r.error||'chyba')+'</div>';return;}
  let h=`<div style="display:flex;justify-content:space-between;align-items:center"><h2 style="margin:0;font-size:16px">🤖 Přehled automatů — celkem ${r.automaty.length}</h2><button class="chip" onclick="closeDetail()">✕</button></div><div class="muted" style="font-size:12px;margin:6px 0 10px">Zatím máme ${r.automaty.length} automat. Klikni na řádek → otevře se JEHO detail (občanka + jeho pravidla).</div>`;
  h+=r.automaty.map(a=>`<div onclick="openAutomatDetail('${a.kod}')" style="cursor:pointer;background:#0f1622;border:1px solid #2c3850;border-radius:10px;padding:11px;margin-bottom:8px"><div style="display:flex;justify-content:space-between;align-items:center"><div style="font-size:14px"><b>${a.nazev}</b> <code>${a.kod}</code> · v${a.verze} <span style="color:#8fa3bd;font-size:12px">› klikni pro detail</span></div>${a.aktivni?'<span class="j hi">🟢 AKTIVNÍ</span>':'<span class="j lo">🔴 DEAKTIVOVÁN</span>'}</div><div class="muted" style="font-size:12px;margin-top:4px">Vytvořil: ${a.vytvoril||'?'} · zaúčtováno ${a.pocet_zapisu} zápisů · poslední běh: ${a.posledni_beh||'—'} · ${a.spousteni||''}</div></div>`).join('');
  if(!r.automaty.length)h+='<div class="muted">Žádný automat.</div>';
  b.innerHTML=h;
}
async function openAutomatDetail(kod){
  _curKod=kod;
  const ov=document.getElementById('ov');const b=document.getElementById('ovbody');
  ov.style.display='';b.innerHTML='Otevírám automata… 🤖';
  const [ai,rk]=await Promise.all([
    fetch(API+'/api/v1/erp/app/uctovani/automat?kod='+encodeURIComponent(kod),{credentials:'include'}).then(x=>x.json()).catch(()=>({ok:false})),
    fetch(API+'/api/v1/erp/app/uctovani/predkontace',{credentials:'include'}).then(x=>x.json())
  ]);
  if(!rk.ok){b.innerHTML='<div style="color:#ff8b8b">'+(rk.error||'chyba')+'</div>';return;}
  let h=`<div style="display:flex;justify-content:space-between;align-items:center">
    <button class="chip" onclick="openAutomatList()">← Zpět na seznam</button>
    <button class="chip" onclick="closeDetail()">✕</button></div>`;
  if(ai.ok){const a=ai.automat;
    h+=`<div style="background:#0f1622;border:1px solid #2c3850;border-radius:10px;padding:11px;margin:10px 0;font-size:12.5px;line-height:1.7">
      <div style="font-size:14px;margin-bottom:4px"><b>${a.nazev}</b> <code>${a.kod}</code> · verze <b>${a.verze}</b>
        ${a.aktivni?'<span class="j hi">AKTIVNÍ</span>':'<span class="j lo">DEAKTIVOVÁN</span>'}</div>
      <b>Vytvořil:</b> ${a.vytvoril||'?'} · ${a.vytvoreno||''}<br>
      <b>Schválil:</b> ${a.schvalil||'<i>neschváleno</i>'} · ${a.schvaleno||''}<br>
      <b>Spouštění:</b> ${a.spousteni||''} · <b>poslední běh:</b> ${a.posledni_beh||'—'}<br>
      <b>Pravidel:</b> ${ai.pocet_pravidel} · <b>zaúčtováno zápisů:</b> ${ai.pocet_zapisu}
      <div style="display:flex;gap:8px;margin-top:10px;flex-wrap:wrap">
        <button class="chip on" onclick="automatRun()">▶ Spustit ručně</button>
        <button class="chip" style="background:${a.aktivni?'#3a1818':'#1a3320'};color:${a.aktivni?'#ff8b8b':'#8fe0a0'}" onclick="automatToggle()">${a.aktivni?'⏸ Deaktivovat':'▶ Aktivovat'}</button>
      </div><div id="amsg" class="muted" style="margin-top:6px"></div></div>`;
    if(ai.behy&&ai.behy.length){h+='<div style="font-size:12px;color:#9fb0c8;margin-bottom:10px"><b>📜 Log běhů:</b><br>'+ai.behy.map(x=>`${x.kdy} · ${x.spustil} · <b>${x.vysledek}</b> (${x.trvani_ms} ms)`).join('<br>')+'</div>';}
  }
  h+=`<div style="border-top:1px solid #2c3850;margin-top:6px;padding-top:8px;font-size:12.5px;margin-bottom:6px">📖 <b>Pravidla TOHOTO automatu</b> (${rk.pravidla.length}) — podle nich účtuje. <span class="muted"><i>Nejsou to další automaty, je to jeho kuchařka.</i></span></div>
    <div class="muted" style="font-size:11px;margin-bottom:4px">Klikni na pravidlo → otevře se jeho detail (úprava účtů, jistoty, zapnutí/vypnutí).</div>
    <table style="font-size:12px"><tr><th>Klíč</th><th>Typ</th><th>Směr</th><th>MD / Dal</th><th>Jistota</th><th>Stav</th><th>Použito</th></tr>`;
  window._rules=rk.pravidla;
  h+=rk.pravidla.map(p=>`<tr onclick="openRuleDetail(${p.id})" style="cursor:pointer">
    <td><code>${p.klic}</code> <span style="color:#8fa3bd">›</span></td><td class="muted">${p.typ_klice}</td><td class="muted">${p.smer||'—'}</td>
    <td class="ucet">${p.ucet_md} / ${p.ucet_dal}</td>
    <td><span class="j ${jcls(p.base_jistota)}">${Math.round(p.base_jistota)}%</span></td>
    <td>${p.aktivni?'<span class="j hi">● zap</span>':'<span class="j lo">○ vyp</span>'}</td>
    <td style="text-align:center"><a onclick="event.stopPropagation();filterByRule('${p.klic}')" style="cursor:pointer;color:#7fb0ff;text-decoration:underline">${p.pouzito||0}×</a></td></tr>`).join('');
  h+='</table>';
  b.innerHTML=h;
}
function openRuleDetail(id){
  const p=(window._rules||[]).find(x=>x.id===id);if(!p)return;
  const b=document.getElementById('ovbody');
  b.innerHTML=`<div style="display:flex;justify-content:space-between;align-items:center">
    <button class="chip" onclick="openAutomatDetail(_curKod)">← Zpět na automat</button>
    <button class="chip" onclick="closeDetail()">✕</button></div>
    <h2 style="font-size:15px;margin:10px 0 2px">🔧 Podautomat (pravidlo) <code>${p.klic}</code></h2>
    <div class="muted" style="font-size:12px;margin-bottom:12px">${p.typ_klice}${p.smer?' / '+p.smer:''} · použito <b>${p.pouzito||0}×</b> · ${p.aktivni?'🟢 aktivní':'🔴 vypnuto'}</div>
    <div style="font-size:13px;line-height:2.2">
      <b>Účet MD:</b> <input id="rmd" value="${(p.ucet_md||'').replace(/"/g,'&quot;')}" style="width:100px"> &nbsp;
      <b>Dal:</b> <input id="rdal" value="${(p.ucet_dal||'').replace(/"/g,'&quot;')}" style="width:100px"><br>
      <b>Jistota %:</b> <input id="rjist" type="number" min="0" max="100" value="${Math.round(p.base_jistota)}" style="width:80px"><br>
      <b>Poznámka:</b><br><input id="rpozn" value="${(p.pozn||'').replace(/"/g,'&quot;')}" style="width:100%"></div>
    <div style="display:flex;gap:8px;margin-top:14px;flex-wrap:wrap">
      <button class="chip on" onclick="saveRule(${p.id})">💾 Uložit</button>
      <button class="chip" style="background:${p.aktivni?'#3a1818':'#1a3320'};color:${p.aktivni?'#ff8b8b':'#8fe0a0'}" onclick="toggleRule(${p.id},${p.aktivni?'false':'true'})">${p.aktivni?'⏸ Vypnout pravidlo':'▶ Zapnout pravidlo'}</button>
    </div><div id="rmsg" class="muted" style="margin-top:8px"></div>`;
}
async function saveRule(id){
  const body={id:id,ucet_md:document.getElementById('rmd').value,ucet_dal:document.getElementById('rdal').value,base_jistota:parseFloat(document.getElementById('rjist').value),pozn:document.getElementById('rpozn').value};
  const r=await fetch(API+'/api/v1/erp/app/uctovani/predkontace/save',{method:'POST',credentials:'include',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}).then(x=>x.json());
  const m=document.getElementById('rmsg');
  if(r.ok){if(m)m.textContent='✓ uloženo';setTimeout(()=>openAutomatDetail(_curKod),600);}else if(m){m.textContent='✗ '+(r.error||'chyba');}
}
async function toggleRule(id,akt){
  const r=await fetch(API+'/api/v1/erp/app/uctovani/predkontace/save',{method:'POST',credentials:'include',headers:{'Content-Type':'application/json'},body:JSON.stringify({id:id,aktivni:akt})}).then(x=>x.json());
  if(r.ok){openAutomatDetail(_curKod);}else{const m=document.getElementById('rmsg');if(m)m.textContent='✗ '+(r.error||'chyba');}
}
function filterByRule(klic){closeDetail();FILTER='klic='+encodeURIComponent(klic);document.querySelectorAll('.chip').forEach(c=>c.classList.remove('on'));load();}
function clearRuleFilter(){FILTER='';document.querySelectorAll('.chip').forEach(c=>c.classList.remove('on'));const v=document.querySelector('.chip[data-f=""]');if(v)v.classList.add('on');load();}
async function automatRun(){
  const m=document.getElementById('amsg');if(m)m.textContent='Spouštím automata… ▶';
  const r=await fetch(API+'/api/v1/erp/app/uctovani/automat/run',{method:'POST',credentials:'include',headers:{'Content-Type':'application/json'},body:JSON.stringify({kod:_curKod})}).then(x=>x.json());
  if(r.ok){if(m)m.textContent='✓ Hotovo — zaúčtováno '+r.zapsano+' ('+r.trvani_ms+' ms)';load();setTimeout(()=>openAutomatDetail(_curKod),500);}else if(m){m.textContent='✗ '+(r.error||'chyba');}
}
async function automatToggle(){
  const r=await fetch(API+'/api/v1/erp/app/uctovani/automat/toggle',{method:'POST',credentials:'include',headers:{'Content-Type':'application/json'},body:JSON.stringify({kod:_curKod})}).then(x=>x.json());
  if(r.ok){openAutomatDetail(_curKod);}else{const m=document.getElementById('amsg');if(m)m.textContent='✗ '+(r.error||'chyba');}
}
async function doReview(id,akce){
  const m=document.getElementById('ovmsg');if(m)m.textContent='…';
  const r=await fetch(API+'/api/v1/erp/app/uctovani/denik/review',{method:'POST',credentials:'include',headers:{'Content-Type':'application/json'},body:JSON.stringify({id:id,akce:akce})}).then(x=>x.json());
  if(r.ok){closeDetail();load();}else if(m){m.textContent='✗ '+(r.error||'chyba');}
}
async function opravUcet(id){
  const md=prompt('Nový účet MD (má dáti):');if(!md)return;
  const dal=prompt('Nový účet Dal:');if(!dal)return;
  const r=await fetch(API+'/api/v1/erp/app/uctovani/denik/review',{method:'POST',credentials:'include',headers:{'Content-Type':'application/json'},body:JSON.stringify({id:id,akce:'oprav',ucet_md:md,ucet_dal:dal})}).then(x=>x.json());
  if(r.ok){closeDetail();load();}else{const m=document.getElementById('ovmsg');if(m)m.textContent='✗ '+(r.error||'chyba');}
}
document.getElementById('chips').addEventListener('click',e=>{
  const b=e.target.closest('.chip');if(!b)return;
  document.querySelectorAll('.chip').forEach(c=>c.classList.remove('on'));b.classList.add('on');
  FILTER=b.dataset.f||'';load();
});
load();
</script>
