<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Docházka po zakázkách</title>
<style>
  /* Standard přehledů (Peta26 pokyny, vzor pokladny.html table.dokl):
     rámeček, sticky hlavička (BEZ velkých písmen — Peťa 22.7.), filtrovací řádek
     POD názvy (černá ohraničená okénka), úzký sloupec značek vlevo s ✕ (zruší
     filtry), roztahovací sloupce ew-resize + dvojklik = výchozí, šířky se NEUKLÁDAJÍ. */
  :root{color-scheme:dark}
  *{box-sizing:border-box}
  body{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;margin:0;padding:8px 12px 6px;background:#0f1420;color:#e8edf6}
  .top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:8px}
  .chips{display:flex;gap:6px}
  .chip{background:#27313f;color:#cdd9ea;border:0;border-radius:14px;padding:6px 13px;font-size:12.5px;cursor:pointer}
  .chip.on{background:#2563eb;color:#fff}
  .muted{color:#8fa3bd;font-size:12.5px}
  .err{background:rgba(239,68,68,.12);border:1px solid #ef4444;color:#fca5a5;border-radius:8px;padding:10px 12px;font-size:13px;margin:8px 0}
  .tw{overflow:auto;max-height:calc(100vh - 52px);border:1px solid #2a3546;border-radius:8px;background:#0f1420}
  .tw::-webkit-scrollbar{width:13px;height:13px}
  .tw::-webkit-scrollbar-track{background:#131b26}
  .tw::-webkit-scrollbar-thumb{background:#33445c;border-radius:7px;border:2px solid #131b26}
  .tw::-webkit-scrollbar-thumb:hover{background:#42597a}
  table.dokl{table-layout:fixed;border-collapse:collapse;font-size:12.5px;width:auto}
  table.dokl th,table.dokl td{border-right:1px solid #2a3546;border-bottom:1px solid #232c3b;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:5px 8px}
  table.dokl thead th{position:sticky;top:0;z-index:3;background:#1c2636;color:#ffffff;font-size:11px;font-weight:700;text-align:left;border-bottom:2px solid #34506f}
  table.dokl thead tr.frow td{position:sticky;top:25px;z-index:2;padding:3px 4px;background:#08090c;border-right:1px solid #24344f;border-bottom:1px solid #24344f}
  table.dokl tbody td{color:#f4f7fc}
  table.dokl tbody tr{cursor:pointer}
  table.dokl .frow input{width:100%;box-sizing:border-box;padding:2px 6px;font-size:11px;border:1px solid #363b43;border-radius:4px;background:#0b0d10;color:#e9eef5}
  table.dokl th.r,table.dokl td.r{text-align:right}
  table.dokl th.c,table.dokl td.c{text-align:center}
  table.dokl thead th .dgrip{position:absolute;top:0;right:0;width:7px;height:100%;cursor:ew-resize;z-index:5;user-select:none}
  table.dokl .frow input{width:100%;box-sizing:border-box;padding:2px 6px;font-size:11px;border:1px solid #363b43;border-radius:4px;background:#0b0d10;color:#e9eef5}
  table.dokl .frow input::placeholder{color:#6a7078}
  table.dokl tbody tr:hover{background:#131d2b}
  table.dokl tbody tr.sel td{background:rgba(37,99,235,.16)}
  td.zak{color:#a5c8ff}
  table.dokl th.mkcol,table.dokl td.mk{width:20px;padding:2px 0;text-align:center}
  td.mk{color:#8aa0bd;font-weight:700;cursor:default}
  .fx{text-align:center;padding:2px 0;cursor:pointer;color:#8aa0bd;font-weight:700}
  .src{font-size:10.5px;padding:1px 6px;border-radius:7px}
  .src.z_a{background:#123c26;color:#8fe0a0}.src.z_c{background:#3b2f12;color:#fbd38d}
  .src.z_s{background:#1d2440;color:#a5b4fc}.src.z_x{background:#2a3240;color:#9fb0c8}
  .ld{padding:30px;text-align:center;color:#8fa3bd;font-size:13px}
</style>
</head>
<body>
<div class="top">
  <div class="chips" id="chips">
    <button class="chip on" data-o="vse">Do dneška</button>
    <button class="chip" data-o="budoucnost">Naplánovaná budoucnost</button>
  </div>
  <span class="muted" id="info"></span>
</div>
<div id="msg"></div>
<div class="tw"><table class="dokl" id="tab"><thead></thead><tbody><tr><td class="ld">Načítám…</td></tr></tbody></table></div>

<script>
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function api(u){return fetch(u,{credentials:'include'}).then(function(r){return r.json().then(function(j){return j;},function(){
  return {ok:false,error:(r&&r.status>=500)?'Server je dočasně nedostupný (nejspíš restart) — zkus to prosím za chvíli.':'Neočekávaná odpověď serveru ('+((r&&r.status)||'?')+').'};});},
  function(){return {ok:false,error:'Nepodařilo se spojit se serverem.'};});}
function $(i){return document.getElementById(i);}

/* Sloupce = přesně jak je vrací přehled (aliasy). h = nadpis (necháváme jak je),
   w = VÝCHOZÍ šířka, r = doprava (čísla), c = na střed, s = odznak zdroje,
   num = filtr bere čárku i tečku. */
var COLS=[
 {k:'PraceAktivni',h:'PraceAktivni',w:34,c:1},
 {k:'CisloZakazky',h:'CisloZakazky',w:92,cls:'zak'},
 {k:'JmenoPrijmeni',h:'JmenoPrijmeni',w:150},
 {k:'CisloZam',h:'CisloZam',w:56,r:1,num:1},
 {k:'DruhCinnosti',h:'DruhCinnosti',w:62,r:1,num:1},
 {k:'CinnostText',h:'CinnostText',w:180},
 {k:'DenVTydnu',h:'DenVTydnu',w:44,c:1},
 {k:'CasZacatek',h:'CasZacatek',w:128},
 {k:'CasKonec',h:'CasKonec',w:110},
 {k:'CasCelkem',h:'CasCelkem',w:74,r:1,num:1},
 {k:'Odkud',h:'Odkud',w:82,s:1,c:1},
 {k:'Smlouva',h:'Smlouva',w:70,c:1},
 {k:'Poznamka',h:'Poznamka',w:220},
 {k:'DatumPripadu',h:'DatumPripadu',w:92},
 {k:'Rok',h:'Rok',w:52,r:1,num:1},
 {k:'Mesic',h:'Mesic',w:50,r:1,num:1}
];
var SRC={'aplikace':'z_a','z Centrály':'z_c','ČSSZ':'z_s'};
var ROWS=[], FIL={}, OBD='vse', SELSET={}, CUR=null;  // SELSET = vybrané řádky (•), CUR = aktuální (▶)
// Šířky sloupců se PAMATUJÍ v prohlížeči (jako pokladny) — natáhneš tažením a drží.
var CW=(function(){try{return JSON.parse(localStorage.getItem('doch_zak_colw')||'{}')||{};}catch(_e){return {};}})();
function saveCW(){try{localStorage.setItem('doch_zak_colw',JSON.stringify(CW));}catch(_e){}}

function cols(){return $('tab').getElementsByTagName('col');}  // [0]=mkcol, [i+1]=COLS[i]
function totW(){var s=0,cs=cols();for(var i=0;i<cs.length;i++)s+=parseInt(cs[i].style.width,10)||0;return s;}
function applyW(){$('tab').style.width=totW()+'px';}

function hlavicka(){
  // Šířky přes <colgroup>/<col> (jako pokladny) — u table-layout:fixed to drží spolehlivě
  var cg='<colgroup><col style="width:20px">';
  var h='<tr><th class="mkcol"></th>';
  var f='<tr class="frow"><td class="fx" title="Zrušit filtry sloupců (jen řádek filtru)" onclick="clearFil()">✕</td>';
  for(var i=0;i<COLS.length;i++){var c=COLS[i];
    cg+='<col style="width:'+(CW[c.k]||c.w)+'px">';
    h+='<th class="'+(c.r?'r':(c.c?'c':''))+'" title="'+esc(c.h)+'">'+esc(c.h)
      +'<span class="dgrip" data-i="'+i+'" title="Táhni = roztáhnout · dvojklik = výchozí"></span></th>';
    f+='<td><input data-k="'+c.k+'"></td>';
  }
  cg+='</colgroup>';
  var tab=$('tab');
  var oldcg=tab.getElementsByTagName('colgroup')[0];if(oldcg)oldcg.parentNode.removeChild(oldcg);
  tab.insertAdjacentHTML('afterbegin',cg);
  var th=tab.getElementsByTagName('thead')[0];
  th.innerHTML=h+'</tr>'+f+'</tr>';
  applyW();
  // Přisadit filtrovací řádek přesně pod hlavičku (jinak mezi nimi prosvítá mezera)
  var hrow=th.getElementsByTagName('tr')[0];
  var hh=(hrow&&hrow.offsetHeight)?hrow.offsetHeight:25;
  // -1px = filtr se o pixel překrývá s hlavičkou → při rolování neprosvítá mezera
  [].forEach.call(th.querySelectorAll('.frow td'),function(td){td.style.top=(hh-1)+'px';});
  th.addEventListener('input',function(e){var k=e.target.getAttribute('data-k');if(k==null)return;
    FIL[k]=(e.target.value||'').trim().toLowerCase();render();});
  th.addEventListener('mousedown',function(e){
    if(!e.target.classList.contains('dgrip'))return;
    var i=parseInt(e.target.getAttribute('data-i'),10),col=cols()[i+1];
    var x0=e.clientX,w0=parseInt(col.style.width,10)||COLS[i].w;e.preventDefault();
    document.body.style.cursor='ew-resize';
    // Vodicí čára — při tažení se NEpřekresluje 14k řádků (plynulé); šířka se
    // nastaví až po puštění myši.
    var guide=document.createElement('div');
    guide.style.cssText='position:fixed;top:0;bottom:0;width:2px;background:#2563eb;z-index:9999;pointer-events:none;left:'+x0+'px';
    document.body.appendChild(guide);
    var lastX=x0;
    function mv(ev){lastX=ev.clientX;guide.style.left=ev.clientX+'px';}
    function up(){document.removeEventListener('mousemove',mv);document.removeEventListener('mouseup',up);
      document.body.style.cursor='';if(guide.parentNode)guide.parentNode.removeChild(guide);
      var nw=Math.max(24,w0+(lastX-x0));col.style.width=nw+'px';applyW();
      CW[COLS[i].k]=nw;saveCW();}  // zapamatuj šířku v prohlížeči
    document.addEventListener('mousemove',mv);document.addEventListener('mouseup',up);});
  th.addEventListener('dblclick',function(e){
    if(!e.target.classList.contains('dgrip'))return;
    var i=parseInt(e.target.getAttribute('data-i'),10);cols()[i+1].style.width=COLS[i].w+'px';applyW();
    delete CW[COLS[i].k];saveCW();});  // dvojklik = zpět na výchozí + zapomeň uloženou
}

function clearFil(){FIL={};[].forEach.call($('tab').querySelectorAll('.frow input'),function(x){x.value='';});render();}

function normNum(v){return String(v==null?'':v).replace(/\s/g,'').replace(',','.');}
function projde(r){
  for(var k in FIL){var q=FIL[k];if(!q)continue;var col=null;
    for(var i=0;i<COLS.length;i++){if(COLS[i].k===k){col=COLS[i];break;}}
    var v=r[k];
    if(col&&col.k==='PraceAktivni'){v=(String(v||'').indexOf('✓')>=0)?'✓ano':'ne';}
    if(col&&col.num){if(normNum(v).indexOf(normNum(q))<0)return false;continue;}
    if(String(v==null?'':v).toLowerCase().indexOf(q)<0)return false;
  }
  return true;
}

function render(){
  var tb=$('tab').getElementsByTagName('tbody')[0],h=[],n=0;
  for(var i=0;i<ROWS.length;i++){var r=ROWS[i];if(!projde(r))continue;n++;
    var mk=(CUR===i)?'▶':(SELSET[i]?'•':'');
    var sel=(SELSET[i]||CUR===i);
    var tr='<tr data-i="'+i+'"'+(sel?' class="sel"':'')+'><td class="mk">'+mk+'</td>';
    for(var j=0;j<COLS.length;j++){var c=COLS[j],v=r[c.k],cl=(c.r?'r':(c.c?'c':''));
      if(c.s){v='<span class="src '+(SRC[v]||'z_x')+'">'+esc(v)+'</span>';}
      else v=esc(v);
      if(c.cls)cl+=' '+c.cls;
      tr+='<td'+(cl.trim()?' class="'+cl.trim()+'"':'')+' title="'+esc(String(r[c.k]==null?'':r[c.k]))+'">'+v+'</td>';}
    h.push(tr+'</tr>');
  }
  tb.innerHTML=h.length?h.join(''):'<tr><td class="ld" colspan="'+(COLS.length+1)+'">Nic neodpovídá filtru.</td></tr>';
  $('info').textContent='Řádků: '+n+(n!==ROWS.length?(' (z '+ROWS.length+')'):'');
}

function load(){
  $('msg').innerHTML='';SELSET={};CUR=null;
  $('tab').getElementsByTagName('tbody')[0].innerHTML='<tr><td class="ld" colspan="'+(COLS.length+1)+'">Načítám…</td></tr>';
  $('info').textContent='';
  api('/api/v1/erp/app/dochazka-zak-tab/data?obdobi='+encodeURIComponent(OBD)).then(function(j){
    if(!j||!j.ok){$('msg').innerHTML='<div class="err">'+esc((j&&j.error)||'Nepodařilo se načíst data.')+'</div>';
      $('tab').getElementsByTagName('tbody')[0].innerHTML='';return;}
    ROWS=j.rows||[];render();
  });
}

(function(){
  hlavicka();
  // období z URL (?obdobi=vse|budoucnost) — uzel „Naplánovaná budoucnost" otevře rovnou budoucnost
  try{var _p=new URLSearchParams(location.search).get('obdobi');
    if(_p==='budoucnost'||_p==='vse'){OBD=_p;
      [].forEach.call($('chips').children,function(x){x.classList.toggle('on',x.getAttribute('data-o')===OBD);});}
  }catch(_e){}
  $('chips').addEventListener('click',function(e){var b=e.target.closest?e.target.closest('.chip'):null;if(!b)return;
    [].forEach.call($('chips').children,function(x){x.classList.remove('on');});b.classList.add('on');
    OBD=b.getAttribute('data-o');load();});
  $('tab').getElementsByTagName('tbody')[0].addEventListener('click',function(e){
    if(e.target.closest('input,select'))return;var tr=e.target.closest('tr[data-i]');if(!tr)return;
    var i=parseInt(tr.getAttribute('data-i'),10);
    if(e.shiftKey && CUR!=null){  // Shift+klik = označit úsek CUR..i
      var a=Math.min(CUR,i),b=Math.max(CUR,i);
      for(var x=a;x<=b;x++)SELSET[x]=true;
    }else{  // klik = přepnout výběr řádku
      if(SELSET[i]){delete SELSET[i];}else{SELSET[i]=true;}
    }
    CUR=i;render();});
  load();
})();
</script>
</body>
</html>
