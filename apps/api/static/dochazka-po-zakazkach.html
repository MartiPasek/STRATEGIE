<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Docházka po zakázkách</title>
<style>
  /* Standard přehledů (Peta26 pokyny, vzor pokladny.html table.dokl):
     rámeček, sticky hlavička (BEZ velkých písmen — Peťa 22.7.), filtrovací řádek
     POD názvy (černá ohraničená okénka), úzký sloupec značek vlevo s ✕ (zruší
     filtry), roztahovací sloupce ew-resize + dvojklik = výchozí, šířky se NEUKLÁDAJÍ. */
  :root{color-scheme:dark}
  *{box-sizing:border-box}
  body{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;margin:0;padding:8px 12px 6px;background:#0f1420;color:#e8edf6}
  .top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:8px}
  .chips{display:flex;gap:6px}
  .chip{background:#27313f;color:#cdd9ea;border:0;border-radius:14px;padding:6px 13px;font-size:12.5px;cursor:pointer}
  .chip.on{background:#2563eb;color:#fff}
  .muted{color:#8fa3bd;font-size:12.5px}
  .err{background:rgba(239,68,68,.12);border:1px solid #ef4444;color:#fca5a5;border-radius:8px;padding:10px 12px;font-size:13px;margin:8px 0}
  .tw{overflow:auto;max-height:calc(100vh - 52px);border:1px solid #2a3546;border-radius:8px;background:#0f1420}
  .tw::-webkit-scrollbar{width:13px;height:13px}
  .tw::-webkit-scrollbar-track{background:#131b26}
  .tw::-webkit-scrollbar-thumb{background:#33445c;border-radius:7px;border:2px solid #131b26}
  .tw::-webkit-scrollbar-thumb:hover{background:#42597a}
  table.dokl{table-layout:fixed;border-collapse:collapse;font-size:12.5px;width:auto}
  table.dokl th,table.dokl td{border-right:1px solid #2a3546;border-bottom:1px solid #232c3b;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:5px 8px}
  table.dokl thead th{position:sticky;top:0;z-index:3;background:#1c2636;color:#ffffff;font-size:11px;font-weight:700;text-align:left;border-bottom:2px solid #34506f}
  table.dokl thead tr.frow td{position:sticky;top:25px;z-index:2;padding:3px 4px;background:#08090c;border-right:1px solid #24344f;border-bottom:1px solid #24344f}
  table.dokl tbody td{color:#f4f7fc}
  table.dokl tbody tr{cursor:pointer}
  table.dokl .frow input{width:100%;box-sizing:border-box;padding:2px 6px;font-size:11px;border:1px solid #363b43;border-radius:4px;background:#0b0d10;color:#e9eef5}
  table.dokl th.r,table.dokl td.r{text-align:right}
  table.dokl th.c,table.dokl td.c{text-align:center}
  table.dokl thead th .dgrip{position:absolute;top:0;right:0;width:7px;height:100%;cursor:ew-resize;z-index:5;user-select:none}
  table.dokl .frow input{width:100%;box-sizing:border-box;padding:2px 6px;font-size:11px;border:1px solid #363b43;border-radius:4px;background:#0b0d10;color:#e9eef5}
  table.dokl .frow input::placeholder{color:#6a7078}
  table.dokl tbody tr:hover{background:#131d2b}
  table.dokl tbody tr.sel td{background:rgba(37,99,235,.16)}
  td.zak{color:#a5c8ff}
  table.dokl th.mkcol,table.dokl td.mk{width:20px;padding:2px 0;text-align:center}
  td.mk{color:#8aa0bd;font-weight:700;cursor:default}
  .fx{text-align:center;padding:2px 0;cursor:pointer;color:#8aa0bd;font-weight:700}
  .src{font-size:10.5px;padding:1px 6px;border-radius:7px}
  .src.z_a{background:#123c26;color:#8fe0a0}.src.z_c{background:#3b2f12;color:#fbd38d}
  .src.z_s{background:#1d2440;color:#a5b4fc}.src.z_x{background:#2a3240;color:#9fb0c8}
  .ld{padding:30px;text-align:center;color:#8fa3bd;font-size:13px}
  /* Editační okno (dvojklik na řádek) — vzhled jako formulář Centrály */
  .ov{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:flex-start;justify-content:center;z-index:50}
  .ov.on{display:flex}
  .dlg{background:#141b28;border:1px solid #2a3546;border-radius:10px;margin-top:4vh;width:min(700px,95vw);max-height:92vh;display:flex;flex-direction:column;box-shadow:0 14px 44px rgba(0,0,0,.55)}
  .dlg h3{margin:0;padding:10px 14px;background:#1c2636;border-bottom:1px solid #2a3546;font-size:14px;display:flex;align-items:center;gap:8px}
  .dlg .bd{padding:14px;overflow:auto}
  .fg{display:grid;grid-template-columns:1fr 1fr;gap:10px 14px}
  .fld{display:flex;flex-direction:column;gap:3px}
  .fld.full{grid-column:1 / -1}
  .fld label{font-size:11px;color:#9fb2c8}
  .fld input,.fld select,.fld textarea{background:#0b0d10;border:1px solid #363b43;border-radius:5px;color:#e9eef5;padding:6px 8px;font-size:13px;font-family:inherit}
  .fld input:disabled,.fld textarea:disabled,.fld select:disabled{opacity:.45;cursor:not-allowed}
  .fld .two{display:flex;gap:6px}
  .fld .two input[type=date]{flex:1;min-width:0}
  .fld .two input[type=time]{width:100px}
  /* Rozložení přesně jako formulář Centrály */
  .frow2{display:grid;grid-template-columns:1fr 1fr;gap:9px 14px;margin-bottom:10px}
  .frow3{display:grid;grid-template-columns:1fr 1fr 0.72fr;gap:9px 14px;margin-bottom:10px;align-items:start}
  .top2{grid-template-columns:150px 110px}
  .prac{margin-bottom:10px}
  .fnote{display:grid;grid-template-columns:1fr auto;gap:8px 16px;align-items:end;margin-bottom:10px}
  .frow3 .fld input[type=time]{margin-top:5px}
  .soon{color:#c99a4a;font-size:10px;font-weight:400}
  .ro{font-size:13px;color:#e8edf6;padding:2px 0 10px;font-weight:600}
  .rob{background:rgba(201,154,74,.12);border:1px solid #7a5a1f;color:#e6c67f;border-radius:6px;padding:8px 10px;font-size:12px;margin:0 0 10px}
  .chk{display:flex;align-items:center;gap:6px;font-size:12.5px;color:#9fb2c8}
  .dmsg{padding:2px 14px;font-size:12px;min-height:0;color:#fca5a5}
  .dmsg.ok{color:#8fe0a0}
  .dbtn{display:flex;justify-content:space-between;gap:8px;padding:12px 14px;border-top:1px solid #2a3546;background:#101622}
  .dbtn .r{display:flex;gap:8px}
  .dbtn button{border:0;border-radius:6px;padding:8px 16px;font-size:13px;cursor:pointer}
  .b-ok{background:#2563eb;color:#fff}
  .b-cn{background:#2a3446;color:#cdd9ea}
  .b-rf{background:#22303f;color:#a9c0da}
</style>
</head>
<body>
<div class="top">
  <div class="chips" id="chips">
    <button class="chip on" data-o="vse">Poslední 2 měsíce</button>
    <button class="chip" data-o="budoucnost">Naplánovaná budoucnost</button>
  </div>
  <span class="muted" id="info"></span>
</div>
<div id="msg"></div>
<div class="tw"><table class="dokl" id="tab"><thead></thead><tbody><tr><td class="ld">Načítám…</td></tr></tbody></table></div>

<!-- Editační okno (otevře dvojklik na řádek). Vzhled dle formuláře Centrály; bez „NOVÝ ZÁZNAM". -->
<div class="ov" id="ov">
  <div class="dlg" role="dialog" aria-modal="true">
    <h3>🕒 Docházka – úpravy<span class="muted" id="d_id" style="margin-left:auto;font-weight:400"></span></h3>
    <div class="bd">
      <div class="rob" id="d_ro" style="display:none"></div>
      <!-- horní řádek: ID záznamu + Čas (jako v Centrále, bez „NOVÝ ZÁZNAM") -->
      <div class="frow2 top2">
        <div class="fld"><label>ID záznamu</label><input id="d_idnum" readonly></div>
        <div class="fld"><label>Čas</label><input id="d_hod" readonly></div>
      </div>
      <div class="fld prac"><label>Pracovník</label><input id="d_prac" readonly></div>
      <div class="frow2">
        <div class="fld"><label>Zakázka</label><input id="d_zak" autocomplete="off"></div>
        <div class="fld"><label>Činnost</label><select id="d_cin"></select></div>
      </div>
      <div class="frow3">
        <div class="fld"><label>Začátek</label><input type="date" id="d_od_d"><input type="time" id="d_od_t"></div>
        <div class="fld"><label>Konec</label><input type="date" id="d_kon_d"><input type="time" id="d_kon_t"></div>
        <div class="fld"><label>Pauza <span class="soon">dodělá se</span></label><input id="d_pauza" type="number" step="1" disabled></div>
      </div>
      <div class="fnote">
        <div class="fld"><label>Zaměstnanec poznámka</label><textarea id="d_pozn" rows="2"></textarea></div>
        <label class="chk"><input type="checkbox" id="d_req" disabled> Požadavek úpravy <span class="soon">dodělá se</span></label>
      </div>
      <div class="fnote">
        <div class="fld"><label>Vedoucí poznámka <span class="soon">dodělá se</span></label><textarea id="d_vpozn" rows="2" disabled></textarea></div>
        <label class="chk"><input type="checkbox" id="d_appr" disabled> Vedoucí schváleno <span class="soon">dodělá se</span></label>
      </div>
    </div>
    <div class="dmsg" id="d_msg"></div>
    <div class="dbtn">
      <button class="b-rf" onclick="reloadForm()">Obnovit</button>
      <div class="r">
        <button class="b-cn" onclick="closeEdit()">Storno</button>
        <button class="b-ok" id="d_ok" onclick="saveEdit()">OK</button>
      </div>
    </div>
  </div>
</div>

<script>
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function api(u){return fetch(u,{credentials:'include'}).then(function(r){return r.json().then(function(j){return j;},function(){
  return {ok:false,error:(r&&r.status>=500)?'Server je dočasně nedostupný (nejspíš restart) — zkus to prosím za chvíli.':'Neočekávaná odpověď serveru ('+((r&&r.status)||'?')+').'};});},
  function(){return {ok:false,error:'Nepodařilo se spojit se serverem.'};});}
function $(i){return document.getElementById(i);}

/* Sloupce = přesně jak je vrací přehled (aliasy). h = nadpis (necháváme jak je),
   w = VÝCHOZÍ šířka, r = doprava (čísla), c = na střed, s = odznak zdroje,
   num = filtr bere čárku i tečku. */
var COLS=[
 {k:'PraceAktivni',h:'PraceAktivni',w:34,c:1},
 {k:'CisloZakazky',h:'CisloZakazky',w:92,cls:'zak'},
 {k:'JmenoPrijmeni',h:'JmenoPrijmeni',w:150},
 {k:'CisloZam',h:'CisloZam',w:56,r:1,num:1},
 {k:'DruhCinnosti',h:'DruhCinnosti',w:62,r:1,num:1},
 {k:'CinnostText',h:'CinnostText',w:180},
 {k:'DenVTydnu',h:'DenVTydnu',w:44,c:1},
 {k:'CasZacatek',h:'CasZacatek',w:128},
 {k:'CasKonec',h:'CasKonec',w:110},
 {k:'CasCelkem',h:'CasCelkem',w:74,r:1,num:1},
 {k:'Odkud',h:'Odkud',w:82,s:1,c:1},
 {k:'Smlouva',h:'Smlouva',w:70,c:1},
 {k:'Poznamka',h:'Poznamka',w:220},
 {k:'DatumPripadu',h:'DatumPripadu',w:92},
 {k:'Rok',h:'Rok',w:52,r:1,num:1},
 {k:'Mesic',h:'Mesic',w:50,r:1,num:1}
];
var SRC={'aplikace':'z_a','z Centrály':'z_c','ČSSZ':'z_s'};
var ROWS=[], FIL={}, OBD='vse', SELSET={}, CUR=null;  // SELSET = vybrané řádky (•), CUR = aktuální (▶)
// Šířky: SRVW = SDÍLENÉ základní ze serveru (pro všechny). Osobní tažení je JEDNORÁZOVÉ
// — nikam se neukládá, po obnovení zpět na základní. Trvale (pro všechny) uloží jen
// rodiče/Peťa (CANSAVE) na server.
// Šířky: SRVW = sdílené základní (pro všechny), MEW = osobní uložené tažení (má přednost).
// Osobní se ukládají do DB (jako dřív framework grid) → drží ti a Claude je vidí a povýší
// na výchozí pro všechny, když řekneš.
var SRVW={}, MEW={};
function currentWidths(){var o={},cs=cols();for(var i=0;i<COLS.length;i++){o[COLS[i].k]=parseInt(cs[i+1].style.width,10)||COLS[i].w;}return o;}
var _saveT=null;
function saveMine(){if(_saveT)clearTimeout(_saveT);_saveT=setTimeout(function(){
  try{fetch('/api/v1/erp/app/dochazka-zak-tab/widths',{method:'POST',credentials:'include',
    headers:{'Content-Type':'application/json'},body:JSON.stringify({widths:currentWidths()})});}catch(_e){}
},400);}

function cols(){return $('tab').getElementsByTagName('col');}  // [0]=mkcol, [i+1]=COLS[i]
function totW(){var s=0,cs=cols();for(var i=0;i<cs.length;i++)s+=parseInt(cs[i].style.width,10)||0;return s;}
function applyW(){$('tab').style.width=totW()+'px';}

function hlavicka(){
  // Šířky přes <colgroup>/<col> (jako pokladny) — u table-layout:fixed to drží spolehlivě
  var cg='<colgroup><col style="width:20px">';
  var h='<tr><th class="mkcol"></th>';
  var f='<tr class="frow"><td class="fx" title="Zrušit filtry sloupců (jen řádek filtru)" onclick="clearFil()">✕</td>';
  for(var i=0;i<COLS.length;i++){var c=COLS[i];
    cg+='<col style="width:'+(MEW[c.k]||SRVW[c.k]||c.w)+'px">';
    h+='<th class="'+(c.r?'r':(c.c?'c':''))+'" title="'+esc(c.h)+'">'+esc(c.h)
      +'<span class="dgrip" data-i="'+i+'" title="Táhni = roztáhnout · dvojklik = výchozí"></span></th>';
    f+='<td><input data-k="'+c.k+'"></td>';
  }
  cg+='</colgroup>';
  var tab=$('tab');
  var oldcg=tab.getElementsByTagName('colgroup')[0];if(oldcg)oldcg.parentNode.removeChild(oldcg);
  tab.insertAdjacentHTML('afterbegin',cg);
  var th=tab.getElementsByTagName('thead')[0];
  th.innerHTML=h+'</tr>'+f+'</tr>';
  applyW();
  // Přisadit filtrovací řádek přesně pod hlavičku (jinak mezi nimi prosvítá mezera)
  var hrow=th.getElementsByTagName('tr')[0];
  var hh=(hrow&&hrow.offsetHeight)?hrow.offsetHeight:25;
  // -1px = filtr se o pixel překrývá s hlavičkou → při rolování neprosvítá mezera
  [].forEach.call(th.querySelectorAll('.frow td'),function(td){td.style.top=(hh-1)+'px';});
  th.addEventListener('input',function(e){var k=e.target.getAttribute('data-k');if(k==null)return;
    FIL[k]=(e.target.value||'').trim().toLowerCase();render();});
  th.addEventListener('mousedown',function(e){
    if(!e.target.classList.contains('dgrip'))return;
    var i=parseInt(e.target.getAttribute('data-i'),10),col=cols()[i+1];
    var x0=e.clientX,w0=parseInt(col.style.width,10)||COLS[i].w;e.preventDefault();
    document.body.style.cursor='ew-resize';
    // Vodicí čára — při tažení se NEpřekresluje 14k řádků (plynulé); šířka se
    // nastaví až po puštění myši.
    var guide=document.createElement('div');
    guide.style.cssText='position:fixed;top:0;bottom:0;width:2px;background:#2563eb;z-index:9999;pointer-events:none;left:'+x0+'px';
    document.body.appendChild(guide);
    var lastX=x0;
    function mv(ev){lastX=ev.clientX;guide.style.left=ev.clientX+'px';}
    function up(){document.removeEventListener('mousemove',mv);document.removeEventListener('mouseup',up);
      document.body.style.cursor='';if(guide.parentNode)guide.parentNode.removeChild(guide);
      var nw=Math.max(24,w0+(lastX-x0));col.style.width=nw+'px';applyW();MEW[COLS[i].k]=nw;saveMine();}  // ulož osobní (DB)
    document.addEventListener('mousemove',mv);document.addEventListener('mouseup',up);});
  th.addEventListener('dblclick',function(e){
    if(!e.target.classList.contains('dgrip'))return;
    var i=parseInt(e.target.getAttribute('data-i'),10);cols()[i+1].style.width=COLS[i].w+'px';applyW();
    delete MEW[COLS[i].k];saveMine();});  // dvojklik = zpět na výchozí (i v uložených osobních)
}

function clearFil(){FIL={};[].forEach.call($('tab').querySelectorAll('.frow input'),function(x){x.value='';});render();}

function normNum(v){return String(v==null?'':v).replace(/\s/g,'').replace(',','.');}
function projde(r){
  for(var k in FIL){var q=FIL[k];if(!q)continue;var col=null;
    for(var i=0;i<COLS.length;i++){if(COLS[i].k===k){col=COLS[i];break;}}
    var v=r[k];
    if(col&&col.k==='PraceAktivni'){v=(String(v||'').indexOf('✓')>=0)?'✓ano':'ne';}
    if(col&&col.num){if(normNum(v).indexOf(normNum(q))<0)return false;continue;}
    if(String(v==null?'':v).toLowerCase().indexOf(q)<0)return false;
  }
  return true;
}

function render(){
  var tb=$('tab').getElementsByTagName('tbody')[0],h=[],n=0;
  for(var i=0;i<ROWS.length;i++){var r=ROWS[i];if(!projde(r))continue;n++;
    var mk=(CUR===i)?'▶':(SELSET[i]?'•':'');
    var sel=(SELSET[i]||CUR===i);
    var tr='<tr data-i="'+i+'"'+(sel?' class="sel"':'')+'><td class="mk">'+mk+'</td>';
    for(var j=0;j<COLS.length;j++){var c=COLS[j],v=r[c.k],cl=(c.r?'r':(c.c?'c':''));
      if(c.s){v='<span class="src '+(SRC[v]||'z_x')+'">'+esc(v)+'</span>';}
      else v=esc(v);
      if(c.cls)cl+=' '+c.cls;
      tr+='<td'+(cl.trim()?' class="'+cl.trim()+'"':'')+' title="'+esc(String(r[c.k]==null?'':r[c.k]))+'">'+v+'</td>';}
    h.push(tr+'</tr>');
  }
  tb.innerHTML=h.length?h.join(''):'<tr><td class="ld" colspan="'+(COLS.length+1)+'">Nic neodpovídá filtru.</td></tr>';
  $('info').textContent='Řádků: '+n+(n!==ROWS.length?(' (z '+ROWS.length+')'):'');
}

function load(){
  $('msg').innerHTML='';SELSET={};CUR=null;
  $('tab').getElementsByTagName('tbody')[0].innerHTML='<tr><td class="ld" colspan="'+(COLS.length+1)+'">Načítám…</td></tr>';
  $('info').textContent='';
  api('/api/v1/erp/app/dochazka-zak-tab/data?obdobi='+encodeURIComponent(OBD)).then(function(j){
    if(!j||!j.ok){$('msg').innerHTML='<div class="err">'+esc((j&&j.error)||'Nepodařilo se načíst data.')+'</div>';
      $('tab').getElementsByTagName('tbody')[0].innerHTML='';return;}
    ROWS=j.rows||[];render();
  });
}

/* ── Editační okno (dvojklik na řádek) ───────────────────────────────── */
var CINY=null, EDIT_I=null;
function loadCiny(cb){
  if(CINY){cb();return;}
  fetch('/api/v1/erp/app/dochazka-zak-tab/cinnosti',{credentials:'include'})
    .then(function(r){return r.json();}).then(function(j){CINY=(j&&j.ok&&j.cinnosti)||[];cb();})
    .catch(function(){CINY=[];cb();});
}
function fillCin(sel){
  var s=$('d_cin');
  s.innerHTML='<option value="">—</option>'+CINY.map(function(c){
    return '<option value="'+c.id+'">'+esc(c.name)+(c.ec!=null?(' ('+c.ec+')'):'')+'</option>';
  }).join('');
  s.value=(sel==null?'':String(sel));
}
function recalcH(){
  var od=$('d_od_d').value, ot=$('d_od_t').value||'00:00', kd=$('d_kon_d').value, kt=$('d_kon_t').value;
  if(od&&kd&&kt){var a=new Date(od+'T'+ot),b=new Date(kd+'T'+kt);var h=(b-a)/3600000;
    $('d_hod').value=isNaN(h)?'':(Math.round(h*100)/100).toFixed(2);}
}
function openEdit(i){
  var r=ROWS[i]; if(!r)return; EDIT_I=i; var isW=(r._kind==='W');
  $('d_id').textContent=(r._src?('· '+r._src):'');
  $('d_idnum').value=(r._id!=null?r._id:'');
  $('d_prac').value=(r._jm||'')+(r._cz?(' '+r._cz):'');
  $('d_zak').value=r._zak||'';
  loadCiny(function(){fillCin(r._cin_id);});
  $('d_od_d').value=r._od_d||''; $('d_od_t').value=r._od_t||'';
  $('d_kon_d').value=r._kon_d||''; $('d_kon_t').value=r._kon_t||'';
  $('d_hod').value=(r._hod!=null&&r._hod!=='')?Number(r._hod).toFixed(2):'';
  $('d_pozn').value=r._pozn||'';
  $('d_vpozn').value=''; $('d_pauza').value=''; $('d_req').checked=false; $('d_appr').checked=false;
  $('d_msg').textContent=''; $('d_msg').className='dmsg';
  var ro=$('d_ro'), edIds=['d_zak','d_od_d','d_od_t','d_kon_d','d_kon_t','d_pozn'];
  if(isW){
    ro.style.display='none';
    edIds.forEach(function(id){$(id).disabled=false;}); $('d_cin').disabled=false;
    $('d_ok').style.display='';
  }else{
    ro.style.display='';
    ro.textContent=(r._kind==='A')
      ? 'Tohle je absence (dovolená / nemoc / lékař). Opravuje se v „Opravy docházky" — tady je jen k nahlédnutí.'
      : 'Tohle je docházka (přítomnost / režie z píchačky). Opravuje se v „Opravy docházky" — tady je jen k nahlédnutí.';
    edIds.forEach(function(id){$(id).disabled=true;}); $('d_cin').disabled=true;
    $('d_ok').style.display='none';
  }
  $('ov').classList.add('on');
}
function reloadForm(){if(EDIT_I!=null)openEdit(EDIT_I);}
function closeEdit(){$('ov').classList.remove('on');EDIT_I=null;}
function saveEdit(){
  if(EDIT_I==null)return; var r=ROWS[EDIT_I];
  var body={kind:r._kind,id:r._id,zakazka:$('d_zak').value,cinnost_id:$('d_cin').value||null,
    od_d:$('d_od_d').value,od_t:$('d_od_t').value,kon_d:$('d_kon_d').value,kon_t:$('d_kon_t').value,
    hodiny:$('d_hod').value,poznamka:$('d_pozn').value};
  var m=$('d_msg'),ok=$('d_ok'); m.className='dmsg'; m.textContent='Ukládám…'; ok.disabled=true;
  fetch('/api/v1/erp/app/dochazka-zak-tab/save',{method:'POST',credentials:'include',
    headers:{'Content-Type':'application/json'},body:JSON.stringify(body)})
    .then(function(rp){return rp.json().then(function(j){return {s:rp.status,j:j};},
      function(){return {s:rp.status,j:{ok:false,error:(rp.status>=500?'Server je dočasně nedostupný — zkus to za chvíli.':'Neočekávaná odpověď serveru.')}};});})
    .then(function(res){ok.disabled=false;var j=res.j;
      if(j&&j.ok){m.className='dmsg ok';m.textContent='Uloženo.';setTimeout(function(){closeEdit();load();},450);}
      else{m.className='dmsg';m.textContent=(j&&j.error)||('Nepodařilo se uložit ('+res.s+').');}
    }).catch(function(){ok.disabled=false;m.className='dmsg';m.textContent='Nepodařilo se spojit se serverem.';});
}

// Obarvení JEDNOHO řádku bez překreslení celé tabulky (14k řádků) — kvůli rychlosti
// i spolehlivému dvojkliku (plný render byl tak pomalý, že přesáhl okno dvojkliku).
function paintRow(idx){
  var tr=document.querySelector('#tab tbody tr[data-i="'+idx+'"]');
  if(!tr)return;
  var selc=(SELSET[idx]||CUR===idx);
  tr.classList.toggle('sel',selc);
  var mkc=tr.getElementsByClassName('mk')[0];
  if(mkc)mkc.textContent=(CUR===idx)?'▶':(SELSET[idx]?'•':'');
}

function init(){
  hlavicka();
  // Bez tlačítka: tažení je VŽDY jen jednorázové (po obnovení zpět na základní). Sdílené
  // základní šířky (SRVW) nastaví Claude na server na vyžádání ("ulož šířky jako výchozí").
  // období z URL (?obdobi=vse|budoucnost) — uzel „Naplánovaná budoucnost" otevře rovnou budoucnost
  try{var _p=new URLSearchParams(location.search).get('obdobi');
    if(_p==='budoucnost'||_p==='vse'){OBD=_p;
      [].forEach.call($('chips').children,function(x){x.classList.toggle('on',x.getAttribute('data-o')===OBD);});}
  }catch(_e){}
  $('chips').addEventListener('click',function(e){var b=e.target.closest?e.target.closest('.chip'):null;if(!b)return;
    [].forEach.call($('chips').children,function(x){x.classList.remove('on');});b.classList.add('on');
    OBD=b.getAttribute('data-o');load();});
  // Dvojklik = otevřít formulář. Detekce dvou rychlých kliků; obarvení řádku je
  // teď inkrementální (paintRow), takže klik neblokuje a dvojklik se stihne.
  var _lastClick={i:-1,t:0};
  $('tab').getElementsByTagName('tbody')[0].addEventListener('click',function(e){
    if(e.target.closest('input,select'))return;var tr=e.target.closest('tr[data-i]');if(!tr)return;
    var i=parseInt(tr.getAttribute('data-i'),10), now=Date.now();
    if(_lastClick.i===i && (now-_lastClick.t)<600){_lastClick={i:-1,t:0};openEdit(i);return;}  // dvojklik = otevřít formulář
    _lastClick={i:i,t:now};
    var touched={}, oldCUR=CUR;
    if(e.shiftKey && CUR!=null){  // Shift+klik = označit úsek CUR..i
      var a=Math.min(CUR,i),b=Math.max(CUR,i);
      for(var x=a;x<=b;x++){SELSET[x]=true;touched[x]=1;}
    }else{  // klik = přepnout výběr řádku
      if(SELSET[i]){delete SELSET[i];}else{SELSET[i]=true;}
    }
    CUR=i; touched[i]=1; if(oldCUR!=null)touched[oldCUR]=1;
    for(var k in touched)paintRow(parseInt(k,10));});
  // Záloha: nativní dvojklik (kdyby překreslení nevadilo) — na jistotu
  $('tab').getElementsByTagName('tbody')[0].addEventListener('dblclick',function(e){
    if(e.target.closest('input,select'))return;var tr=e.target.closest('tr[data-i]');if(!tr)return;
    openEdit(parseInt(tr.getAttribute('data-i'),10));});
  ['d_od_d','d_od_t','d_kon_d','d_kon_t'].forEach(function(id){var el=$(id);if(el)el.addEventListener('input',recalcH);});
  document.addEventListener('keydown',function(e){if(e.key==='Escape'&&$('ov').classList.contains('on'))closeEdit();});
  $('ov').addEventListener('mousedown',function(e){if(e.target===$('ov'))closeEdit();});
  load();
}
// Nejdřív načti sdílené základní šířky ze serveru, pak postav tabulku
(function(){
  fetch('/api/v1/erp/app/dochazka-zak-tab/widths',{credentials:'include'})
    .then(function(r){return r.json();}).then(function(j){
      if(j&&j.ok){SRVW=j.base||{};MEW=j.me||{};}
    }).catch(function(){}).then(init,init);
})();
</script>
