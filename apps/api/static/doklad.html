<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Doklad — detail</title>
<style>
  :root{--bg:#0a1018;--card:#121a25;--bord:#1f2a38;--tx:#e6edf5;--mut:#8fa0b4;
        --accent:#4f8ef7;--green:#34d399;--amber:#fbbf24;--red:#ff8a8a;}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--tx);font:14.5px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
  .wrap{max-width:1000px;margin:0 auto;padding:22px}
  .top{display:flex;align-items:flex-start;gap:14px;flex-wrap:wrap;margin-bottom:6px}
  h1{font-size:23px;margin:0;font-weight:800}
  .badge{font-size:12.5px;padding:3px 11px;border-radius:11px;font-weight:600}
  .b-open{background:rgba(251,191,36,.14);color:var(--amber);border:1px solid #fbbf2455}
  .b-done{background:rgba(52,211,153,.14);color:var(--green);border:1px solid #34d39955}
  .sub{color:var(--mut);font-size:13px;margin:2px 0 18px}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-bottom:18px}
  .f{background:var(--card);border:1px solid var(--bord);border-radius:12px;padding:11px 13px}
  .f .l{color:var(--mut);font-size:11.5px}
  .f .v{font-weight:700;font-size:15px;margin-top:2px;word-break:break-word}
  h2{font-size:15px;margin:0 0 8px;color:var(--mut);font-weight:700}
  table{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--bord);border-radius:12px;overflow:hidden}
  th{color:var(--mut);font-weight:600;text-align:right;padding:10px 14px;border-bottom:1px solid var(--bord);font-size:12.5px;white-space:nowrap}
  th.l,td.l{text-align:left}
  td{padding:9px 14px;text-align:right;border-bottom:1px solid rgba(255,255,255,.04)}
  tr:last-child td{border-bottom:none}
  td.dil{max-width:420px;white-space:normal}
  .o{color:var(--amber);font-weight:800}
  .done{color:var(--green)}
  .hint{color:var(--mut);padding:20px}
  .err{color:var(--red);padding:20px}
</style>
</head>
<body>
<div class="wrap" id="root"><div class="hint">Načítám…</div></div>
<script>
function qs(k){
  var v=new URLSearchParams(location.search).get(k);
  if(v) return v;
  try{ if(window.__opcUrl){ return new URL(window.__opcUrl, location.origin).searchParams.get(k); } }catch(e){}
  return null;
}
function kc(n,m){ if(n==null||n==="")return""; return (+n).toLocaleString("cs-CZ")+" "+(m||"Kč"); }
function num(n){ return n==null?"":(+n).toLocaleString("cs-CZ"); }
function esc(s){ return (s==null?"":String(s)).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c];}); }

var id=qs("id");
fetch("/api/v1/erp/app/doklad/detail?id="+encodeURIComponent(id||""),{credentials:"include"})
  .then(function(r){return r.json();})
  .then(function(j){
    var R=document.getElementById("root");
    if(!j||!j.ok){ R.innerHTML='<div class="err">'+esc((j&&j.error)||"Nenačteno")+'</div>'; return; }
    var d=j.doklad, pol=j.polozky||[];
    var done=(d.splneno===true);
    var f=function(l,v){ return v?('<div class="f"><div class="l">'+l+'</div><div class="v">'+esc(v)+'</div></div>'):''; };
    var h='<div class="top"><h1>Vydaná objednávka '+esc(d.poradove_cislo||d.cislo||d.src_id)+'</h1>'
      +'<span class="badge '+(done?'b-done':'b-open')+'">'+(done?'Splněno ✓':'Otevřeno')+'</span></div>'
      +'<div class="sub">Řada '+esc(d.rada||'')+(d.cislo_zakazky?(' · zakázka '+esc(d.cislo_zakazky)):'')
      +(d.popis_dodavky?(' · '+esc(d.popis_dodavky)):'')+'</div>';
    h+='<div class="grid">'
      +f("Dodavatel", d.dodavatel)
      +f("Zkratka", d.zkratka)
      +f("IČO / DIČ", [d.ico,d.dic].filter(Boolean).join(" / "))
      +f("Pořízeno", d.dat_porizeni)
      +f("Termín dodávky", d.termin_dodavky)
      +f("Suma bez DPH", kc(d.suma_kc_bez_dph||d.suma_bez_dph, d.mena))
      +f("Č. nabídky dodavatele", d.cislo_nabidky_dod)
      +f("Adresa dodavatele", [d.ulice_s_cisly,d.psc].filter(Boolean).join(", "))
      +'</div>';
    h+='<h2>Položky ('+pol.length+')</h2>'
      +'<table><thead><tr><th class="l">Díl</th><th class="l">Zakázka</th>'
      +'<th>Objednáno</th><th>Dodáno</th><th>Otevřeno</th><th>JC</th><th>Cena</th></tr></thead><tbody>';
    pol.forEach(function(p){
      var ot=+p.otevreno;
      h+='<tr><td class="l dil">'+esc(p.dil||"")+(p.cislo_karty&&p.cislo_karty!==p.dil?(' <span style="color:var(--mut)">'+esc(p.cislo_karty)+'</span>'):'')+'</td>'
        +'<td class="l">'+esc(p.zakazka||"")+'</td>'
        +'<td>'+num(p.objednano)+'</td><td class="done">'+num(p.dodano)+'</td>'
        +'<td class="'+(ot>0?'o':'')+'">'+num(p.otevreno)+'</td>'
        +'<td>'+num(p.primarni_cena)+'</td><td>'+kc(p.cc_bez_dani_kc,p.mena)+'</td></tr>';
    });
    if(!pol.length) h+='<tr><td colspan="7" class="hint">Bez položek</td></tr>';
    h+='</tbody></table>';
    R.innerHTML=h;
    document.title="Objednávka "+(d.poradove_cislo||d.src_id);
  })
  .catch(function(e){ document.getElementById("root").innerHTML='<div class="err">Chyba: '+esc(e)+'</div>'; });
</script>
</body>
</html>
