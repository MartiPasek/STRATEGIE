<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>📚 Dokumentace</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/4.3.0/marked.min.js"></script>
<style>
  :root{--bg:#0a1018;--card:#121a25;--bord:#1f2a38;--tx:#e6edf5;--mut:#8fa0b4;--accent:#4f8ef7;--green:#34d399;--amber:#fbbf24;--red:#f87171;}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.6 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
  .wrap{max-width:880px;margin:0 auto;padding:16px}
  .topbar{position:sticky;top:0;background:var(--bg);padding:8px 0;border-bottom:1px solid var(--bord);display:flex;gap:8px;flex-wrap:wrap;align-items:center;z-index:5}
  select,.btn{background:#0f1830;border:1px solid var(--bord);color:var(--tx);border-radius:8px;padding:8px 12px;font-size:14px}
  .btn{cursor:pointer;font-weight:700}
  .btn.pri{background:var(--accent);color:#06101f;border:0}
  .btn.fb{background:rgba(251,191,36,.16);color:var(--amber);border:1px solid rgba(251,191,36,.4)}
  .doc{background:var(--card);border:1px solid var(--bord);border-radius:12px;padding:22px;margin-top:12px}
  .doc h1{font-size:24px} .doc h2{font-size:19px;margin-top:22px;border-bottom:1px solid var(--bord);padding-bottom:4px}
  .doc h3{font-size:16px} .doc table{border-collapse:collapse;width:100%;margin:10px 0;font-size:13px}
  .doc th,.doc td{border:1px solid var(--bord);padding:6px 9px;text-align:left;vertical-align:top}
  .doc th{background:#0f1830} .doc code{background:#0f1830;padding:1px 5px;border-radius:4px;font-size:13px}
  .doc pre{background:#0f1830;border:1px solid var(--bord);border-radius:8px;padding:10px;overflow:auto}
  .doc blockquote{border-left:3px solid var(--accent);margin:8px 0;padding:4px 12px;color:var(--mut)}
  .doc a{color:var(--accent)}
  /* feedback panel */
  #fbpanel{position:fixed;right:16px;bottom:16px;width:340px;max-width:92vw;background:var(--card);border:1px solid var(--accent);border-radius:12px;padding:12px;box-shadow:0 8px 30px rgba(0,0,0,.5);display:none;z-index:20}
  #fbpanel h3{margin:0 0 6px;font-size:15px}
  .fbtypes{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
  .fbtype{font-size:12px;padding:4px 9px;border-radius:8px;border:1px solid var(--bord);background:#0f1830;color:var(--tx);cursor:pointer}
  .fbtype.on{background:var(--accent);color:#06101f;border:0;font-weight:700}
  #fbtext{width:100%;min-height:80px;background:#0f1830;border:1px solid var(--bord);color:var(--tx);border-radius:8px;padding:8px;font:14px inherit;resize:vertical}
  .hint{color:var(--mut);font-size:12px}
  @media print{ .topbar,#fbpanel,#fbFab{display:none!important} body{background:#fff;color:#000} .doc{border:0;background:#fff;color:#000} .doc th{background:#eee} }
  #fbFab{position:fixed;right:16px;bottom:16px;background:var(--amber);color:#06101f;border:0;border-radius:30px;padding:12px 16px;font-weight:800;cursor:pointer;box-shadow:0 6px 20px rgba(0,0,0,.4);z-index:19}
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <select id="sel" onchange="openDoc(this.value)"></select>
    <button class="btn pri" onclick="window.print()">🖨 Tisk</button>
    <span class="hint" id="hint">Máte dotaz nebo něco nesedí? → tlačítko vpravo dole 💬</span>
  </div>
  <div class="doc" id="doc">Načítám…</div>
</div>
<button id="fbFab" onclick="openFb()">💬 Mám dotaz / něco nesedí</button>
<div id="fbpanel">
  <h3>💬 Napište nám to</h3>
  <div class="hint">Co potřebujete? (uvidíme to hned a odpovíme)</div>
  <div class="fbtypes" id="fbtypes"></div>
  <textarea id="fbtext" placeholder="Napište dotaz, co nechápete, co je špatně, s čím nesouhlasíte nebo co doplnit…"></textarea>
  <div style="display:flex;gap:8px;margin-top:8px">
    <button class="btn pri" onclick="sendFb()">Odeslat</button>
    <button class="btn" onclick="closeFb()">Zavřít</button>
    <span id="fbmsg" class="hint"></span>
  </div>
</div>
<script>
function esc(s){return(s==null?"":String(s)).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c]));}
function api(p,m,b){return fetch(p,{method:m||"GET",credentials:"include",headers:b?{"Content-Type":"application/json"}:{},body:b?JSON.stringify(b):undefined}).then(r=>r.json());}
function qp(k){return new URLSearchParams(location.search).get(k);}
var KEY=qp("key")||"tutorial";
var FBTYPES=[["otazka","❓ Dotaz"],["nerozumim","🤔 Nerozumím"],["spatne","⚠️ Je to špatně"],["nesouhlas","✋ Nesouhlasím"],["doplnit","➕ Chci doplnit"]];
var fbtype="otazka";
function initTypes(){document.getElementById("fbtypes").innerHTML=FBTYPES.map(t=>'<span class="fbtype'+(t[0]===fbtype?' on':'')+'" data-t="'+t[0]+'" onclick="pickType(\''+t[0]+'\')">'+t[1]+'</span>').join('');}
function pickType(t){fbtype=t;initTypes();}
function openFb(){document.getElementById("fbpanel").style.display="block";document.getElementById("fbFab").style.display="none";}
function closeFb(){document.getElementById("fbpanel").style.display="none";document.getElementById("fbFab").style.display="block";document.getElementById("fbmsg").textContent="";}
function sendFb(){
  var t=document.getElementById("fbtext").value.trim();if(!t){document.getElementById("fbmsg").textContent="napište text";return;}
  api("/api/v1/erp/app/kb/feedback","POST",{doc_key:KEY,typ:fbtype,text:t}).then(r=>{
    if(r&&r.ok){document.getElementById("fbtext").value="";document.getElementById("fbmsg").innerHTML='<span style="color:#34d399">Odesláno — díky! Reagujeme.</span>';setTimeout(closeFb,1500);}
    else{document.getElementById("fbmsg").textContent=(r&&r.error)||"chyba";}
  });
}
function loadList(){return api("/api/v1/erp/app/kb/list").then(j=>{
  if(!j||!j.ok)return;
  document.getElementById("sel").innerHTML=j.docs.map(d=>'<option value="'+d.key+'"'+(d.key===KEY?' selected':'')+'>'+esc(d.title)+'</option>').join('');
});}
function openDoc(key){KEY=key;history.replaceState(null,"","?key="+key);
  api("/api/v1/erp/app/kb/raw/"+encodeURIComponent(key)).then(j=>{
    if(!j||!j.ok){document.getElementById("doc").innerHTML='<span style="color:#f87171">'+esc((j&&j.error)||"nelze načíst")+'</span>';return;}
    document.getElementById("doc").innerHTML=marked.parse(j.md);
  });
}
initTypes();loadList();openDoc(KEY);
</script>
</body>
</html>
