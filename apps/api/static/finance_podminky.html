<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>💰 Finanční podmínky</title>
<style>
  /* Tmavé schéma dle ERP STRATEGIE (Šárka 8.7.2026 — držet stejné jako ERP/Marti-AI) */
  :root{--bg:#0f141a;--panel:#161c24;--panel2:#12181f;--line:#233040;--line2:#1e2730;
        --txt:#cdd6e2;--title:#e8eef5;--accent:#aac8ec;--muted:#7f8ea0;--in:#0f141a;}
  *{box-sizing:border-box}
  body{margin:0;font:14px/1.55 -apple-system,Segoe UI,Roboto,system-ui,sans-serif;color:var(--txt);background:var(--bg)}
  .top{background:var(--panel2);border-bottom:1px solid var(--line);padding:11px 18px;display:flex;align-items:center;gap:10px}
  .top .b{font-weight:800;font-size:16px;color:var(--title);display:flex;align-items:center;gap:8px}
  .lock{margin-left:auto;font-size:11px;font-weight:700;color:#ffcf6b;background:#2a2312;border:1px solid #4a3a16;border-radius:20px;padding:3px 11px}
  .wrap{max-width:1180px;margin:16px auto;padding:0 14px;display:grid;grid-template-columns:320px 1fr;gap:16px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden}
  .card .hd{padding:11px 14px;font-weight:800;color:var(--title);border-bottom:1px solid var(--line);font-size:13.5px}
  #srch{width:100%;border:0;border-bottom:1px solid var(--line);padding:10px 14px;font:inherit;outline:none;background:var(--panel);color:var(--txt)}
  #srch::placeholder{color:#5d6b7c}
  .lst{max-height:74vh;overflow:auto}
  .prow{padding:10px 14px;border-top:1px solid var(--line2);cursor:pointer}
  .prow:first-child{border-top:0}
  .prow:hover{background:#1b232d}
  .prow.sel{background:#1e2a38}
  .prow .nm{font-weight:700;color:var(--title)}
  .prow .mt{font-size:12px;color:var(--muted)}
  .chip{display:inline-block;font-size:10.5px;font-weight:700;border-radius:20px;padding:1px 8px;background:#1f2a37;color:var(--accent);margin-right:4px}
  .det{padding:16px 18px}
  .pomer{border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:14px;background:#12181f}
  .pomer h3{margin:0 0 4px;font-size:15px;color:var(--accent);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .meta{font-size:12.5px;color:var(--muted);margin-bottom:12px}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th{text-align:left;color:var(--muted);font-weight:600;font-size:11.5px;padding:4px 8px;border-bottom:1px solid var(--line)}
  td{padding:6px 8px;border-bottom:1px solid var(--line2)}
  td.num{text-align:right;font-variant-numeric:tabular-nums}
  .base td{font-weight:700;color:var(--title)}
  .empty{padding:26px;color:var(--muted);text-align:center;font-style:italic}
  .ph{font-size:10px;color:#5d6b7c;margin-left:4px}
  .ei{width:100px;border:1px solid #2b3a4a;background:var(--in);color:var(--txt);border-radius:6px;padding:3px 6px;font:inherit;text-align:right}
  .ei:focus{outline:none;border-color:var(--accent)}
  .sbtn{border:1px solid #2b3a4a;background:#1b232d;color:var(--txt);border-radius:6px;padding:3px 8px;cursor:pointer;font-size:12px;font-weight:600}
  .sbtn:hover{background:#232d39}
  .sbtn.p{background:#2e6f3e;border-color:#3a8a4d;color:#eafff0}
  .sbtn.p:hover{background:#357f47}
  .sbtn.d{color:#ff8a7a;border-color:#5a2a26}
  .addbar{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:10px;padding-top:10px;border-top:1px dashed var(--line)}
  .addbar select{border:1px solid #2b3a4a;background:var(--in);color:var(--txt);border-radius:6px;padding:4px 6px;font:inherit;max-width:220px}
  .aud{font-size:10.5px;color:#5d6b7c;margin-top:6px}
  .savemsg{font-size:12px;color:#7fe0a0;margin-left:8px}
  .flt{width:100%;border:1px solid #2b3a4a;background:var(--in);color:var(--txt);border-radius:6px;padding:5px 6px;font:inherit;outline:none}
  .flt:focus{border-color:var(--accent)}
  .fbar{padding:8px 12px;border-top:1px solid var(--line);display:grid;grid-template-columns:1fr 1fr;gap:6px}
  .fexp{padding:2px 12px 8px;display:flex;gap:8px;align-items:center}
  /* Šárka 21.7.2026: embed režim = vloženo do karty zaměstnance (schová seznam + horní lištu) */
  body.embed .top{display:none}
  body.embed .wrap{grid-template-columns:1fr;margin:0;max-width:none;padding:0}
  body.embed .wrap>.card:first-child{display:none}
  body.embed .wrap>.card:last-child{border:0;border-radius:0}
  body.embed .det{padding:10px 14px}
</style>
</head>
<body>
<div class="top">
  <div class="b">💰 Finanční podmínky</div>
  <span class="lock">🔒 citlivé · jen oprávnění</span>
</div>
<div class="wrap">
  <div class="card">
    <div class="hd">Zaměstnanci <span id="cnt" class="ph"></span></div>
    <input id="srch" placeholder="🔎 Hledat jméno…">
    <div class="fbar">
      <select id="ffirma" class="flt"><option value="">Všechny firmy</option><option value="EC">EUROSOFT-Control (EC)</option><option value="ES">EUROSOFT-System (ES)</option></select>
      <select id="fdruh" class="flt"><option value="">Všechny typy</option><option value="HPP">HPP</option><option value="OSVC">OSVČ</option><option value="DPP">DPP</option></select>
      <select id="fpoz" class="flt"><option value="">Všechny pozice</option></select>
      <select id="fsort" class="flt"><option value="az">Příjmení A–Z</option><option value="za">Příjmení Z–A</option><option value="poz">Dle pozice</option><option value="cislo">Dle čísla</option></select>
    </div>
    <div class="fexp">
      <button class="sbtn" onclick="exportCsv()">⬇ Export (CSV)</button>
      <label style="font-size:12px;color:var(--muted);display:flex;align-items:center;gap:4px;cursor:pointer"><input type="checkbox" id="fbyv" style="margin:0"> i bývalé</label>
      <span class="ph" id="fcnt"></span>
    </div>
    <div class="lst" id="lst"><div class="empty">Načítám…</div></div>
  </div>
  <div class="card"><div class="det" id="det"><div class="empty">Vyber zaměstnance vlevo.</div></div></div>
</div>
<script>
const API="/api/v1/erp";
let LIDE=[];
function esc(s){return (s==null?'':String(s)).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));}
async function j(u){const r=await fetch(u,{credentials:'same-origin'});return r.json();}
function kc(n){return n==null?'—':n.toLocaleString('cs-CZ',{maximumFractionDigits:2})+' Kč';}

async function load(){
  const _b=document.getElementById('fbyv');
  const d=await j(API+"/app/hr/finance/lide"+((_b&&_b.checked)?"?vsichni=1":""));
  const l=document.getElementById('lst');
  if(!d.ok){l.innerHTML='<div class="empty">🔒 Nemáš oprávnění zobrazit finanční podmínky.</div>';return;}
  LIDE=d.lide||[];
  document.getElementById('cnt').textContent='('+LIDE.length+')';
  render();
}
function _val(id){return (document.getElementById(id)||{}).value||'';}
function applyFilters(){
  const q=_val('srch').toLowerCase();
  const fp=_val('fpoz'), ff=_val('ffirma').toUpperCase(), fd=_val('fdruh').toUpperCase(), fs=_val('fsort')||'az';
  let f=LIDE.filter(p=>p.jmeno.toLowerCase().includes(q)
    && (!fp || (p.pozice_ciselnik||'')===fp)
    && (!ff || (p.firmy||'').toUpperCase().includes(ff))
    && (!fd || (p.typy||'').toUpperCase().includes(fd)));
  const _k=p=>((p.prijmeni||p.jmeno||'')+' '+(p.krestni||'')).trim();
  f=f.slice().sort((a,b)=>{
    if(fs==='za') return _k(b).localeCompare(_k(a),'cs');
    if(fs==='poz') return (a.pozice||'žžž').localeCompare(b.pozice||'žžž','cs')||_k(a).localeCompare(_k(b),'cs');
    if(fs==='cislo') return ((parseInt(a.cislo,10)||0)-(parseInt(b.cislo,10)||0))||_k(a).localeCompare(_k(b),'cs');
    return _k(a).localeCompare(_k(b),'cs');
  });
  return f;
}
function render(){
  const l=document.getElementById('lst');
  const f=applyFilters();
  const c=document.getElementById('fcnt'); if(c)c.textContent=f.length+' z '+LIDE.length;
  if(!f.length){l.innerHTML='<div class="empty">Nic nenalezeno.</div>';return;}
  l.innerHTML=f.map(p=>'<div class="prow" data-u="'+p.user_id+'" onclick="openP('+p.user_id+',this)">'+
    '<div class="nm">'+esc(p.jmeno)+(p.cislo?' <span class="chip">č. '+esc(p.cislo)+'</span>':'')+
    (p.aktivni===false?' <span class="chip" style="background:#3a2622;color:#ff9a8a">bývalý</span>':'')+'</div><div class="mt">'+
    (p.firmy?'<span class="chip">'+esc(p.firmy)+'</span>':'')+esc(p.typy||'')+
    (p.pozice?' · '+esc(p.pozice):'')+'</div></div>').join('');
}
function exportCsv(){
  const rows=applyFilters();
  const esc2=s=>'"'+String(s==null?'':s).replace(/"/g,'""')+'"';
  const head=['Příjmení','Jméno','Číslo zaměstnance','Firma','Typ úvazku','Pozice','Stav'];
  const lines=[head.map(esc2).join(';')];
  rows.forEach(p=>lines.push([(p.prijmeni||p.jmeno),(p.krestni||''),p.cislo,p.firmy,p.typy,p.pozice,
    (p.aktivni===false?'bývalý':'aktivní')].map(esc2).join(';')));
  const csv='﻿'+lines.join('\r\n');
  const blob=new Blob([csv],{type:'text/csv;charset=utf-8'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob);
  a.download='financni_podminky_'+new Date().toISOString().slice(0,10).replace(/-/g,'')+'.csv';
  document.body.appendChild(a); a.click(); document.body.removeChild(a); URL.revokeObjectURL(a.href);
}
document.getElementById('srch').addEventListener('input',render);
['fpoz','ffirma','fdruh','fsort'].forEach(id=>{const e=document.getElementById(id); if(e)e.addEventListener('change',render);});
{const b=document.getElementById('fbyv'); if(b)b.addEventListener('change',load);}
let POZ=[];
async function loadPozice(){ const d=await j(API+"/app/hr/finance/pozice-ciselnik"); if(d.ok){ POZ=d.pozice||[]; const f=document.getElementById('fpoz'); if(f)f.innerHTML='<option value="">Všechny pozice</option>'+POZ.map(o=>'<option value="'+esc(o.label)+'">'+esc(o.label)+'</option>').join(''); } }
function pozOpts(sel){ return '<option value="">— nezařazeno —</option>'+POZ.map(o=>'<option value="'+o.id+'"'+(o.id===sel?' selected':'')+'>'+esc(o.label)+'</option>').join(''); }

let CURU=null, TYPY=[];
function typyOpts(){ return '<option value="">+ složka…</option>'+TYPY.map(t=>'<option value="'+t.id+'">'+esc(t.nazev||t.kod)+'</option>').join(''); }
async function loadTypy(){ const d=await j(API+"/app/hr/finance/slozky-typy"); if(d.ok)TYPY=d.typy||[]; }
function nval(v){ if(v==null)return ''; return v; }

async function openP(uid,row){
  CURU=uid;
  document.querySelectorAll('.prow').forEach(e=>e.classList.remove('sel'));
  const sel=row||document.querySelector('.prow[data-u="'+uid+'"]'); if(sel)sel.classList.add('sel');
  const det=document.getElementById('det'); det.innerHTML='<div class="empty">Načítám…</div>';
  const d=await j(API+"/app/hr/finance/osoba?uid="+uid);
  if(!d.ok){det.innerHTML='<div class="empty">🔒 '+esc(d.error||'chyba')+'</div>';return;}
  if(!d.pomery||!d.pomery.length){det.innerHTML='<div class="empty">'+esc(d.jmeno)+' — žádný aktuální poměr.</div>';return;}
  let h='<h2 style="margin:0 0 14px;color:var(--title);">'+esc(d.jmeno)+'</h2>';
  for(const p of d.pomery){
    const eg=p.engagement_id;
    h+='<div class="pomer"><h3>'+esc(p.typ||'poměr')+
      (p.firma?' <span class="chip">'+esc(p.firma)+'</span>':'')+
      (p.hodinovka?' <span class="chip">hodinová</span>':'')+'</h3>'+
      '<div class="meta">'+
      (p.cislo?'č. zam. '+esc(p.cislo)+' · ':'')+
      'úvazek '+(p.uvazek!=null?p.uvazek+' h/týd':'—')+
      ' · smlouva '+(p.smlouva_od||'—')+(p.smlouva_do?' – '+p.smlouva_do:'')+
      (p.zkusebni_do?' · zkušební do '+p.zkusebni_do:'')+'</div>'+
      '<div class="addbar" style="margin-top:0;padding-top:8px"><label style="color:var(--muted);font-size:12px">Pozice:</label>'+
      '<select onchange="savePozice('+eg+',this.value)">'+pozOpts(p.position_id)+'</select></div>';
    h+='<table><tr><th>Mzdová složka</th><th style="text-align:right">Plán</th><th style="text-align:right">Skutečnost</th><th></th></tr>';
    for(const c of (p.slozky||[])){
      const ph=c.per_hour?'<span class="ph">/hod</span>':'';
      const base=(c.je_zaklad||/zaklad/.test(c.kod||''))?'base':'';
      const aud=c.changed_by?('<div class="aud" title="Kdo naposledy měnil tuto složku">✎ '+esc(c.changed_by)+(c.changed_at?' · '+c.changed_at.substring(0,10):'')+'</div>'):'';
      h+='<tr class="'+base+'" data-wc="'+c.id+'"><td>'+esc(c.nazev||c.kod)+ph+aud+'</td>'+
        '<td class="num"><input class="ei" data-f="plan" value="'+nval(c.plan)+'"></td>'+
        '<td class="num"><input class="ei" data-f="real" value="'+nval(c.real)+'"></td>'+
        '<td style="white-space:nowrap"><button class="sbtn p" onclick="saveRow(this,'+c.id+')">💾</button> '+
        '<button class="sbtn d" onclick="delRow('+c.id+')" title="Smazat">✕</button></td></tr>';
    }
    h+='</table>';
    h+='<div class="addbar"><select id="at_'+eg+'">'+typyOpts()+'</select>'+
      '<input class="ei" id="ap_'+eg+'" placeholder="plán"><input class="ei" id="ar_'+eg+'" placeholder="skut.">'+
      '<button class="sbtn" onclick="addRow('+eg+')">+ přidat</button>'+
      '<span class="savemsg" id="sm_'+eg+'"></span></div>';
    h+='</div>';
  }
  det.innerHTML=h;
}
async function _post(url,payload){
  const r=await fetch(API+url,{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});
  return r.json().catch(()=>({}));
}
async function saveRow(btn,wcId){
  const tr=btn.closest('tr');
  const plan=tr.querySelector('[data-f="plan"]').value;
  const real=tr.querySelector('[data-f="real"]').value;
  if(!confirm('Uložit změnu mzdové složky?'))return;
  const d=await _post('/app/hr/finance/slozka-save',{id:wcId,amount_planned:plan,amount_real:real});
  if(d.ok){ openP(CURU); } else { alert('Nepovedlo se: '+(d.error||'')); }
}
async function delRow(wcId){
  if(!confirm('Opravdu smazat tuto mzdovou složku?'))return;
  const d=await _post('/app/hr/finance/slozka-smazat',{id:wcId});
  if(d.ok){ openP(CURU); } else { alert('Nepovedlo se: '+(d.error||'')); }
}
async function addRow(eg){
  const ct=document.getElementById('at_'+eg).value;
  if(!ct){alert('Vyber složku.');return;}
  const plan=document.getElementById('ap_'+eg).value;
  const real=document.getElementById('ar_'+eg).value;
  const d=await _post('/app/hr/finance/slozka-save',{engagement_id:eg,component_type_id:parseInt(ct,10),amount_planned:plan,amount_real:real});
  if(d.ok){ openP(CURU); } else { alert('Nepovedlo se: '+(d.error||'')); }
}
async function savePozice(eg,pid){
  const d=await _post('/app/hr/finance/pozice-save',{engagement_id:eg,position_id:pid?parseInt(pid,10):null});
  if(d.ok){ await load(); openP(CURU); } else { alert('Nepovedlo se: '+(d.error||'')); }
}
if(new URLSearchParams(location.search).get('embed'))document.body.classList.add('embed');
loadTypy();
loadPozice();
// Šárka 21.7.2026: když přijde ?uid= (z karty zaměstnance), rovnou otevři tu osobu.
load().then(function(){
  var u=new URLSearchParams(location.search).get('uid');
  if(u && !isNaN(parseInt(u))) openP(parseInt(u));
});
</script>
</body>
</html>
