<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FLOW — Stav zakázek</title>
<style>
  :root{ --bg:#0e1622; --card:#16202e; --bord:#243347; --tx:#e6edf5; --dim:#9fb0c2; --navy:#4f8ef7;
         --green:#10b981; --amber:#f59e0b; --red:#ef4444; }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
  .wrap{max-width:1100px;margin:0 auto;padding:18px}
  .wrap.wide{max-width:none}
  h1{font-size:22px;margin:0 0 2px}
  .sub{color:var(--dim);font-size:13px;margin-bottom:16px}
  a.back{display:inline-block;color:var(--navy);text-decoration:none;font-size:14px;margin-bottom:12px;cursor:pointer}
  /* hub tiles */
  .tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
  .tile{background:var(--card);border:1px solid var(--bord);border-radius:16px;padding:18px 14px;text-align:center;cursor:pointer;transition:transform .1s,border-color .15s;position:relative}
  .tile:hover{border-color:var(--navy)} .tile:active{transform:scale(.97)}
  .tile .ic{font-size:34px;line-height:1}
  .tile .lb{margin-top:8px;font-weight:600;font-size:14.5px}
  .tile .sm{color:var(--dim);font-size:12px;margin-top:2px}
  .tile .bdg{position:absolute;top:8px;right:10px;font-size:12px;font-weight:800}
  .tile .bdg.amber{color:var(--amber)} .tile .bdg.blue{color:var(--navy)} .tile .bdg.red{color:var(--red)}
  .tile.soon{opacity:.62}
  /* shared */
  .row{display:flex;flex-wrap:wrap;gap:12px}
  .card{background:var(--card);border:1px solid var(--bord);border-radius:14px;padding:14px 16px}
  .hl{flex:1;min-width:220px;cursor:pointer}.hl .n{font-size:32px;font-weight:800;line-height:1}.hl .t{font-size:13px;color:var(--dim);margin-top:6px}
  .hl.amber{border-color:#7a5a13}.hl.amber .n{color:var(--amber)}
  .hl.blue{border-color:#27406b}.hl.blue .n{color:var(--navy)}
  .hl.red{border-color:#7a2020}.hl.red .n{color:var(--red)}
  .chips{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0 10px}
  .chip{padding:6px 13px;border-radius:999px;border:1px solid var(--bord);background:transparent;color:var(--dim);cursor:pointer;font-size:14px}
  .chip.on{background:var(--navy);border-color:var(--navy);color:#fff;font-weight:600}
  .pipe{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:8px}
  .st{flex:1;min-width:115px;background:var(--card);border:1px solid var(--bord);border-radius:12px;padding:12px;text-align:center}
  .st .n{font-size:24px;font-weight:700}.st .l{font-size:12px;color:var(--dim);margin-top:4px}
  .st.zkus{border-color:#7a5a13}.st.zkus .n{color:var(--amber)}.st.fakt{border-color:#27406b}.st.fakt .n{color:var(--navy)}
  h2{font-size:16px;margin:24px 0 8px}
  table{width:100%;border-collapse:collapse;font-size:13.5px}
  th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--bord)}
  th{color:var(--dim);font-weight:600}
  .badge{display:inline-block;font-size:11px;font-weight:700;padding:2px 7px;border-radius:6px;background:#1f2d40;color:var(--dim)}
  .badge.VR{background:#13361f;color:#5fd08a}.badge.SW{background:#27406b;color:#9cc1ff}.badge.PR{background:#3a2a55;color:#c9a9f5}
  .muted{color:var(--dim)} .funnel{color:var(--dim);font-size:13px;margin:6px 0}
  .err{background:#3a1414;border:1px solid #7a2020;color:#f3b4b4;padding:12px;border-radius:10px}
  .soonbox{background:var(--card);border:1px dashed var(--bord);border-radius:14px;padding:28px;text-align:center;color:var(--dim)}
  button.rf{background:var(--card);border:1px solid var(--bord);color:var(--tx);border-radius:10px;padding:8px 14px;cursor:pointer;font-size:14px;margin-top:18px}
</style>
</head>
<body>
<script>try{history.pushState({stg:1},"");window.addEventListener("popstate",function(){location.href="/mobile";});}catch(e){}</script>
<div class="wrap">
  <h1 id="ttl">FLOW — Stav zakázek</h1>
  <div class="sub" id="sub">Načítám…</div>
  <div id="content"></div>
</div>
<script>
'use strict';
var DATA=null, SEC={}, FILTER='ALL';
// poradi dle Marti: Obchod - VP - Nakup - Priprava - Vyroba - Zkusebna - Vyroba vyhodnoceni - Odvozy - Fakturace - Analyza
var TILES=[
  {id:'timeline',ic:'🗓️', lb:'Časová osa', sm:'běh všech zakázek na časové ose', ready:true},
  {id:'obchod',  ic:'🤝', lb:'Obchod',     sm:'obchodní jednání (CRM)', ready:true},
  {id:'vp',      ic:'📋', lb:'VP',          sm:'poptávky · kalkulace · nabídky · objednávky · zakázka', ready:true},
  {id:'zl',      ic:'📑', lb:'Zakázkové listy', sm:'výrobní listy — termíny · materiál · hodiny', ready:true},
  {id:'nakup',   ic:'🛒', lb:'Nákup',       sm:'objednávky materiálu', ready:true},
  {id:'priprava',ic:'🧰', lb:'Příprava',    sm:'příjem materiálu — přebírání', ready:true},
  {id:'vyroba',  ic:'🏭', lb:'Výroba',      sm:'plán a průběh výroby', ready:true},
  {id:'zkusebna',ic:'🔬', lb:'Zkušebna',    sm:'zkušební protokoly', ready:true},
  {id:'vyhodnoceni',ic:'📈', lb:'Výroba — vyhodnocení', sm:'efektivita montérů', ready:true},
  {id:'odvozy',  ic:'🚚', lb:'Odvozy',      sm:'doprava zákazníkovi', ready:true},
  {id:'fakturace',ic:'🧾', lb:'Fakturace',  sm:'stav fakturace', ready:true},
  {id:'analyza', ic:'📊', lb:'Analýza',     sm:'kde co vázne (celý flow)', ready:true}
];
function esc(s){return (s==null?'':String(s)).replace(/[&<>]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;'}[c];});}
function num(n){return (n||0).toLocaleString('cs-CZ');}
function go(v){ location.hash=v; route(); }

function api(section){
  var u='/api/v1/erp/app/flow'+(section?('?section='+section):'');
  return fetch(u,{credentials:'same-origin'})
    .then(function(r){ if(r.status===401||r.status===403){throw new Error('Tato sekce je jen pro vedení (přihlas se jako rodič).');} return r.json(); })
    .then(function(j){ if(!j.ok){ throw new Error(j.error||'chyba'); } return j; });
}
function showErr(e){ document.getElementById('sub').textContent=''; document.getElementById('content').innerHTML='<div class="err">'+esc(e.message)+'</div>'; }
function load(){ api('').then(function(j){ DATA=j; route(); }).catch(showErr); }
var SECVIEW={timeline:renderTimeline, obchod:renderObchod, vyroba:renderVyroba, zkusebna:renderZkusebna, odvozy:renderOdvozy, fakturace:renderFakturace, priprava:renderPriprava, vyhodnoceni:renderVyhod, zl:renderZl};
function route(){
  var v=(location.hash||'').replace('#','')||'hub';
  var c=document.getElementById('content'); c.innerHTML='';
  var wEl=document.querySelector('.wrap'); if(wEl){ if(v==='timeline') wEl.classList.add('wide'); else wEl.classList.remove('wide'); }
  document.getElementById('sub').textContent = DATA?('Živá data z Centrály · '+esc(DATA.generated||'')+' · jen čtení, nic se nemění'):'';
  if(v==='hub'){ document.getElementById('ttl').textContent='FLOW — Stav zakázek'; renderHub(c); return; }
  var tile=TILES.filter(function(t){return t.id===v;})[0];
  document.getElementById('ttl').textContent='FLOW · '+(tile?tile.lb:v);
  var back=document.createElement('a'); back.className='back'; back.textContent='← Zpět na FLOW'; back.onclick=function(){go('hub');}; c.appendChild(back);
  if(v==='analyza'){ renderAnalyza(c); return; }
  if(v==='vp'){ renderVP(c); return; }
  if(v==='nakup'){ renderNakup(c); return; }
  if(SECVIEW[v]){
    if(SEC[v]){ SECVIEW[v](c, SEC[v]); }
    else { var ld=document.createElement('div'); ld.className='muted'; ld.textContent='Načítám…'; c.appendChild(ld);
      api(v).then(function(j){ SEC[v]=j; route(); }).catch(showErr); }
    return;
  }
  renderSoon(c, tile);
}

function renderHub(c){
  var nef=(DATA.nefakturovano||[]).length, neu=(DATA.neuzavreno||[]).length, mat=(DATA.material_po_terminu||[]).length;
  var g=document.createElement('div'); g.className='tiles';
  TILES.forEach(function(t){
    var d=document.createElement('div'); d.className='tile'+(t.ready?'':' soon'); d.onclick=function(){go(t.id);};
    var bdg='';
    if(t.id==='analyza' && (nef+neu)) bdg='<span class="bdg amber">'+num(nef+neu)+'</span>';
    if(t.id==='nakup' && mat) bdg='<span class="bdg red">'+num(mat)+'</span>';
    d.innerHTML=bdg+'<div class="ic">'+t.ic+'</div><div class="lb">'+esc(t.lb)+'</div><div class="sm">'+esc(t.sm)+(t.ready?'':' · brzy')+'</div>';
    g.appendChild(d);
  });
  c.appendChild(g);
}

function renderSoon(c, tile){
  var b=document.createElement('div'); b.className='soonbox';
  b.innerHTML='<div style="font-size:40px">'+(tile?tile.ic:'🧩')+'</div>'
    +'<div style="font-size:17px;font-weight:600;color:var(--tx);margin:8px 0">'+esc(tile?tile.lb:'')+'</div>'
    +'<div>Přehled připravujeme. Řekni, co přesně sem má patřit — doplním ho jako další ikonu do FLOW.</div>';
  c.appendChild(b);
}

function renderVP(c){
  var f={}; (DATA.funnel||[]).forEach(function(r){f[String(r.rada).trim()]=r;});
  function ff(k){var x=f[k];return x?num(x.pocet):'0';}
  function fs(k){var x=f[k];return x?num(x.splneno):'0';}
  var row=document.createElement('div'); row.className='row';
  row.innerHTML=
    '<div class="card hl"><div class="n">'+ff('900')+'</div><div class="t">Poptávky (900) · splněno '+fs('900')+'</div></div>'
    +'<div class="card hl"><div class="n">'+ff('910')+'</div><div class="t">Kalkulace + nabídky (910) · splněno '+fs('910')+'</div></div>'
    +'<div class="card hl"><div class="n">'+ff('920')+'</div><div class="t">Přijaté objednávky (920) · splněno '+fs('920')+'</div></div>';
  c.appendChild(row);
  var note=document.createElement('div'); note.className='funnel'; note.style.margin='12px 0 6px';
  note.textContent='Trychtýř od 1. 1. 2024. Níže řízení vzniklých zakázek — otevřené podle fáze.';
  c.appendChild(note);
  var chips=document.createElement('div'); chips.className='chips';
  [['ALL','Vše'],['VR','VR'],['SW','SW'],['PR','PR'],['OST','Ost.']].forEach(function(t){
    var b=document.createElement('button'); b.className='chip'+(FILTER===t[0]?' on':''); b.textContent=t[1]; b.onclick=function(){FILTER=t[0];route();}; chips.appendChild(b);
  });
  c.appendChild(chips);
  var m=stageCounts(FILTER);
  var STAGES=[['2_bezzl','Bez ZL'],['3_zl','Zakázkový list'],['4_vyr','Ve výrobě'],['5_zkus','Zkušebna'],['6_fakt','Fakturováno']];
  var pipe=document.createElement('div'); pipe.className='pipe';
  STAGES.forEach(function(s){ var d=document.createElement('div'); d.className='st'; d.innerHTML='<div class="n">'+num(m[s[0]])+'</div><div class="l">'+s[1]+'</div>'; pipe.appendChild(d); });
  c.appendChild(pipe);
  var tot=document.createElement('div'); tot.className='muted'; tot.style.fontSize='13px'; tot.style.marginTop='4px';
  tot.textContent='Otevřených zakázek '+(FILTER==='ALL'?'celkem':FILTER)+': '+num(m['2_bezzl']+m['3_zl']+m['4_vyr']+m['5_zkus']+m['6_fakt']);
  c.appendChild(tot);
}

function renderObchod(c,j){
  var rows=(j&&j.jednani)||[];
  var open=rows.filter(function(r){return !r.splneno;}).length;
  var row=document.createElement('div'); row.className='row';
  row.innerHTML='<div class="card hl"><div class="n">'+num(rows.length)+'</div><div class="t">Obchodní jednání za 3 měsíce</div></div>'
    +'<div class="card hl amber"><div class="n">'+num(open)+'</div><div class="t">Nesplněná (otevřená)</div></div>';
  c.appendChild(row);
  var h=document.createElement('h2'); h.textContent='Poslední obchodní jednání'; c.appendChild(h);
  if(!rows.length){ var m=document.createElement('div'); m.className='muted'; m.textContent='Žádná jednání za poslední 3 měsíce.'; c.appendChild(m); return; }
  var t=document.createElement('table');
  t.innerHTML='<tr><th>Datum</th><th>Typ</th><th>Firma / osoba</th><th>Popis</th><th>Řešitel</th><th>✓</th></tr>'+
    rows.map(function(r){
      var who=esc(r.firma)+(r.osoba?(' · '+esc(r.osoba)):'');
      return '<tr><td>'+esc(r.dat||'—')+'</td><td>'+esc(r.akce)+'</td><td>'+who+'</td><td>'+esc(r.popis)+'</td><td>'+esc(r.autor)+'</td><td>'+(r.splneno?'✅':'⏳')+'</td></tr>';
    }).join('');
  c.appendChild(t);
}
function muted(txt){var m=document.createElement('div');m.className='muted';m.textContent=txt;return m;}
function renderVyroba(c,j){
  var rows=(j&&j.vyroba)||[];
  function cnt(s){return rows.filter(function(r){return r.stav===s;}).length;}
  var row=document.createElement('div'); row.className='row';
  row.innerHTML='<div class="card hl"><div class="n">'+num(cnt('probiha'))+'</div><div class="t">Probíhá</div></div>'
    +'<div class="card hl"><div class="n">'+num(cnt('naplanovano'))+'</div><div class="t">Naplánováno</div></div>'
    +'<div class="card hl amber"><div class="n">'+num(cnt('po terminu'))+'</div><div class="t">Po plánovaném termínu</div></div>';
  c.appendChild(row);
  var h=document.createElement('h2'); h.textContent='Zakázky ve výrobě ('+rows.length+')'; c.appendChild(h);
  if(!rows.length){c.appendChild(muted('Nic v plánu výroby.'));return;}
  var t=document.createElement('table');
  t.innerHTML='<tr><th>Zakázka</th><th>Od</th><th>Do</th><th>Stav</th></tr>'+rows.map(function(r){
    var col=r.stav==='po terminu'?'color:#f59e0b;font-weight:700':(r.stav==='probiha'?'color:#10b981':'');
    return '<tr><td>'+esc(r.cz)+'</td><td>'+esc(r.od||'—')+'</td><td>'+esc(r.dodatum||'—')+'</td><td><span style="'+col+'">'+esc(r.stav)+'</span></td></tr>';
  }).join(''); c.appendChild(t);
}
function renderZkusebna(c,j){
  var rows=(j&&j.zkusebna)||[];
  var h=document.createElement('h2'); h.textContent='Zkušební protokoly za 3 měsíce ('+rows.length+')'; c.appendChild(h);
  if(!rows.length){c.appendChild(muted('Žádné protokoly.'));return;}
  var t=document.createElement('table');
  t.innerHTML='<tr><th>Zakázka</th><th>Datum výroby</th><th>Stáří</th></tr>'+rows.map(function(r){
    return '<tr><td>'+esc(r.cz)+'</td><td>'+esc(r.dat||'—')+'</td><td>'+dniBadge(r.dni)+'</td></tr>';}).join(''); c.appendChild(t);
}
function renderOdvozy(c,j){
  var rows=(j&&j.odvozy)||[];
  var plan=rows.filter(function(r){return !r.odvezeno;}).length, done=rows.filter(function(r){return r.odvezeno;}).length;
  var row=document.createElement('div'); row.className='row';
  row.innerHTML='<div class="card hl"><div class="n">'+num(plan)+'</div><div class="t">Plánované (neodvezeno)</div></div>'
    +'<div class="card hl"><div class="n">'+num(done)+'</div><div class="t">Odvezeno (3 měsíce)</div></div>';
  c.appendChild(row);
  var h=document.createElement('h2'); h.textContent='Odvozy ('+rows.length+')'; c.appendChild(h);
  if(!rows.length){c.appendChild(muted('Žádné odvozy.'));return;}
  var t=document.createElement('table');
  t.innerHTML='<tr><th>Zakázka</th><th>Název</th><th>Plán odvozu</th><th>Odvezeno</th><th>Dopravce</th></tr>'+rows.map(function(r){
    return '<tr><td>'+esc(r.cz)+'</td><td>'+esc(r.nazev)+'</td><td>'+esc(r.odvoz||'—')+'</td><td>'+(r.odvezeno?('✅ '+esc(r.odvezeno)):'⏳')+'</td><td>'+esc(r.dopravce)+'</td></tr>';}).join(''); c.appendChild(t);
}
function renderFakturace(c,j){
  var stav=(j&&j.fakt_stav)||[], chybi=(j&&j.fakt_chybi)||[];
  var row=document.createElement('div'); row.className='row';
  stav.forEach(function(s){
    var amber=(String(s.stav).indexOf('Chyb')>=0);
    row.innerHTML+='<div class="card hl'+(amber?' amber':'')+'"><div class="n">'+num(s.pocet)+'</div><div class="t">'+esc(s.stav)+'</div></div>';
  });
  c.appendChild(row);
  var h=document.createElement('h2'); h.textContent='Zakázky kde chybí faktury ('+chybi.length+')'; c.appendChild(h);
  if(!chybi.length){c.appendChild(muted('Nic nechybí 🎉'));return;}
  var t=document.createElement('table');
  t.innerHTML='<tr><th>Zakázka</th><th>Název</th><th>Zákazník</th><th>Pořízeno</th></tr>'+chybi.map(function(r){
    return '<tr><td>'+esc(r.cz)+'</td><td>'+esc(r.nazev)+'</td><td>'+esc(r.zakaznik)+'</td><td>'+esc(r.dat||'—')+'</td></tr>';}).join(''); c.appendChild(t);
}
function pd(s){ if(!s) return null; var p=String(s).split('-'); if(p.length<3) return null; var d=new Date(+p[0],+p[1]-1,+p[2]); return isNaN(d)?null:d; }
function fdmy(s){ var d=pd(s); if(!d) return ''; return d.getDate()+'.'+(d.getMonth()+1)+'.'; }
var TLF='ALL', TLDET={}, TLPX=7, TLSHOWH=true, TLSHOWU=true;
(function(){ if(lsG('flow_showh')==='0')TLSHOWH=false; if(lsG('flow_showu')==='0')TLSHOWU=false; })();
function tlBand(which,on){ if(which==='h'){TLSHOWH=on; lsS('flow_showh',on?'1':'0');} else {TLSHOWU=on; lsS('flow_showu',on?'1':'0');} route(); }
function lsG(k){ try{return localStorage.getItem(k);}catch(e){return null;} }
function lsS(k,v){ try{localStorage.setItem(k,v);}catch(e){} }
(function(){ var z=parseInt(lsG('flow_tl_px'),10); if(z>=3&&z<=28) TLPX=z; })();
function tlZoom(d){ TLPX=Math.max(3,Math.min(28,TLPX+d)); lsS('flow_tl_px',TLPX); route(); }
function renderTimeline(c,j){
  var all=(j&&j.timeline)||[];
  if(!all.length){ c.appendChild(muted('Žádné zakázky s naplánovaným během (plán montérů / termíny).')); return; }
  var leg=document.createElement('div'); leg.className='muted'; leg.style.fontSize='12px'; leg.style.margin='2px 2px 8px';
  leg.innerHTML='Pruh = naplánovaná výroba (od 1. dne montérů po termín k zákazníkovi) · číslo v pruhu = plán hodin · 🔧 materiál · 🔬 zkušebna · 🚚 odvoz · 🎯 k zákazníkovi · červená čára = dnes. Klikni na zakázku = kdo je naplánovaný. Posuň vodorovně.';
  c.appendChild(leg);
  var chips=document.createElement('div'); chips.className='chips'; chips.style.margin='0 0 8px'; chips.style.display='flex'; chips.style.alignItems='center'; chips.style.gap='6px'; chips.style.flexWrap='wrap';
  [['ALL','Vše'],['VR','VR'],['SW','SW'],['PR','PR'],['OST','Ost.']].forEach(function(t){
    var b=document.createElement('button'); b.className='chip'+(TLF===t[0]?' on':''); b.textContent=t[1]; b.onclick=function(){TLF=t[0]; route();}; chips.appendChild(b);
  });
  var sp=document.createElement('span'); sp.style.flex='1'; chips.appendChild(sp);
  var zlbl=document.createElement('span'); zlbl.className='muted'; zlbl.style.fontSize='12px'; zlbl.textContent='Šířka:'; chips.appendChild(zlbl);
  var bMinus=document.createElement('button'); bMinus.className='chip'; bMinus.textContent='− zúžit'; bMinus.title='Zúžit graf'; bMinus.onclick=function(){tlZoom(-2);}; chips.appendChild(bMinus);
  var bPlus=document.createElement('button'); bPlus.className='chip'; bPlus.textContent='+ roztáhnout'; bPlus.title='Roztáhnout graf'; bPlus.onclick=function(){tlZoom(2);}; chips.appendChild(bPlus);
  var bPpl=document.createElement('button'); bPpl.className='chip'; bPpl.textContent='👷 Lidé'; bPpl.title='Lidé výroby v plánování'; bPpl.style.marginLeft='6px'; bPpl.onclick=openPeopleModal; chips.appendChild(bPpl);
  var bVyt=document.createElement('button'); bVyt.className='chip'; bVyt.textContent='📈 Vytížení'; bVyt.title='Vytížení montérů (denní přehled)'; bVyt.style.marginLeft='6px'; bVyt.onclick=function(){window.open('/vytizeni','strategieVyt');}; chips.appendChild(bVyt);
  c.appendChild(chips);
  var rows=all.filter(function(r){ return TLF==='ALL'||String(r.typ)===TLF; });
  if(!rows.length){ c.appendChild(muted('Žádné zakázky typu '+TLF+'.')); return; }
  var today=new Date(); today.setHours(0,0,0,0);
  var min=today, max=today, KEYS=['vyr_od','vyr_do','term_mat','term_zak','zkusebna','odvoz'];

function tlGroup(daily){
  var by={}, order=[];
  (daily||[]).forEach(function(d){ var k=String(d.cislo); if(!by[k]){ by[k]={cislo:d.cislo,jmeno:d.jmeno,hod:0,days:[]}; order.push(k); } by[k].hod+=(parseInt(d.hod,10)||0); by[k].days.push({den:d.den,hod:parseInt(d.hod,10)||0}); });
  var out=order.map(function(k){ return by[k]; });
  out.forEach(function(p){ p.days.sort(function(a,b){ return a.den<b.den?-1:(a.den>b.den?1:0); });
    var segs=[], cur=null;
    p.days.forEach(function(dd){ var dt=pd(dd.den); if(!dt) return;
      if(cur && Math.round((dt-cur._l)/864e5)===1){ cur.do=dd.den; cur._l=dt; cur.hod+=dd.hod; }
      else { if(cur) segs.push(cur); cur={od:dd.den,do:dd.den,_l:dt,hod:dd.hod}; } });
    if(cur) segs.push(cur); p.segs=segs;
    p.od=p.days.length?p.days[0].den:null; p.do=p.days.length?p.days[p.days.length-1].den:null;
  });
  out.sort(function(a,b){ return (a.od||'')<(b.od||'')?-1:((a.od||'')>(b.od||'')?1:0); });
  return out;
}

  c.appendChild(chips);
  var m=stageCounts(FILTER);
  var STAGES=[['2_bezzl','Bez ZL',''],['3_zl','Zakázkový list',''],['4_vyr','Ve výrobě',''],['5_zkus','Zkušebna → fakturovat','zkus'],['6_fakt','Fakturováno → zavřít','fakt']];
  var pipe=document.createElement('div'); pipe.className='pipe';
  STAGES.forEach(function(s){ var d=document.createElement('div'); d.className='st'+(s[2]?(' '+s[2]):''); d.innerHTML='<div class="n">'+num(m[s[0]])+'</div><div class="l">'+s[1]+'</div>'; pipe.appendChild(d); });
  c.appendChild(pipe);
  c.appendChild(mkTable('t-nef','💰 Po zkušebně, nefakturováno','Zkušebna',listFor(nef,FILTER),{}));
  c.appendChild(mkTable('t-neu','📁 Fakturováno, neuzavřeno','Faktura',listFor(neu,FILTER),{kc:true}));
  c.appendChild(mkMaterial(DATA.material_po_terminu||[]));
  var rf=document.createElement('button'); rf.className='rf'; rf.textContent='🔄 Obnovit'; rf.onclick=function(){load();}; c.appendChild(rf);
}
function mkTable(id,title,datLabel,rows,opts){
  opts=opts||{}; var w=document.createElement('div');
  var h=document.createElement('h2'); h.id=id; h.textContent=title+' ('+rows.length+')'; w.appendChild(h);
  if(!rows.length){ var p=document.createElement('div'); p.className='muted'; p.textContent='Nic tu není 🎉'; w.appendChild(p); return w; }
  var head='<tr><th>Typ</th><th>Zakázka</th><th>Název</th><th>'+datLabel+'</th><th>Stáří</th>'+(opts.kc?'<th>Kč bez DPH</th>':'')+'</tr>';
  var body=rows.map(function(r){ return '<tr><td><span class="badge '+esc(r.typ)+'">'+esc(r.typ)+'</span></td><td>'+esc(r.cz)+'</td><td>'+esc(r.nazev)+'</td><td>'+esc(r.dat||'—')+'</td><td>'+dniBadge(r.dni)+'</td>'+(opts.kc?('<td>'+(r.kc!=null?num(r.kc):'—')+'</td>'):'')+'</tr>'; }).join('');
  var t=document.createElement('table'); t.innerHTML=head+body; w.appendChild(t); return w;
}
function mkMaterial(rows){
  var w=document.createElement('div');
  var h=document.createElement('h2'); h.id='t-mat'; h.textContent='🚚 Materiál po termínu ('+rows.length+')'; w.appendChild(h);
  if(!rows.length){ var p=document.createElement('div'); p.className='muted'; p.textContent='Nic po termínu 🎉'; w.appendChild(p); return w; }
  var t=document.createElement('table');
  t.innerHTML='<tr><th>Dodavatel</th><th>Zakázka</th><th>Doklad</th><th>Termín</th><th>Po termínu</th></tr>'+
    rows.map(function(r){return '<tr><td>'+esc(r.dodavatel)+'</td><td>'+esc(r.cz)+'</td><td>'+esc(r.doklad)+'</td><td>'+esc(r.termin||'—')+'</td><td>'+dniBadge(r.dni)+'</td></tr>';}).join('');
  w.appendChild(t); return w;
}
window.addEventListener('hashchange', route);
load();
</script>
