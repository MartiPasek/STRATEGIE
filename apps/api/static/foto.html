<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Fotky pro výrobu</title>
<style>
  :root{ --bg:#0b1220; --panel:#111c30; --bord:#22314c; --blue:#4f8ef7; --mut:#8aa0c6;
         --green:#39c07a; --red:#f2635a; --amber:#e6b800; --txt:#e8eefc; }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);font:15px/1.45 -apple-system,Segoe UI,Roboto,sans-serif;padding-bottom:40px}
  .top{position:sticky;top:0;background:#0d1830;border-bottom:1px solid var(--bord);padding:12px 14px;z-index:5}
  .top h1{margin:0;font-size:17px}
  .top .sub{color:var(--mut);font-size:12px;margin-top:2px}
  .wrap{padding:12px 12px 0}
  label{display:block;font-size:12px;color:var(--mut);margin:8px 0 3px}
  input,select,button{font:inherit}
  input[type=text],select{width:100%;padding:10px;border:1px solid var(--bord);background:#0d1828;color:var(--txt);border-radius:9px}
  .row{display:flex;gap:8px}
  .row>*{flex:1}
  .btn{padding:10px 14px;border:1px solid var(--blue);background:var(--blue);color:#04122b;border-radius:9px;font-weight:700;cursor:pointer}
  .btn.ghost{background:transparent;color:var(--blue)}
  .grp{margin:16px 4px 6px;font-size:12px;font-weight:700;letter-spacing:.5px;color:#7c8cdb;text-transform:uppercase}
  .zab{border:1px solid var(--bord);background:var(--panel);border-radius:12px;padding:10px;margin:8px 0}
  .zab .h{display:flex;align-items:center;gap:8px}
  .zab .nm{font-weight:600;flex:1}
  .zab .np{color:var(--mut);font-size:12px;margin-top:2px}
  .pov{font-size:10px;color:var(--amber);border:1px solid var(--amber);border-radius:6px;padding:1px 5px}
  .cam{white-space:nowrap;padding:8px 12px;border:1px solid var(--blue);background:#0d1f3d;color:var(--blue);border-radius:9px;font-weight:700}
  .thumbs{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
  .th{position:relative;width:88px}
  .th img{width:88px;height:88px;object-fit:cover;border-radius:8px;border:1px solid var(--bord);display:block}
  .th .badge{position:absolute;left:3px;top:3px;font-size:10px;font-weight:700;padding:1px 5px;border-radius:6px;background:#000a}
  .th .del{position:absolute;right:3px;top:3px;background:#000a;color:#fff;border:none;border-radius:6px;width:20px;height:20px;cursor:pointer}
  .ok{color:var(--green)} .bad{color:var(--red)} .wait{color:var(--mut)}
  .msg{margin:10px 4px;color:var(--mut);font-size:13px}
  .toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#0d1f3d;border:1px solid var(--blue);
         color:var(--txt);padding:10px 16px;border-radius:10px;max-width:90%;display:none;z-index:20}
  .cov{display:flex;gap:6px;align-items:center;margin:4px 4px 0;font-size:12px;color:var(--mut)}
  .bar{flex:1;height:8px;background:#0d1828;border:1px solid var(--bord);border-radius:6px;overflow:hidden}
  .bar>i{display:block;height:100%;background:var(--green)}
</style>
</head>
<body>
<div class="top">
  <h1>📷 Fotky pro výrobu <span style="font-size:11px;color:var(--mut)">— test</span></h1>
  <div class="sub" id="who">Testovací focení k zakázce · offline kontrola rozmazanosti</div>
</div>

<div class="wrap">
  <div class="row">
    <div style="flex:1.3">
      <label>Zakázka (číslo)</label>
      <input type="text" id="zak" placeholder="např. 2500123" autocomplete="off">
    </div>
    <div>
      <label>Šablona</label>
      <select id="sab"></select>
    </div>
  </div>
  <div style="margin-top:10px" class="row">
    <button class="btn" id="load">Načíst záběry</button>
    <button class="btn ghost" id="evalall" style="flex:.9">⚖︎ Vyhodnotit vše</button>
    <button class="btn ghost" id="refresh" style="flex:.4">↻</button>
  </div>

  <div class="cov" id="covrow" style="display:none">
    <span id="covtxt"></span><div class="bar"><i id="covbar" style="width:0%"></i></div>
  </div>

  <div id="list"><div class="msg">Zadej číslo zakázky a dej „Načíst záběry".</div></div>
</div>

<div class="toast" id="toast"></div>

<script>
var API="/api/v1/erp/app/foto";
function j(m,u,b){ return fetch(u,{method:m,credentials:"include",cache:"no-store",
  headers:b?{"Content-Type":"application/json"}:{},body:b?JSON.stringify(b):undefined})
  .then(function(r){return r.json().catch(function(){return{ok:false,error:"bad json ("+r.status+")"};});}); }
function toast(t,ms){ var e=document.getElementById("toast"); e.textContent=t; e.style.display="block";
  clearTimeout(window._tt); window._tt=setTimeout(function(){e.style.display="none";}, ms||2600); }
function esc(s){ return (s==null?"":String(s)).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];}); }

var SAB=[], ZAB=[], SADA=[], CURKOD="", CURPT="zakazka";

// ── Offline Laplacian variance (rozmazanost) ────────────────────────────────
function blurScore(file){ return new Promise(function(res){
  var img=new Image(); img.onload=function(){
    var W=Math.min(360,img.width), H=Math.round(img.height*(W/img.width));
    var c=document.createElement("canvas"); c.width=W; c.height=H;
    var x=c.getContext("2d"); x.drawImage(img,0,0,W,H);
    var d=x.getImageData(0,0,W,H).data, g=new Float64Array(W*H);
    for(var i=0,p=0;i<d.length;i+=4,p++){ g[p]=0.299*d[i]+0.587*d[i+1]+0.114*d[i+2]; }
    var sum=0,sum2=0,n=0;
    for(var y=1;y<H-1;y++)for(var xx=1;xx<W-1;xx++){
      var o=y*W+xx, lap=-4*g[o]+g[o-1]+g[o+1]+g[o-W]+g[o+W];
      sum+=lap; sum2+=lap*lap; n++;
    }
    var mean=sum/n, varr=sum2/n-mean*mean;
    URL.revokeObjectURL(img.src); res(varr);
  }; img.onerror=function(){ res(999); }; img.src=URL.createObjectURL(file);
});}

function loadSablony(){ return j("GET",API+"/sablony").then(function(r){
  var sel=document.getElementById("sab"); sel.innerHTML="";
  SAB=(r&&r.sablony)||[];
  SAB.forEach(function(s){ var o=document.createElement("option"); o.value=s.kod; o.textContent=s.nazev; sel.appendChild(o); });
  if(!SAB.length){ sel.innerHTML='<option>—</option>'; }
});}

function loadZabery(){
  var kod=document.getElementById("sab").value; CURKOD=kod;
  var zak=document.getElementById("zak").value.trim();
  if(!zak){ toast("Zadej číslo zakázky."); return; }
  var sd=SAB.filter(function(s){return s.kod===kod;})[0]; CURPT=(sd&&sd.predmet_typ)||"zakazka";
  document.getElementById("list").innerHTML='<div class="msg">Načítám…</div>';
  Promise.all([
    j("GET",API+"/sablona/"+encodeURIComponent(kod)),
    j("GET",API+"/sada?predmet_typ="+encodeURIComponent(CURPT)+"&predmet_ref="+encodeURIComponent(zak))
  ]).then(function(a){
    ZAB=(a[0]&&a[0].zabery)||[]; SADA=(a[1]&&a[1].fotky)||[];
    render();
  });
}

function fotkyZaZaber(zid){ return SADA.filter(function(f){return f.zaber_id===zid;}); }

function render(){
  var L=document.getElementById("list"); L.innerHTML="";
  if(!ZAB.length){ L.innerHTML='<div class="msg">Šablona nemá záběry.</div>'; return; }
  // coverage
  var pov=ZAB.filter(function(z){return z.povinny;});
  var hotovo=pov.filter(function(z){return fotkyZaZaber(z.id).length>0;}).length;
  var covrow=document.getElementById("covrow"); covrow.style.display="flex";
  document.getElementById("covtxt").textContent="Povinné: "+hotovo+"/"+pov.length;
  document.getElementById("covbar").style.width=(pov.length?Math.round(100*hotovo/pov.length):0)+"%";

  var lastGrp=null;
  ZAB.forEach(function(z){
    if(z.skupina!==lastGrp){ lastGrp=z.skupina;
      var g=document.createElement("div"); g.className="grp"; g.textContent=z.skupina||"Ostatní"; L.appendChild(g); }
    var box=document.createElement("div"); box.className="zab";
    var head=document.createElement("div"); head.className="h";
    head.innerHTML='<div style="flex:1"><div class="nm">'+esc(z.nazev)+(z.povinny?' <span class="pov">povinné</span>':'')+'</div>'
                 + (z.napoveda?'<div class="np">'+esc(z.napoveda)+'</div>':'')+'</div>';
    var cam=document.createElement("label"); cam.className="cam"; cam.textContent="📷 Vyfotit";
    var inp=document.createElement("input"); inp.type="file"; inp.accept="image/*"; inp.capture="environment"; inp.style.display="none";
    inp.addEventListener("change",function(){ if(inp.files&&inp.files[0]) takePhoto(z, inp.files[0]); inp.value=""; });
    cam.appendChild(inp); head.appendChild(cam); box.appendChild(head);

    var th=document.createElement("div"); th.className="thumbs";
    fotkyZaZaber(z.id).forEach(function(f){ th.appendChild(thumb(f)); });
    box.appendChild(th); L.appendChild(box);
  });
}

function thumb(f){
  var d=document.createElement("div"); d.className="th";
  var im=document.createElement("img"); im.src="/api/v1/media/"+f.media_id+"/preview"; im.loading="lazy";
  d.appendChild(im);
  var b=document.createElement("div"); b.className="badge";
  if(f.verdikt==="prefotit"){ b.className+=" bad"; b.textContent="⚠ přefotit"; }
  else if(f.znamka){ b.className+=" ok"; b.textContent=(f.hodnoceni!=null?f.hodnoceni.toFixed(1):"")+" "+f.znamka; }
  else { b.className+=" wait"; b.textContent="…"; }
  d.appendChild(b);
  var del=document.createElement("button"); del.className="del"; del.textContent="×";
  del.onclick=function(){ if(confirm("Smazat fotku?")) j("POST",API+"/smazat",{foto_id:f.id}).then(loadZabery); };
  d.appendChild(del);
  return d;
}

function takePhoto(z, file){
  blurScore(file).then(function(bs){
    var go=true;
    if(bs<80){ go=confirm("Fotka vypadá rozmazaně (ostrost "+Math.round(bs)+"). Nahrát i tak?"); }
    if(!go) return;
    toast("Nahrávám…", 8000);
    var fd=new FormData(); fd.append("file", file); fd.append("source","vyroba_foto");
    fetch("/api/v1/media/upload",{method:"POST",credentials:"include",body:fd})
      .then(function(r){return r.json();})
      .then(function(m){
        if(!m||!m.id){ toast("Upload selhal: "+((m&&m.detail)||"?")); return; }
        var zak=document.getElementById("zak").value.trim();
        return j("POST",API+"/attach",{predmet_typ:CURPT,predmet_ref:zak,sablona_kod:CURKOD,
                 zaber_id:z.id, media_id:m.id, jmeno_souboru:(file.name||""), ucel:z.skupina, ucel_detail:z.nazev})
          .then(function(a){
            if(!a||!a.ok){ toast("Attach chyba: "+((a&&a.error)||"?")); return; }
            toast("Uloženo, hodnotím…", 12000);
            return j("POST",API+"/vyhodnotit",{foto_id:a.foto_id}).then(function(v){
              if(v&&v.ok){ toast(v.verdikt==="prefotit" ? "⚠ Přefotit: "+((v.poznamka||"nízká kvalita").split("|")[0]) : ("✓ "+v.znamka+" "+(v.celkem!=null?v.celkem.toFixed(1):""))); }
              else { toast("Uloženo. Hodnocení selhalo: "+((v&&v.error)||"?")); }
              loadZabery();
            });
          });
      }).catch(function(e){ toast("Chyba: "+e); });
  });
}

function evalAll(){
  var todo=SADA.filter(function(f){ return !f.znamka && f.verdikt!=="prefotit"; });
  if(!todo.length){ toast("Není co vyhodnotit."); return; }
  var i=0;
  function next(){
    if(i>=todo.length){ toast("Hotovo — vyhodnoceno "+todo.length); loadZabery(); return; }
    var f=todo[i++]; toast("Hodnotím "+i+"/"+todo.length+"…", 15000);
    j("POST",API+"/vyhodnotit",{foto_id:f.id}).then(next).catch(next);
  }
  next();
}

document.getElementById("load").onclick=loadZabery;
document.getElementById("refresh").onclick=loadZabery;
document.getElementById("evalall").onclick=evalAll;
loadSablony();
</script>
</body>
</html>
