<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>🧑‍💼 HR modul</title>
<style>
  :root{
    --green:#7cb342;      /* Pinya akcentní zelená */
    --green-d:#5f9331;
    --ink:#33404d;        /* tmavý text */
    --title:#2b3a4a;
    --muted:#8a94a3;      /* popisky */
    --line:#e7eaef;
    --bg:#f4f5f7;
    --card:#ffffff;
    --ic-bg:#f0f4ec;      /* světle zelené pozadí ikon */
  }
  *{box-sizing:border-box}
  body{margin:0;font:14px/1.55 -apple-system,Segoe UI,Roboto,system-ui,sans-serif;color:var(--ink);background:var(--bg)}
  /* Horní nav — světlá se zeleným akcentem (Pinya) */
  .topbar{background:#fff;border-bottom:1px solid var(--line);box-shadow:0 1px 2px rgba(20,30,50,.04)}
  .topbar .inner{max-width:1180px;margin:0 auto;padding:11px 18px;display:flex;align-items:center;gap:12px}
  .brand{display:flex;align-items:center;gap:9px;font-weight:800;font-size:16px;color:var(--title)}
  .brand .dot{width:26px;height:26px;border-radius:8px;background:var(--green);display:inline-flex;align-items:center;justify-content:center;font-size:15px}
  .brand .sub{font-weight:500;font-size:12px;color:var(--muted);margin-left:2px}
  .topbar .spacer{margin-left:auto}
  .pill{font-size:12px;color:var(--green-d);background:var(--ic-bg);border:1px solid #e0ead4;border-radius:20px;padding:4px 12px;font-weight:700}
  .wrap{max-width:1180px;margin:18px auto;padding:0 18px}

  /* KPI badges — jemné stat karty */
  .badges{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-bottom:18px}
  .badge{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:2px}
  .badge .n{font-size:28px;font-weight:800;color:var(--title);line-height:1}
  .badge .l{font-size:12px;color:var(--muted)}
  .badge .bar{height:3px;border-radius:3px;background:var(--green);width:34px;margin-top:8px;opacity:.85}

  /* Obsahová karta s dlaždicemi (styl „Profil pracovníka") */
  .panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px 22px;margin-bottom:18px}
  .panel .phd{display:flex;align-items:center;gap:9px;font-size:16px;font-weight:800;color:var(--title);margin:2px 0 18px}
  .panel .phd .pi{width:26px;height:26px;border-radius:50%;background:var(--ic-bg);color:var(--green-d);display:inline-flex;align-items:center;justify-content:center;font-size:14px}
  .panel .phd .cnt{font-size:13px;color:var(--muted);font-weight:600;margin-left:2px}
  .panel .phd .jhint{font-size:11px;color:#aab2bd;font-weight:500;margin-left:auto}
  .jrow{display:flex;gap:12px;align-items:center;padding:10px 12px;border-top:1px solid #f2f4f6;border-radius:9px;margin:2px 0}
  .jrow:first-child{border-top:0}
  .jic{flex:0 0 36px;height:36px;border-radius:9px;background:var(--ic-bg);display:flex;align-items:center;justify-content:center;font-size:18px}
  .jbd{flex:1;min-width:0}
  .jnm{font-weight:700;color:var(--title);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .jsub{font-size:12.5px;color:var(--muted);margin-top:1px}
  .jbadge{font-size:10.5px;font-weight:800;letter-spacing:.3px;padding:1px 8px;border-radius:20px;background:#eef1f4;color:#66707d}
  .j-major{background:linear-gradient(180deg,#fff7e0,#fffdf6);border:1px solid #f0d98a;padding:12px}
  .j-major .jic{background:#fbe6a0}
  .j-major .jnm{font-size:15px}
  .j-major .jbadge{background:#e0a400;color:#fff}
  .j-minor{background:#f7fafd;border:1px solid #e4ecf5;padding:11px 12px}
  .j-minor .jic{background:#e9f1fb}
  .j-minor .jbadge{background:#dbe7ff;color:#3a5a9c}
  .mrow{display:flex;gap:12px;align-items:center;padding:10px 4px;border-top:1px solid #f2f4f6}
  .mrow:first-child{border-top:0}
  .mrow .mic{flex:0 0 34px;height:34px;border-radius:9px;background:var(--ic-bg);display:flex;align-items:center;justify-content:center;font-size:17px}
  .mrow .mnm{font-weight:700;color:var(--title)}
  .mrow .mdv{font-size:12.5px;color:var(--muted)}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:6px 26px}
  .tile{display:flex;gap:13px;padding:14px 10px;border-radius:10px;align-items:flex-start;transition:background .12s}
  .tile .ico{flex:0 0 40px;height:40px;border-radius:10px;background:var(--ic-bg);display:flex;align-items:center;justify-content:center;font-size:19px;color:var(--green-d)}
  .tile .bd{flex:1;min-width:0}
  .tile .tt{font-weight:700;color:var(--title);font-size:14.5px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .tile .dd{font-size:12.5px;color:var(--muted);margin-top:2px}
  .tile.click{cursor:pointer}
  .tile.click:hover{background:#fafcf7}
  .tag{display:inline-block;border-radius:20px;padding:1px 9px;font-size:10.5px;font-weight:700;letter-spacing:.2px}
  .tag.soon{background:#f1f3f5;color:#9aa4b1}
  .tag.live{background:var(--ic-bg);color:var(--green-d)}

  /* Aktuality */
  .feed .phd{margin-bottom:10px}
  .feed .row{display:flex;gap:11px;padding:10px 6px;border-top:1px solid #f2f4f6;font-size:13.5px;align-items:center}
  .feed .row:first-of-type{border-top:0}
  .feed .row .ic{flex:0 0 30px;height:30px;border-radius:8px;background:var(--ic-bg);display:flex;align-items:center;justify-content:center;font-size:15px}
  .empty{padding:22px;color:var(--muted);text-align:center;font-style:italic}
  .badge.click{cursor:pointer}
  /* Modal Mimo kancelář */
  .modal{display:none;position:fixed;inset:0;background:rgba(20,30,50,.45);z-index:50;align-items:flex-start;justify-content:center;padding:56px 16px}
  .modal.on{display:flex}
  .modal-card{background:#fff;border-radius:14px;max-width:520px;width:100%;box-shadow:0 20px 60px rgba(20,30,50,.25);overflow:hidden;max-height:80vh;display:flex;flex-direction:column}
  .modal-hd{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid var(--line);font-weight:800;color:var(--title)}
  .modal-hd .x{cursor:pointer;color:var(--muted);font-weight:400;font-size:18px;line-height:1}
  #modalBody{overflow:auto}
  .mrow{display:flex;gap:12px;align-items:center;padding:11px 18px;border-top:1px solid #f2f4f6}
  .mrow:first-child{border-top:0}
  .mrow .mic{flex:0 0 34px;height:34px;border-radius:9px;background:var(--ic-bg);display:flex;align-items:center;justify-content:center;font-size:17px}
  .mrow .mnm{font-weight:700;color:var(--title)}
  .mrow .mdv{font-size:12.5px;color:var(--muted)}
  @media(max-width:640px){.wrap{padding:0 12px}.panel{padding:16px}}
</style>
</head>
<body>
<div class="topbar">
  <div class="inner">
    <div class="brand"><span class="dot">🧑‍💼</span> HR modul <span class="sub">· personalistika</span></div>
    <span class="spacer"></span>
    <span class="pill" id="pill">přehled z jednoho místa</span>
  </div>
</div>

<div class="wrap">
  <div class="badges" id="badges"><div class="empty">Načítám…</div></div>

  <div class="panel">
    <div class="phd"><span class="pi">🏖️</span> Mimo kancelář dnes <span class="cnt" id="mimoCnt"></span></div>
    <div id="mimoList"><div class="empty">Načítám…</div></div>
  </div>

  <div class="panel">
    <div class="phd"><span class="pi">🎂</span> Narozeniny a výročí <span class="cnt" id="jubCnt"></span><span class="jhint">nejbližších 30 dní</span></div>
    <div id="jubList"><div class="empty">Načítám…</div></div>
  </div>

  <div class="panel">
    <div class="phd"><span class="pi">▦</span> Personalistika — přehled</div>
    <div class="grid" id="grid"></div>
  </div>

  <div class="panel feed">
    <div class="phd"><span class="pi">📣</span> Aktuality</div>
    <div id="akt"><div class="empty">Načítám…</div></div>
  </div>
</div>

<div id="modal" class="modal" onclick="if(event.target===this)closeMimo()">
  <div class="modal-card">
    <div class="modal-hd"><span id="modalTitle">🏖️ Mimo kancelář dnes</span><span class="x" onclick="closeMimo()">✕</span></div>
    <div id="modalBody"><div class="empty">Načítám…</div></div>
  </div>
</div>

<script>
const API="/api/v1/erp";
function esc(s){return (s==null?'':String(s)).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));}
async function j(u){const r=await fetch(u,{credentials:'same-origin'});return r.json();}

// Dlaždice HR modulu (kroky dle plánu; live = má už data, soon = připravujeme)
const TILES=[
  {ic:"🏖️",t:"Mimo kancelář",d:"Kdo dnes není ve firmě (absence + home office).",st:"live",act:"mimo"},
  {ic:"🎂",t:"Narozeniny a výročí",d:"Blížící se narozeniny a výročí nástupu.",st:"live",go:null},
  {ic:"🆕",t:"Noví + budoucí nástupy",d:"Kdo nastoupil za poslední rok a kdo teprve nastoupí.",st:"live",go:null},
  {ic:"🧲",t:"Výběrová řízení",d:"Běžící nábor, editace, publikace (Teamio).",st:"live",go:"/recruit"},
  {ic:"👥",t:"Zaměstnanci",d:"Přehled lidí → karta 360°.",st:"soon",go:null},
  {ic:"🔔",t:"Notifikace",d:"Konce smluv, prohlídky, propadající školení.",st:"soon",go:null},
  {ic:"✅",t:"Úkoly",d:"HR úkoly z jednoho místa.",st:"soon",go:null},
  {ic:"🗓️",t:"Kalendář",d:"Události + import z Outlooku (na konec).",st:"soon",go:null},
];
function renderTiles(){
  const g=document.getElementById('grid'); g.innerHTML='';
  for(const x of TILES){
    const el=document.createElement('div'); el.className='tile'+((x.go||x.act)?' click':'');
    const tag=(x.st==='live')?'<span class="tag live">funkční</span>':'<span class="tag soon">připravujeme</span>';
    el.innerHTML='<div class="ico">'+x.ic+'</div><div class="bd">'+
      '<div class="tt">'+esc(x.t)+' '+tag+'</div>'+
      '<div class="dd">'+esc(x.d)+'</div></div>';
    if(x.go){el.onclick=()=>{location.href=x.go;};}
    else if(x.act==='mimo'){el.onclick=openMimo;}
    g.appendChild(el);
  }
}
async function load(){
  renderTiles();
  loadMimoPanel();
  loadJubilea();
  const d=await j(API+"/app/hr/dashboard");
  const bEl=document.getElementById('badges'), aEl=document.getElementById('akt');
  if(!d.ok){
    bEl.innerHTML='<div class="empty">Nemáš oprávnění nebo chyba: '+esc(d.error||'')+'</div>';
    aEl.innerHTML=''; return;
  }
  const b=d.badges||{};
  bEl.innerHTML=
    badge(b.mimo,"Mimo kancelář dnes","mimo")+
    badge(b.naroz,"Narozeniny / výročí (7 dní)")+
    badge(b.novi,"Noví (do roka)")+
    badge(b.vyberka,"Běžící výběrová řízení");
  const akt=d.aktuality||[];
  if(!akt.length){aEl.innerHTML='<div class="empty">Žádné aktuality.</div>';return;}
  aEl.innerHTML=akt.map(a=>'<div class="row"><span class="ic">'+esc(a.ikona||'•')+'</span><span>'+esc(a.text)+'</span></div>').join('');
}
function badge(n,l,act){return '<div class="badge'+(act?' click':'')+'"'+(act?' onclick="openMimo()"':'')+'><div class="n">'+(n==null?'0':n)+'</div><div class="l">'+esc(l)+'</div><div class="bar"></div></div>';}

function mimoRows(lide){
  return lide.map(p=>'<div class="mrow"><span class="mic">'+esc(p.ikona||'•')+'</span><div><div class="mnm">'+esc(p.jmeno)+'</div><div class="mdv">'+esc(p.duvod)+'</div></div></div>').join('');
}
async function loadMimoPanel(){
  const list=document.getElementById('mimoList'), cnt=document.getElementById('mimoCnt');
  if(!list)return;
  const d=await j(API+"/app/hr/mimo");
  if(!d.ok){list.innerHTML='<div class="empty">Nemáš oprávnění nebo chyba: '+esc(d.error||'')+'</div>';return;}
  if(cnt)cnt.textContent='('+(d.pocet||0)+')';
  if(!d.lide||!d.lide.length){list.innerHTML='<div class="empty">Dnes jsou všichni v kanceláři. 🎉</div>';return;}
  list.innerHTML=mimoRows(d.lide);
}
function jubRow(jx){
  let badge='';
  if(jx.tier&&jx.tier!=='normal'){const bt=jx.kind==='vyroci'?(jx.roky+' LET'):(jx.roky+'. NAR.');badge='<span class="jbadge">'+esc(bt)+'</span>';}
  const za=jx.za_dni===0?'dnes':(jx.za_dni===1?'zítra':('za '+jx.za_dni+' dní'));
  return '<div class="jrow j-'+esc(jx.tier||'normal')+'"><span class="jic">'+esc(jx.ikona||'•')+'</span><div class="jbd"><div class="jnm">'+esc(jx.jmeno)+badge+'</div><div class="jsub">'+esc(jx.popis)+' · '+esc(jx.datum_cz)+' · '+za+'</div></div></div>';
}
async function loadJubilea(){
  const list=document.getElementById('jubList'), cnt=document.getElementById('jubCnt');
  if(!list)return;
  const d=await j(API+"/app/hr/jubilea?days=30");
  if(!d.ok){list.innerHTML='<div class="empty">Nemáš oprávnění nebo chyba: '+esc(d.error||'')+'</div>';return;}
  if(cnt)cnt.textContent='('+(d.pocet||0)+')';
  if(!d.jubilea||!d.jubilea.length){list.innerHTML='<div class="empty">V nejbližších 30 dnech žádná jubilea. 🎈</div>';return;}
  list.innerHTML=d.jubilea.map(jubRow).join('');
}
async function openMimo(){
  const m=document.getElementById('modal'); m.classList.add('on');
  const body=document.getElementById('modalBody'); body.innerHTML='<div class="empty">Načítám…</div>';
  const d=await j(API+"/app/hr/mimo");
  if(!d.ok){body.innerHTML='<div class="empty">Chyba: '+esc(d.error||'')+'</div>';return;}
  document.getElementById('modalTitle').textContent='🏖️ Mimo kancelář dnes ('+(d.pocet||0)+')';
  if(!d.lide||!d.lide.length){body.innerHTML='<div class="empty">Dnes jsou všichni v kanceláři. 🎉</div>';return;}
  body.innerHTML=d.lide.map(p=>'<div class="mrow"><span class="mic">'+esc(p.ikona||'•')+'</span><div><div class="mnm">'+esc(p.jmeno)+'</div><div class="mdv">'+esc(p.duvod)+'</div></div></div>').join('');
}
function closeMimo(){document.getElementById('modal').classList.remove('on');}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeMimo();});
load();
</script>
</body>
</html>
