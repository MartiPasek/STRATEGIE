<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>🧑‍💼 HR modul</title>
<style>
  :root{--navy:#1f3864;--line:#e2e6ef;--muted:#667;--accent:#3a5a9c;}
  *{box-sizing:border-box}
  body{margin:0;font:14px/1.5 -apple-system,Segoe UI,Roboto,system-ui;color:#111;background:#f6f7fb}
  header{background:var(--navy);color:#fff;padding:12px 18px;display:flex;align-items:center;gap:10px}
  header h1{font-size:17px;margin:0;font-weight:700}
  header .sub{opacity:.8;font-size:12px;margin-left:auto}
  .wrap{max-width:1120px;margin:16px auto;padding:0 14px}
  /* KPI badges */
  .badges{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}
  .badge{flex:1;min-width:150px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 14px}
  .badge .n{font-size:26px;font-weight:800;color:var(--navy);line-height:1}
  .badge .l{font-size:12px;color:var(--muted);margin-top:4px}
  /* dlaždice grid */
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
  .tile{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px 16px;min-height:120px;display:flex;flex-direction:column}
  .tile h3{margin:0 0 6px;font-size:15px;color:var(--navy);display:flex;align-items:center;gap:8px}
  .tile .desc{font-size:12.5px;color:var(--muted);flex:1}
  .tile .foot{margin-top:8px;font-size:12px}
  .tag{display:inline-block;border-radius:20px;padding:1px 9px;font-size:11px;font-weight:700}
  .tag.soon{background:#f3f4f6;color:#8894a8}
  .tag.live{background:#e6f6ec;color:#1a7a3d}
  .feed{background:#fff;border:1px solid var(--line);border-radius:12px;padding:6px 4px;margin-top:16px}
  .feed .hd{padding:8px 14px;font-weight:700;color:var(--navy)}
  .feed .row{display:flex;gap:10px;padding:8px 14px;border-top:1px solid #f0f2f7;font-size:13.5px;align-items:center}
  .feed .row .ic{font-size:17px}
  .empty{padding:22px;color:var(--muted);text-align:center}
</style>
</head>
<body>
<header>
  <h1>🧑‍💼 HR modul</h1>
  <span class="sub">personalistika · přehled z jednoho místa</span>
</header>
<div class="wrap">
  <div class="badges" id="badges"><div class="empty">Načítám…</div></div>

  <div class="grid" id="grid"></div>

  <div class="feed">
    <div class="hd">📣 Aktuality</div>
    <div id="akt"><div class="empty">Načítám…</div></div>
  </div>
</div>
<script>
const API="/api/v1/erp";
function esc(s){return (s==null?'':String(s)).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));}
async function j(u){const r=await fetch(u,{credentials:'same-origin'});return r.json();}

// Dlaždice HR modulu (kroky dle plánu; live = má už data, soon = připravujeme)
const TILES=[
  {ic:"🏖️",t:"Mimo kancelář",d:"Kdo dnes není ve firmě (absence + home office).",st:"live",go:null},
  {ic:"🎂",t:"Narozeniny a výročí",d:"Blížící se narozeniny a výročí nástupu.",st:"live",go:null},
  {ic:"🆕",t:"Noví + budoucí nástupy",d:"Kdo nastoupil za poslední rok a kdo teprve nastoupí.",st:"live",go:null},
  {ic:"🧲",t:"Výběrová řízení",d:"Běžící nábor, editace, publikace (Teamio).",st:"live",go:"/recruit"},
  {ic:"👥",t:"Zaměstnanci",d:"Přehled lidí → karta 360°.",st:"soon",go:null},
  {ic:"🔔",t:"Notifikace",d:"Konce smluv, prohlídky, propadající školení.",st:"soon",go:null},
  {ic:"✅",t:"Úkoly",d:"HR úkoly z jednoho místa.",st:"soon",go:null},
  {ic:"🗓️",t:"Kalendář",d:"Události + import z Outlooku (na konec).",st:"soon",go:null},
];
function renderTiles(){
  const g=document.getElementById('grid'); g.innerHTML='';
  for(const x of TILES){
    const el=document.createElement('div'); el.className='tile';
    el.innerHTML='<h3>'+x.ic+' '+esc(x.t)+'</h3><div class="desc">'+esc(x.d)+'</div>'+
      '<div class="foot">'+(x.st==='live'?'<span class="tag live">funkční</span>':'<span class="tag soon">připravujeme</span>')+'</div>';
    if(x.go){el.style.cursor='pointer';el.onclick=()=>{location.href=x.go;};}
    g.appendChild(el);
  }
}
async function load(){
  renderTiles();
  const d=await j(API+"/app/hr/dashboard");
  const bEl=document.getElementById('badges'), aEl=document.getElementById('akt');
  if(!d.ok){
    bEl.innerHTML='<div class="empty">Nemáš oprávnění nebo chyba: '+esc(d.error||'')+'</div>';
    aEl.innerHTML=''; return;
  }
  const b=d.badges||{};
  bEl.innerHTML=
    badge(b.mimo,"Mimo kancelář dnes")+
    badge(b.naroz,"Narozeniny / výročí (7 dní)")+
    badge(b.novi,"Noví (do roka)")+
    badge(b.vyberka,"Běžící výběrová řízení");
  const akt=d.aktuality||[];
  if(!akt.length){aEl.innerHTML='<div class="empty">Žádné aktuality.</div>';return;}
  aEl.innerHTML=akt.map(a=>'<div class="row"><span class="ic">'+esc(a.ikona||'•')+'</span><span>'+esc(a.text)+'</span></div>').join('');
}
function badge(n,l){return '<div class="badge"><div class="n">'+(n==null?'0':n)+'</div><div class="l">'+esc(l)+'</div></div>';}
load();
</script>
</body>
</html>
