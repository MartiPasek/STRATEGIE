<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Doklady — hromady</title>
<style>
  :root{color-scheme:light dark}
  body{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;margin:0;padding:14px;background:#0f1420;color:#e8edf6}
  h1{font-size:19px;margin:0 0 2px}
  .sub{color:#9fb0c8;font-size:12px;margin-bottom:14px}
  .piles{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-bottom:16px}
  .pile{background:#19202e;border:1px solid #26303f;border-radius:13px;padding:15px;cursor:pointer;transition:border-color .15s}
  .pile:hover{border-color:#2563eb}
  .pile.on{border-color:#2563eb;background:#1b2740}
  .pile .ic{font-size:26px}
  .pile .nm{font-size:14px;font-weight:600;margin:6px 0 2px}
  .pile .ks{font-size:22px;font-weight:700}
  .pile .ob{font-size:12px;color:#8fa3bd}
  table{width:100%;border-collapse:collapse;font-size:12.5px}
  th,td{text-align:left;padding:6px 8px;border-bottom:1px solid #232c3b}
  th{color:#8fa3bd;font-weight:600;font-size:11.5px}
  td.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
  .muted{color:#8295ad}
  .cis{font-family:ui-monospace,Menlo,monospace}
  .badge{font-size:11px;padding:1px 7px;border-radius:9px;background:#16243a;color:#7fb0ff}
  .badge.out{background:#3a2414;color:#f0b674}
  #msg{color:#9fb0c8;font-size:13px;margin-top:10px}
  .fbtn{background:#27313f;color:#cdd9ea;border:0;border-radius:16px;padding:7px 14px;font-size:13px;cursor:pointer;margin-right:6px}
  .fbtn.on{background:#2563eb;color:#fff}
</style>
</head>
<body>
<h1>📂 Doklady — hromady</h1>
<div class="sub">Nejdřív si haldu roztřiď na hromady. Klikni na hromadu → rozsype se ti jen ta jedna.</div>
<div style="margin-bottom:14px">
  <span class="muted" style="font-size:12px;margin-right:6px">Účtuji firmu:</span>
  <button class="fbtn" id="f_EC" onclick="setFirma('EC')">🏢 EUROSOFT-Control (EC)</button>
  <button class="fbtn on" id="f_ES" onclick="setFirma('ES')">🏢 EUROSOFT-System (ES)</button>
</div>
<div style="margin-bottom:12px"><button class="fbtn" style="background:#1a3320;color:#8fe0a0" onclick="syncES()">🔄 Dotáhnout doklady z Heliosu (1:1)</button> <span id="syncmsg" class="muted" style="font-size:12px"></span></div>
<div class="piles" id="piles"></div>
<div id="msg">Načítám hromady…</div>
<div id="listwrap" style="display:none"><h2 id="listh" style="font-size:15px"></h2><div id="grid"></div></div>

<script src="/static/ag_license.js"></script>
<script src="/static/aggrid_lite.js"></script>
<script>
const API='';
function dCmp(a,b){function p(s){if(!s)return 0;const x=(''+s).split('.');return x.length===3?(x[2]+x[1].padStart(2,'0')+x[0].padStart(2,'0'))*1:0;}return p(a)-p(b);}
const COLDAT=(h)=>({headerName:h||'Datum',field:'datum',maxWidth:130,comparator:dCmp});
let CUR='';
let FIRMA='ES';
function setFirma(f){FIRMA=f;document.getElementById('f_EC').classList.toggle('on',f==='EC');document.getElementById('f_ES').classList.toggle('on',f==='ES');document.getElementById('listwrap').style.display='none';CUR='';loadPiles();}
async function syncES(){
  const m=document.getElementById('syncmsg');m.textContent='Tahám z Heliosu… 🔄';
  const P=(u)=>fetch(API+'/api/v1/erp/app/uctovani/'+u,{method:'POST',credentials:'include'}).then(x=>x.json());
  const fmt=(x)=>x&&x.ok?(x.zapsano+(x.se_skenem!=null?('/'+x.se_skenem+' sken'):'')):('err '+((x&&x.error)||''));
  if(FIRMA==='EC'){
    const rp=await P('sync-ec-pf');const rv=await P('sync-ec-fv');const ro=await P('sync-ec-vo');const rpo=await P('sync-ec-po');
    m.textContent='✓ EC: PF '+fmt(rp)+' · FV '+fmt(rv)+' · VO '+fmt(ro)+' · PO '+fmt(rpo)+' · kalkulace…';
    const rpp=await P('sync-ec-pp');const rk=await P('sync-ec-kalkulace');const rkp=await P('sync-ec-kalk-pol');const rko=await P('sync-ec-kontace');
    m.textContent='✓ EC: PF '+fmt(rp)+' · FV '+fmt(rv)+' · VO '+fmt(ro)+' · PO '+fmt(rpo)+' · PP '+fmt(rpp)+' · Kalk '+fmt(rk)+' ('+fmt(rkp)+' pol.) · Předkontace '+(rko&&rko.ok?(rko.kontace+'/'+rko.radky+' MD-DAL'):'err');
  }else{
    const rv=await P('sync-es-vf');const rp=await P('sync-es-pf');const ro=await P('sync-es-vo');
    m.textContent='✓ ES: VF '+fmt(rv)+' · PF '+fmt(rp)+' · VO '+fmt(ro)+' · předkontace…';
    const rk=await P('sync-es-kontace');
    m.textContent='✓ ES: VF '+fmt(rv)+' · PF '+fmt(rp)+' · VO '+fmt(ro)+' · Předkontace '+(rk&&rk.ok?(rk.kontace+' kontací/'+rk.radky+' řádků'):'err');
  }
  document.getElementById('listwrap').style.display='none';loadPiles();
}
function czk(n){return (n==null?0:n).toLocaleString('cs-CZ',{maximumFractionDigits:0})+' Kč';}
async function loadPiles(){
  const r=await fetch(API+'/api/v1/erp/app/uctovani/hromady?firma='+FIRMA,{credentials:'include'}).then(x=>x.json());
  if(!r.ok){document.getElementById('msg').textContent=r.error||'Nedostupné (přihlas se jako rodič)';return;}
  document.getElementById('piles').innerHTML=r.hromady.map(h=>`<div class="pile" id="p_${h.kod}" onclick="openPile('${h.kod}','${h.nazev.replace(/'/g,"\\'")}')">
    <div class="ic">${h.ikona}</div><div class="nm">${h.nazev}</div>
    <div class="ks">${(h.ks||0).toLocaleString('cs-CZ')} <span style="font-size:13px;color:#8fa3bd">ks</span></div>
    <div class="ob">${h.objem?czk(h.objem):''}</div></div>`).join('');
  document.getElementById('msg').textContent='Vyber hromadu nahoře.';
}
async function openPile(kod,nazev){
  CUR=kod;
  document.querySelectorAll('.pile').forEach(p=>p.classList.remove('on'));
  const pe=document.getElementById('p_'+kod);if(pe)pe.classList.add('on');
  document.getElementById('msg').textContent='Načítám hromadu '+nazev+'…';
  document.getElementById('listwrap').style.display='none';
  const r=await fetch(API+'/api/v1/erp/app/uctovani/hromada?typ='+kod+'&firma='+FIRMA,{credentials:'include'}).then(x=>x.json());
  if(!r.ok){document.getElementById('msg').textContent=r.error||'chyba';return;}
  const rows=r.polozky||[];
  const CZK={type:'numericColumn',valueFormatter:AGLite.fmt.czk,filter:'agNumberColumnFilter',aggFunc:'sum'};
  const pdf=(typ)=>({headerName:'Doklad 📄',field:'cislo',minWidth:130,filter:'agTextColumnFilter',
    cellRenderer:p=>p.value?('<a class="aglite-link" href="/api/v1/erp/app/uctovani/doklad-pdf?typ='+typ+'&firma='+FIRMA+'&id='+(p.data.id||'')+'&cislo='+encodeURIComponent(p.value)+'" target="_blank">📄 '+p.value+'</a>'):''});
  let cols=[], opts={csvName:kod+'_'+FIRMA, totals:['castka']};
  if(kod==='fp'||kod==='fv'){
    cols=[COLDAT('Datum realizace'),pdf(kod),{headerName:'Řada',field:'rada',maxWidth:90},{headerName:'Název',field:'nazev',flex:2,minWidth:180},{headerName:'Org',field:'cislo_org',maxWidth:90},{headerName:'Zakázka',field:'zakazka',maxWidth:130},Object.assign({headerName:'Částka (bez DPH)',field:'castka'},CZK),{headerName:'Měna',field:'mena',maxWidth:90}];
  }else if(kod==='vo'){
    cols=[COLDAT(),pdf('vo'),{headerName:'Řada',field:'rada',maxWidth:90},{headerName:'Org',field:'cislo_org',maxWidth:90},{headerName:'Zakázka',field:'zakazka',maxWidth:130},Object.assign({headerName:'Částka (bez DPH)',field:'castka'},CZK),{headerName:'Měna',field:'mena',maxWidth:90},{headerName:'Stav',field:'stav',maxWidth:120}];
  }else if(kod==='po'){
    cols=[COLDAT(),{headerName:'Doklad',field:'cislo',maxWidth:120},{headerName:'Zákazník',field:'nazev',flex:2,minWidth:180},{headerName:'Zakázka',field:'zakazka',maxWidth:130},{headerName:'Ref. zákazníka',field:'ref_zak',minWidth:130},{headerName:'Popis',field:'popis',flex:1},Object.assign({headerName:'Částka',field:'castka'},CZK)];
  }else if(kod==='kontace'){
    cols=[{headerName:'Kontace',field:'cislo',type:'numericColumn',maxWidth:110,filter:'agNumberColumnFilter'},{headerName:'Název',field:'nazev',flex:2,minWidth:200},{headerName:'Řada',field:'rada',maxWidth:90},{headerName:'Sborník (DUD)',field:'sbornik',minWidth:130},{headerName:'Řádků MD/DAL',field:'radku',type:'numericColumn',maxWidth:130}];
    opts.onRowClick=(d)=>openKontace(d.id,d.cislo); opts.totals=null;
  }else if(kod==='pp'){
    cols=[COLDAT(),{headerName:'Doklad',field:'cislo',maxWidth:120},{headerName:'Zákazník',field:'nazev',flex:2,minWidth:180},{headerName:'Zakázka',field:'zakazka',maxWidth:130},{headerName:'Navazuje (nabídka)',field:'navazny',minWidth:140},{headerName:'Popis',field:'popis',flex:1}]; opts.totals=null;
  }else if(kod==='kalk'){
    cols=[COLDAT(),{headerName:'Doklad',field:'cislo',minWidth:120},{headerName:'Č. kalk.',field:'cislo_kalk',maxWidth:120},{headerName:'Zákazník',field:'nazev',flex:2,minWidth:170},{headerName:'Zakázka',field:'zakazka',maxWidth:130},{headerName:'Položek',field:'pocet_polozek',type:'numericColumn',maxWidth:110},Object.assign({headerName:'Celkem cena',field:'castka'},CZK),{headerName:'Řešitel',field:'resitel',maxWidth:120}];
    opts.onRowClick=(d)=>openKalkPol(d.id_kalk,d.cislo);
  }else if(kod==='banka'){
    cols=[COLDAT(),{headerName:'Doklad',field:'doklad',minWidth:120},{headerName:'VS',field:'vs',maxWidth:130},{headerName:'Směr',field:'smer',maxWidth:100,valueFormatter:p=>p.value==='out'?'výdej':'příjem'},Object.assign({headerName:'Částka',field:'castka'},CZK),{headerName:'Měna',field:'mena',maxWidth:90},{headerName:'Zpráva',field:'zprava',flex:2}];
  }else if(kod==='pokladna'){
    cols=[{headerName:'Číslo',field:'cislo',maxWidth:110},{headerName:'Název',field:'nazev',flex:2},{headerName:'Měna',field:'mena',maxWidth:90},{headerName:'Typ',field:'typ',minWidth:120},{headerName:'Účet',field:'ucet',maxWidth:120}]; opts.totals=null;
  }
  document.getElementById('listh').textContent=nazev+' — '+rows.length+(rows.length>=200?' (prvních 200)':'');
  document.getElementById('listwrap').style.display='';
  await AGLite.mount('grid',cols,rows,opts);
  document.getElementById('msg').textContent='';
}
async function openKalkPol(idk,doklad){
  document.getElementById('msg').textContent='Načítám položky '+doklad+'…';
  const r=await fetch(API+'/api/v1/erp/app/uctovani/kalkulace-pol?id_kalk='+idk,{credentials:'include'}).then(x=>x.json());
  if(!r.ok){document.getElementById('msg').textContent=r.error||'chyba';return;}
  const rows=r.polozky||[];
  document.getElementById('listh').innerHTML='Kalkulace '+doklad+' — '+rows.length+' položek &nbsp;<a onclick="openPile(\'kalk\',\'Nabídky/Kalkulace (910)\')" style="cursor:pointer;color:#7fb0ff;font-size:12px">← zpět na kalkulace</a>';
  document.getElementById('listwrap').style.display='';
  const N={type:'numericColumn',valueFormatter:AGLite.fmt.num};
  const cols=[{headerName:'Poz',field:'pos',type:'numericColumn',maxWidth:90},{headerName:'Reg. číslo',field:'reg_cis',minWidth:130},{headerName:'Název',field:'nazev',flex:2,minWidth:200},{headerName:'Výrobce',field:'vyrobce',minWidth:110},Object.assign({headerName:'Ks',field:'pocet_kusu'},N),Object.assign({headerName:'JC EUR',field:'jcena_eur'},N),Object.assign({headerName:'Celkem',field:'gesamt_preis',aggFunc:'sum'},N),{headerName:'Zakázka',field:'zakazka',maxWidth:130},Object.assign({headerName:'Obj',field:'objednano'},N),Object.assign({headerName:'Vyd',field:'vydano'},N)];
  await AGLite.mount('grid',cols,rows,{csvName:'kalkulace_'+doklad,totals:['gesamt_preis']});
  document.getElementById('msg').textContent='';
}
async function openKontace(idu,cislo){
  document.getElementById('msg').textContent='Načítám řádky kontace '+cislo+'…';
  const r=await fetch(API+'/api/v1/erp/app/uctovani/kontace-radky?idukod='+idu+'&firma='+FIRMA,{credentials:'include'}).then(x=>x.json());
  if(!r.ok){document.getElementById('msg').textContent=r.error||'chyba';return;}
  const rows=r.radky||[];
  document.getElementById('listh').innerHTML='Kontace '+cislo+' — '+rows.length+' řádků MD/DAL &nbsp;<a onclick="openPile(\'kontace\',\'Předkontace (Helios 1:1)\')" style="cursor:pointer;color:#7fb0ff;font-size:12px">← zpět na kontace</a>';
  document.getElementById('listwrap').style.display='';
  const cols=[{headerName:'Řádek',field:'radek',type:'numericColumn',maxWidth:90},{headerName:'Druh řádku',valueGetter:p=>(p.data.sazbadph!=null)?('Základ DPH '+p.data.sazbadph+'%'):'Ostatní částky',minWidth:150},{headerName:'Sazba DPH',valueGetter:p=>(p.data.sazbadph!=null)?(p.data.sazbadph+' %'):'—',maxWidth:120},{headerName:'Účet MD',field:'ucetmd',cellStyle:{color:'#8fe0a0',fontFamily:'ui-monospace,Menlo,monospace'},minWidth:110},{headerName:'Účet DAL',field:'ucetdal',cellStyle:{color:'#f0a0b4',fontFamily:'ui-monospace,Menlo,monospace'},minWidth:110},{headerName:'Cizí měna',valueGetter:p=>AGLite.fmt.yn({value:p.data.cizimena}),maxWidth:110},{headerName:'Záporně',valueGetter:p=>AGLite.fmt.yn({value:p.data.zaporne}),maxWidth:100},{headerName:'Uplatnit DPH',valueGetter:p=>AGLite.fmt.yn({value:p.data.uplatnitdph}),maxWidth:130}];
  await AGLite.mount('grid',cols,rows,{quickFilter:false,grouping:false,csvName:'kontace_'+cislo});
  document.getElementById('msg').textContent='';
}
loadPiles();
</script>
<script src="/static/nav-back.js"></script>
</body>
</html>
