<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ISO 27001 — auditorský přístup</title>
<style>
  :root{--bg:#0a1018;--card:#121a25;--bord:#1f2a38;--tx:#e6edf5;--mut:#8fa0b4;--accent:#4f8ef7;--green:#34d399;--amber:#fbbf24;}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.55 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
  .wrap{max-width:920px;margin:0 auto;padding:18px}
  h1{font-size:20px;margin:0 0 2px;font-weight:800}
  .sub{color:var(--mut);font-size:13px;margin-bottom:12px}
  .c{background:var(--card);border:1px solid var(--bord);border-radius:12px;padding:12px}
  .row{display:flex;gap:10px;align-items:flex-start;border-bottom:1px solid var(--bord);padding:10px 0}
  .row:last-child{border-bottom:0}
  .grow{flex:1;min-width:0}.nm{font-weight:600}
  .meta{color:var(--mut);font-size:12px;margin-top:2px}
  .pill{font-size:11px;padding:1px 8px;border-radius:8px;font-weight:700}
  .p-schvaleno{background:rgba(52,211,153,.18);color:var(--green)}
  .p-navrh{background:rgba(251,191,36,.16);color:var(--amber)}
  .sig{color:var(--green);font-size:11px;margin-top:2px}
  a.lnk{color:var(--accent);text-decoration:none;font-size:12px}
  .err{color:#ff8a8a}
  .badge{display:inline-block;background:rgba(79,142,247,.16);color:var(--accent);font-size:11px;font-weight:700;padding:2px 9px;border-radius:8px;margin-bottom:10px}
</style>
</head>
<body>
<div class="wrap">
  <div class="badge">AUDITORSKÝ PŘÍSTUP · READ-ONLY</div>
  <h1>🛡️ ISO 27001 — elektronické dokumenty ISMS</h1>
  <div class="sub" id="head">Načítám…</div>
  <div id="body"></div>
</div>
<script>
function esc(s){return(s==null?"":String(s)).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c]));}
var TOKEN=decodeURIComponent((location.pathname.split("/iso-audit/")[1]||"").replace(/\/.*$/,""));
function load(){
  if(!TOKEN){document.getElementById("body").innerHTML='<div class="c err">Chybí přístupový token.</div>';return;}
  fetch("/api/v1/erp/app/iso/audit/"+encodeURIComponent(TOKEN)+"/data",{credentials:"omit"}).then(r=>r.json()).then(j=>{
    if(!j||!j.ok){document.getElementById("head").textContent="";document.getElementById("body").innerHTML='<div class="c err">'+esc(j&&j.error==="invalid_or_expired"?"Odkaz je neplatný nebo vypršel. Požádejte správce ISMS o nový.":(j&&j.error)||"chyba")+'</div>';return;}
    document.getElementById("head").innerHTML='Subjekt: <b>'+esc(j.tenant_name)+'</b> · níže jsou elektronické dokumenty ISMS a stav jejich schválení.';
    var h='<div class="c">';
    (j.docs||[]).forEach(d=>{
      var sg=(d.podpisy||[]);
      h+='<div class="row"><div class="grow">'
        +'<div class="nm">'+esc(d.kod)+' — '+esc(d.nazev)+' <span class="pill p-'+esc(d.stav)+'">'+(d.stav==="schvaleno"?"schváleno":"návrh")+'</span></div>'
        +'<div class="meta">'+esc(d.kategorie||"")+' · verze '+esc(d.verze)+'</div>'
        +sg.map(x=>'<div class="sig">✍️ '+esc(x.jmeno)+(x.role?(" ("+esc(x.role)+")"):"")+' · '+esc(x.kdy)+'</div>').join('')
        +'</div><div style="margin-left:auto"><a class="lnk" href="/api/v1/erp/app/iso/audit/'+encodeURIComponent(TOKEN)+'/doc/'+encodeURIComponent(d.kod)+'" target="_blank">otevřít ↗</a></div></div>';
    });
    h+='</div>';
    var ct=(j.controls||[]);
    if(ct.length){
      h+='<h1 style="font-size:16px;margin:18px 0 6px">📑 SoA — Prohlášení o aplikovatelnosti ('+ct.length+' kontrol)</h1><div class="c">';
      var cur="";
      ct.forEach(c=>{
        if(c.oblast!==cur){cur=c.oblast;h+='<div style="margin:10px 0 2px;font-weight:700;color:#9fb4d4">'+esc(cur)+'</div>';}
        h+='<div class="row"><div class="grow"><div class="nm">'+esc(c.kod)+' — '+esc(c.nazev)+' <span class="pill '+(c.apl?'p-schvaleno':'p-navrh')+'">'+(c.apl?"aplikovatelné":"neaplikovatelné")+'</span></div>'
          +'<div class="meta">'+esc(c.stav||"")+(c.zduvodneni?(' · '+esc(c.zduvodneni)):'')+'</div></div></div>';
      });
      h+='</div>';
    }
    var ev=(j.evidence||[]);
    if(ev.length){
      h+='<h1 style="font-size:16px;margin:18px 0 6px">📎 Evidence — nahrané dokumenty ('+ev.length+')</h1><div class="c">';
      var cg="";
      ev.forEach(d=>{
        var grp=(d.projekt||"")+(d.folder?(" / "+d.folder):"");
        if(grp!==cg){cg=grp;h+='<div style="margin:10px 0 2px;font-weight:700;color:#9fb4d4">'+esc(grp)+'</div>';}
        h+='<div class="row"><div class="grow"><div class="nm">'+esc(d.nazev)+' <span class="meta">·'+esc(d.typ)+'</span></div></div>'
          +'<div style="margin-left:auto"><a class="lnk" href="/api/v1/erp/app/iso/audit/'+encodeURIComponent(TOKEN)+'/evidence-doc/'+d.id+'" target="_blank">otevřít ↗</a></div></div>';
      });
      h+='</div>';
    }
    h+='<h1 style="font-size:16px;margin:18px 0 6px">💬 Napište nám přímo (bez e-mailu)</h1><div class="c">'
      +'<div class="sub">Co potřebujete? Napište to sem — uvidíme to hned a odpovíme přímo v tomto portálu.</div>'
      +'<div id="aftypes" style="display:flex;flex-wrap:wrap;gap:6px;margin:6px 0"></div>'
      +'<textarea id="aftext" placeholder="Dotaz, požadavek na doklad, zjištění, co doplnit…" style="width:100%;min-height:70px;background:#0f1830;border:1px solid var(--bord);color:var(--tx);border-radius:8px;padding:8px"></textarea>'
      +'<div style="margin-top:8px"><button onclick="sendAFb()" style="background:var(--accent);color:#06101f;border:0;border-radius:8px;padding:8px 14px;font-weight:700;cursor:pointer">Odeslat</button> <span id="afmsg" class="sub"></span></div>'
      +'<div id="afthread" style="margin-top:12px"></div></div>';
    h+='<div class="sub" style="margin-top:10px">Přístup je auditovaný (každé otevření i zpráva se zaznamenává).</div>';
    document.getElementById("body").innerHTML=h;
    initAfTypes();loadAuditFb();
  }).catch(()=>{document.getElementById("body").innerHTML='<div class="c err">Chyba načtení.</div>';});
}
var AFTYPES=[["otazka","❓ Dotaz"],["doplnit","➕ Doplnit"],["spatne","⚠️ Zjištění"],["nesouhlas","✋ Nesouhlas"]];
var aftype="otazka";
function initAfTypes(){var e=document.getElementById("aftypes");if(!e)return;e.innerHTML=AFTYPES.map(t=>'<span onclick="aftype=\''+t[0]+'\';initAfTypes()" style="font-size:12px;padding:4px 9px;border-radius:8px;cursor:pointer;'+(t[0]===aftype?'background:#4f8ef7;color:#06101f;font-weight:700':'background:#0f1830;border:1px solid var(--bord)')+'">'+t[1]+'</span>').join('');}
function sendAFb(){
  var t=document.getElementById("aftext").value.trim();if(!t){document.getElementById("afmsg").textContent="napište text";return;}
  fetch("/api/v1/erp/app/iso/audit/"+encodeURIComponent(TOKEN)+"/feedback",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({typ:aftype,text:t})}).then(r=>r.json()).then(r=>{
    if(r&&r.ok){document.getElementById("aftext").value="";document.getElementById("afmsg").innerHTML='<span style="color:#34d399">Odesláno — díky! Reagujeme.</span>';loadAuditFb();}
    else{document.getElementById("afmsg").textContent=(r&&r.error)||"chyba";}
  });
}
function loadAuditFb(){
  fetch("/api/v1/erp/app/iso/audit/"+encodeURIComponent(TOKEN)+"/feedback",{credentials:"omit"}).then(r=>r.json()).then(j=>{
    var el=document.getElementById("afthread");if(!el||!j||!j.ok)return;
    if(!j.feedback.length){el.innerHTML='';return;}
    el.innerHTML='<div class="sub" style="margin:6px 0">Vaše zprávy a naše odpovědi:</div>'+j.feedback.map(f=>
      '<div style="border:1px solid var(--bord);border-radius:8px;padding:8px;margin-bottom:6px">'
      +'<div><b>'+esc(f.typ)+'</b> <span class="meta">· '+esc(f.kdy)+' · '+(f.stav==="vyrizeno"?'<span style="color:#34d399">vyřízeno</span>':'<span style="color:#fbbf24">čeká</span>')+'</span></div>'
      +'<div style="margin:3px 0">'+esc(f.text)+'</div>'
      +(f.odpoved?('<div style="border-left:3px solid #34d399;padding:3px 8px;margin-top:4px;color:#bfe3c8">Naše odpověď: '+esc(f.odpoved)+'</div>'):'')
      +'</div>').join('');
  });
}
load();
</script>
</body>
</html>
