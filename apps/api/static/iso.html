<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>🛡️ ISO 27001 — cockpit ISMS</title>
<style>
  :root{--bg:#0a1018;--card:#121a25;--bord:#1f2a38;--tx:#e6edf5;--mut:#8fa0b4;--accent:#4f8ef7;--green:#34d399;--amber:#fbbf24;--red:#f87171;}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.55 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
  .wrap{max-width:1000px;margin:0 auto;padding:18px;padding-bottom:110px}
  h1{font-size:21px;margin:0 0 2px;font-weight:800}
  h2{font-size:16px;margin:20px 0 8px;font-weight:700}
  .sub{color:var(--mut);font-size:13px;margin-bottom:6px}
  .bar{height:9px;border-radius:6px;background:#1f2a38;overflow:hidden;margin:8px 0 4px}
  .bar>i{display:block;height:100%;background:var(--green)}
  .c{background:var(--card);border:1px solid var(--bord);border-radius:12px;padding:12px;margin-bottom:10px}
  .row{display:flex;gap:10px;align-items:flex-start;border-bottom:1px solid var(--bord);padding:9px 0}
  .row:last-child{border-bottom:0}
  .num{flex:0 0 26px;height:26px;border-radius:50%;background:#1f2a38;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px;color:var(--mut)}
  .num.done{background:rgba(52,211,153,.18);color:var(--green)}
  .grow{flex:1;min-width:0}
  .nm{font-weight:600}
  .meta{color:var(--mut);font-size:12px;margin-top:2px}
  .pill{font-size:11px;padding:1px 8px;border-radius:8px;font-weight:700;white-space:nowrap}
  .p-ceka{background:rgba(143,160,180,.16);color:var(--mut)}
  .p-hotovo{background:rgba(52,211,153,.18);color:var(--green)}
  .p-schvaleno{background:rgba(52,211,153,.18);color:var(--green)}
  .p-navrh{background:rgba(251,191,36,.16);color:var(--amber)}
  .btn{background:var(--accent);color:#06101f;border:0;border-radius:8px;padding:7px 12px;font-weight:700;cursor:pointer;font-size:13px}
  .btn.ghost{background:transparent;border:1px solid var(--bord);color:var(--tx)}
  .btn.sm{padding:4px 9px;font-size:12px}
  .btn:disabled{opacity:.45;cursor:default}
  a.lnk{color:var(--accent);text-decoration:none;font-size:12px}
  .sig{color:var(--green);font-size:11px;margin-top:2px}
  input,select{background:#0f1830;border:1px solid var(--bord);color:var(--tx);border-radius:7px;padding:6px 8px;font-size:13px}
  .right{margin-left:auto}
  .tokenbox{background:#0f1830;border:1px dashed var(--accent);border-radius:8px;padding:8px;margin-top:8px;font-family:ui-monospace,monospace;font-size:12px;word-break:break-all}
  .hint{color:var(--mut);font-size:12px}
</style>
</head>
<body>
<div class="wrap">
  <h1>🛡️ ISO 27001 &amp; TISAX — váš pomocník v bezpečnosti firmy</h1>
  <div class="sub" id="head">Načítám…</div>
  <div class="bar"><i id="bar" style="width:0%"></i></div>
  <div class="hint" id="prog"></div>
  <div id="body"></div>
</div>
<script>
function esc(s){return(s==null?"":String(s)).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c]));}
var TENANT=new URLSearchParams(location.search).get("tenant");
// V appce (iframe) odkazy na stránky neotvírej target=_blank (vyskočí z appky a rozbije Zpět) — pošli je rodičovské appce.
if(window.parent!==window){document.addEventListener("click",function(e){var a=e.target.closest?e.target.closest("a[href]"):null;if(!a)return;var h=a.getAttribute("href")||"";if(h.indexOf("/dokument")===0||h.indexOf("/iso")===0){e.preventDefault();try{parent.postMessage({stgOpen:h},"*");}catch(x){}return;}if(h.indexOf("/api/")===0){e.preventDefault();try{parent.postMessage({stgOpenExt:location.origin+h},"*");}catch(x){}}},true);}
function api(p,m,b){if(TENANT&&p.indexOf("/app/iso")>=0){p+=(p.indexOf("?")>=0?"&":"?")+"tenant="+encodeURIComponent(TENANT);}return fetch(p,{method:m||"GET",credentials:"include",headers:b?{"Content-Type":"application/json"}:{},body:b?JSON.stringify(b):undefined}).then(r=>r.json());}
var DATA=null;
var KROKFILTR="Vše";
function setKrokFiltr(o){KROKFILTR=o;if(DATA)render();}
function navodKey(t){var v=t.vlastnik||"",f=t.faze||"";if(v.indexOf("Michal")>=0||f.indexOf("Obnova")>=0)return "michal";if(v.indexOf("Kristý")>=0)return "handoff";if(f.indexOf("Dodavatel")>=0)return "dodavatele";if(f.indexOf("Technika")>=0)return "dr";return "dorazeni";}
function load(){return api("/api/v1/erp/app/iso/overview").then(j=>{
  if(!j||!j.ok){document.getElementById("body").innerHTML='<div class="c" style="color:#ff8a8a">'+esc((j&&j.error)||"přístup jen pro vedení")+'</div>';document.getElementById("head").textContent="";return;}
  DATA=j;render();
}).catch(e=>{document.getElementById("head").textContent="";document.getElementById("body").innerHTML='<div class="c" style="color:#ff8a8a">Chyba načtení ('+esc(String(e))+'). Zkus obnovit (Ctrl+Shift+R).</div>';});}
function render(){
  var j=DATA;
  document.getElementById("head").innerHTML='Subjekt: <b>'+esc(j.tenant_name)+'</b> · průběžná správa bezpečnosti — vede vás k pořádku, kontrolám a správě hesel. Certifikace je milník, ne cíl. Elektronicky, podpis klikem (SES), bez tisku.';
  var pct=j.progress.celkem?Math.round(100*j.progress.hotovo/j.progress.celkem):0;
  document.getElementById("bar").style.width=pct+"%";
  document.getElementById("prog").textContent="Kroky: "+j.progress.hotovo+" / "+j.progress.celkem+" hotovo ("+pct+" %)";
  var h="";
  // TREZOR HESEL — vlajková funkce (největší reálná bolest firem)
  h+='<h2>🔐 Trezor hesel — konec bordelu v heslech</h2><div class="c" id="vault"><div class="hint">Načítám…</div></div>';
  // KROKY — kdo co má (filtr podle vlastníka, ať se nikdo neztratí)
  var owners=["Vše"]; j.tasks.forEach(function(t){ if(t.vlastnik && owners.indexOf(t.vlastnik)<0) owners.push(t.vlastnik); });
  h+='<h2>📋 Kroky k certifikaci — kdo co má</h2><div class="c">';
  h+='<div class="hint" style="margin-bottom:6px">Vyber, čí úkoly chceš vidět — každý se soustředí jen na svou část:</div>';
  h+='<div style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px">'+owners.map(function(o){
    var on=(o===KROKFILTR);
    return '<span onclick="setKrokFiltr(\''+esc(o)+'\')" style="cursor:pointer;font-size:12px;padding:4px 10px;border-radius:8px;'+(on?'background:var(--accent);color:#06101f;font-weight:700':'background:#0f1830;border:1px solid var(--bord)')+'">'+esc(o)+'</span>';
  }).join('')+'</div>';
  var ft=j.tasks.filter(function(t){return KROKFILTR==="Vše"||t.vlastnik===KROKFILTR;});
  if(KROKFILTR!=="Vše"){
    var hot=ft.filter(function(t){return t.stav==="hotovo";}).length;
    var dalsi=ft.filter(function(t){return t.stav!=="hotovo";})[0];
    h+='<div class="row" style="background:rgba(79,142,247,.08);border-radius:8px"><div class="grow"><div class="nm">'+esc(KROKFILTR)+' — '+hot+'/'+ft.length+' hotovo</div><div class="meta">'+(dalsi?('👉 Tvůj další krok: <b>'+esc(dalsi.nazev)+'</b>'):'✅ Máš vše hotovo!')+'</div></div></div>';
  }
  ft.forEach(function(t){
    var done=t.stav==="hotovo";
    var nk=navodKey(t);
    h+='<div class="row"><div class="num'+(done?" done":"")+'">'+(done?"✓":t.poradi)+'</div><div class="grow">'
      +'<div class="nm">'+esc(t.nazev)+' <span class="pill p-'+esc(t.stav)+'">'+(done?"hotovo":"čeká")+'</span></div>'
      +'<div class="meta">'+esc(t.faze)+' · '+esc(t.vlastnik||"")+(t.doc_kod?(' · '+esc(t.doc_kod)):'')+'</div>'
      +'<div class="meta">'+esc(t.popis||"")+'</div>'
      +(t.done_kdy?('<div class="sig">✓ '+esc(t.done_kdy)+'</div>'):'')
      +'</div><div class="right" style="display:flex;flex-direction:column;gap:6px;align-items:flex-end">'
      +'<a class="lnk" href="/dokument?key='+nk+'" target="_blank">📖 Jak na to</a>'
      +(t.vyzaduje_podpis?'<span class="hint">podpis u dokumentu ↓</span>':('<button class="btn sm '+(done?'ghost':'')+'" onclick="taskDone('+t.id+','+(!done)+')">'+(done?"vrátit":"hotovo")+'</button>'))
      +'</div></div>';
  });
  h+='</div>';
  // DOKUMENTY
  h+='<h2>📄 Dokumenty ISMS — elektronické</h2><div class="c">';
  j.docs.forEach(d=>{
    var sg=(d.podpisy||[]);
    h+='<div class="row"><div class="grow">'
      +'<div class="nm">'+esc(d.kod)+' — '+esc(d.nazev)+' <span class="pill p-'+esc(d.stav)+'">'+(d.stav==="schvaleno"?"schváleno":"návrh")+'</span></div>'
      +'<div class="meta">'+esc(d.kategorie||"")+' · verze '+esc(d.verze)+(d.vyzaduje_podpis?' · vyžaduje podpis':'')+'</div>'
      +sg.map(x=>'<div class="sig">✍️ '+esc(x.jmeno)+(x.role?(" ("+esc(x.role)+")"):"")+' · '+esc(x.kdy)+'</div>').join('')
      +'</div><div class="right" style="display:flex;flex-direction:column;gap:6px;align-items:flex-end">'
      +'<a class="lnk" href="/api/v1/erp/app/iso/doc/'+encodeURIComponent(d.kod)+'" target="_blank">otevřít ↗</a>'
      +(d.vyzaduje_podpis&&d.stav!=="schvaleno"?('<button class="btn sm" onclick="sign(\''+d.kod+'\')">✍️ Podepsat</button>'):'')
      +'</div></div>';
  });
  h+='</div>';
  // SoA
  var so=j.soa||{};
  h+='<h2>📑 SoA — Prohlášení o aplikovatelnosti (93 kontrol)</h2><div class="c">'
    +'<div class="row"><div class="grow"><div class="nm">Aplikovatelných: <b>'+(so.apl_ano||0)+'</b> · neaplikovatelných: '+(so.apl_ne||0)+' · celkem '+(so.total||0)
    +' <span class="pill p-'+esc(so.stav||"navrh")+'">'+(so.stav==="schvaleno"?"SoA schváleno":"SoA návrh")+'</span></div>'
    +'<div class="meta">Elektronické Prohlášení o aplikovatelnosti — uprav aplikovatelnost/stav, pak schval podpisem.</div></div>'
    +'<div class="right" style="display:flex;flex-direction:column;gap:6px;align-items:flex-end">'
    +(so.stav!=="schvaleno"?'<button class="btn sm" onclick="sign(\'DOC-06\')">✍️ Schválit SoA</button>':'')
    +'<button class="btn sm ghost" id="cBtn" onclick="loadControls()">Zobrazit 93 kontrol</button></div></div>'
    +'<div id="ctrls"></div></div>';
  // TISAX
  var tx=j.tisax||{};
  h+='<h2>🚗 TISAX — VDA ISA '+esc((tx.verze||"6.0.3").replace("VDA ISA ",""))+' (automotive)</h2><div class="c">'
    +'<div class="row"><div class="grow"><div class="nm">Information Security: pokrytí z ISO <b>'+(tx.is_coverage||0)+' %</b> · aplikovatelné položky '+(tx.appl||0)+' · hotovo '+(tx.hotovo||0)+'</div>'
    +'<div class="meta">Cíl: Assessment Level AL2. IS modul je mapovaný z ISO 27001 (jedna investice, dva výsledky). Přesné otázky lze importovat z oficiálního VDA ISA 6.0.3 (enx.com).</div></div>'
    +'<div class="right"><button class="btn sm ghost" id="txBtn" onclick="loadTisax()">Zobrazit moduly</button></div></div>'
    +'<div id="tisx"></div></div>';
  // EVIDENCE (nahrané dokumenty STRATEGIE)
  h+='<h2>📎 Nahrané dokumenty (evidence ze STRATEGIE)</h2><div class="c">'
    +'<div class="row"><div class="grow"><div class="nm">Dokumenty nahrané v projektu (TISAX/ISO) — napojené do modulu</div>'
    +'<div class="meta">Servírují se přímo z úložiště STRATEGIE; auditor je vidí read-only.</div></div>'
    +'<div class="right"><button class="btn sm ghost" id="evBtn" onclick="loadEvidence()">Zobrazit dokumenty</button></div></div>'
    +'<div id="evid"></div></div>';
  // PRŮBĚŽNÉ KONTROLY (kalendář bezpečnosti)
  h+='<h2>🔁 Průběžné kontroly (kalendář bezpečnosti)</h2><div class="c">'
    +'<div class="hint" style="margin-bottom:6px">Bezpečnost není jednorázová. Modul vás drží v pravidelném rytmu kontrol — aby se firma neztratila a zůstala v pořádku i <b>po</b> certifikaci. Tohle je vaše pravá ruka v bezpečnosti.</div>'
    +'<div id="cad"><div class="hint">Načítám…</div></div></div>';
  // AUDITOR
  h+='<h2>👁️ Přístup pro auditora (web, read-only)</h2><div class="c" id="aud"><div class="hint">Načítám…</div></div>';
  // FEEDBACK INBOX
  h+='<h2>💬 Dotazy a připomínky (od lidí i auditorů)</h2><div class="c" id="fbinbox"><div class="hint">Načítám…</div></div>';
  document.getElementById("body").innerHTML=h;
  loadAud();loadFeedback();loadCadence();loadVault();
}
function loadVault(){
  var el=document.getElementById("vault");if(!el)return;
  Promise.all([
    fetch("/api/v1/erp/app/self-secret",{credentials:"include"}).then(function(r){return r.json();}),
    api("/api/v1/erp/app/iso/vault-overview")
  ]).then(function(res){
    var mine=res[0]||{}, ov=res[1]||{};
    var items=mine.items||mine.secrets||[];
    var ready=mine.vault_ready!==false;
    var h='<div class="hint" style="margin-bottom:6px">Největší bordel ve firmách jsou hesla. Tady má <b>každý svůj šifrovaný trezor</b> (Fernet + PIN/SMS). STRATEGIE ani HR obsah <b>nevidí</b> — jen vlastník po 2FA. Konec lepíků pod klávesnicí.</div>';
    if(ov&&ov.ok){h+='<div class="row"><div class="grow"><div class="nm">📊 Pořádek v heslech (firma)</div><div class="meta">Trezor používá <b>'+(ov.lidi||0)+'</b>'+(ov.lidi_celkem?(' z '+ov.lidi_celkem):'')+' lidí · bezpečně uloženo <b>'+(ov.hesla||0)+'</b> hesel</div></div></div>';}
    h+='<div class="row"><div class="grow"><div class="nm">🔑 Moje hesla ('+items.length+')</div>';
    if(!ready){h+='<div class="meta" style="color:#fbbf24">Trezor se inicializuje…</div>';}
    h+=items.map(function(it){return '<div class="meta">• '+esc(it.label||"")+(it.username?(' ('+esc(it.username)+')'):'')+'</div>';}).join('');
    h+='</div></div>';
    h+='<div style="margin-top:8px;display:flex;flex-wrap:wrap;gap:6px;align-items:center">'
      +'<input id="vsLabel" placeholder="Název (např. Helios)" style="background:#0f1830;border:1px solid var(--bord);color:var(--tx);border-radius:7px;padding:6px 8px">'
      +'<input id="vsUser" placeholder="Uživatel" style="background:#0f1830;border:1px solid var(--bord);color:var(--tx);border-radius:7px;padding:6px 8px">'
      +'<input id="vsSecret" type="password" placeholder="Heslo" style="background:#0f1830;border:1px solid var(--bord);color:var(--tx);border-radius:7px;padding:6px 8px">'
      +'<button class="btn sm" onclick="saveVault()">➕ Uložit do trezoru</button> <span id="vsMsg" class="hint"></span></div>'
      +'<div class="hint" style="margin-top:6px">Zobrazení hesla = jen vlastník po PIN + SMS (v appce). Tady bezpečně přidáš a máš přehled.</div>';
    el.innerHTML=h;
  }).catch(function(){el.innerHTML='<div class="hint">Trezor nedostupný.</div>';});
}
function saveVault(){
  var lb=document.getElementById("vsLabel").value.trim(),un=document.getElementById("vsUser").value.trim(),sc=document.getElementById("vsSecret").value;
  if(!lb||!sc){document.getElementById("vsMsg").textContent="vyplň název a heslo";return;}
  fetch("/api/v1/erp/app/self-secret/save",{method:"POST",credentials:"include",headers:{"Content-Type":"application/json"},body:JSON.stringify({label:lb,username:un,secret:sc})}).then(function(r){return r.json();}).then(function(r){
    if(r&&r.ok){document.getElementById("vsMsg").innerHTML='<span style="color:#34d399">Uloženo bezpečně.</span>';loadVault();}
    else{document.getElementById("vsMsg").textContent=(r&&r.error)||"chyba";}
  });
}
function loadCadence(){api("/api/v1/erp/app/iso/cadence").then(function(j){
  var el=document.getElementById("cad");if(!el)return;
  if(!j||!j.ok){el.innerHTML='<div class="hint">—</div>';return;}
  el.innerHTML=(j.cadence||[]).map(function(c){
    return '<div class="row"><div class="grow"><div class="nm">'+esc(c.nazev)+' <span class="pill" style="background:rgba(79,142,247,.16);color:#4f8ef7">'+esc(c.perioda)+'</span></div>'
      +'<div class="meta">'+esc(c.popis)+' · '+esc(c.vazba)+'</div></div></div>';
  }).join('');
});}
var FBTYP={otazka:"❓ Dotaz",nerozumim:"🤔 Nerozumím",spatne:"⚠️ Špatně",nesouhlas:"✋ Nesouhlas",doplnit:"➕ Doplnit"};
function loadFeedback(){api("/api/v1/erp/app/kb/feedback").then(function(j){
  var el=document.getElementById("fbinbox");if(!el)return;
  if(!j||!j.ok){el.innerHTML='<div class="hint">'+esc((j&&j.error)||"chyba")+'</div>';return;}
  var rows=j.feedback||[];
  if(!rows.length){el.innerHTML='<div class="hint">Zatím žádné dotazy ani připomínky.</div>';return;}
  var nove=0,h="";
  rows.forEach(function(f){
    if(f.stav!=="vyrizeno")nove++;
    var aud=(f.zdroj==="auditor")?'<span class="pill" style="background:rgba(79,142,247,.18);color:#4f8ef7">AUDITOR</span> ':'';
    var stav=(f.stav==="vyrizeno")?'<span class="pill p-hotovo">vyřízeno</span>':'<span class="pill p-navrh">nové</span>';
    var odp=f.odpoved?('<div class="sig">↳ '+esc(f.odpoved)+'</div>'):'';
    var btn=(f.stav!=="vyrizeno")?('<button class="btn sm" onclick="replyFb('+f.id+')">Odpovědět</button>'):'';
    h+='<div class="row"><div class="grow"><div class="nm">'+(FBTYP[f.typ]||esc(f.typ))+' '+aud+stav+'</div>'
      +'<div class="meta">'+esc(f.jmeno||"")+' · '+esc(f.doc_key||"")+' · '+esc(f.kdy||"")+'</div>'
      +'<div style="margin:3px 0">'+esc(f.text)+'</div>'+odp
      +'</div><div class="right">'+btn+'</div></div>';
  });
  el.innerHTML='<div class="hint" style="margin-bottom:6px">Nových: '+nove+' · celkem '+rows.length+'</div>'+h;
});}
function replyFb(id){
  var o=prompt("Vaše odpověď (uvidí ji tazatel/auditor v portálu):");
  if(o==null||!o.trim())return;
  api("/api/v1/erp/app/kb/feedback/reply","POST",{id:id,odpoved:o.trim()}).then(r=>{if(r&&r.ok)loadFeedback();else alert((r&&r.error)||"chyba");});
}
var STAVY=["HOTOVO","ROZPRACOVÁNO","ZBÝVÁ","PROCES-ISMS","EUROSOFT-INFRA","NEAPLIKOVATELNÉ"];
function loadControls(){
  var box=document.getElementById("ctrls");var b=document.getElementById("cBtn");
  if(box.dataset.open==="1"){box.innerHTML="";box.dataset.open="0";if(b)b.textContent="Zobrazit 93 kontrol";return;}
  box.innerHTML='<div class="hint" style="padding:8px 0">Načítám…</div>';
  api("/api/v1/erp/app/iso/controls").then(j=>{
    if(!j||!j.ok){box.innerHTML='<div class="hint">chyba</div>';return;}
    box.dataset.open="1";if(b)b.textContent="Skrýt kontroly";
    var cur="",h="";
    j.controls.forEach(c=>{
      if(c.oblast!==cur){cur=c.oblast;h+='<div style="margin:10px 0 2px;font-weight:700;color:#9fb4d4">'+esc(cur)+'</div>';}
      var opts=STAVY.map(s=>'<option'+(s===c.stav?' selected':'')+'>'+s+'</option>').join('');
      h+='<div class="row"><div class="grow"><div class="nm">'+esc(c.kod)+' — '+esc(c.nazev)+'</div>'
        +'<div class="meta">'+esc(c.zduvodneni||"")+(c.dukaz?(' · <i>'+esc(c.dukaz)+'</i>'):'')+'</div></div>'
        +'<div class="right" style="display:flex;gap:8px;align-items:center">'
        +'<label class="hint" style="display:flex;gap:4px;align-items:center"><input type="checkbox" '+(c.apl?'checked':'')+' onchange="ctlUpd('+c.id+",'apl',this.checked)\">apl.</label>"
        +'<select onchange="ctlUpd('+c.id+",'stav',this.value)\">"+opts+'</select>'
        +'</div></div>';
    });
    box.innerHTML=h;
  });
}
function ctlUpd(id,field,val){var b={id:id};b[field]=val;api("/api/v1/erp/app/iso/control-update","POST",b);}
var TXSTAV=["ceka","probiha","hotovo","neaplikovatelne"];
function loadTisax(){
  var box=document.getElementById("tisx");var b=document.getElementById("txBtn");
  if(box.dataset.open==="1"){box.innerHTML="";box.dataset.open="0";if(b)b.textContent="Zobrazit moduly";return;}
  box.innerHTML='<div class="hint" style="padding:8px 0">Načítám…</div>';
  api("/api/v1/erp/app/iso/tisax").then(j=>{
    if(!j||!j.ok){box.innerHTML='<div class="hint">chyba</div>';return;}
    box.dataset.open="1";if(b)b.textContent="Skrýt moduly";
    var cur="",h="";
    j.tisax.forEach(t=>{
      if(t.modul!==cur){cur=t.modul;h+='<div style="margin:10px 0 2px;font-weight:700;color:#9fb4d4">'+esc(cur)+'</div>';}
      var opts=TXSTAV.map(s=>'<option'+(s===t.stav?' selected':'')+'>'+s+'</option>').join('');
      h+='<div class="row"><div class="grow"><div class="nm">'+esc(t.kod)+' — '+esc(t.nazev)+'</div>'
        +'<div class="meta">'+(t.iso_map?('↔ '+esc(t.iso_map)):'TISAX-specifické (mimo ISO)')+'</div></div>'
        +'<div class="right" style="display:flex;gap:8px;align-items:center">'
        +'<label class="hint" style="display:flex;gap:4px;align-items:center"><input type="checkbox" '+(t.applicable?'checked':'')+' onchange="txUpd('+t.id+",'applicable',this.checked)\">v rozsahu</label>"
        +'<select onchange="txUpd('+t.id+",'stav',this.value)\">"+opts+'</select>'
        +'</div></div>';
    });
    box.innerHTML=h;
  });
}
function txUpd(id,field,val){var b={id:id};b[field]=val;api("/api/v1/erp/app/iso/tisax-update","POST",b);}
function loadEvidence(){
  var box=document.getElementById("evid");var b=document.getElementById("evBtn");
  if(box.dataset.open==="1"){box.innerHTML="";box.dataset.open="0";if(b)b.textContent="Zobrazit dokumenty";return;}
  box.innerHTML='<div class="hint" style="padding:8px 0">Načítám…</div>';
  api("/api/v1/erp/app/iso/evidence").then(j=>{
    if(!j||!j.ok){box.innerHTML='<div class="hint">chyba</div>';return;}
    box.dataset.open="1";if(b)b.textContent="Skrýt dokumenty";
    if(!j.evidence.length){box.innerHTML='<div class="hint" style="padding:8px 0">Žádné nahrané dokumenty v ISO/TISAX projektu pro tento subjekt.</div>';return;}
    var cur="",h='<div class="hint" style="margin:6px 0">Celkem '+j.evidence.length+' dokumentů</div>';
    j.evidence.forEach(d=>{
      var grp=(d.projekt||"")+(d.folder?(" / "+d.folder):"");
      if(grp!==cur){cur=grp;h+='<div style="margin:10px 0 2px;font-weight:700;color:#9fb4d4">'+esc(grp)+'</div>';}
      h+='<div class="row"><div class="grow"><div class="nm">'+esc(d.nazev)+' <span class="hint">·'+esc(d.typ)+'</span></div></div>'
        +'<div class="right"><a class="lnk" href="/api/v1/erp/app/iso/evidence-doc/'+d.id+'" target="_blank">otevřít ↗</a></div></div>';
    });
    box.innerHTML=h;
  });
}
function taskDone(id,done){api("/api/v1/erp/app/iso/task-done","POST",{task_id:id,done:done}).then(()=>load());}
function sign(kod){
  if(!confirm("Elektronicky podepsat / schválit "+kod+"?\nPodpis (SES) se zaznamená s vaším jménem, časem a zařízením."))return;
  api("/api/v1/erp/app/iso/sign","POST",{doc_kod:kod,role:"schvalovatel"}).then(r=>{
    if(r&&r.ok){load();}else{alert((r&&r.error)||"chyba");}
  });
}
function loadAud(){api("/api/v1/erp/app/iso/auditor/list").then(j=>{
  var el=document.getElementById("aud");if(!el)return;
  var rows=(j&&j.auditori)||[];
  var h='<div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:8px">'
    +'<input id="aJ" placeholder="Jméno auditora">'
    +'<input id="aE" placeholder="E-mail (nepovinné)" style="min-width:180px">'
    +'<select id="aD"><option value="30">30 dní</option><option value="60">60 dní</option><option value="90">90 dní</option></select>'
    +'<button class="btn sm" onclick="audCreate()">+ Vytvořit přístup</button></div>'
    +'<div id="aTok"></div>';
  if(rows.length){
    h+='<div style="margin-top:6px">';
    rows.forEach(a=>{
      h+='<div class="row"><div class="grow"><div class="nm">'+esc(a.auditor_jmeno||"(bez jména)")+(a.revoked?' <span class="pill p-ceka">zrušeno</span>':'')+'</div>'
        +'<div class="meta">'+esc(a.auditor_email||"")+' · platí do '+esc(a.do||"—")+' · vytvořeno '+esc(a.od||"")+'</div></div>'
        +'<div class="right">'+(a.revoked?'':'<button class="btn sm ghost" onclick="audRevoke('+a.id+')">zrušit</button>')+'</div></div>';
    });
    h+='</div>';
  }
  el.innerHTML=h;
});}
function audCreate(){
  var j=document.getElementById("aJ").value,e=document.getElementById("aE").value,d=document.getElementById("aD").value;
  api("/api/v1/erp/app/iso/auditor/create","POST",{jmeno:j,email:e,dny:parseInt(d)}).then(r=>{
    if(r&&r.ok){
      var url=location.origin+r.odkaz;
      document.getElementById("aTok").innerHTML='<div class="tokenbox">✅ Odkaz pro auditora (zkopíruj a pošli, zobrazí se jen teď):<br><b>'+esc(url)+'</b></div>';
      loadAud();
    }else{alert((r&&r.error)||"chyba");}
  });
}
function audRevoke(id){if(!confirm("Zrušit tento auditorský přístup?"))return;api("/api/v1/erp/app/iso/auditor/revoke","POST",{id:id}).then(()=>loadAud());}
load();
</script>
</body>
