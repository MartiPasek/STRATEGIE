<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>🪪 Karta zaměstnance</title>
<style>
  /* Tmavé ERP schéma (Šárka 8.7.2026) */
  :root{--bg:#0f141a;--panel:#161c24;--panel2:#12181f;--line:#233040;--line2:#1e2730;
        --txt:#cdd6e2;--title:#e8eef5;--accent:#aac8ec;--muted:#7f8ea0;--ic:#1f2a37;}
  *{box-sizing:border-box}
  body{margin:0;font:14px/1.55 -apple-system,Segoe UI,Roboto,system-ui,sans-serif;color:var(--txt);background:var(--bg)}
  .top{background:var(--panel2);border-bottom:1px solid var(--line);padding:11px 18px;display:flex;align-items:center;gap:10px}
  .top .b{font-weight:800;font-size:16px;color:var(--title)}
  .top .sub{font-size:12px;color:var(--muted);margin-left:2px}
  .wrap{max-width:1200px;margin:16px auto;padding:0 14px;display:grid;grid-template-columns:300px 1fr;gap:16px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden}
  .card .hd{padding:11px 14px;font-weight:800;color:var(--title);border-bottom:1px solid var(--line);font-size:13.5px}
  #srch{width:100%;border:0;border-bottom:1px solid var(--line);padding:10px 14px;font:inherit;outline:none;background:var(--panel);color:var(--txt)}
  #srch::placeholder{color:#5d6b7c}
  .lst{max-height:76vh;overflow:auto}
  .prow{padding:10px 14px;border-top:1px solid var(--line2);cursor:pointer}
  .prow:first-child{border-top:0}
  .prow:hover{background:#1b232d}
  .prow.sel{background:#1e2a38}
  .prow .nm{font-weight:700;color:var(--title)}
  .prow .mt{font-size:12px;color:var(--muted)}
  .det{padding:0}
  .phead{display:flex;align-items:center;gap:14px;padding:18px 20px;border-bottom:1px solid var(--line);background:#12181f}
  .avatar{width:54px;height:54px;border-radius:50%;background:#1f2a37;color:var(--accent);display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:800}
  .phead .nm{font-size:20px;font-weight:800;color:var(--title)}
  .phead .mt{font-size:13px;color:var(--muted);margin-top:2px}
  .sects{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px;padding:18px 20px}
  .sec{display:flex;gap:12px;padding:14px;border:1px solid var(--line);border-radius:10px;background:#12181f;align-items:flex-start}
  .sec.on{cursor:pointer}
  .sec.on:hover{background:#1b232d;border-color:#2b3a4a}
  .sec .si{flex:0 0 40px;height:40px;border-radius:10px;background:var(--ic);display:flex;align-items:center;justify-content:center;font-size:20px}
  .sec .st{font-weight:700;color:var(--title);font-size:14px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
  .sec .sd{font-size:12px;color:var(--muted);margin-top:2px}
  .tag{font-size:9.5px;font-weight:800;letter-spacing:.3px;padding:1px 7px;border-radius:20px}
  .tag.on{background:#16301f;color:#7fe0a0}
  .tag.soon{background:#23262b;color:#7f8ea0}
  .empty{padding:40px;color:var(--muted);text-align:center;font-style:italic}
</style>
</head>
<body>
<div class="top"><span class="b">🪪 Karta zaměstnance</span><span class="sub">· vše o člověku na jednom místě</span></div>
<div class="wrap">
  <div class="card">
    <div class="hd">Zaměstnanci <span id="cnt" style="color:#5d6b7c;font-weight:600"></span></div>
    <input id="srch" placeholder="🔎 Hledat…">
    <select id="fpoz" style="width:100%;border:0;border-bottom:1px solid #233040;padding:9px 14px;font:inherit;background:#161c24;color:#cdd6e2;outline:none">
      <option value="">💼 Pozice: vše</option>
    </select>
    <select id="ftyp" style="width:100%;border:0;border-bottom:1px solid #233040;padding:9px 14px;font:inherit;background:#161c24;color:#cdd6e2;outline:none">
      <option value="">👤 Typ poměru: vše</option>
      <option value="HPP">HPP (zaměstnanec)</option>
      <option value="OSVČ">OSVČ</option>
      <option value="DPP">DPP</option>
    </select>
    <div id="exbar" style="padding:7px 14px;font-size:11.5px;color:#7f8ea0;border-bottom:1px solid #1e2730"></div>
    <div class="lst" id="lst"><div class="empty">Načítám…</div></div>
  </div>
  <div class="card"><div class="det" id="det"><div class="empty">Vyber zaměstnance vlevo.</div></div></div>
</div>
<script>
const API="/api/v1/erp";
let LIDE=[];
let CUR_UID=null;
function esc(s){return (s==null?'':String(s)).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));}
async function j(u){const r=await fetch(u,{credentials:'same-origin'});return r.json();}
function ini(n){return (n||'?').trim().split(/\s+/).map(x=>x[0]||'').slice(0,2).join('').toUpperCase();}

// Sekce karty (dle Pinya „Profil pracovníka" × Centrála). on=napojeno, go=cíl.
const SEKCE=[
  {ic:"🧾",t:"Základní údaje",d:"Osobní údaje, adresy, kontakty, doklady.",on:true,key:'zakladni'},
  {ic:"💼",t:"Pracovní údaje",d:"Poměr, smlouva, úvazek, zařazení.",on:true,key:'pracovni'},
  {ic:"💰",t:"Finanční podmínky",d:"Mzdové složky (jen oprávnění).",on:true,go:"/finance-podminky"},
  {ic:"📄",t:"Dokumenty",d:"Smlouvy, dodatky, podpisy (spis).",on:true},
  {ic:"🏖️",t:"Přítomnost/absence",d:"Zůstatek, docházka, absence.",on:true,key:'absence'},
  {ic:"🩺",t:"Lékařské prohlídky",d:"Platnosti, potvrzení.",on:true},
  {ic:"👥",t:"Skupiny a kvalifikace",d:"Zařazení do skupin, kvalifikace.",on:true,key:'skupiny'},
  {ic:"🎓",t:"Školení",d:"Absolvovaná + plánovaná (BOZP/PO).",on:false},
  {ic:"💻",t:"IT / svěřený majetek",d:"Notebook, telefon, klíče, protokol.",on:false},
  {ic:"🧭",t:"Onboarding",d:"Nástupní checklist a úkoly.",on:false},
  {ic:"👋",t:"Offboarding",d:"Ukončení poměru, dopočet dovolené, vrácení majetku, archivace.",on:false},
  {ic:"📚",t:"Interní předpisy",d:"Seznámení se směrnicemi.",on:false},
  {ic:"⭐",t:"Hodnocení / KPI",d:"Periodické hodnocení, cíle.",on:false},
  {ic:"📝",t:"Dotazníky",d:"Evidence dotazníků.",on:false},
  {ic:"🖥️",t:"E-learning",d:"Kurzy, skóre.",on:false},
];

let VSE=false;
async function load(){
  const d=await j(API+"/app/hr/people"+(VSE?"?vse=1":""));
  const l=document.getElementById('lst');
  if(!d.ok){l.innerHTML='<div class="empty">🔒 Nemáš oprávnění ('+esc(d.error||'')+').</div>';return;}
  LIDE=d.lide||[];
  document.getElementById('cnt').textContent='('+LIDE.length+')';
  // Šárka 20.7.2026: seznam ukazuje jen lidi s platným poměrem; bývalí jdou zobrazit přepínačem.
  const b=document.getElementById('exbar');
  if(b){
    if(VSE){ b.innerHTML='Zobrazeni <b>i bývalí</b> (bez platného poměru). '+
      '<a href="#" onclick="toggleVse();return false;">Zobrazit jen aktivní</a>'; }
    else if(d.skryto>0){ b.innerHTML='Skryto <b>'+d.skryto+'</b> osob bez platného pracovního poměru. '+
      '<a href="#" onclick="toggleVse();return false;">Zobrazit i bývalé</a>'; }
    else { b.innerHTML=''; }
  }
  naplnPozice();
  render();
}
function toggleVse(){ VSE=!VSE; load(); }
function naplnPozice(){
  // dropdown pozic z načtených lidí (Šárka 21.7.2026)
  const sel=document.getElementById('fpoz'); if(!sel) return;
  const cur=sel.value;
  const poz=[...new Set(LIDE.map(p=>p.pozice).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'cs'));
  sel.innerHTML='<option value="">💼 Pozice: vše</option>'+poz.map(p=>'<option value="'+esc(p)+'">'+esc(p)+'</option>').join('');
  sel.value=cur;
}
function render(){
  const q=(document.getElementById('srch').value||'').toLowerCase();
  const fp=(document.getElementById('fpoz')||{}).value||'';
  const ft=(document.getElementById('ftyp')||{}).value||'';
  const l=document.getElementById('lst');
  const f=LIDE.filter(p=>(p.jmeno||'').toLowerCase().includes(q)
    && (!fp || p.pozice===fp)
    && (!ft || (p.typ||'').split(' / ').includes(ft)));
  document.getElementById('cnt').textContent='('+f.length+')';
  if(!f.length){l.innerHTML='<div class="empty">Nic nenalezeno.</div>';return;}
  l.innerHTML=f.map(p=>{
    const stav = p.ma_pomer
      ? '<span style="font-size:10px;font-weight:800;padding:1px 7px;border-radius:20px;background:#16301f;color:#7fe0a0">Aktivní</span>'
      : '<span style="font-size:10px;font-weight:800;padding:1px 7px;border-radius:20px;background:#23262b;color:#7f8ea0">Bývalý</span>';
    const meta = [p.pozice||'', p.typ||'', p.nastup?('nástup '+p.nastup):''].filter(Boolean).join(' · ');
    return '<div class="prow" data-u="'+p.user_id+'" onclick="openP('+p.user_id+',this)">'+
      '<div style="display:flex;justify-content:space-between;align-items:center;gap:8px">'+
        '<div class="nm">'+esc(p.jmeno)+'</div>'+stav+'</div>'+
      '<div class="mt">'+esc(meta)+(p.ma_kartu?'':' · <span style="color:#c98">bez karty</span>')+'</div></div>';
  }).join('');
}
document.getElementById('srch').addEventListener('input',render);
document.getElementById('fpoz').addEventListener('change',render);
document.getElementById('ftyp').addEventListener('change',render);

// Šárka 21.7.2026: profilová hlavička (foto, pozice·bydliště, nástup·firma, stav, výročí, věk, narozeniny)
function pheadHTML(p){
  const _ini=esc(ini(p.jmeno));
  const roky = p.nastup_rok ? (new Date().getFullYear()-p.nastup_rok) : null;
  const _rs = (n)=> n===1?'rok':((n>=2&&n<=4)?'roky':'let');
  const chip=(t,bg,fg)=>'<span style="font-size:11px;font-weight:800;padding:2px 9px;border-radius:20px;background:'+bg+';color:'+fg+';margin-right:6px;white-space:nowrap">'+t+'</span>';
  const idline = [p.pozice, p.stredisko, p.mesto].filter(Boolean).map(esc).join(' · ');
  return '<div class="phead" style="align-items:flex-start"><div class="avatar">'+
    '<img src="'+API+'/app/hr/photo/'+p.user_id+'" alt="" '+
    'style="width:100%;height:100%;object-fit:cover;border-radius:50%;display:block" '+
    'onerror="this.remove();this.parentNode.textContent=\''+_ini+'\'"></div>'+
    '<div style="flex:1"><div class="nm">'+esc(p.jmeno||'')+'</div>'+
    (idline?'<div class="mt" style="color:#aac8ec">'+idline+'</div>':'')+
    ((p.nastup||p.firma)?'<div class="mt">'+
      [p.nastup?('Nástup '+esc(p.nastup)):'', p.firma?esc(p.firma):''].filter(Boolean).join(' · ')+'</div>':'')+
    '<div style="margin-top:7px">'+
      (p.ma_pomer?chip('Aktivní','#16301f','#7fe0a0'):chip('Bývalý','#23262b','#7f8ea0'))+
      (roky!=null?chip('Výročí: '+roky+' '+_rs(roky)+' ve firmě','#1b2c44','#7fb2e8'):'')+
    '</div>'+
    ((p.vek!=null||p.narozeniny)?'<div class="mt" style="margin-top:6px">'+
      (p.vek!=null?('👤 '+esc(p.vek)+' '+_rs(p.vek)):'')+
      (p.narozeniny?((p.vek!=null?' · ':'')+'🎂 narozeniny '+esc(p.narozeniny)):'')+'</div>':'')+
    '</div></div>';
}
function openP(uid,row){
  CUR_UID=uid;
  document.querySelectorAll('.prow').forEach(e=>e.classList.remove('sel'));
  if(row)row.classList.add('sel');
  const p=LIDE.find(x=>x.user_id===uid)||{};
  const det=document.getElementById('det');
  let h=pheadHTML(p);
  h+='<div class="sects">';
  for(const s of SEKCE){
    const tag=s.on?'<span class="tag on">napojeno</span>':'<span class="tag soon">připravujeme</span>';
    const ACT={zakladni:'zakUdaje',pracovni:'pracUdaje',skupiny:'skupUdaje',absence:'absUdaje'};
    const klik = ACT[s.key] ? (' onclick="'+ACT[s.key]+'()"') : (s.go?(' onclick="window.open(\''+s.go+'?uid='+uid+'\',\'_blank\')"'):'');
    const cls='sec'+((s.go||ACT[s.key])?' on':'');
    h+='<div class="'+cls+'"'+klik+'><div class="si">'+s.ic+'</div><div>'+
      '<div class="st">'+esc(s.t)+' '+tag+'</div><div class="sd">'+esc(s.d)+'</div></div></div>';
  }
  h+='</div>';
  det.innerHTML=h;
}

// Šárka 21.7.2026: „Základní údaje" — načte z /app/hr/person, zobrazí a umožní HR editaci.
let ZU_DATA=null, ZU_UID=null;
async function zakUdaje(){
  const uid=CUR_UID; if(!uid) return;
  ZU_UID=uid;
  const det=document.getElementById('det');
  det.innerHTML='<div class="empty">Načítám…</div>';
  const d=await j(API+'/app/hr/person?uid='+uid);
  if(!d.ok){ det.innerHTML='<div style="padding:12px 16px"><a href="#" onclick="openP('+uid+');return false;" style="color:#aac8ec;text-decoration:none">‹ Zpět na kartu</a></div><div class="empty">🔒 '+esc(d.error||'nedostupné')+'</div>'; return; }
  ZU_DATA=d; renderZU(false);
}
function renderZU(edit){
  const d=ZU_DATA, uid=ZU_UID, det=document.getElementById('det');
  const p=LIDE.find(x=>x.user_id===uid)||{};
  const back='<a href="#" onclick="openP('+uid+');return false;" style="color:#aac8ec;text-decoration:none">‹ Zpět na kartu</a>';
  const btn = edit
    ? '<span><a href="#" onclick="zakUdajeSave();return false;" style="color:#7fe0a0;font-weight:800;text-decoration:none">Uložit</a> &nbsp;·&nbsp; <a href="#" onclick="renderZU(false);return false;" style="color:#7f8ea0;text-decoration:none">Zrušit</a></span>'
    : '<a href="#" onclick="renderZU(true);return false;" style="color:#aac8ec;text-decoration:none">✏️ Upravit</a>';
  let h=pheadHTML(p)+
    '<div style="display:flex;justify-content:space-between;align-items:center;padding:10px 16px;border-top:1px solid #1e2730">'+
    '<span style="font-weight:800;color:#e8eef5">🧾 Základní údaje</span>'+
    '<span style="display:flex;gap:14px">'+back+btn+'</span></div>';
  for(const sec of (d.sections||[])){
    const rows=(sec.items||[]).map(it=>{
      let val;
      if(edit){
        const t = it.type==='date'?'date':'text';
        val='<input data-k="'+esc(it.key)+'" type="'+t+'" value="'+esc(it.value||'')+'" style="width:100%;box-sizing:border-box;background:#12181f;border:1px solid #233040;border-radius:6px;color:#e8eef5;padding:5px 8px;font:inherit">';
      } else { val=it.value?esc(it.value):'<span style="color:#5d6b7c">—</span>'; }
      return '<tr><td style="color:#7f8ea0;padding:5px 16px;white-space:nowrap;vertical-align:top">'+esc(it.label)+'</td><td style="padding:5px 16px;color:#e8eef5">'+val+'</td></tr>';
    }).join('');
    h+='<div style="margin:10px 0"><div style="font-weight:800;color:#e8eef5;padding:6px 16px;border-bottom:1px solid #233040">'+esc(sec.label)+'</div><table style="width:100%;border-collapse:collapse;font-size:13px">'+rows+'</table></div>';
  }
  if(!(d.sections||[]).length) h+='<div class="empty">Zaměstnanec zatím nemá vyplněné žádné základní údaje.</div>';
  det.innerHTML=h;
}
async function zakUdajeSave(){
  const values={};
  document.querySelectorAll('#det input[data-k]').forEach(i=>{ values[i.getAttribute('data-k')]=i.value; });
  const r=await fetch(API+'/app/hr/person/save',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify({uid:ZU_UID,values})});
  let d={}; try{ d=await r.json(); }catch(e){}
  if(!d.ok){ alert('Uložení selhalo: '+((d&&d.error)||r.status)); return; }
  zakUdaje();
}

// Šárka 21.7.2026: „Pracovní údaje" — poměry z /app/hr/person-work, editace pozice + poznámky.
let PU_DATA=null, PU_UID=null;
async function pracUdaje(){
  const uid=CUR_UID; if(!uid) return; PU_UID=uid;
  const det=document.getElementById('det');
  det.innerHTML='<div class="empty">Načítám…</div>';
  const d=await j(API+'/app/hr/person-work?uid='+uid);
  if(!d.ok){ det.innerHTML='<div style="padding:12px 16px"><a href="#" onclick="openP('+uid+');return false;" style="color:#aac8ec;text-decoration:none">‹ Zpět na kartu</a></div><div class="empty">🔒 '+esc(d.error||'nedostupné')+'</div>'; return; }
  PU_DATA=d; renderPU(false);
}
function renderPU(edit){
  const d=PU_DATA, uid=PU_UID, det=document.getElementById('det');
  const p=LIDE.find(x=>x.user_id===uid)||{};
  const back='<a href="#" onclick="openP('+uid+');return false;" style="color:#aac8ec;text-decoration:none">‹ Zpět na kartu</a>';
  const btn = edit
    ? '<span><a href="#" onclick="pracUdajeSave();return false;" style="color:#7fe0a0;font-weight:800;text-decoration:none">Uložit</a> &nbsp;·&nbsp; <a href="#" onclick="renderPU(false);return false;" style="color:#7f8ea0;text-decoration:none">Zrušit</a></span>'
    : '<a href="#" onclick="renderPU(true);return false;" style="color:#aac8ec;text-decoration:none">✏️ Upravit</a>';
  let h=pheadHTML(p)+
    '<div style="display:flex;justify-content:space-between;align-items:center;padding:10px 16px;border-top:1px solid #1e2730">'+
    '<span style="font-weight:800;color:#e8eef5">💼 Pracovní údaje</span>'+
    '<span style="display:flex;gap:14px">'+back+btn+'</span></div>';
  const rRO=(lab,val)=>'<tr><td style="color:#7f8ea0;padding:5px 16px;white-space:nowrap;vertical-align:top">'+lab+'</td><td style="padding:5px 16px;color:#e8eef5">'+(val?esc(val):'<span style="color:#5d6b7c">—</span>')+'</td></tr>';
  const rIN=(lab,k,val,eid)=>'<tr><td style="color:#7f8ea0;padding:5px 16px;white-space:nowrap;vertical-align:top">'+lab+'</td><td style="padding:5px 16px"><input data-eid="'+eid+'" data-k="'+k+'" value="'+esc(val||'')+'" style="width:100%;box-sizing:border-box;background:#12181f;border:1px solid #233040;border-radius:6px;color:#e8eef5;padding:5px 8px;font:inherit"></td></tr>';
  for(const po of (d.pomery||[])){
    let rows='';
    rows+=rRO('Typ poměru', po.typ);
    rows+=rRO('Druh smlouvy', po.druh);
    rows+=rRO('Smlouva od', po.smlouva_od);
    rows+=rRO('Smlouva do', po.smlouva_do || 'na dobu neurčitou');
    rows+=rRO('Zkušební doba do', po.zkusebni_do);
    rows+=rRO('Úvazek (h/týden)', po.uvazek);
    rows += edit ? rIN('Pozice','pozice',po.pozice,po.id) : rRO('Pozice', po.pozice);
    rows += edit ? rIN('Poznámka','note',po.note,po.id) : rRO('Poznámka', po.note);
    const audit=(po.zmenil||po.zmeneno)?'<div style="font-size:10.5px;color:#5d6b7c;padding:4px 16px 0">naposledy upravil: '+esc(po.zmenil||'—')+(po.zmeneno?(' · '+esc(po.zmeneno)):'')+'</div>':'';
    h+='<div style="margin:10px 0"><div style="font-weight:800;color:#e8eef5;padding:6px 16px;border-bottom:1px solid #233040">'+esc(po.firma)+' · '+esc(po.typ)+'</div><table style="width:100%;border-collapse:collapse;font-size:13px">'+rows+'</table>'+audit+'</div>';
  }
  if(!(d.pomery||[]).length) h+='<div class="empty">Žádný aktuální pracovní poměr.</div>';
  if(edit) h+='<div style="font-size:11px;color:#7f8ea0;padding:0 16px 12px">Editovat lze pozici a poznámku. Smluvní údaje a úvazek jsou napojené na mzdy — mění se přes mzdový modul, ať se nerozbijí výplaty.</div>';
  det.innerHTML=h;
}
async function pracUdajeSave(){
  const byE={};
  document.querySelectorAll('#det input[data-eid]').forEach(i=>{
    const eid=i.getAttribute('data-eid'); byE[eid]=byE[eid]||{id:parseInt(eid)};
    byE[eid][i.getAttribute('data-k')]=i.value;
  });
  for(const eid in byE){
    const r=await fetch(API+'/app/hr/person-work/save',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify(byE[eid])});
    let d={}; try{ d=await r.json(); }catch(e){}
    if(!d.ok){ alert('Uložení selhalo: '+((d&&d.error)||r.status)); return; }
  }
  pracUdaje();
}

// Šárka 21.7.2026: „Skupiny a kvalifikace" (jen čtení).
async function skupUdaje(){
  const uid=CUR_UID; if(!uid) return;
  const det=document.getElementById('det'); det.innerHTML='<div class="empty">Načítám…</div>';
  const d=await j(API+'/app/hr/person-groups?uid='+uid);
  const p=LIDE.find(x=>x.user_id===uid)||{};
  const back='<a href="#" onclick="openP('+uid+');return false;" style="color:#aac8ec;text-decoration:none">‹ Zpět na kartu</a>';
  let h=pheadHTML(p)+'<div style="display:flex;justify-content:space-between;align-items:center;padding:10px 16px;border-top:1px solid #1e2730"><span style="font-weight:800;color:#e8eef5">👥 Skupiny a kvalifikace</span>'+back+'</div>';
  if(!d.ok){ h+='<div class="empty">🔒 '+esc(d.error||'nedostupné')+'</div>'; }
  else if(!(d.skupiny||[]).length){ h+='<div class="empty">Zaměstnanec není zařazen v žádné skupině.</div>'; }
  else { h+='<div style="padding:12px 16px;display:flex;flex-wrap:wrap;gap:8px">'+d.skupiny.map(g=>'<span style="font-size:12px;padding:4px 12px;border-radius:20px;background:#16301f;color:#7fe0a0">'+esc(g)+'</span>').join('')+'</div>'; }
  det.innerHTML=h;
}

// Šárka 21.7.2026: „Přítomnost/absence" (jen čtení, posledních 50 žádostí).
async function absUdaje(){
  const uid=CUR_UID; if(!uid) return;
  const det=document.getElementById('det'); det.innerHTML='<div class="empty">Načítám…</div>';
  const d=await j(API+'/app/hr/person-absence?uid='+uid);
  const p=LIDE.find(x=>x.user_id===uid)||{};
  const back='<a href="#" onclick="openP('+uid+');return false;" style="color:#aac8ec;text-decoration:none">‹ Zpět na kartu</a>';
  let h=pheadHTML(p)+'<div style="display:flex;justify-content:space-between;align-items:center;padding:10px 16px;border-top:1px solid #1e2730"><span style="font-weight:800;color:#e8eef5">🏖️ Přítomnost / absence</span>'+back+'</div>';
  if(!d.ok){ h+='<div class="empty">🔒 '+esc(d.error||'nedostupné')+'</div>'; }
  else if(!(d.zaznamy||[]).length){ h+='<div class="empty">Žádné záznamy o absenci.</div>'; }
  else {
    const col=(st)=> (/schvál|approv|ukonc/i.test(st))?'#7fe0a0':(/pend|nov|žád/i.test(st)?'#E0A94A':'#cdd6e2');
    h+='<table style="width:100%;border-collapse:collapse;font-size:13px">'+
      '<tr><td style="color:#7f8ea0;padding:6px 16px">Typ</td><td style="color:#7f8ea0;padding:6px 16px">Od – do</td><td style="color:#7f8ea0;padding:6px 16px">Stav</td></tr>'+
      d.zaznamy.map(z=>'<tr style="border-top:1px solid #1e2730"><td style="padding:6px 16px;color:#e8eef5">'+esc(z.typ)+'</td><td style="padding:6px 16px;color:#e8eef5">'+esc(z.od)+(z.do?(' – '+esc(z.do)):'')+'</td><td style="padding:6px 16px;color:'+col(z.stav)+'">'+esc(z.stav)+'</td></tr>').join('')+'</table>';
  }
  det.innerHTML=h;
}
load();
</script>
