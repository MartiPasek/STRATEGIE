<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e0f11">
<link rel="manifest" href="/static/mobile-manifest.json">
<title>STRATEGIE Mobil</title>
<style>
  :root { --bg:#0e0f11; --surf:#16181c; --bord:#2a2d33; --tx:#e8eaf0; --mut:#8a96a4;
          --blue:#4f8ef7; --green:#10b981; --amber:#e0b070; --red:#e08a8a; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--tx); font-family:system-ui,sans-serif;
         padding:14px 14px 96px; -webkit-tap-highlight-color:transparent; }
  .topbar { display:flex; align-items:center; gap:10px; margin-bottom:6px; min-height:40px; }
  .back { font-size:22px; cursor:pointer; color:var(--tx); background:none; border:none; padding:6px 8px 6px 0; }
  .title { font-size:21px; font-weight:700; }
  .mode { font-size:11px; padding:3px 9px; border-radius:20px; margin-left:auto; }
  .mode.native { background:rgba(16,185,129,.15); color:#5ee0b7; border:1px solid #1f6b53; }
  .mode.web { background:rgba(79,142,247,.15); color:#9bc0fb; border:1px solid #2a4d80; }
  .mode.dev { background:rgba(224,176,112,.15); color:var(--amber); border:1px solid #6e5326; }
  .group { font-size:12px; color:var(--mut); text-transform:uppercase; letter-spacing:.04em; margin:18px 2px 4px; }
  .list { background:var(--surf); border:1px solid var(--bord); border-radius:12px; overflow:hidden; }
  .row { display:flex; align-items:center; gap:14px; padding:14px; border-bottom:1px solid #20262e; cursor:pointer; }
  .row:last-child { border-bottom:none; }
  .row .ic { font-size:20px; width:26px; text-align:center; }
  .row .tx { flex:1; min-width:0; } .row .tt { font-size:15px; } .row .sub { font-size:12px; color:var(--mut); margin-top:2px; }
  .row .chev { color:var(--mut); font-size:18px; }
  .row .rbadge { background:#e24b4a; color:#fff; font-size:11px; min-width:18px; height:18px; line-height:18px; border-radius:9px; padding:0 5px; text-align:center; font-weight:700; margin-right:6px; }
  .panel { margin-top:6px; }
  label { font-size:12px; color:var(--mut); display:block; margin:12px 2px 4px; }
  input { width:100%; background:#0f1620; border:1px solid var(--bord); border-radius:8px; padding:12px; color:var(--tx); font-size:15px; }
  button { background:var(--blue); border:none; color:#fff; border-radius:8px; padding:12px 14px; font-size:14px; font-weight:600; cursor:pointer; }
  button.full { width:100%; margin-top:12px; padding:13px; font-size:15px; }
  button.green { background:var(--green); } button.ghost { background:transparent; border:1px solid var(--bord); color:var(--tx); }
  button.warn { background:#3a1f24; border:1px solid #6e3540; color:var(--red); } button.sm { padding:8px 12px; font-size:13px; }
  .hint { font-size:12px; color:var(--mut); margin-top:10px; line-height:1.5; }
  .devinfo { margin-top:12px; padding:10px; border-radius:8px; background:rgba(224,176,112,.08); border:1px solid #6e5326; color:#e6c699; font-size:12.5px; line-height:1.5; }
  ul { list-style:none; padding:0; margin:0; } li { padding:12px 0; border-bottom:1px solid #20262e; font-size:14px; } li:last-child { border-bottom:none; }
  .nt { font-weight:600; } .nm { color:var(--mut); font-size:13px; margin:3px 0 9px; } .nactions { display:flex; gap:8px; flex-wrap:wrap; justify-content:flex-end; }
  .big { font-size:16px; padding:8px 2px; }
  .homebg { margin:-14px -14px -96px; min-height:100vh; border-radius:0; background:#1a2330 center top / cover no-repeat;
            display:flex; flex-direction:column; justify-content:flex-end;
            padding:18px 18px calc(92px + env(safe-area-inset-bottom,0)); }
  .homenotif { background:rgba(20,24,30,.86); border:1px solid #2a2d33; border-radius:12px; padding:12px; margin-bottom:10px; display:flex; align-items:center; gap:12px; cursor:pointer; }
  .homenotif .ic { font-size:22px; width:26px; text-align:center; } .homenotif .chev { color:var(--mut); font-size:18px; }
  .homebg .h1 { font-size:26px; font-weight:800; } .homebg .h2 { color:#cdd6e2; margin-top:4px; font-size:14px; }
  .homebg .h3 { color:#dfe7f0; margin-top:12px; font-size:15px; font-weight:600; }
  .bottomnav { position:fixed; left:0; right:0; bottom:0; display:flex; background:#121519; border-top:1px solid var(--bord); z-index:50; padding-bottom:env(safe-area-inset-bottom,0); }
  #navwrap { position:fixed; left:0; right:0; bottom:0; z-index:50; }
  .bnavstatic { position:static; padding-bottom:0; min-height:52px; }
  #navwrap > .bnavstatic:last-child { padding-bottom:env(safe-area-inset-bottom,0); }
  .tabbtn { position:relative; flex:1; background:none; border:none; color:var(--mut); padding:9px 2px; font-size:11px; display:flex; flex-direction:column; align-items:center; gap:3px; cursor:pointer; border-radius:10px; margin:3px 2px; }
  .tabbtn .i { font-size:21px; line-height:1; } .tabbtn.active { color:var(--blue); background:#262e3a; }
  .nbadge { position:absolute; top:3px; left:50%; margin-left:6px; background:#e24b4a; color:#fff; font-size:10px; min-width:16px; height:16px; line-height:16px; border-radius:8px; padding:0 4px; text-align:center; font-weight:600; }
  .appgrid { display:grid; grid-template-columns:repeat(4,1fr); gap:16px 6px; margin-top:12px; }
  .appcell { display:flex; flex-direction:column; align-items:center; gap:6px; cursor:pointer; position:relative; }
  .appicon { width:58px; height:58px; border-radius:15px; background:#16181c; border:1px solid #2a2d33; display:flex; align-items:center; justify-content:center; font-size:28px; overflow:hidden; }
  .appicon img { width:100%; height:100%; object-fit:cover; }
  .applabel { font-size:11px; text-align:center; color:#cdd6e2; line-height:1.2; }
  .appbadge { position:absolute; top:-4px; right:8px; background:#e24b4a; color:#fff; font-size:10px; min-width:16px; height:16px; line-height:16px; border-radius:8px; padding:0 4px; text-align:center; font-weight:600; }
  .dashgrid { display:grid; grid-template-columns:repeat(2,1fr); gap:12px; margin-top:8px; }
  .tile { background:var(--surf); border:1px solid var(--bord); border-radius:14px; padding:16px; cursor:pointer; min-height:92px; position:relative; }
  .tile-ic { font-size:26px; } .tile-tt { font-weight:600; margin-top:8px; } .tile-sub { color:var(--mut); font-size:12px; margin-top:3px; }
  .ct { border-bottom:1px solid #20262e; }
  .cthead { display:flex; align-items:center; gap:11px; padding:7px 4px; cursor:pointer; }
  .cav { width:38px; height:38px; border-radius:11px; flex-shrink:0; display:flex; align-items:center; justify-content:center; color:#0e1014; font-weight:700; font-size:15px; overflow:hidden; }
  .cav img { width:100%; height:100%; object-fit:cover; }
  .ctname { font-weight:600; font-size:14.5px; } .ctnum { color:var(--mut); font-size:12px; margin-top:1px; }
  .ctexp { padding:2px 4px 12px 53px; }
  .ctacts { display:flex; gap:14px; }
  .cact { width:38px; height:38px; border-radius:11px; display:flex; align-items:center; justify-content:center; cursor:pointer; }
  .cact svg { width:22px; height:22px; }
  .cact.call { background:#22c55e; } .cact.sms { background:#3b82f6; }
  /* Otevřený kontakt (accordion) — záznam ~o 30 % větší + jemné zvýraznění. */
  .ct.open { background:rgba(79,142,247,.07); border-radius:12px; }
  .ct.open .cthead { padding:11px 8px; gap:14px; }
  .ct.open .cav { width:50px; height:50px; border-radius:14px; font-size:19px; }
  .ct.open .ctname { font-size:18.5px; } .ct.open .ctnum { font-size:14px; }
  .ct.open .ctexp { padding-left:72px; }
  .ct.open .cact { width:46px; height:46px; border-radius:14px; }
  .ct.open .cact svg { width:26px; height:26px; }
  /* ── Desktop „telefonní rámeček" (Marti 7.6.2026) ─────────────────────
     Na PC (široké okno + myš) sevři appku do poměru telefonu 19,5:9
     (Samsung S24, 2340×1080) — šířka se odvodí z výšky okna, vycentrováno.
     Na mobilu se neaplikuje nic (media query pointer:fine + min-width). */
  @media (min-width: 700px) and (pointer: fine) {
    :root { --phone-w: min(100vw, calc(100vh * 9 / 19.5)); }
    html { background:#000; }
    body { max-width: var(--phone-w); margin: 0 auto;
           border-left:1px solid #2a2d33; border-right:1px solid #2a2d33;
           min-height:100vh; box-shadow:0 0 40px rgba(0,0,0,.55); }
    #navwrap { left:50%; right:auto; transform:translateX(-50%);
               width: var(--phone-w); }
  }
</style>
</head>
<body>
<script>
/* Bílá smrt → viditelná chyba (Marti 7.6.). Chytá i parse error dalšího scriptu. */
window.onerror=function(msg,src,line){
  try{
    var d=document.getElementById("bootErr");
    if(!d){ d=document.createElement("div");
      d.id="bootErr";
      d.style.cssText="position:fixed;top:10px;left:10px;right:10px;z-index:99999;background:#3a1f24;border:1px solid #6e3540;border-radius:10px;padding:12px;color:#e08a8a;font:13px/1.5 system-ui;";
      document.body.appendChild(d); }
    d.innerHTML="⚠ Appka narazila na chybu — pošli mi prosím screenshot:<br><b>"
      +String(msg).replace(/</g,"&lt;")+"</b><br>řádek "+line
      +'<br><button onclick="location.reload()" style="margin-top:8px;padding:8px 14px;border:none;border-radius:8px;background:#4f8ef7;color:#fff;">🔄 Zkusit znovu</button>';
  }catch(e){}
  return false;
};
</script>
<div id="app"></div>
<div id="navwrap">
  <nav class="bottomnav bnavstatic" id="bnavx1" style="display:none;"></nav>
  <nav class="bottomnav bnavstatic" id="bnavx2" style="display:none;"></nav>
  <nav class="bottomnav bnavstatic" id="bnav"></nav>
</div>
<script>
(function () {
  var B = window.STRATEGIE || null;
  var deferredPrompt = null;
  window.addEventListener("beforeinstallprompt", function (e) { e.preventDefault(); deferredPrompt = e; });
  if ("serviceWorker" in navigator) { try { navigator.serviceWorker.register("/mobile-sw.js", { scope: "/mobile" }); } catch (e) {} }

  var canDial = !!(B && (typeof B.dialNumber === "function" || typeof B.dial === "function"));
  var canListen = !!(B && typeof B.listening === "function");
  var canFetch = !!(B && typeof B.authedFetch === "function");
  var canSms = !!(B && typeof B.sendSms === "function" && typeof B.deviceId === "function");
  var native = canDial || canListen || canFetch;
  var ver = (B && typeof B.version === "function") ? (function(){try{return B.version();}catch(e){return "";}})() : "";

  var params = new URLSearchParams(location.search);
  if (params.get("dev") === "1") { try { localStorage.setItem("stg_mobile_dev","1"); } catch(e){} }
  if (params.get("dev") === "0") { try { localStorage.removeItem("stg_mobile_dev"); } catch(e){} }
  var DEV = false; try { DEV = localStorage.getItem("stg_mobile_dev") === "1"; } catch(e){}

  var app = document.getElementById("app");
  var bnav = document.getElementById("bnav");
  var bnavx1 = document.getElementById("bnavx1");
  var bnavx2 = document.getElementById("bnavx2");
  var navwrap = document.getElementById("navwrap");
  var curTab = "home";
  var stack = ["home"];
  var notifCount = null;
  var _hasUpdate = false;
  var _lastOk = 0;            // čas poslední úspěšné odezvy serveru (liveness)
  function markOk(){ _lastOk = Date.now(); }
  function refreshUpdate(){ try{ if(B&&typeof B.checkUpdate==="function"){ var t=B.checkUpdate(); var u=t?JSON.parse(t):null; _hasUpdate=!!(u&&u.has_update); } }catch(e){} }
  var avatarUrl = "/api/v1/erp/app/avatar";
  if (B && typeof B.avatarDataUrl === "function") { try { var d=B.avatarDataUrl(); if(d) avatarUrl=d; } catch(e){} }

  var CLAUDE_SVG='<svg width="26" height="26" viewBox="0 0 100 100"><g stroke="#d97757" stroke-width="8" stroke-linecap="round"><line x1="50" y1="50" x2="50" y2="8"/><line x1="50" y1="50" x2="71" y2="13.6"/><line x1="50" y1="50" x2="86.4" y2="29"/><line x1="50" y1="50" x2="92" y2="50"/><line x1="50" y1="50" x2="86.4" y2="71"/><line x1="50" y1="50" x2="71" y2="86.4"/><line x1="50" y1="50" x2="50" y2="92"/><line x1="50" y1="50" x2="29" y2="86.4"/><line x1="50" y1="50" x2="13.6" y2="71"/><line x1="50" y1="50" x2="8" y2="50"/><line x1="50" y1="50" x2="13.6" y2="29"/><line x1="50" y1="50" x2="29" y2="13.6"/></g></svg>';
  var PHONE_SVG='<svg width="22" height="22" viewBox="0 0 24 24" fill="#22c55e"><path d="M6.6 10.8c1.4 2.8 3.8 5.1 6.6 6.6l2.2-2.2c.3-.3.7-.4 1-.2 1.1.4 2.3.6 3.6.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1C10.6 21 3 13.4 3 4c0-.6.4-1 1-1h3.5c.6 0 1 .4 1 1 0 1.2.2 2.4.6 3.6.1.4 0 .8-.3 1.1l-2.2 2.1z"/></svg>';
  function esc(s){ return (s||"").replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c];}); }
  function el(html){ var d=document.createElement("div"); d.innerHTML=html.trim(); return d.firstChild; }
  function go(id){ stack.push(id); render(); }
  function back(){ if(stack.length>1){ stack.pop(); render(); } }
  function selectTab(t){ curTab=t; stack=[t]; render(); }
  // hardwarové zpět (nativní HybridActivity volá): vrať true když jsme šli o úroveň výš, false na home
  window.__stgBack=function(){
    // V kontaktech postupně: 1) odscrolluj nahoru, 2) smaž číslo ze zeleného pole,
    // 3) smaž filtr, teprve pak odejdi. Marti 6.6.2026.
    if(curTab==="contacts" && stack[stack.length-1]==="contacts"){
      var st=window.pageYOffset||document.documentElement.scrollTop||(document.body&&document.body.scrollTop)||0;
      if(st>10){ try{window.scrollTo({top:0,behavior:"smooth"});}catch(e){window.scrollTo(0,0);} return true; }
      if(_dialNum){ setDialNum(""); return true; }
      var sf=document.getElementById("ctsearch"); if(sf && sf.value && sf.value.length){ sf.value=""; try{renderContactsList();}catch(e){} return true; }
    }
    if(stack.length>1){ back(); return true; }
    if(curTab!=="home"){ selectTab("home"); return true; }
    return false;
  };
  // Spuštění přes ikonu v launcheru → vždy hlavní obrazovka (volá nativní onNewIntent).
  window.__stgHome=function(){ try{ selectTab("home"); }catch(e){} return true; };

  function api(method, path, body){
    if (canFetch){ try{ var t=B.authedFetch(method,path,body?JSON.stringify(body):""); return Promise.resolve(t?JSON.parse(t):null);}catch(e){return Promise.resolve(null);} }
    var o={method:method,credentials:"same-origin",headers:{}};
    if(body){o.headers["Content-Type"]="application/json";o.body=JSON.stringify(body);}
    return fetch(path,o).then(function(r){return r.ok?r.json():null;}).catch(function(){return null;});
  }
  function bjson(fn, arg){ try{ if(B && typeof B[fn]==="function"){ var t=B[fn](arg); return t?JSON.parse(t):null; } }catch(e){} return null; }
  function doDial(n){ if(B&&typeof B.dialNumber==="function")B.dialNumber(n); else if(B&&typeof B.dial==="function")B.dial(n); }
  function listenState(){ if(!canListen)return null; try{return B.listening()==="1";}catch(e){return null;} }
  function getPrefixes(){ try{ return localStorage.getItem("stg_prefixes") || "STR,EC"; }catch(e){ return "STR,EC"; } }
  function fmtCall(c){ var t={1:"příchozí",2:"odchozí",3:"zmeškaný"}[c.type]||"hovor"; var d=new Date(c.date); var ds=d.toLocaleDateString("cs")+" "+d.toLocaleTimeString("cs",{hour:"2-digit",minute:"2-digit"}); return t+" · "+ds+(c.duration?(" · "+c.duration+" s"):""); }
  function getBadges(){ try{ if(B&&typeof B.appBadges==="function"){ var t=B.appBadges(); return t?JSON.parse(t):null; } }catch(e){} return null; }
  var PHONE_SVG_W=PHONE_SVG.replace(/#22c55e/g,'#ffffff');
  var WA_SVG='<svg width="30" height="30" viewBox="0 0 32 32"><path d="M16 3C9.4 3 4 8.4 4 15c0 2.1.5 4.1 1.5 5.8L4 29l8.4-2.2A12 12 0 1 0 16 3z" fill="#25D366"/><path d="M12.2 9.2c-.25 0-.65.1-1 .5-.35.4-1.3 1.25-1.3 3s1.35 3.5 1.5 3.75c.2.25 2.6 4.15 6.4 5.65 3.15 1.25 3.8 1 4.5.95.7-.05 2.2-.9 2.5-1.75.3-.85.3-1.6.2-1.75-.1-.15-.35-.25-.75-.45-.4-.2-2.2-1.1-2.55-1.2-.35-.15-.6-.2-.85.2-.25.4-.95 1.2-1.15 1.45-.2.25-.45.3-.85.1-.4-.2-1.7-.65-3.2-2-.9-.8-1.55-1.85-1.75-2.25-.2-.4 0-.6.2-.8.2-.2.4-.45.6-.7.2-.25.25-.4.4-.7.1-.25.05-.5-.05-.7-.1-.2-.85-2.1-1.2-2.85-.3-.7-.6-.65-.85-.65z" fill="#fff"/></svg>';
  function avColor(s){ var h=0; for(var i=0;i<(s||"").length;i++) h=(h*31+s.charCodeAt(i))%360; return "hsl("+h+",42%,55%)"; }
  function fmtName(name,pfxCsv){ var pl=(pfxCsv||"").split(",").map(function(x){return x.trim();}); for(var i=0;i<pl.length;i++){ if(pl[i] && (name||"").indexOf(pl[i])===0){ return '<span style="color:#5ee0b7;font-weight:700;">'+esc(pl[i])+'</span>'+esc(name.slice(pl[i].length)); } } return esc(name); }

  function modeChip(){ var c=native?"native":"web", t=native?"appka":"prohlížeč"; if(DEV){c="dev";t="DEV";} return '<span class="mode '+c+'">'+t+'</span>'; }
  function topbar(title, withBack, noChip){ var b='<div class="topbar">'; if(withBack)b+='<button class="back" data-back>&#8592;</button>'; b+='<span class="title">'+esc(title)+'</span>'+(noChip?"":modeChip())+'</div>'; return b; }
  function row(ic, tt, sub, onclick, badge){ var bd=(badge&&badge>0)?'<div class="rbadge">'+(badge>99?"99+":badge)+'</div>':''; var r=el('<div class="row"><div class="ic">'+ic+'</div><div class="tx"><div class="tt">'+esc(tt)+'</div>'+(sub?'<div class="sub">'+esc(sub)+'</div>':'')+'</div>'+bd+'<div class="chev">&#8250;</div></div>'); r.addEventListener("click",onclick); return r; }

  // Znovupoužitelný potvrzovací dialog (využije i docházka). Marti 6.6.2026.
  function confirmDialog(title, msg, okLabel, onOk){
    var ov=el('<div style="position:fixed;inset:0;z-index:300;background:rgba(0,0,0,.62);display:flex;align-items:center;justify-content:center;padding:24px;"></div>');
    var card=el('<div style="background:#161b22;border:1px solid var(--bord);border-radius:14px;padding:20px;max-width:340px;width:100%;box-shadow:0 18px 50px rgba(0,0,0,.5);"></div>');
    card.innerHTML='<div style="font-size:17px;font-weight:700;margin-bottom:8px;">'+esc(title)+'</div>'
      +'<div style="color:#cdd6e2;font-size:14px;line-height:1.55;margin-bottom:18px;">'+esc(msg)+'</div>';
    var row=el('<div class="nactions"></div>');
    var no=el('<button class="ghost sm">Zrušit</button>'); no.addEventListener("click",function(){ try{ov.remove();}catch(e){} });
    var yes=el('<button class="green sm">'+esc(okLabel||"OK")+'</button>'); yes.addEventListener("click",function(){ try{ov.remove();}catch(e){} if(onOk)onOk(); });
    row.appendChild(no); row.appendChild(yes); card.appendChild(row); ov.appendChild(card);
    ov.addEventListener("click",function(e){ if(e.target===ov) ov.remove(); });
    document.body.appendChild(ov);
  }

  // Živý indikátor spojení s ERP (tep) — ukazuje, že párování žije a telefon odpovídá.
  function updateLive(){
    var e=document.getElementById("homeLive"); if(!e) return;
    var ls=listenState();
    if(ls===false){ e.innerHTML='🔴 Párování pozastaveno — ťukni na název pro spuštění'; return; }
    if(!_lastOk){ e.innerHTML='🟡 Připojuji se k ERP…'; return; }
    var s=Math.round((Date.now()-_lastOk)/1000);
    if(s<=15) e.innerHTML='🟢 Spojení s ERP <b>živé</b> · odezva před '+s+' s';
    else if(s<=60) e.innerHTML='🟡 Čekám na odezvu ('+s+' s)…';
    else e.innerHTML='🔴 Bez odezvy ('+s+' s) — zkontroluj párování';
  }

  // Karta „Zavolat z ERP" na hlavní obrazovce — když přijde vytočení (do ~2 min),
  // ukáže se i v appce (ne jen jako notifikace). Marti 6.6.2026.
  function showDialCard(){
    var box=document.getElementById("homeDialCard"); if(!box) return;
    var raw=""; try{ if(B&&typeof B.lastDial==="function") raw=B.lastDial()||""; }catch(e){}
    var d=null; try{ if(raw) d=JSON.parse(raw); }catch(e){}
    if(!d||!d.phone){ if(box.innerHTML)box.innerHTML=""; return; }
    if(box.getAttribute("data-ph")===d.phone) return; // už zobrazeno
    box.setAttribute("data-ph", d.phone);

  function dedupContacts(arr){
    var seen={}, out=[];
    (arr||[]).forEach(function(c){
      var k=_normNum(c.number);
      if(!k){ out.push(c); return; }
      if(seen[k]!==undefined){ var i=seen[k]; if(c.photo && !out[i].photo) out[i]=c; return; }
      seen[k]=out.length; out.push(c);

  function collSec(ulEl, title, defOpen, onToggle){

    function close(){ box.style.display="none"; head.querySelector(".cgch").textContent="▼"; li.style.borderColor="var(--bord)"; li.style.background="var(--surf)"; if(onToggle)onToggle(false); }
    function setOpen(o){
      if(o){ (ulEl._secs||[]).forEach(function(s){ if(s.box!==box) s.close(); }); }
      box.style.display=o?"block":"none"; head.querySelector(".cgch").textContent=o?"▲":"▼";
      li.style.borderColor=o?"#2a4d80":"var(--bord)"; li.style.background=o?"rgba(79,142,247,.07)":"var(--surf)";

  function fmtHM(h){ var m=Math.round(Number(h||0)*60); var hh=Math.floor(m/60), mm=m%60; return hh+":"+(mm<10?"0":"")+mm; }
  function dochLoad(){

      // Výběr rozsahu dat od–do do boxu → fn(od, do, btn)

      // Píchnutí na zakázku (Marti 7.6.): picker nad tenant.zakazka (⚙ sync_zakazky).
      function zakBuild(box){
        box.appendChild(el('<div class="hint" style="margin:4px 0 2px;">Najdi zakázku (číslo / název):</div>'));
        var si=el('<input placeholder="🔍 např. VR106… nebo název" autocomplete="off" style="margin-top:6px;">');

            res.innerHTML="";

      // Přímá zpráva (Marti 7.6.): text i audio, odpověď hned + notifikace.
      // Marti 7.6. večer: zelený rámeček „Jsem tu, tak povídej…", 🚀 + 🎙, scroll nahoru.
      function martiMsgBuild(box){
        var ta=el('<textarea rows="3" placeholder="Jsem tu, tak povídej…" style="width:100%;background:#0f1620;border:1px solid var(--green);box-shadow:0 0 0 2px rgba(16,185,129,.18);border-radius:10px;padding:11px;color:var(--tx);font-size:15px;font-family:inherit;"></textarea>');
        var brow=el('<div style="display:flex;gap:8px;margin-top:8px;"></div>');

        setTimeout(function(){ try{ box.scrollIntoView({behavior:"smooth",block:"start"}); }catch(e){} },60);
        var st=el('<div class="hint" style="margin-top:8px;"></div>');
        // Marti 7.6. večer: scrollovací okno odpovědi + polling — odpověď dorazí
        // PŘÍMO sem do menu, i když to trvá déle (notifikace je jen bonus).
        var reply=el('<div style="display:none;margin-top:10px;background:rgba(79,142,247,.08);border:1px solid #2a4d80;border-radius:10px;padding:12px;font-size:14px;line-height:1.5;white-space:pre-wrap;max-height:45vh;overflow-y:auto;"></div>');
        function busy(t){ st.textContent=t; }
        var mmAfter=0;
        function showReply(txt){
          send.disabled=false; rec.disabled=false;
          reply.style.display="block"; reply.textContent=txt; ta.value="";
          try{ reply.scrollIntoView({behavior:"smooth",block:"nearest"}); }catch(e){}
        }
        function doSend(payload){
          busy("💭 Tvoje Marti přemýšlí…"); send.disabled=true; rec.disabled=true;
          api("GET","/api/v1/erp/app/marti-message/last","").then(function(b0){ mmAfter=(b0&&b0.id)||0; });
          api("POST","/api/v1/erp/app/marti-message",payload).then(function(j){
            if(j&&j.ok){
              busy("✅ Odpovězeno");
              showReply((payload.audio_b64&&j.transcript?("🎙 Rozuměla jsem: „"+j.transcript+"“\n\n"):"")+(j.reply||""));
            } else if(j&&j.error){ send.disabled=false; rec.disabled=false; busy("✗ "+j.error); }
            else { busy("⏳ Trvá to déle — odpověď se ukáže tady v Docházce…"); _mmStartPoll(mmAfter); }
          }).catch(function(){ busy("⏳ Trvá to déle — odpověď se ukáže tady v Docházce…"); _mmStartPoll(mmAfter); });
        }
        send.addEventListener("click",function(){ var t=(ta.value||"").trim(); if(t) doSend({text:t}); });
        var recState=null;
        function fileFallback(){
          var fi=el('<input type="file" accept="audio/*" capture style="display:none;">');
          fi.addEventListener("change",function(){
            var f=fi.files&&fi.files[0]; if(!f)return;
            if(f.size>6*1024*1024){ busy("✗ Nahrávka je moc velká (max ~6 MB)."); return; }
            var fr=new FileReader();
            fr.onload=function(){ doSend({audio_b64:String(fr.result).split(",")[1],mime:f.type||"audio/m4a",filename:f.name||"audio"}); };
            fr.readAsDataURL(f);
          });
          box.appendChild(fi); fi.click();
        }
        rec.addEventListener("click",function(){
          if(recState){ try{recState.stop();}catch(e){} return; }
          if(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia&&window.MediaRecorder){
            navigator.mediaDevices.getUserMedia({audio:true}).then(function(stream){
              var chunks=[]; var mr=new MediaRecorder(stream);
              mr.ondataavailable=function(e){ if(e.data&&e.data.size)chunks.push(e.data); };
              mr.onstop=function(){
                stream.getTracks().forEach(function(t){t.stop();});
                rec.textContent="🎙"; recState=null;
                var blob=new Blob(chunks,{type:mr.mimeType||"audio/webm"});
                if(blob.size>6*1024*1024){ busy("✗ Nahrávka je moc dlouhá."); return; }
                var fr=new FileReader();
                fr.onload=function(){ doSend({audio_b64:String(fr.result).split(",")[1],mime:blob.type,filename:"mobil-audio.webm"}); };
                fr.readAsDataURL(blob);
              };
              mr.start(); recState=mr;
              rec.textContent="⏹"; busy("🔴 Nahrávám… (klepni ⏹)");
            }).catch(function(){ fileFallback(); });
          } else { fileFallback(); }
        });
        box.appendChild(ta);
        brow.appendChild(send); brow.appendChild(rec); box.appendChild(brow);

  function paskaLoad(y,m){

      }
      if(j&&j.error==="pin_not_set"){ paskaPinSetup(); return; }
      if(j&&(j.error==="pin_required"||j.error==="pin_wrong"||j.error==="pin_locked")){ paskaPinEntry(j); return; }
      if(!j||!j.ok){ box.innerHTML='<div class="hint">Pásku se nepodařilo načíst.</div>'; return; }
      if(!j.items||!j.items.length){ box.innerHTML='<div class="hint">'+esc(j.note||"Zatím žádné pásky.")+'</div>'; if(_dS&&_dS.paska)_dS.paska.val.textContent="—"; return; }
      var ps=j.periods||[]; var idx=-1;
      for(var i2=0;i2<ps.length;i2++){ if(ps[i2].y===j.y&&ps[i2].m===j.m){ idx=i2; break; } }
      var hd=el('<div style="display:flex;align-items:center;gap:8px;margin:2px 0 8px;"></div>');

      hd.appendChild(bNext);
      // periods jsou DESC: další v poli = starší
      bPrev.disabled = idx < 0 || idx >= ps.length-1;
      bNext.disabled = idx <= 0;
      bPrev.addEventListener("click",function(){ var p=ps[idx+1]; if(p) paskaLoad(p.y,p.m); });
      bNext.addEventListener("click",function(){ var p=ps[idx-1]; if(p) paskaLoad(p.y,p.m); });
      box.innerHTML=""; box.appendChild(hd);
      // Marti 7.6.: dvě firmy = DVĚ samostatné pásky, každá s plnou hlavičkou.

        var k=it.firma||"?";
        if(!firmy[k]){ firmy[k]={nazev:it.firma_nazev||k, items:[]}; poradi.push(k); }
        firmy[k].items.push(it);
      });
      var celkemVyplata=0;

        card.appendChild(el('<div class="hint" style="margin:2px 0 8px;">Výplatní páska · '+esc(j.jmeno||"")+' · '+esc(_CZ_MES[j.m]||j.m)+' '+j.y+'</div>'));
        // Marti 7.6.: lidská struktura — 1) co firma poskytla (vč. odvodů firmy)
        // 2) FIRMA DALA CELKEM (superhrubá) 3) červené srážky (sleva na dani +)
        // 4) zelená Výplata na účet. Klasifikace dle názvu — doladí Šárka.
        var dal=[], firmaOdvody=[], srazky=[], vyp=[];
        f.items.forEach(function(it){
          var n=(it.nazev||"").toLowerCase();
          if(it.kc===0 && !it.hod && !it.dny) return;          // nulové technické řádky skrýt
          if(n.substring(0,7)==="výplata"){ vyp.push(it); return; }
          if(n.indexOf("firma")>=0){ firmaOdvody.push(it); return; }  // odvody firmy → dolů červeně (Marti: „to je teprve síla")
          if(it.hruba || n.indexOf("paušál")>=0 || n.indexOf("pausal")>=0
             || n.indexOf("stravenk")>=0 || n.indexOf("benefit")>=0 || n.indexOf("náhrad")>=0
             || (!it.kc && (it.hod||it.dny))){ dal.push(it); return; }
          srazky.push(it);
        });
        function radek(it, mode){  // mode: 'plus' | 'minus' | 'sleva'
          var kc="";
          if(it.kc!=null){
            var v=Math.round(it.kc).toLocaleString("cs")+" Kč";
            kc = (mode==="minus") ? ("− "+v) : ((mode==="sleva") ? ("+ "+v) : v);
          }
          var col = (mode==="minus") ? "var(--red)" : ((mode==="sleva") ? "var(--green)" : "var(--tx)");
          var sub=(it.hod?(it.hod+" h"):"")+(it.dny?((it.hod?" · ":"")+it.dny+" dní"):"");
          return el('<li style="display:flex;justify-content:space-between;align-items:center;gap:8px;">'

            +'<span class="nm" style="margin:0;white-space:nowrap;color:'+col+';">'+esc(kc)+'</span></li>');
        }
        var ul=el('<ul></ul>');
        var superhruba=0;
        dal.forEach(function(it){ superhruba+=(it.kc||0); ul.appendChild(radek(it,"plus")); });
        firmaOdvody.forEach(function(it){ superhruba+=(it.kc||0); });  // do CELKEM patří, zobrazí se dole červeně
        ul.appendChild(el('<li style="display:flex;justify-content:space-between;align-items:center;gap:8px;background:rgba(79,142,247,.08);border-radius:8px;padding:12px 8px;">'
          +'<span class="nt" style="font-weight:700;font-size:13.5px;">🏢 Firma dala celkem (superhrubá)</span>'
          +'<span class="nm" style="margin:0;white-space:nowrap;font-weight:700;">'+Math.round(superhruba).toLocaleString("cs")+' Kč</span></li>'));
        firmaOdvody.forEach(function(it){ ul.appendChild(radek(it,"minus")); });
        srazky.forEach(function(it){
          var n=(it.nazev||"").toLowerCase();
          ul.appendChild(radek(it, n.indexOf("sleva")>=0 ? "sleva" : "minus"));
        });
        var vyplata=0;
        vyp.forEach(function(it){
          vyplata+=(it.kc||0);
          ul.appendChild(el('<li style="display:flex;justify-content:space-between;align-items:center;gap:8px;background:rgba(16,185,129,.10);border-radius:8px;padding:13px 8px;">'
            +'<span class="nt" style="font-weight:700;font-size:14px;">💚 '+esc(it.nazev)+'</span>'
            +'<span class="nm" style="margin:0;white-space:nowrap;font-weight:700;color:var(--green);font-size:15px;">'+Math.round(it.kc||0).toLocaleString("cs")+' Kč</span></li>'));
        });
        card.appendChild(ul);
        box.appendChild(card);
        celkemVyplata+=vyplata;
      });
      box.appendChild(el('<div class="hint">Zdroj: mzdový systém Helios (oficiální zúčtování).</div>'));
      // Marti 7.6. večer: částka do hlavičky sekce NEPATŘÍ (vidí ji i zamčená) — jen 🔓.
      if(_dS&&_dS.paska) _dS.paska.val.textContent="🔓";
    });
  }
  // Rozsah práce „od prvního píchnutí do posledního odpíchnutí" (Marti 7.6.).
  function _dochSpans(){
    var es=window._dochEntries||[];
    var today=new Date().toISOString().substr(0,10), yest=new Date(Date.now()-86400000).toISOString().substr(0,10);
    function mk(d,id){
      var e2=document.getElementById(id); if(!e2)return;
      var rows=es.filter(function(e){return e.d===d&&e.zac;});
      if(!rows.length){ e2.style.display="none"; return; }
      var zacs=rows.map(function(e){return e.zac;}).sort();
      var kons=rows.filter(function(e){return e.kon;}).map(function(e){return e.kon;}).sort();
      var act=rows.some(function(e){return e.is_active;});
      e2.style.display="";
      e2.innerHTML='Práce od <b style="color:var(--tx);">'+esc(zacs[0])+'</b>'
        +(act?' — <span style="color:var(--green);">běží</span>'
              :(kons.length?(' do <b style="color:var(--tx);">'+esc(kons[kons.length-1])+'</b>'):''));
    }
    mk(today,"dochSpanToday"); mk(yest,"dochSpanYest");
  }
  // ───── PŘIHLÁSIT JAKO (impersonace pro test docházky, Marti 7.6.) ─────
  function set_imp(){
    app.innerHTML=topbar("Přihlásit jako (test)", true);
    var p=el('<div class="panel"></div>');
    var st=el('<div class="hint" id="impSt" style="font-size:13.5px;">Zjišťuji stav…</div>'); p.appendChild(st);
    p.appendChild(el('<label>User ID, login, nebo z+ČísloZam (např. z370)</label>'));
    var inp=el('<input id="impUser" placeholder="např. 30 nebo z370" autocomplete="off">'); p.appendChild(inp);
    var go=el('<button class="green full">🎭 Přihlásit jako</button>');
    var bk=el('<button class="warn full" style="margin-top:8px;">Vrátit se k sobě</button>');
    function refresh(){
      api("GET","/api/v1/erp/app/impersonate/status","").then(function(j){
        var e=document.getElementById("impSt"); if(!e)return;
        if(!j||!j.ok){ e.textContent="Stav se nepodařilo načíst."; return; }
        if(j.active){ e.innerHTML='🎭 Právě jednáš jako <b>'+esc(j.active.target_name||String(j.active.target_id))+'</b> — Docházka ukazuje jeho data.'; }
        else if(!j.is_parent){ e.textContent="Tahle funkce je dostupná jen rodičům."; }
        else { e.textContent="Žádná aktivní impersonace — jednáš sám za sebe."; }
      });
    }
    go.addEventListener("click",function(){
      var q=(inp.value||"").trim(); if(!q)return; go.disabled=true;
      api("POST","/api/v1/erp/app/impersonate",{user:q}).then(function(j){
        go.disabled=false; var e=document.getElementById("impSt"); if(!e)return;
        if(j&&j.ok){ e.innerHTML='✅ Jednáš jako <b>'+esc(j.target_name||String(j.target_id))+'</b>. Otevři Docházku — uvidíš jeho data.'; inp.value=""; }
        else { e.textContent="✗ "+((j&&j.error)||"Nepodařilo se."); }
      });
    });
    bk.addEventListener("click",function(){
      bk.disabled=true;
      api("POST","/api/v1/erp/app/impersonate/stop",{}).then(function(){ bk.disabled=false; refresh(); });
    });
    p.appendChild(go); p.appendChild(bk);
    p.appendChild(el('<div class="hint">Pro testování docházky a práv. Vše se loguje do fw.impersonation_log (od–do, kdo, koho). Automaticky končí po 8 hodinách nebo tlačítkem výše.</div>'));
    app.appendChild(p); refresh();
  }
  function buildAbsForm(box){
    var today=new Date().toISOString().substr(0,10);
    var ist="width:100%;background:#0f1620;border:1px solid var(--bord);border-radius:8px;padding:11px;color:var(--tx);font-size:15px;margin-bottom:4px;";
    box.innerHTML='<label>Typ nepřítomnosti</label>'
      +'<select id="absType" style="'+ist+'"><option value="vacation">Dovolená</option>'
      +'<option value="homeoffice">🏠 Home office (hlášení dopředu)</option>'
      +'<option value="sick">Nemoc (PN)</option><option value="medical">Lékař</option>'
      +'<option value="family_care">OČR</option><option value="sickday">Sickday</option>'
      +'<option value="unpaid">Neplacené volno</option></select>'
      +'<label>Od</label><input type="date" id="absFrom" value="'+today+'" style="'+ist+'">'
      +'<label>Do (volitelně, jen pro celé dny)</label><input type="date" id="absTo" value="'+today+'" style="'+ist+'">'
      +'<label>Počet hodin (část dne — prázdné = celé dny po 8 h)</label><input type="number" step="0.5" min="0" id="absHours" placeholder="např. 1.5 (lékař)" style="'+ist+'">'
      +'<label>Poznámka (volitelné)</label><input id="absNote" placeholder="důvod…" style="'+ist+'">';
    var b=el('<button class="green full" style="margin-top:10px;">Odeslat ke schválení</button>');
    b.addEventListener("click",function(){
      var t=document.getElementById("absType").value, f=document.getElementById("absFrom").value,
          to=document.getElementById("absTo").value, n=document.getElementById("absNote").value,
          hv=(document.getElementById("absHours").value||"").trim();
      if(!f){ return; }
      var payload = hv ? {type_code:t,date_from:f,mode:"hours",hours:parseFloat(hv),note:n}
                       : {type_code:t,date_from:f,date_to:to,mode:"days",note:n};
      b.disabled=true; b.textContent="Odesílám…";
      api("POST","/api/v1/erp/app/attendance/absence",payload).then(function(j){
        if(j&&j.ok){ box.style.display="none"; box.innerHTML=""; dochListLoad(); alert("Nahlášeno ✓ ("+(j.created||0)+" pracovních dní)"); }
        else { b.disabled=false; b.textContent="Odeslat ke schválení"; alert("Nepodařilo se: "+((j&&j.error)||"")); }
      }).catch(function(){ b.disabled=false; b.textContent="Odeslat ke schválení"; });
    });
    box.appendChild(b);
  }
  var SCREENS={home:home,phone:phone,notifs:notifs,claudetasks:claudetasks,claudeDetail:claudeDetail,contacts:contacts,calllog:calllog,settings:settings,apps:apps,firma:firma,dochazka:dochazka,set_listen:set_listen,set_icons:set_icons,set_install:set_install,set_prefixes:set_prefixes,set_phone:set_phone,set_notifaccess:set_notifaccess,set_dev:set_dev,set_about:set_about,set_imp:set_imp};

  function navBtn(ic,lbl,active,fn,badge){ var b=el('<button class="tabbtn'+(active?" active":"")+'"><span class="i">'+ic+'</span>'+lbl+(badge?'<span class="nbadge">'+(badge>99?"99+":badge)+'</span>':'')+'</button>'); b.addEventListener("click",fn); return b; }
  function renderNav(){
    bnav.innerHTML="";
    var bd=getBadges();
    var atApps=(stack[stack.length-1]==="apps");
    var APPS_SVG='<svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><rect x="3" y="3" width="7" height="7" rx="2"/><rect x="14" y="3" width="7" height="7" rx="2"/><rect x="3" y="14" width="7" height="7" rx="2"/><rect x="14" y="14" width="7" height="7" rx="2"/></svg>';
    navwrap.style.display="";
    bnav.appendChild(navBtn("🏠","Domů",curTab==="home"&&!atApps,function(){selectTab("home");},0));
    // Badge Aplikace = notifikace (WA/SMS) + nová verze appky (Marti 7.6.: ať je update vidět z hlavního menu).
    bnav.appendChild(navBtn(APPS_SVG,"Aplikace",atApps,function(){ curTab="home"; stack=["home","apps"]; render(); },(((bd&&bd.total)||0)+(_hasUpdate?1:0))));
    bnav.appendChild(navBtn("🔔","Úkoly",curTab==="notifs",function(){selectTab("notifs");},notifCount||0));
    bnav.appendChild(navBtn("👤","Kontakty",curTab==="contacts",function(){selectTab("contacts");},0));
    bnav.appendChild(navBtn("🏢","Firma",curTab==="firma",function(){selectTab("firma");},0));
    // Na obrazovce Aplikace: dvě extra lišty nad základní; Nastavení vpravo v DOLNÍ extra liště.
    bnavx1.innerHTML=""; bnavx2.innerHTML="";
    if(atApps){
      // Marti 7.6.: dolní extra lišta = neviditelná mřížka 5 sekcí (jako hlavní nav)
      // → ⚙ Nastavení sedí přesně v 5. sekci, správně vycentrované.
      bnavx1.style.display="flex";
      bnavx2.style.display="grid"; bnavx2.style.gridTemplateColumns="repeat(5,1fr)"; bnavx2.style.justifyContent="";
      var setBtn=navBtn("⚙️","Nastavení",false,function(){selectTab("settings");},_hasUpdate?1:0);
      setBtn.style.gridColumn="5";
      bnavx2.appendChild(setBtn);
    } else { bnavx1.style.display="none"; bnavx2.style.display="none"; }
  }
  function render(){ (SCREENS[stack[stack.length-1]]||home)(); var b=app.querySelector("[data-back]"); if(b)b.addEventListener("click",back); renderNav(); }

  window.addEventListener("popstate", function(){ if(stack.length>1){ back(); try{history.pushState(null,"");}catch(e){} } });
  try{ history.pushState(null,""); }catch(e){}
  render();
  setTimeout(function(){ refreshUpdate(); renderNav(); }, 800);

  // Živé načítání úkolů — ať se nová notifikace objeví v appce sama (Marti 6.6.2026).
  function pollNotifs(){
    api("GET","/api/v1/erp/app/mobile/commands/pending","").then(function(j){
      if(j)markOk();
      var cmds=(j&&j.commands)||[]; var n=cmds.length; var changed=(n!==notifCount);
      notifCount=n; renderNav();
      // Obnov seznam jen na hlavní obrazovce nebo na záložce Úkoly (ne když je
      // uživatel zanořený v detailu) — žádné vyškubnutí z rozečtené zprávy.
      if(changed){
        var top=stack[stack.length-1];
        if((curTab==="home"&&stack.length===1)||top==="notifs"){ try{ render(); }catch(e){} }
      }
    }).catch(function(){});
  }
  setInterval(pollNotifs, 6000);
  setInterval(function(){ updateLive(); showDialCard(); }, 1000);
  // Při návratu do popředí (otevření z notifikace/launcheru) obnov hned.
  document.addEventListener("visibilitychange", function(){ if(!document.hidden){ refreshUpdate(); pollNotifs(); } });
  window.addEventListener("focus", function(){ refreshUpdate(); pollNotifs(); });

  // Auto-zachycení čísla telefonu ze SIM (Marti 6.6.) — ať se v párování číslo
  // ukáže samo, bez ručního kroku. Uloží jen když SIM číslo lze přečíst a změnilo se.
  function autoCapturePhone(){
    try{
      if(!(B&&typeof B.simNumber==="function"&&typeof B.deviceId==="function")) return;
      var sn=(B.simNumber()||"").trim();
      if(!sn || sn.replace(/[^0-9]/g,"").length<6) return;
      var last=""; try{last=localStorage.getItem("stg_saved_phone")||"";}catch(e){}
      if(sn===last) return;
      api("POST","/api/v1/erp/app/phone-set",{phone_number:sn,device_id:B.deviceId()}).then(function(j){
        if(j&&j.ok){ try{localStorage.setItem("stg_saved_phone",sn);}catch(e){} }
      }).catch(function(){});
    }catch(e){}
  }
  setTimeout(autoCapturePhone, 1500);

  // ── Nová verze → lišta nahoře, klik = HARD reload (Marti 7.6.) ──────────
  var _verLoaded=null;
  function _verHardReload(){
    var done=false; var fin=function(){ if(done)return; done=true; try{location.reload();}catch(e){location.href=location.pathname;} };
    try{
      var ps=[];
      if(window.caches&&caches.keys) ps.push(caches.keys().then(function(ks){ return Promise.all(ks.map(function(k){ return caches.delete(k); })); }));
      if(navigator.serviceWorker&&navigator.serviceWorker.getRegistrations) ps.push(navigator.serviceWorker.getRegistrations().then(function(rs){ return Promise.all(rs.map(function(r){ return r.update(); })); }));
      Promise.all(ps).then(fin,fin); setTimeout(fin,2500);
    }catch(e){ fin(); }
  }
  function _verTick(){
    try{
      fetch("/api/v1/erp/app-version",{cache:"no-store",credentials:"same-origin"})
        .then(function(r){ return r.ok?r.json():null; })
        .then(function(j){
          var v=j&&j.version; if(!v||v==="unknown")return;
          if(_verLoaded===null){ _verLoaded=v; return; }
          if(v!==_verLoaded && !document.getElementById("verBar")){
            var b=el('<div id="verBar" style="position:fixed;top:74px;left:10px;right:10px;z-index:90;background:#3a2f12;border:1px solid #6e5326;border-radius:10px;box-shadow:0 6px 18px rgba(0,0,0,.4);color:#f0d98a;padding:11px 14px;font-size:13.5px;text-align:center;cursor:pointer;">🔄 Nová verze STRATEGIE — klepni pro obnovení</div>');
            b.addEventListener("click",_verHardReload); document.body.appendChild(b);
          }
        }).catch(function(){});
    }catch(e){}
  }
  setInterval(_verTick, 30000); setTimeout(_verTick, 1200);
})();
</script>
