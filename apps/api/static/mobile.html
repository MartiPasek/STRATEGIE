<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>STRATEGIE Mobil</title>
<style>
  :root { --bg:#0e0f11; --surf:#16181c; --bord:#2a2d33; --tx:#e8eaf0; --mut:#8a96a4;
          --blue:#4f8ef7; --green:#10b981; --amber:#e0b070; --red:#e08a8a; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--tx); font-family:system-ui,sans-serif;
         padding:16px; -webkit-tap-highlight-color:transparent; }
  h1 { font-size:20px; font-weight:700; margin:4px 0 2px; }
  .badges { margin-bottom:14px; }
  .mode { display:inline-block; font-size:12px; padding:4px 10px; border-radius:20px; margin-right:6px; }
  .mode.native { background:rgba(16,185,129,.15); color:#5ee0b7; border:1px solid #1f6b53; }
  .mode.web { background:rgba(79,142,247,.15); color:#9bc0fb; border:1px solid #2a4d80; }
  .mode.dev { background:rgba(224,176,112,.15); color:var(--amber); border:1px solid #6e5326; }
  .card { background:var(--surf); border:1px solid var(--bord); border-radius:12px; padding:14px; margin-bottom:14px; }
  .card.devonly { border-style:dashed; border-color:#6e5326; }
  .card h2 { font-size:15px; margin:0 0 10px; font-weight:600; display:flex; justify-content:space-between; align-items:center; }
  label { font-size:12px; color:var(--mut); display:block; margin-bottom:4px; }
  input { width:100%; background:#0f1620; border:1px solid var(--bord); border-radius:8px;
          padding:11px; color:var(--tx); font-size:15px; margin-bottom:10px; }
  button { background:var(--blue); border:none; color:#fff; border-radius:8px;
           padding:11px 14px; font-size:14px; font-weight:600; cursor:pointer; }
  button.full { width:100%; padding:13px; font-size:15px; }
  button.green { background:var(--green); }
  button.ghost { background:transparent; border:1px solid var(--bord); color:var(--tx); }
  button.sm { padding:8px 12px; font-size:13px; }
  button.warn { background:#3a1f24; border:1px solid #6e3540; color:var(--red); }
  .hint { font-size:12px; color:var(--mut); margin-top:8px; }
  .devinfo { margin-top:10px; padding:10px; border-radius:8px; background:rgba(224,176,112,.08);
             border:1px solid #6e5326; color:#e6c699; font-size:12.5px; line-height:1.5; }
  .hidden { display:none; }
  ul { list-style:none; padding:0; margin:0; }
  li { padding:10px 0; border-bottom:1px solid #20262e; font-size:14px; }
  li:last-child { border-bottom:none; }
  .nt { font-weight:600; }
  .nm { color:var(--mut); font-size:13px; margin:3px 0 8px; }
  .nactions { display:flex; gap:8px; flex-wrap:wrap; }
  .appchip { display:flex; gap:8px; background:rgba(79,142,247,.1); border:1px solid #2a4d80;
             color:#9bc0fb; border-radius:10px; padding:10px 12px; font-size:13px; margin-bottom:14px; }
  .devtoggle { margin-top:18px; font-size:12px; color:var(--mut); text-align:center; }
  .devtoggle a { color:var(--amber); text-decoration:underline; cursor:pointer; }
</style>
</head>
<body>
  <h1>STRATEGIE Mobil</h1>
  <div class="badges">
    <span id="mode" class="mode web">prohlížeč (PWA)</span>
    <span id="devBadge" class="mode dev hidden">DEV mód</span>
  </div>

  <div id="appchip" class="appchip hidden">📲 Telefonní funkce (vytáčení) jsou v appce STRATEGIE.</div>

  <div class="card hidden" id="phoneCard">
    <h2>📞 Telefon</h2>
    <label>Telefonní číslo</label>
    <input id="num" type="tel" inputmode="tel" placeholder="+420…" value="+420">
    <button id="dial" class="green full">Vytočit</button>
    <div class="hint">Nativní only — vytočí přes most v appce.</div>
    <div id="dialInfo" class="devinfo hidden"></div>
  </div>

  <div class="card hidden" id="listenCard">
    <h2>🟢 Naslouchání</h2>
    <div id="listenState" style="font-size:14px;">—</div>
    <button id="listenBtn" class="ghost sm" style="margin-top:10px;">Zjistit stav</button>
    <div id="listenInfo" class="devinfo hidden"></div>
  </div>

  <div class="card">
    <h2>🔔 Notifikace / úkoly <button id="refresh" class="ghost sm">Obnovit</button></h2>
    <ul id="notifs"><li style="color:var(--mut);border:none;">Načítám…</li></ul>
  </div>

  <div class="devtoggle">
    <span id="devLabel"></span> · <a id="devLink"></a>
  </div>

<script>
(function () {
  var B = window.STRATEGIE || null;
  var canDial = !!(B && (typeof B.dialNumber === "function" || typeof B.dial === "function"));
  var canListen = !!(B && typeof B.listening === "function");
  var canFetch = !!(B && typeof B.authedFetch === "function");
  var native = canDial || canListen || canFetch;

  var params = new URLSearchParams(location.search);
  if (params.get("dev") === "1") { try { localStorage.setItem("stg_mobile_dev", "1"); } catch (e) {} }
  if (params.get("dev") === "0") { try { localStorage.removeItem("stg_mobile_dev"); } catch (e) {} }
  var DEV = false; try { DEV = localStorage.getItem("stg_mobile_dev") === "1"; } catch (e) {}

  var modeEl = document.getElementById("mode");
  if (native) { modeEl.textContent = "appka (nativní funkce aktivní)"; modeEl.className = "mode native"; }
  if (DEV) document.getElementById("devBadge").classList.remove("hidden");

  function showInfo(el, t) { el.textContent = t; el.classList.remove("hidden"); }
  function esc(s) { return (s || "").replace(/[&<>"]/g, function (c) {
    return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }

  // ── Unifikovaný API: v appce přes most (token v headeru), v prohlížeči přes cookie ──
  function api(method, path, body) {
    if (canFetch) {
      try {
        var txt = B.authedFetch(method, path, body ? JSON.stringify(body) : "");
        return Promise.resolve(txt ? JSON.parse(txt) : null);
      } catch (e) { return Promise.resolve(null); }
    }
    var opt = { method: method, credentials: "same-origin", headers: {} };
    if (body) { opt.headers["Content-Type"] = "application/json"; opt.body = JSON.stringify(body); }
    return fetch(path, opt).then(function (r) { return r.ok ? r.json() : null; }).catch(function () { return null; });
  }

  function doDial(n) {
    if (B && typeof B.dialNumber === "function") B.dialNumber(n);
    else if (B && typeof B.dial === "function") B.dial(n);
  }

  // ── Telefon (most NEBO DEV) ──
  if (canDial || DEV) {
    var pc = document.getElementById("phoneCard"); pc.classList.remove("hidden");
    if (DEV && !canDial) pc.classList.add("devonly");
    document.getElementById("dial").addEventListener("click", function () {
      var n = (document.getElementById("num").value || "").trim(); if (!n) return;
      if (canDial) {
        doDial(n);
        if (DEV) showInfo(document.getElementById("dialInfo"),
          "✓ Most: dialNumber(\"" + n + "\") → ACTION_DIAL otevře dialer s číslem.");
      } else {
        showInfo(document.getElementById("dialInfo"),
          "DEV (bez mostu): dialNumber(\"" + n + "\") → v appce spustí ACTION_DIAL (dialer s předvyplněným číslem). Nativní-only.");
      }
    });
  }

  // ── Naslouchání (most NEBO DEV) ──
  if (canListen || DEV) {
    var lc = document.getElementById("listenCard"); lc.classList.remove("hidden");
    if (DEV && !canListen) lc.classList.add("devonly");
    var ls = document.getElementById("listenState");
    if (canListen) { try { ls.textContent = B.listening() === "1" ? "Zapnuto ✓" : "Vypnuto"; } catch (e) {} }
    else { ls.textContent = "(zjistí se přes most v appce)"; }
    document.getElementById("listenBtn").addEventListener("click", function () {
      if (canListen) {
        try { ls.textContent = B.listening() === "1" ? "Zapnuto ✓" : "Vypnuto"; } catch (e) {}
        if (DEV) showInfo(document.getElementById("listenInfo"), "✓ Most: listening() → stav služby naslouchání vytáčení.");
      } else {
        showInfo(document.getElementById("listenInfo"),
          "DEV (bez mostu): listening() → vrátí, jestli v appce běží služba naslouchání vytáčení z ERP.");
      }
    });
  }

  if (!native && !DEV) document.getElementById("appchip").classList.remove("hidden");

  // ── Notifikace / úkoly (reálná data; v appce token, v prohlížeči cookie) ──
  function act(id, decision) { api("POST", "/api/v1/erp/app/command/" + id + "/result", { decision: decision }).then(loadNotifs); }

  function renderCmd(c) {
    var li = document.createElement("li");
    var h = '<div class="nt">' + esc(c.title || "Notifikace") + '</div>';
    if (c.message) h += '<div class="nm">' + esc(c.message) + '</div>';
    h += '<div class="nactions"></div>';
    li.innerHTML = h;
    var a = li.querySelector(".nactions");
    function btn(label, cls, dec) {
      var b = document.createElement("button"); b.className = "sm " + cls; b.textContent = label;
      b.addEventListener("click", function () { act(c.id, dec); }); a.appendChild(b);
    }
    if (c.command_type === "claude_confirm") { btn("Povolit", "green", "accept"); btn("Odmítnout", "warn", "reject"); }
    else { btn("OK", "ghost", "done"); }
    return li;
  }

  function loadNotifs() {
    var ul = document.getElementById("notifs");
    api("GET", "/api/v1/erp/app/mobile/commands/pending", "").then(function (j) {
      if (!j) { ul.innerHTML = '<li style="color:var(--mut);border:none;">Přihlas se (prohlížeč) nebo otevři v appce.</li>'; return; }
      var cmds = j.commands || [];
      if (!cmds.length) { ul.innerHTML = '<li style="color:var(--mut);border:none;">Žádné čekající notifikace ✓</li>'; return; }
      ul.innerHTML = ""; cmds.forEach(function (c) { ul.appendChild(renderCmd(c)); });
    });
  }
  document.getElementById("refresh").addEventListener("click", loadNotifs);
  loadNotifs();

  // ── Přepínač DEV/Production ──
  document.getElementById("devLabel").textContent = DEV ? "DEV mód zapnutý" : "Production mód";
  var link = document.getElementById("devLink");
  link.textContent = DEV ? "přepnout na Production" : "zapnout DEV mód";
  link.addEventListener("click", function () {
    try { if (DEV) localStorage.removeItem("stg_mobile_dev"); else localStorage.setItem("stg_mobile_dev", "1"); } catch (e) {}
    location.href = location.pathname;
  });
})();
</script>
</body>
</html>
