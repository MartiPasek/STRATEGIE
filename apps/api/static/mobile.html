<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e0f11">
<link rel="manifest" href="/static/mobile-manifest.json">
<title>STRATEGIE Mobil</title>
<style>
  :root { --bg:#0e0f11; --surf:#16181c; --bord:#2a2d33; --tx:#e8eaf0; --mut:#8a96a4;
          --blue:#4f8ef7; --green:#10b981; --amber:#e0b070; --red:#e08a8a; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--tx); font-family:system-ui,sans-serif;
         padding:14px 14px 78px; -webkit-tap-highlight-color:transparent; }
  .topbar { display:flex; align-items:center; gap:10px; margin-bottom:6px; min-height:40px; }
  .back { font-size:22px; cursor:pointer; color:var(--tx); background:none; border:none; padding:6px 8px 6px 0; }
  .title { font-size:21px; font-weight:700; }
  .mode { font-size:11px; padding:3px 9px; border-radius:20px; margin-left:auto; }
  .mode.native { background:rgba(16,185,129,.15); color:#5ee0b7; border:1px solid #1f6b53; }
  .mode.web { background:rgba(79,142,247,.15); color:#9bc0fb; border:1px solid #2a4d80; }
  .mode.dev { background:rgba(224,176,112,.15); color:var(--amber); border:1px solid #6e5326; }
  .group { font-size:12px; color:var(--mut); text-transform:uppercase; letter-spacing:.04em; margin:18px 2px 4px; }
  .list { background:var(--surf); border:1px solid var(--bord); border-radius:12px; overflow:hidden; }
  .row { display:flex; align-items:center; gap:14px; padding:14px; border-bottom:1px solid #20262e; cursor:pointer; }
  .row:last-child { border-bottom:none; }
  .row .ic { font-size:20px; width:26px; text-align:center; }
  .row .tx { flex:1; min-width:0; } .row .tt { font-size:15px; } .row .sub { font-size:12px; color:var(--mut); margin-top:2px; }
  .row .chev { color:var(--mut); font-size:18px; }
  .row .rbadge { background:#e24b4a; color:#fff; font-size:11px; min-width:18px; height:18px; line-height:18px; border-radius:9px; padding:0 5px; text-align:center; font-weight:700; margin-right:6px; }
  .panel { margin-top:6px; }
  label { font-size:12px; color:var(--mut); display:block; margin:12px 2px 4px; }
  input { width:100%; background:#0f1620; border:1px solid var(--bord); border-radius:8px; padding:12px; color:var(--tx); font-size:15px; }
  button { background:var(--blue); border:none; color:#fff; border-radius:8px; padding:12px 14px; font-size:14px; font-weight:600; cursor:pointer; }
  button.full { width:100%; margin-top:12px; padding:13px; font-size:15px; }
  button.green { background:var(--green); } button.ghost { background:transparent; border:1px solid var(--bord); color:var(--tx); }
  button.warn { background:#3a1f24; border:1px solid #6e3540; color:var(--red); } button.sm { padding:8px 12px; font-size:13px; }
  .hint { font-size:12px; color:var(--mut); margin-top:10px; line-height:1.5; }
  .devinfo { margin-top:12px; padding:10px; border-radius:8px; background:rgba(224,176,112,.08); border:1px solid #6e5326; color:#e6c699; font-size:12.5px; line-height:1.5; }
  ul { list-style:none; padding:0; margin:0; } li { padding:12px 0; border-bottom:1px solid #20262e; font-size:14px; } li:last-child { border-bottom:none; }
  .nt { font-weight:600; } .nm { color:var(--mut); font-size:13px; margin:3px 0 9px; } .nactions { display:flex; gap:8px; flex-wrap:wrap; justify-content:flex-end; }
  .big { font-size:16px; padding:8px 2px; }
  .homebg { margin:-14px -14px -78px; min-height:100vh; border-radius:0; background:#1a2330 center top / cover no-repeat;
            display:flex; flex-direction:column; justify-content:flex-end;
            padding:18px 18px calc(92px + env(safe-area-inset-bottom,0)); }
  .homenotif { background:rgba(20,24,30,.86); border:1px solid #2a2d33; border-radius:12px; padding:12px; margin-bottom:10px; display:flex; align-items:center; gap:12px; cursor:pointer; }
  .homenotif .ic { font-size:22px; width:26px; text-align:center; } .homenotif .chev { color:var(--mut); font-size:18px; }
  .homebg .h1 { font-size:26px; font-weight:800; } .homebg .h2 { color:#cdd6e2; margin-top:4px; font-size:14px; }
  .homebg .h3 { color:#dfe7f0; margin-top:12px; font-size:15px; font-weight:600; }
  .bottomnav { position:fixed; left:0; right:0; bottom:0; display:flex; background:#121519; border-top:1px solid var(--bord); z-index:50; padding-bottom:env(safe-area-inset-bottom,0); }
  .tabbtn { position:relative; flex:1; background:none; border:none; color:var(--mut); padding:9px 2px; font-size:11px; display:flex; flex-direction:column; align-items:center; gap:3px; cursor:pointer; }
  .tabbtn .i { font-size:21px; line-height:1; } .tabbtn.active { color:var(--blue); }
  .nbadge { position:absolute; top:3px; left:50%; margin-left:6px; background:#e24b4a; color:#fff; font-size:10px; min-width:16px; height:16px; line-height:16px; border-radius:8px; padding:0 4px; text-align:center; font-weight:600; }
  .appgrid { display:grid; grid-template-columns:repeat(4,1fr); gap:16px 6px; margin-top:12px; }
  .appcell { display:flex; flex-direction:column; align-items:center; gap:6px; cursor:pointer; position:relative; }
  .appicon { width:58px; height:58px; border-radius:15px; background:#16181c; border:1px solid #2a2d33; display:flex; align-items:center; justify-content:center; font-size:28px; overflow:hidden; }
  .appicon img { width:100%; height:100%; object-fit:cover; }
  .applabel { font-size:11px; text-align:center; color:#cdd6e2; line-height:1.2; }
  .appbadge { position:absolute; top:-4px; right:8px; background:#e24b4a; color:#fff; font-size:10px; min-width:16px; height:16px; line-height:16px; border-radius:8px; padding:0 4px; text-align:center; font-weight:600; }
  .dashgrid { display:grid; grid-template-columns:repeat(2,1fr); gap:12px; margin-top:8px; }
  .tile { background:var(--surf); border:1px solid var(--bord); border-radius:14px; padding:16px; cursor:pointer; min-height:92px; position:relative; }
  .tile-ic { font-size:26px; } .tile-tt { font-weight:600; margin-top:8px; } .tile-sub { color:var(--mut); font-size:12px; margin-top:3px; }
  .ct { border-bottom:1px solid #20262e; }
  .cthead { display:flex; align-items:center; gap:14px; padding:12px 4px; cursor:pointer; }
  .cav { width:46px; height:46px; border-radius:14px; flex-shrink:0; display:flex; align-items:center; justify-content:center; color:#0e1014; font-weight:700; font-size:18px; overflow:hidden; }
  .cav img { width:100%; height:100%; object-fit:cover; }
  .ctname { font-weight:600; font-size:16px; } .ctnum { color:var(--mut); font-size:13px; margin-top:2px; }
  .ctexp { padding:2px 4px 16px 60px; }
  .ctacts { display:flex; gap:20px; }
  .cact { width:48px; height:48px; border-radius:50%; display:flex; align-items:center; justify-content:center; cursor:pointer; }
  .cact.call { background:#22c55e; } .cact.sms { background:#3b82f6; }
</style>
</head>
<body>
<div id="app"></div>
<nav class="bottomnav" id="bnav"></nav>
<script>
(function () {
  var B = window.STRATEGIE || null;
  var deferredPrompt = null;
  window.addEventListener("beforeinstallprompt", function (e) { e.preventDefault(); deferredPrompt = e; });
  if ("serviceWorker" in navigator) { try { navigator.serviceWorker.register("/mobile-sw.js", { scope: "/mobile" }); } catch (e) {} }

  var canDial = !!(B && (typeof B.dialNumber === "function" || typeof B.dial === "function"));
  var canListen = !!(B && typeof B.listening === "function");
  var canFetch = !!(B && typeof B.authedFetch === "function");
  var native = canDial || canListen || canFetch;
  var ver = (B && typeof B.version === "function") ? (function(){try{return B.version();}catch(e){return "";}})() : "";

  var params = new URLSearchParams(location.search);
  if (params.get("dev") === "1") { try { localStorage.setItem("stg_mobile_dev","1"); } catch(e){} }
  if (params.get("dev") === "0") { try { localStorage.removeItem("stg_mobile_dev"); } catch(e){} }
  var DEV = false; try { DEV = localStorage.getItem("stg_mobile_dev") === "1"; } catch(e){}

  var app = document.getElementById("app");
  var bnav = document.getElementById("bnav");
  var curTab = "home";
  var stack = ["home"];
  var notifCount = null;
  var _hasUpdate = false;
  function refreshUpdate(){ try{ if(B&&typeof B.checkUpdate==="function"){ var t=B.checkUpdate(); var u=t?JSON.parse(t):null; _hasUpdate=!!(u&&u.has_update); } }catch(e){} }
  var avatarUrl = "/api/v1/erp/app/avatar";
  if (B && typeof B.avatarDataUrl === "function") { try { var d=B.avatarDataUrl(); if(d) avatarUrl=d; } catch(e){} }

  var CLAUDE_SVG='<svg width="26" height="26" viewBox="0 0 100 100"><g stroke="#d97757" stroke-width="8" stroke-linecap="round"><line x1="50" y1="50" x2="50" y2="8"/><line x1="50" y1="50" x2="71" y2="13.6"/><line x1="50" y1="50" x2="86.4" y2="29"/><line x1="50" y1="50" x2="92" y2="50"/><line x1="50" y1="50" x2="86.4" y2="71"/><line x1="50" y1="50" x2="71" y2="86.4"/><line x1="50" y1="50" x2="50" y2="92"/><line x1="50" y1="50" x2="29" y2="86.4"/><line x1="50" y1="50" x2="13.6" y2="71"/><line x1="50" y1="50" x2="8" y2="50"/><line x1="50" y1="50" x2="13.6" y2="29"/><line x1="50" y1="50" x2="29" y2="13.6"/></g></svg>';
  var PHONE_SVG='<svg width="22" height="22" viewBox="0 0 24 24" fill="#22c55e"><path d="M6.6 10.8c1.4 2.8 3.8 5.1 6.6 6.6l2.2-2.2c.3-.3.7-.4 1-.2 1.1.4 2.3.6 3.6.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1C10.6 21 3 13.4 3 4c0-.6.4-1 1-1h3.5c.6 0 1 .4 1 1 0 1.2.2 2.4.6 3.6.1.4 0 .8-.3 1.1l-2.2 2.1z"/></svg>';
  function esc(s){ return (s||"").replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c];}); }
  function el(html){ var d=document.createElement("div"); d.innerHTML=html.trim(); return d.firstChild; }
  function go(id){ stack.push(id); render(); }
  function back(){ if(stack.length>1){ stack.pop(); render(); } }
  function selectTab(t){ curTab=t; stack=[t]; render(); }
  // hardwarové zpět (nativní HybridActivity volá): vrať true když jsme šli o úroveň výš, false na home
  window.__stgBack=function(){ if(stack.length>1){ back(); return true; } if(curTab!=="home"){ selectTab("home"); return true; } return false; };
  // Spuštění přes ikonu v launcheru → vždy hlavní obrazovka (volá nativní onNewIntent).
  window.__stgHome=function(){ try{ selectTab("home"); }catch(e){} return true; };

  function api(method, path, body){
    if (canFetch){ try{ var t=B.authedFetch(method,path,body?JSON.stringify(body):""); return Promise.resolve(t?JSON.parse(t):null);}catch(e){return Promise.resolve(null);} }
    var o={method:method,credentials:"same-origin",headers:{}};
    if(body){o.headers["Content-Type"]="application/json";o.body=JSON.stringify(body);}
    return fetch(path,o).then(function(r){return r.ok?r.json():null;}).catch(function(){return null;});
  }
  function bjson(fn, arg){ try{ if(B && typeof B[fn]==="function"){ var t=B[fn](arg); return t?JSON.parse(t):null; } }catch(e){} return null; }
  function doDial(n){ if(B&&typeof B.dialNumber==="function")B.dialNumber(n); else if(B&&typeof B.dial==="function")B.dial(n); }
  function listenState(){ if(!canListen)return null; try{return B.listening()==="1";}catch(e){return null;} }
  function getPrefixes(){ try{ return localStorage.getItem("stg_prefixes") || "STR,EC"; }catch(e){ return "STR,EC"; } }
  function fmtCall(c){ var t={1:"příchozí",2:"odchozí",3:"zmeškaný"}[c.type]||"hovor"; var d=new Date(c.date); var ds=d.toLocaleDateString("cs")+" "+d.toLocaleTimeString("cs",{hour:"2-digit",minute:"2-digit"}); return t+" · "+ds+(c.duration?(" · "+c.duration+" s"):""); }
  function getBadges(){ try{ if(B&&typeof B.appBadges==="function"){ var t=B.appBadges(); return t?JSON.parse(t):null; } }catch(e){} return null; }
  var PHONE_SVG_W=PHONE_SVG.replace(/#22c55e/g,'#ffffff');
  var WA_SVG='<svg width="30" height="30" viewBox="0 0 32 32"><path d="M16 3C9.4 3 4 8.4 4 15c0 2.1.5 4.1 1.5 5.8L4 29l8.4-2.2A12 12 0 1 0 16 3z" fill="#25D366"/><path d="M12.2 9.2c-.25 0-.65.1-1 .5-.35.4-1.3 1.25-1.3 3s1.35 3.5 1.5 3.75c.2.25 2.6 4.15 6.4 5.65 3.15 1.25 3.8 1 4.5.95.7-.05 2.2-.9 2.5-1.75.3-.85.3-1.6.2-1.75-.1-.15-.35-.25-.75-.45-.4-.2-2.2-1.1-2.55-1.2-.35-.15-.6-.2-.85.2-.25.4-.95 1.2-1.15 1.45-.2.25-.45.3-.85.1-.4-.2-1.7-.65-3.2-2-.9-.8-1.55-1.85-1.75-2.25-.2-.4 0-.6.2-.8.2-.2.4-.45.6-.7.2-.25.25-.4.4-.7.1-.25.05-.5-.05-.7-.1-.2-.85-2.1-1.2-2.85-.3-.7-.6-.65-.85-.65z" fill="#fff"/></svg>';
  function avColor(s){ var h=0; for(var i=0;i<(s||"").length;i++) h=(h*31+s.charCodeAt(i))%360; return "hsl("+h+",42%,55%)"; }
  function fmtName(name,pfxCsv){ var pl=(pfxCsv||"").split(",").map(function(x){return x.trim();}); for(var i=0;i<pl.length;i++){ if(pl[i] && (name||"").indexOf(pl[i])===0){ return '<span style="color:#5ee0b7;font-weight:700;">'+esc(pl[i])+'</span>'+esc(name.slice(pl[i].length)); } } return esc(name); }

  function modeChip(){ var c=native?"native":"web", t=native?"appka":"prohlížeč"; if(DEV){c="dev";t="DEV";} return '<span class="mode '+c+'">'+t+'</span>'; }
  function topbar(title, withBack){ var b='<div class="topbar">'; if(withBack)b+='<button class="back" data-back>&#8592;</button>'; b+='<span class="title">'+esc(title)+'</span>'+modeChip()+'</div>'; return b; }
  function row(ic, tt, sub, onclick, badge){ var bd=(badge&&badge>0)?'<div class="rbadge">'+(badge>99?"99+":badge)+'</div>':''; var r=el('<div class="row"><div class="ic">'+ic+'</div><div class="tx"><div class="tt">'+esc(tt)+'</div>'+(sub?'<div class="sub">'+esc(sub)+'</div>':'')+'</div>'+bd+'<div class="chev">&#8250;</div></div>'); r.addEventListener("click",onclick); return r; }

  // ───── DOMŮ (pozadí = fotka Marti-AI) ─────
  function home(){
    app.innerHTML = "";
    var ls = listenState();
    var bg = el('<div class="homebg"></div>');
    bg.style.backgroundImage = "linear-gradient(rgba(14,15,17,.05), rgba(14,15,17,.86)), url('"+avatarUrl+"')";
    bg.innerHTML = '<div id="homeNotifsWrap"></div>'
      + '<div class="h1">STRATEGIE Mobil</div>'
      + '<div class="h2">'+(native?"Nativní appka":"Prohlížeč (PWA)")+(DEV?" · DEV":"")+'</div>'
      + '<div class="h3">'+(ls==null?"":(ls?"🟢 Párování aktivní":"🔴 Párování pozastaveno"))+'</div>';
    app.appendChild(bg);
    loadHomeNotifs();
  }
  function loadHomeNotifs(){
    var box=document.getElementById("homeNotifsWrap"); if(!box)return;
    var upd=null; try{ if(B&&typeof B.checkUpdate==="function"){ var t=B.checkUpdate(); if(t)upd=JSON.parse(t); } }catch(e){}
    _hasUpdate=!!(upd&&upd.has_update);
    api("GET","/api/v1/erp/app/mobile/commands/pending","").then(function(j){
      var cmds=(j&&j.commands)||[]; notifCount=cmds.length; renderNav();
      box.innerHTML="";
      if(upd&&upd.has_update){
        var ru=el('<div class="homenotif"><div class="ic">🆕</div><div style="flex:1;min-width:0;"><div style="font-weight:600;">Nová verze STRATEGIE</div><div style="color:var(--mut);font-size:12px;">'+esc(upd.latest_name||"")+' — klepni pro aktualizaci</div></div><div class="chev">&#8250;</div></div>');
        ru.addEventListener("click",function(){ curTab="settings"; stack=["settings","set_about"]; render(); }); box.appendChild(ru);
      }
      cmds.forEach(function(c){
        var r=el('<div class="homenotif"><div class="ic">'+CLAUDE_SVG.replace('width="26" height="26"','width="22" height="22"')+'</div><div style="flex:1;min-width:0;"><div style="font-weight:600;">'+esc(c.title||"Claude")+'</div><div style="color:var(--mut);font-size:12px;">'+esc((c.message||"").slice(0,60))+'</div></div><div class="chev">&#8250;</div></div>');
        r.addEventListener("click",function(){ curTab="notifs"; stack=["notifs","claudetasks"]; render(); }); box.appendChild(r);
      });
      // žádné notifikace → wrap zůstane prázdný (neviditelný)
    });
  }

  // ───── TELEFON ─────
  function phone(){
    app.innerHTML = topbar("Telefon", false);
    var p=el('<div class="panel"></div>');
    if(canDial||DEV){
      p.appendChild(el('<label>Telefonní číslo</label>'));
      var inp=el('<input id="num" type="tel" inputmode="tel" placeholder="+420…" value="+420">'); p.appendChild(inp);
      var btn=el('<button class="green full">Vytočit</button>'); var info=el('<div class="devinfo" style="display:none;"></div>');
      btn.addEventListener("click",function(){ var n=(inp.value||"").trim(); if(!n)return;
        if(canDial){ doDial(n); if(DEV){info.textContent="✓ Most: dialNumber(\""+n+"\") → ACTION_DIAL.";info.style.display="block";} }
        else { info.textContent="DEV (bez mostu): dialNumber(\""+n+"\") → v appce spustí ACTION_DIAL. Nativní-only.";info.style.display="block"; } });
      p.appendChild(btn); p.appendChild(info);
    } else { p.appendChild(el('<div class="hint">Vytáčení je nativní funkce — funguje v appce STRATEGIE.</div>')); }
    var ls=listenState();
    p.appendChild(el('<div class="group">Další</div>'));
    var sl=el('<div class="list"></div>');
    sl.appendChild(row("🟢","Párování s ERP", ls==null?"(zjistí se v appce)":(ls?"aktivní":"pozastaveno"), function(){go("set_listen");}));
    sl.appendChild(row("🕓","Historie hovorů","Prefixy: "+getPrefixes(), function(){go("calllog");}));
    p.appendChild(sl); app.appendChild(p);
  }

  // ───── ÚKOLY / NOTIFIKACE ─────
  var _afterAct=false;
  function act(id,decision){ _afterAct=true; api("POST","/api/v1/erp/app/command/"+id+"/result",{decision:decision}).then(notifsLoad); }
  function notifsLoad(){ var ul=document.getElementById("ntlist"); if(!ul)return;
    api("GET","/api/v1/erp/app/mobile/commands/pending","").then(function(j){
      var wasAct=_afterAct; _afterAct=false;
      if(!j){ ul.innerHTML='<li style="color:var(--mut);border:none;">Přihlas se (prohlížeč) nebo otevři v appce.</li>'; return; }
      var cmds=j.commands||[]; notifCount=cmds.length;
      if(!cmds.length){ if(wasAct){ renderNav(); selectTab("home"); return; } ul.innerHTML='<li style="color:var(--mut);border:none;">Žádné čekající úkoly ✓</li>'; return; }
      ul.innerHTML="";
      cmds.forEach(function(c){
        var li=el('<li></li>');
        var txt=el('<div style="cursor:pointer;"><div class="nt">'+esc(c.title||"Úkol")+'</div>'+(c.message?'<div class="nm" style="max-height:60px;overflow:hidden;">'+esc(c.message)+'</div>':'')+(c.message&&c.message.length>120?'<div style="color:var(--blue);font-size:12px;">klepni pro celé…</div>':'')+'</div>');
        txt.addEventListener("click",function(){ openClaudeDetail(c); });
        var a=el('<div class="nactions" style="margin-top:8px;"></div>');
        function b(l,cl,d){var x=el('<button class="sm '+cl+'">'+l+'</button>'); x.addEventListener("click",function(e){e.stopPropagation();act(c.id,d);}); a.appendChild(x);}
        if(c.command_type==="claude_confirm"){b("Odmítnout","warn","reject");b("Povolit","green","accept");} else {b("OK","ghost","done");}
        li.appendChild(txt); li.appendChild(a); ul.appendChild(li); }); }); }
  function notifs(){ // dashboard s dlaždicemi
    app.innerHTML=topbar("Úkoly", false); var p=el('<div class="panel"></div>');
    var grid=el('<div class="dashgrid"></div>');
    var ct=el('<div class="tile"><div class="tile-ic">'+CLAUDE_SVG+'</div><div class="tile-tt">Claude</div><div class="tile-sub" id="claudeSub">…</div></div>');
    ct.addEventListener("click",function(){go("claudetasks");}); grid.appendChild(ct);
    p.appendChild(grid); app.appendChild(p);
    api("GET","/api/v1/erp/app/mobile/commands/pending","").then(function(j){ notifCount=j&&j.commands?j.commands.length:0; var s=document.getElementById("claudeSub"); if(s)s.textContent=notifCount?(notifCount+" ke schválení / nové"):"Žádné nové"; renderNav(); }); }
  function claudetasks(){ app.innerHTML=topbar("Claude", true); var p=el('<div class="panel"></div>');
    p.appendChild(el('<div class="list" style="padding:0 14px;"><ul id="ntlist"><li style="color:var(--mut);border:none;">Načítám…</li></ul></div>'));
    var r=el('<button class="ghost full">Obnovit</button>'); r.addEventListener("click",notifsLoad); p.appendChild(r); app.appendChild(p); notifsLoad(); }

  var _detailCmd=null;
  function openClaudeDetail(c){ _detailCmd=c; go("claudeDetail"); }
  function detailAct(c,decision){
    api("POST","/api/v1/erp/app/command/"+c.id+"/result",{decision:decision}).then(function(){
      api("GET","/api/v1/erp/app/mobile/commands/pending","").then(function(j){
        var cmds=(j&&j.commands)||[]; notifCount=cmds.length; renderNav();
        if(!cmds.length){ selectTab("home"); } else { curTab="notifs"; stack=["notifs","claudetasks"]; render(); }
      });
    });
  }
  function claudeDetail(){
    var c=_detailCmd||{};
    app.innerHTML=topbar("Claude", true);
    var p=el('<div class="panel"></div>');
    p.appendChild(el('<div style="font-weight:700;font-size:17px;margin-bottom:10px;">'+esc(c.title||"Claude")+'</div>'));
    p.appendChild(el('<div style="color:#d4dde8;font-size:14px;line-height:1.65;white-space:pre-wrap;word-break:break-word;">'+esc(c.message||"")+'</div>'));
    var a=el('<div class="nactions" style="margin-top:20px;"></div>');
    function b(l,cl,d){var x=el('<button class="'+cl+'">'+l+'</button>'); x.addEventListener("click",function(){ detailAct(c,d); }); a.appendChild(x);}
    if(c.command_type==="claude_confirm"){ b("Odmítnout","warn","reject"); b("Povolit","green","accept"); } else { b("OK","ghost","done"); }
    p.appendChild(a); app.appendChild(p);
  }

  // ───── KONTAKTY ─────
  var _contacts=null;
  function renderContactsList(){ var ul=document.getElementById("ctlist"); if(!ul)return; var j=_contacts;
    if(j&&j.need){ ul.innerHTML='<li style="border:none;"><div style="color:var(--mut);margin-bottom:8px;">Appka potřebuje přístup ke kontaktům.</div><button class="green sm" id="ctperm">Povolit přístup</button></li>'; var pb=document.getElementById("ctperm"); if(pb)pb.addEventListener("click",function(){bjson("getContacts",getPrefixes());setTimeout(loadContacts,700);}); return; }
    var all=(j&&j.contacts)||[]; var sf=document.getElementById("ctsearch"); var f=((sf&&sf.value)||"").trim().toLowerCase(); var nf=f.replace(/\s/g,"");
    var list=all.filter(function(c){ if(!f)return true; return (c.name||"").toLowerCase().indexOf(f)>=0 || (c.number||"").replace(/\s/g,"").indexOf(nf)>=0; });
    if(!list.length){ ul.innerHTML='<li style="color:var(--mut);border:none;">'+(f?"Nic nenalezeno.":("Žádné kontakty s prefixem "+esc(getPrefixes())+"."))+'</li>'; return; }
    var pfx=getPrefixes(); ul.innerHTML="";
    list.forEach(function(c){
      var li=document.createElement("li"); li.className="ct"; li.style.padding="0"; li.style.borderBottom="none";
      var av = c.photo ? ('<div class="cav"><img src="'+c.photo+'"></div>')
        : ('<div class="cav" style="background:'+avColor(c.name||"?")+'">'+esc(((c.name||"?").replace(/[^A-Za-zÀ-ž]/g,"").charAt(0)||"?").toUpperCase())+'</div>');
      var head=el('<div class="cthead">'+av+'<div style="flex:1;min-width:0;"><div class="ctname">'+fmtName(c.name||"",pfx)+'</div><div class="ctnum">'+esc(c.number||"")+'</div></div></div>');
      var exp=el('<div class="ctexp" style="display:none;"><div class="ctacts"></div></div>');
      var acts=exp.querySelector(".ctacts");
      var bCall=el('<div class="cact call">'+PHONE_SVG_W+'</div>'); bCall.addEventListener("click",function(e){e.stopPropagation();doDial(c.number);});
      var bSms=el('<div class="cact sms" style="color:#fff;font-size:20px;">💬</div>'); bSms.addEventListener("click",function(e){e.stopPropagation();openApp("sms:"+(c.number||"").replace(/\s/g,""));});
      var bWa=el('<div class="cact" style="background:transparent;padding:0;">'+WA_SVG.replace('width="30" height="30"','width="46" height="46"')+'</div>');
      bWa.addEventListener("click",function(e){ e.stopPropagation(); var num=(c.number||"").replace(/[^0-9]/g,""); if(B&&typeof B.openExternal==="function") B.openExternal("https://wa.me/"+num); else openApp("https://wa.me/"+num); });
      acts.appendChild(bCall); acts.appendChild(bSms); acts.appendChild(bWa);
      head.addEventListener("click",function(){ exp.style.display=exp.style.display==="none"?"block":"none"; });
      li.appendChild(head); li.appendChild(exp); ul.appendChild(li);
    }); }
  function loadContacts(){ _contacts=bjson("getContacts", getPrefixes()); renderContactsList(); }
  function contacts(){ app.innerHTML=topbar("Kontakty", false); var p=el('<div class="panel"></div>');
    if(!(B&&typeof B.getContacts==="function")){ p.appendChild(el('<div class="hint">Kontakty jsou nativní funkce — funguje v appce STRATEGIE.</div>')); app.appendChild(p); return; }
    var s=el('<input id="ctsearch" placeholder="Hledat kontakt…" autocomplete="off">'); s.addEventListener("input",renderContactsList); p.appendChild(s);
    p.appendChild(el('<div class="hint">Jen kontakty s prefixem: <b>'+esc(getPrefixes())+'</b> (změna v Nastavení).</div>'));
    p.appendChild(el('<div class="list" style="padding:0 14px;margin-top:10px;"><ul id="ctlist"><li style="color:var(--mut);border:none;">Načítám…</li></ul></div>'));
    app.appendChild(p); loadContacts(); }

  // ───── HISTORIE HOVORŮ ─────
  function loadCalllog(){ var ul=document.getElementById("cllist"); if(!ul)return; var j=bjson("getCallLog", getPrefixes());
    if(j&&j.need){ ul.innerHTML='<li style="border:none;"><div style="color:var(--mut);margin-bottom:8px;">Appka potřebuje přístup k protokolu hovorů.</div><button class="green sm" id="clperm">Povolit přístup</button></li>'; var pb=document.getElementById("clperm"); if(pb)pb.addEventListener("click",function(){bjson("getCallLog",getPrefixes());setTimeout(loadCalllog,700);}); return; }
    var list=(j&&j.calls)||[]; if(!list.length){ ul.innerHTML='<li style="color:var(--mut);border:none;">Žádné hovory s prefixem '+esc(getPrefixes())+'.</li>'; return; }
    ul.innerHTML=""; list.forEach(function(c){ var li=el('<li><div class="nt">'+esc(c.name||c.number)+'</div><div class="nm">'+esc(fmtCall(c))+'</div><div class="nactions"></div></li>');
      var b=el('<button class="green sm">Vytočit</button>'); b.addEventListener("click",function(){doDial(c.number);}); li.querySelector(".nactions").appendChild(b); ul.appendChild(li); }); }
  function calllog(){ app.innerHTML=topbar("Historie hovorů", true); var p=el('<div class="panel"></div>');
    if(!(B&&typeof B.getCallLog==="function")){ p.appendChild(el('<div class="hint">Historie hovorů je nativní funkce — funguje v appce STRATEGIE.</div>')); app.appendChild(p); return; }
    p.appendChild(el('<div class="hint">Jen hovory kontaktů s prefixem: <b>'+esc(getPrefixes())+'</b>.</div>'));
    p.appendChild(el('<div class="list" style="padding:0 14px;margin-top:10px;"><ul id="cllist"><li style="color:var(--mut);border:none;">Načítám…</li></ul></div>')); app.appendChild(p); loadCalllog(); }

  // ───── NASTAVENÍ ─────
  function settings(){ app.innerHTML=topbar("Nastavení", false); var l=el('<div class="list"></div>');
    l.appendChild(row("🟢","Párování s ERP","Stav spojení s ERP",function(){go("set_listen");}));
    l.appendChild(row("📌","Ikony na plochu","ERP a Chat zkratky",function(){go("set_icons");}));
    l.appendChild(row("📲","Nainstalovat na plochu","/mobile jako PWA",function(){go("set_install");}));
    l.appendChild(row("🔤","Prefixy kontaktů a hovorů","Filtr (STR, EC)",function(){go("set_prefixes");}));
    l.appendChild(row("🔔","Přístup k oznámením","Počty WhatsApp / SMS",function(){go("set_notifaccess");}));
    l.appendChild(row("🧪","Vývojářské","DEV mód, most",function(){go("set_dev");}));
    l.appendChild(row("ℹ️","O aplikaci", _hasUpdate?"🆕 Nová verze k dispozici":(ver?("Verze "+ver):"Verze a stav"),function(){go("set_about");}, _hasUpdate?1:0));
    app.appendChild(l); }
  function set_listen(){ app.innerHTML=topbar("Párování s ERP", true); var p=el('<div class="panel"></div>'); var ls=listenState();
    p.appendChild(el('<div class="big">Párování: <b>'+(ls==null?"(jen v appce)":(ls?"aktivní ✓":"pozastaveno"))+'</b></div>'));
    if(B&&typeof B.startListening==="function"){
      if(ls){ var off=el('<button class="warn full">Pozastavit párování</button>'); off.addEventListener("click",function(){ B.stopListening(); setTimeout(function(){ render(); },700); }); p.appendChild(off); }
      else { var on=el('<button class="green full">Aktivovat párování</button>'); on.addEventListener("click",function(){ B.startListening(); setTimeout(function(){ render(); },900); }); p.appendChild(on); }
      if(typeof B.openBatterySettings==="function"){ var bb=el('<button class="ghost full">Vypnout úsporu baterie (ať párování nepadá)</button>'); bb.addEventListener("click",function(){B.openBatterySettings();}); p.appendChild(bb); }
    } else { p.appendChild(el('<div class="hint">Párování se ovládá v appce STRATEGIE.</div>')); }
    p.appendChild(el('<div class="hint">Když je párování aktivní, ve stavovém řádku svítí <b>zelená ikona energie</b> a telefon přijímá vytáčení/úkoly z ERP. Vyžaduje povolená oznámení a vypnutou úsporu baterie pro STRATEGII — jinak ji systém uspí.</div>')); app.appendChild(p); }
  function set_icons(){ app.innerHTML=topbar("Ikony na plochu", true); var p=el('<div class="panel"></div>');
    p.appendChild(el('<div class="hint">Přidání ikon ERP a Chat na plochu je nativní akce v appce STRATEGIE. Most doplníme.</div>')); app.appendChild(p); }
  function set_install(){ app.innerHTML=topbar("Nainstalovat na plochu", true); var p=el('<div class="panel"></div>');
    var b=el('<button class="green full">Nainstalovat /mobile jako appku</button>'); var info=el('<div class="hint"></div>');
    b.addEventListener("click",function(){ if(deferredPrompt){deferredPrompt.prompt();try{deferredPrompt.userChoice.then(function(){deferredPrompt=null;});}catch(e){}} else {info.textContent="Pokud nabídka nevyskočí: v prohlížeči ⋮ → Přidat na plochu / Nainstalovat aplikaci.";} });
    p.appendChild(b); p.appendChild(info); p.appendChild(el('<div class="hint">Nainstaluje /mobile jako samostatnou PWA (vlastní ikona, bez lišty prohlížeče).</div>')); app.appendChild(p); }
  function set_prefixes(){ app.innerHTML=topbar("Prefixy kontaktů a hovorů", true); var p=el('<div class="panel"></div>');
    p.appendChild(el('<label>Zobrazovat jen kontakty a hovory začínající (oddělené čárkou)</label>'));
    var inp=el('<input id="pfx" value="'+esc(getPrefixes())+'">'); p.appendChild(inp);
    var b=el('<button class="green full">Uložit</button>'); b.addEventListener("click",function(){var v=(inp.value||"").trim()||"STR,EC";try{localStorage.setItem("stg_prefixes",v);}catch(e){}back();}); p.appendChild(b);
    p.appendChild(el('<div class="hint">Standardně STR, EC. Platí pro Kontakty i Historii hovorů.</div>')); app.appendChild(p); }
  function set_dev(){ app.innerHTML=topbar("Vývojářské", true); var p=el('<div class="panel"></div>');
    p.appendChild(el('<div class="big">DEV mód: <b>'+(DEV?"zapnutý":"vypnutý")+'</b></div>'));
    var t=el('<button class="'+(DEV?"warn":"green")+' full">'+(DEV?"Vypnout DEV mód":"Zapnout DEV mód")+'</button>');
    t.addEventListener("click",function(){try{if(DEV)localStorage.removeItem("stg_mobile_dev");else localStorage.setItem("stg_mobile_dev","1");}catch(e){}location.href=location.pathname;}); p.appendChild(t);
    p.appendChild(el('<div class="devinfo">Most: '+(native?("aktivní — "+[canDial?"dialNumber":"",canListen?"listening":"",canFetch?"authedFetch":"",(B&&B.getContacts)?"getContacts":"",(B&&B.getCallLog)?"getCallLog":""].filter(Boolean).join(", ")):"není (prohlížeč)")+'</div>')); app.appendChild(p); }
  function set_about(){ app.innerHTML=topbar("O aplikaci", true); var p=el('<div class="panel"></div>'); app.appendChild(p);
    if(!(B&&typeof B.checkUpdate==="function")){
      p.appendChild(el('<div class="list"><div class="row" style="cursor:default"><div class="tx"><div class="tt">Verze</div><div class="sub">'+(ver||"— (jen v appce)")+'</div></div></div><div class="row" style="cursor:default"><div class="tx"><div class="tt">Režim</div><div class="sub">prohlížeč (PWA)</div></div></div></div>'));
      return;
    }
    var status=el('<div class="hint">Kontroluji novou verzi…</div>'); p.appendChild(status);
    setTimeout(function(){
      var j={}; try{ var t=B.checkUpdate(); if(t)j=JSON.parse(t); }catch(e){}
      var bt=j.build_time||(B.buildTime?(function(){try{return B.buildTime();}catch(e){return "";}})():"");
      var box=el('<div class="list"></div>');
      box.appendChild(el('<div class="row" style="cursor:default"><div class="tx"><div class="tt">Verze appky</div><div class="sub">'+esc(j.current_name||ver)+' (code '+esc(String(j.current_code||""))+')</div></div></div>'));
      box.appendChild(el('<div class="row" style="cursor:default"><div class="tx"><div class="tt">Sestaveno</div><div class="sub">'+esc(bt)+'</div></div></div>'));
      p.replaceChild(box,status);
      if(j.has_update){
        p.appendChild(el('<div class="big" style="color:#5ee0b7;margin-top:12px;">Nová verze '+esc(j.latest_name)+' (code '+esc(String(j.latest_code))+')</div>'));
        var ub=el('<button class="green full">Aktualizovat na novou verzi</button>'); ub.addEventListener("click",function(){ try{B.installUpdate();}catch(e){} }); p.appendChild(ub);
      } else if(j.error){ p.appendChild(el('<div class="hint" style="margin-top:12px;">Verzi se nepodařilo zjistit (zkontroluj párování / připojení).</div>')); }
      else { p.appendChild(el('<div class="hint" style="margin-top:12px;">Máš nejnovější verzi ✓</div>')); }
      p.appendChild(el('<div class="group">Telefon a ERP</div>'));
      var pair=el('<button class="ghost full" style="margin-top:0;">Spárovat telefon (sken QR)</button>');
      pair.addEventListener("click",function(){ try{ if(typeof B.scanPairQr==="function") B.scanPairQr(); else B.openPairing(); }catch(e){} });
      p.appendChild(pair);
      p.appendChild(el('<div class="hint">Na PC otevři <b>strategie-ai.com/app-pair</b> (ukáže QR), pak tady klepni Spárovat a naskenuj ho fotoaparátem.</div>'));
    },60);
  }

  // ───── APLIKACE (launcher) ─────
  function openApp(url){ var u=(url.charAt(0)==="/")?(location.origin+url):url; if(B&&typeof B.openExternal==="function")B.openExternal(u); else { try{window.open(u,"_blank");}catch(e){ location.href=u; } } }
  function appCell(iconHtml,label,badge,fn){ var c=el('<div class="appcell"><div class="appicon">'+iconHtml+'</div><div class="applabel">'+esc(label)+'</div>'+(badge?'<span class="appbadge">'+(badge>99?"99+":badge)+'</span>':'')+'</div>'); c.addEventListener("click",fn); return c; }
  function apps(){
    app.innerHTML=topbar("Aplikace", true);
    var bd=getBadges()||{whatsapp:0,sms:0,access:true};
    var g=el('<div class="appgrid"></div>');
    g.appendChild(appCell('<img src="/static/erp/icon-chat-192.png">',"Chat",0,function(){openApp("/");}));
    g.appendChild(appCell('<img src="/static/erp/icon-erp-192.png">',"ERP",0,function(){openApp("/erp");}));
    g.appendChild(appCell("🕒","Docházka",0,function(){openApp("/dochazka");}));
    g.appendChild(appCell(WA_SVG,"WhatsApp",bd.whatsapp||0,function(){ if(B&&typeof B.openPackage==="function") B.openPackage("com.whatsapp","https://wa.me/"); else openApp("https://wa.me/"); }));
    g.appendChild(appCell("💬","Zprávy",bd.sms||0,function(){openApp("sms:");}));
    app.appendChild(g);
    if(bd.access===false){ app.appendChild(el('<div class="hint">Pro počty u WhatsApp / Zprávy povol <b>Přístup k oznámením</b> (Nastavení).</div>')); }
  }
  function set_notifaccess(){ app.innerHTML=topbar("Přístup k oznámením", true); var p=el('<div class="panel"></div>');
    if(!(B&&typeof B.openNotifAccess==="function")){ p.appendChild(el('<div class="hint">Tato funkce je v appce STRATEGIE.</div>')); app.appendChild(p); return; }
    var bd=getBadges()||{};
    p.appendChild(el('<div class="big">Stav: <b>'+(bd.access?"povoleno ✓":"nepovoleno")+'</b></div>'));
    var b=el('<button class="green full">Otevřít nastavení přístupu</button>'); b.addEventListener("click",function(){B.openNotifAccess();}); p.appendChild(b);
    p.appendChild(el('<div class="hint">Umožní spočítat nová oznámení (WhatsApp, SMS) a zobrazit číslo na ikoně Aplikace. Appka oznámení nečte — jen je počítá.</div>')); app.appendChild(p); }
  var SCREENS={home:home,phone:phone,notifs:notifs,claudetasks:claudetasks,claudeDetail:claudeDetail,contacts:contacts,calllog:calllog,settings:settings,apps:apps,set_listen:set_listen,set_icons:set_icons,set_install:set_install,set_prefixes:set_prefixes,set_notifaccess:set_notifaccess,set_dev:set_dev,set_about:set_about};

  function navBtn(ic,lbl,active,fn,badge){ var b=el('<button class="tabbtn'+(active?" active":"")+'"><span class="i">'+ic+'</span>'+lbl+(badge?'<span class="nbadge">'+(badge>99?"99+":badge)+'</span>':'')+'</button>'); b.addEventListener("click",fn); return b; }
  function renderNav(){
    bnav.innerHTML="";
    var bd=getBadges();
    var atApps=(stack[stack.length-1]==="apps");
    if(curTab==="home" && !atApps) bnav.appendChild(navBtn("📱","Aplikace",false,function(){go("apps");},(bd&&bd.total)||0));
    else bnav.appendChild(navBtn("🏠","Domů",false,function(){selectTab("home");},0));
    bnav.appendChild(navBtn(PHONE_SVG,"Telefon",curTab==="phone",function(){selectTab("phone");},0));
    bnav.appendChild(navBtn("🔔","Úkoly",curTab==="notifs",function(){selectTab("notifs");},notifCount||0));
    bnav.appendChild(navBtn("👤","Kontakty",curTab==="contacts",function(){selectTab("contacts");},0));
    bnav.appendChild(navBtn("⚙️","Nastavení",curTab==="settings",function(){selectTab("settings");},_hasUpdate?1:0));
  }
  function render(){ (SCREENS[stack[stack.length-1]]||home)(); var b=app.querySelector("[data-back]"); if(b)b.addEventListener("click",back); renderNav(); }

  window.addEventListener("popstate", function(){ if(stack.length>1){ back(); try{history.pushState(null,"");}catch(e){} } });
  try{ history.pushState(null,""); }catch(e){}
  render();
  setTimeout(function(){ refreshUpdate(); renderNav(); }, 800);

  // Živé načítání úkolů — ať se nová notifikace objeví v appce sama (Marti 6.6.2026).
  function pollNotifs(){
    api("GET","/api/v1/erp/app/mobile/commands/pending","").then(function(j){
      var cmds=(j&&j.commands)||[]; var n=cmds.length; var changed=(n!==notifCount);
      notifCount=n; renderNav();
      // Obnov seznam jen na hlavní obrazovce nebo na záložce Úkoly (ne když je
      // uživatel zanořený v detailu) — žádné vyškubnutí z rozečtené zprávy.
      if(changed){
        var top=stack[stack.length-1];
        if((curTab==="home"&&stack.length===1)||top==="notifs"){ try{ render(); }catch(e){} }
      }
    }).catch(function(){});
  }
  setInterval(pollNotifs, 6000);
  // Při návratu do popředí (otevření z notifikace/launcheru) obnov hned.
  document.addEventListener("visibilitychange", function(){ if(!document.hidden){ refreshUpdate(); pollNotifs(); } });
  window.addEventListener("focus", function(){ refreshUpdate(); pollNotifs(); });
})();
</script>
