      if(_tapAC.state==="suspended") _tapAC.resume();

  function api(method, path, body){

    function mk(t){
      var j=null; try{ j=t?JSON.parse(t):null; }catch(e){ return null; }
      if(j && j.detail==="Not Found") return {ok:false,error:"Server se právě aktualizuje — zkus to za pár vteřin."};
      return j;
    }
    if (canFetch){ try{ var t=B.authedFetch(method,path,body?JSON.stringify(body):""); return Promise.resolve(mk(t));}catch(e){return Promise.resolve(null);} }
    var o={method:method,credentials:"same-origin",headers:{}};
    if(body){o.headers["Content-Type"]="application/json";o.body=JSON.stringify(body);}
    return fetch(path,o).then(function(r){ return r.text().then(mk); }).catch(function(){return null;});
  }

  // nastaví cookie session → reload do appky. Demo zůstává jako bezloginová cesta.
  function openPasswordLogin(){
    var ov=el('<div style="position:fixed;inset:0;background:rgba(4,10,18,.97);z-index:300;display:flex;flex-direction:column;justify-content:center;padding:24px;gap:10px;"></div>');

    ov.appendChild(el('<div class="hint" style="line-height:1.55;">Zadej e-mail a heslo svého účtu STRATEGIE.</div>'));
    var em=el('<input type="email" inputmode="email" autocapitalize="off" autocomplete="username" placeholder="E-mail" style="margin:0;">');
    var pw=el('<input type="password" autocomplete="current-password" placeholder="Heslo" style="margin:0;">');
    var st=el('<div class="hint" style="min-height:16px;"></div>');
    var send=el('<button class="green full" style="margin:0;">Přihlásit se</button>');
    var cl=el('<button class="ghost full" style="margin:0;">Zavřít</button>');
    cl.addEventListener("click",function(){ ov.remove(); });
    function doLogin(){
      var e=(em.value||"").trim(), p=(pw.value||"");
      if(!e||!p){ st.textContent="Doplň prosím e-mail i heslo."; return; }
      send.disabled=true; st.textContent="Přihlašuji…";
      fetch("/api/v1/auth/login",{method:"POST",headers:{"Content-Type":"application/json"},
        body:JSON.stringify({email:e,password:p})})
        .then(function(r){ return r.json().then(function(b){ return {ok:r.ok,status:r.status,body:b}; }); })
        .then(function(r){
          if(r.ok){ st.textContent="Hotovo ✅"; location.href="/mobile"; return; }
          send.disabled=false;
          var d=r.body&&r.body.detail;
          var msg = (d&&typeof d==="object"&&d.message) ? d.message
                  : (typeof d==="string"?d:"Přihlášení se nezdařilo.");
          if(r.status===401) msg="Neplatný e-mail nebo heslo.";
          if(r.status===429) msg=(typeof d==="string"?d:"Příliš mnoho pokusů. Zkus to prosím za chvíli.");
          st.textContent=msg;
        })
        .catch(function(){ send.disabled=false; st.textContent="Nepovedlo se. Zkus to prosím znovu."; });
    }
    send.addEventListener("click",doLogin);
    pw.addEventListener("keydown",function(ev){ if(ev.key==="Enter") doLogin(); });
    ov.appendChild(em); ov.appendChild(pw); ov.appendChild(st); ov.appendChild(send); ov.appendChild(cl);
    app.appendChild(ov);
  }

  // Overdrive popup: nad +100 % se dá přetáhnout do 500 % (✈️ Letadlo) a nad 500 % (🚀 Raketa)

    var card=document.createElement("div");

      +'<div id="ovEmo" style="font-size:64px;line-height:1.1;margin:8px 0;">'+emo(val)+'</div>'
      +'<div id="ovLab" style="font-weight:800;font-size:18px;margin-bottom:4px;">'+lab(val)+'</div>'
      +'<div id="ovNum" style="font-size:30px;font-weight:900;color:#7dd3fc;">'+val+' %</div>'
      +'<input id="ovRange" type="range" min="100" max="1000" step="10" value="'+val+'" style="width:100%;margin:16px 0;accent-color:#7c5cff;">'
      +'<div style="display:flex;justify-content:space-between;font-size:11px;color:#8ea0c4;"><span>100 %</span><span>500 %</span><span>1000 %</span></div>'
      +'<div style="display:flex;gap:8px;margin-top:16px;"><button id="ovCancel" style="flex:1;padding:11px;border:1px solid #2a55c8;border-radius:11px;background:transparent;color:#e8eefc;cursor:pointer;">Zrušit</button>'

    ov.appendChild(card); document.body.appendChild(ov);
    var rng=card.querySelector("#ovRange");
    rng.addEventListener("input",function(){ var v=parseInt(rng.value,10); card.querySelector("#ovEmo").textContent=emo(v); card.querySelector("#ovLab").textContent=lab(v); card.querySelector("#ovNum").textContent=v+" %"; });

  // Import CV: vyber PDF nebo vyfoť → base64 → server přečte + LLM strukturuje → karta uchazeče
  function cvImport(camera){
    var fi;
    if(camera){
      fi=el('<input type="file" accept="image/*" capture="environment" style="display:none;">');
    } else {
      fi=el('<input type="file" accept=".pdf,.doc,.docx,.rtf,.txt,image/*" style="display:none;">');
    }
    fi.addEventListener("change",function(){
      var f=fi.files&&fi.files[0]; if(!f)return;
      if(f.size>25*1024*1024){ alert("Soubor je moc velký (max 25 MB)."); return; }
      go("hr_cv_result"); // přepni na obrazovku s průběhem
      var box=document.getElementById("cvResBox");
      if(box) box.innerHTML='<div class="hint">⏳ Čtu životopis a vytahuji údaje… (pár vteřin)</div>';
      var fr=new FileReader();
      fr.onload=function(){
        var b64=String(fr.result).split(",")[1]||"";
        var fn=f.name||"";
        if(!fn){ var mt=(f.type||""); fn = mt.indexOf("png")>=0?"cv.png" : (mt.indexOf("image")>=0?"cv.jpg":"cv.pdf"); }
        api("POST","/api/v1/erp/app/recruit/cv-import",{file_b64:b64,filename:fn,position:""}).then(function(r){
          renderCvResult(r);
        }).catch(function(){ renderCvResult({ok:false,error:"Nepodařilo se odeslat."}); });
      };
      fr.readAsDataURL(f);
    });
    document.body.appendChild(fi); fi.click();
    setTimeout(function(){ try{document.body.removeChild(fi);}catch(e){} },60000);
  }
  function hr_cv_result(){
    app.innerHTML=topbar("📥 Import CV", true);
    app.appendChild(el('<div id="cvResBox" class="list"><div class="hint">⏳ Zpracovávám…</div></div>'));
  }
  function renderCvResult(r){
    var box=document.getElementById("cvResBox"); if(!box)return;
    if(!r||!r.ok){
      box.innerHTML='<div class="hint" style="color:#f87171;">✗ '+esc((r&&r.error)||"Nepodařilo se zpracovat.")+'</div>';
      return;
    }
    var c=r.card||{};
    function fld(lbl,val){ if(!val&&val!==0)return ""; return '<div style="display:flex;gap:8px;margin:4px 0;font-size:14px;"><span style="min-width:120px;color:var(--mut);">'+lbl+'</span><b style="flex:1;">'+esc(String(val))+'</b></div>'; }
    var warn = r.scanned ? '<div class="hint" style="color:#fbbf24;margin:6px 0;">⚠ Naskenované PDF bez textové vrstvy — údaje doplň ručně v detailu.</div>' : '';
    box.innerHTML=
      '<div style="background:rgba(52,211,153,.08);border:1px solid rgba(52,211,153,.4);border-radius:12px;padding:12px;margin:6px;">'+
        '<div style="font-weight:700;font-size:16px;margin-bottom:6px;">✅ Uchazeč založen</div>'+ warn +
        fld("Jméno", c.jmeno)+ fld("E-mail", c.email)+ fld("Telefon", c.telefon)+
        fld("Narození", c.narozeni)+ fld("Vzdělání", c.vzdelani)+
        fld("Poslední zam.", c.posl_zam)+ fld("Jazyky", c.jazyky)+
        fld("Praxe", c.praxe)+ fld("Oček. plat", (c.plat!=null?(c.plat+" Kč"):""))+
        (c.shrnuti?('<div style="margin-top:6px;font-style:italic;color:var(--tx);">"'+esc(c.shrnuti)+'"</div>'):'')+
      '</div>';
    var det=el('<button style="margin:6px;padding:11px 16px;border:0;border-radius:12px;background:#4f8ef7;color:#fff;font-weight:700;cursor:pointer;width:calc(100% - 12px);">Otevřít v náboru →</button>');
    det.addEventListener("click",function(){ window._nbAppId=r.application_id; go("hr_nabor_detail"); });
    box.appendChild(det);
    var another=el('<button style="margin:6px;padding:11px 16px;border:1px solid var(--bord);border-radius:12px;background:rgba(255,255,255,.04);color:var(--tx);cursor:pointer;width:calc(100% - 12px);">📥 Importovat další CV</button>');
    another.addEventListener("click",function(){ cvImport(); });

  function hr_nabor_list(){

    var box=el('<div class="list"><div class="hint">Načítám…</div></div>');

    var all=[];
    function draw(){
      var q=(sb.value||"").trim().toLowerCase(); box.innerHTML=""; var n=0;
      all.forEach(function(it){
        if(q && (it.jmeno||"").toLowerCase().indexOf(q)<0) return;
        n++;

      });

  // Marti 11.6.: self-service osobních údajů — primární zdroj, logovaný,
  // s upozorněním HR na změny. Každý si spravuje svá data sám přes mobil.
  function hr_att_source(){
    app.innerHTML=topbar("🗓️ Zdroj docházky", true);
    app.appendChild(el('<div class="hint" style="margin:8px 6px;line-height:1.6;">„Jen STRATEGIE" = člověk píchá výhradně v naší appce. Vypneme mu píchání ve staré docházce (Centrála) a nebereme odtud jeho záznamy. Kdykoli lze vrátit zpět (kdyby náš systém zlobil).</div>'));
    var box=el('<div class="list"><div class="hint">Načítám…</div></div>'); app.appendChild(box);
    function load(){
      api("GET","/api/v1/erp/app/hr/att-source","").then(function(j){
        box.innerHTML="";
        if(!j||!j.ok){ box.innerHTML='<div class="hint">'+((j&&j.error==="forbidden")?"🔒 Jen rodiče a HR.":"Nepodařilo se načíst.")+'</div>'; return; }
        var items=j.items||[];
        if(!items.length){ box.innerHTML='<div class="hint">Žádní lidé.</div>'; return; }
        items.forEach(function(p){
          var on=!!p.app_only;
          var rw=el('<div style="display:flex;align-items:center;gap:10px;padding:10px 6px;border-bottom:1px solid var(--bord);"></div>');
          rw.appendChild(el('<div style="flex:1;min-width:0;"><div style="font-weight:600;">'+esc(p.jmeno)+'</div><div class="hint">'+(on?("jen STRATEGIE"+(p.ec_blocked?" · Centrála vypnutá":" · ⚠ Centrála nešla vypnout")):"Centrála (stará docházka)")+'</div></div>'));
          var b=el('<button style="padding:8px 12px;border-radius:10px;border:1px solid '+(on?"#34d399":"var(--bord)")+';background:'+(on?"rgba(52,211,153,.15)":"rgba(255,255,255,.04)")+';color:'+(on?"#5ee0b7":"var(--tx)")+';font-weight:700;cursor:pointer;white-space:nowrap;">'+(on?"✓ Jen STRATEGIE":"Přepnout")+'</button>');
          b.addEventListener("click",function(){
            var msg=on?("Vrátit "+p.jmeno+" zpět na starou docházku (Centrála)?"):("Přepnout "+p.jmeno+" na JEN STRATEGIE? Vypne se mu píchání v Centrále.");
            if(!confirm(msg)) return;
            b.disabled=true; b.textContent="…";
            api("POST","/api/v1/erp/app/hr/att-source",{user_id:p.user_id,app_only:!on}).then(function(r){
              if(r&&r.ok){ if(!on && r.ec_blocked===false){ alert("Přepnuto na naší straně, ale Centrálu se nepodařilo vypnout: "+(r.ec_error||"?")); } load(); }
              else { b.disabled=false; b.textContent=on?"✓ Jen STRATEGIE":"Přepnout"; alert("Chyba: "+((r&&r.error)||"?")); }
            });
          });
          rw.appendChild(b); box.appendChild(rw);
        });
      });
    }
    load();
  }

  // ── OČR (ošetřovné) — Fáze 1 (bez ČSSZ API) ─────────────────────────────
  var _OCR_BTN="width:100%;box-sizing:border-box;margin-top:8px;padding:12px;border-radius:12px;border:none;background:var(--green);color:#04150e;font-weight:800;font-size:15px;cursor:pointer;";
  function ocr(){
    app.innerHTML=topbar("🧑‍⚕️ Ošetřovné (OČR) · v2", true);
    // Auth gate (Kristý 29.6.): nepřihlášený host nesmí skončit u prázdného
    // formuláře bez cesty k loginu. whoami → jméno = přihlášen; jinak login karta.
    var _ocrLoad=el('<div class="hint" style="margin:12px 6px;">Ověřuji přihlášení…</div>'); app.appendChild(_ocrLoad);
    var _dev=""; try{ if(B&&typeof B.deviceId==="function") _dev=B.deviceId()||""; }catch(e){}
    api("GET","/api/v1/erp/app/whoami"+(_dev?("?device_id="+encodeURIComponent(_dev)):""),"").then(function(w){
      try{ _ocrLoad.remove(); }catch(e){}
      if(!(w && w.jmeno)){ _ocrLoginGate(); return; }
      _ocrListBody();
    });
  }
  function _ocrLoginGate(){
    var box=el('<div style="padding:14px 8px;"></div>');
    box.appendChild(el('<div style="font-weight:800;font-size:17px;margin-bottom:6px;">🔒 Nejdřív se přihlas</div>'));
    box.appendChild(el('<div class="hint" style="line-height:1.6;margin-bottom:14px;">Pro práci s ošetřovným se přihlas jako zaměstnanec. Tvůj OČR případ se založil přeposláním SMS od ČSSZ — po přihlášení ho tu uvidíš předvyplněný.</div>'));
    var bPwd=el('<button style="'+_OCR_BTN+'">🔑 Přihlásit e-mailem a heslem</button>');
    bPwd.addEventListener("click",function(){ try{ openPasswordLogin(); }catch(e){ location.href="/api/v1/auth/sms-login?next="+encodeURIComponent("/mobile?screen=ocr"); } });
    box.appendChild(bPwd);

  function _ocrRadio(parent,label,opts,val){

  function _rcToBirth(rc){
    rc=(rc||"").replace(/[\s\/]/g,""); if(!/^\d{9,10}$/.test(rc)) return "";
    var yy=parseInt(rc.slice(0,2),10), mm=parseInt(rc.slice(2,4),10), dd=parseInt(rc.slice(4,6),10);
    if(mm>70)mm-=70; else if(mm>50)mm-=50; else if(mm>20)mm-=20;
    var full=(rc.length===10)?((yy<54?2000:1900)+yy):(1900+yy);
    if(full>(new Date().getFullYear()))full-=100;
    if(mm<1||mm>12||dd<1||dd>31)return "";
    return full+"-"+("0"+mm).slice(-2)+"-"+("0"+dd).slice(-2);
  }

    // Dělení na krátké úseky (<180 zn.) — Android-safe (chunking, ne pause/resume).

        var buf=""; s.split(/,\s*/).forEach(function(c){
          if((buf+", "+c).length>180){ if(buf)out.push(buf); buf=c; } else buf=buf?buf+", "+c:c;
        });
        if(buf)out.push(buf);
      });
      return out;

  function paskaLoad(y,m){

        return;
      }
      if(j&&j.error==="pin_not_set"){ paskaPinSetup(); return; }
      if(j&&(j.error==="pin_required"||j.error==="pin_wrong"||j.error==="pin_locked")){ paskaPinEntry(j); return; }
      if(!j||!j.ok){ box.innerHTML='<div class="hint">Pásku se nepodařilo načíst.</div>'; return; }
      if(!j.items||!j.items.length){ box.innerHTML='<div class="hint">'+esc(j.note||"Zatím žádné pásky.")+'</div>'; if(_dS&&_dS.paska)_dS.paska.val.textContent=""; return; }
      var ps=j.periods||[]; var idx=-1;
      for(var i2=0;i2<ps.length;i2++){ if(ps[i2].y===j.y&&ps[i2].m===j.m){ idx=i2; break; } }
      var hd=el('<div style="display:flex;align-items:center;gap:8px;margin:2px 0 8px;"></div>');
      var bPrev=el('<button class="ghost sm">◀</button>');
      var bNext=el('<button class="ghost sm">▶</button>');

      hd.appendChild(bNext);
      // periods jsou DESC: další v poli = starší
      bPrev.disabled = idx < 0 || idx >= ps.length-1;
      bNext.disabled = idx <= 0;
      bPrev.addEventListener("click",function(){ var p=ps[idx+1]; if(p) paskaLoad(p.y,p.m); });
      bNext.addEventListener("click",function(){ var p=ps[idx-1]; if(p) paskaLoad(p.y,p.m); });
      box.innerHTML=""; box.appendChild(hd);
      // Marti 7.6.: dvě firmy = DVĚ samostatné pásky, každá s plnou hlavičkou.
      var firmy={}; var poradi=[];
      j.items.forEach(function(it){
        var k=it.firma||"?";
        if(!firmy[k]){ firmy[k]={nazev:it.firma_nazev||k, items:[]}; poradi.push(k); }
        firmy[k].items.push(it);
      });
      var celkemVyplata=0;
      poradi.forEach(function(fk){
        var f=firmy[fk];
        var card=el('<div style="background:var(--bg);border:1px solid var(--bord);border-radius:12px;padding:12px;margin-bottom:10px;"></div>');
        card.appendChild(el('<div style="font-weight:700;font-size:14.5px;">🏢 '+esc(f.nazev)+'</div>'));
        card.appendChild(el('<div class="hint" style="margin:2px 0 8px;">Výplatní páska · '+esc(j.jmeno||"")+' · '+esc(_CZ_MES[j.m]||j.m)+' '+j.y+'</div>'));
        // Mzdový LIST k pásce (Marti 27.6.) — úvazek, fond PD, odpracováno, průměry, pojišťovna
        (function(){
          var lst=(j.list||[]).filter(function(x){ return (x.firma||"?")===fk; });
          if(!lst.length) return;
          var L=lst[0];
          function combo(dni,hod){ var a=[]; if(dni!=null)a.push(Math.round(dni*10)/10+" dní"); if(hod!=null)a.push(Math.round(hod*10)/10+" h"); return a.length?a.join(" · "):null; }
          function lrow(lbl,val){ return val==null?"":('<div style="display:flex;justify-content:space-between;gap:8px;padding:3px 0;border-bottom:1px solid var(--bord);"><span style="font-size:12.5px;color:var(--mut);">'+esc(lbl)+'</span><span style="font-size:12.5px;font-weight:600;">'+esc(val)+'</span></div>'); }
          var html=lrow("Týdenní úvazek", L.tydenni_uvazek!=null?(L.tydenni_uvazek+" h"):null)
            +lrow("Denní úvazek", L.denni_uvazek!=null?(Math.round(L.denni_uvazek*10)/10+" h"):null)
            +lrow("Fond prac. doby", combo(L.fond_dny,L.fond_hod))
            +lrow("Odpracováno", combo(L.odprac_dny,L.odprac_hod))
            +lrow("Přesčas", L.prescas_hod!=null?(Math.round(L.prescas_hod*10)/10+" h"):null)
            +lrow("Svátek", L.svatek_tarif_hod!=null?(Math.round(L.svatek_tarif_hod*10)/10+" h"):null)
            +lrow("Průměrný výdělek/h", L.prum_vydelek_hod!=null?(Math.round(L.prum_vydelek_hod*100)/100+" Kč"):null)
            +lrow("Základní mzda", L.zakladni_mzda!=null?(Math.round(L.zakladni_mzda).toLocaleString("cs")+" Kč"):null)
            +lrow("Zdrav. pojišťovna", L.zdrav_pojistovna);
          if(!html) return;
          var det=el('<details style="margin:0 0 10px;"></details>');

          det.appendChild(dbox); card.appendChild(det);
        })();
        // Marti 7.6.: lidská struktura — 1) co firma poskytla (vč. odvodů firmy)
        // 2) FIRMA DALA CELKEM (superhrubá) 3) červené srážky (sleva na dani +)
        // 4) zelená Výplata na účet. Klasifikace dle názvu — doladí Šárka.
        var dal=[], firmaOdvody=[], srazky=[], vyp=[];
        f.items.forEach(function(it){
          var n=(it.nazev||"").toLowerCase();
          if(it.kc===0 && !it.hod && !it.dny) return;          // nulové technické řádky skrýt
          if(n.substring(0,7)==="výplata"){ vyp.push(it); return; }

          srazky.push(it);

        function radek(it, mode){  // mode: 'plus' | 'minus' | 'sleva'

            +'<span class="nm" style="margin:0;white-space:nowrap;color:'+col+';">'+esc(kc)+'</span></li>');
        }
        var ul=el('<ul></ul>');
        var superhruba=0;
        dal.forEach(function(it){ superhruba+=(it.kc||0); ul.appendChild(radek(it,"plus")); });
        firmaOdvody.forEach(function(it){ superhruba+=(it.kc||0); });  // do CELKEM patří, zobrazí se dole červeně
        ul.appendChild(el('<li style="display:flex;justify-content:space-between;align-items:center;gap:8px;background:rgba(79,142,247,.08);border-radius:8px;padding:12px 8px;">'
          +'<span class="nt" style="font-weight:700;font-size:13.5px;">🏢 Firma dala celkem (superhrubá)</span>'
          +'<span class="nm" style="margin:0;white-space:nowrap;font-weight:700;">'+Math.round(superhruba).toLocaleString("cs")+' Kč</span></li>'));
        firmaOdvody.forEach(function(it){ ul.appendChild(radek(it,"minus")); });
        srazky.forEach(function(it){
          var n=(it.nazev||"").toLowerCase();
          ul.appendChild(radek(it, n.indexOf("sleva")>=0 ? "sleva" : "minus"));
        });
        var vyplata=0;
        vyp.forEach(function(it){
          vyplata+=(it.kc||0);
          ul.appendChild(el('<li style="display:flex;justify-content:space-between;align-items:center;gap:8px;background:rgba(16,185,129,.10);border-radius:8px;padding:13px 8px;">'

        });
        card.appendChild(ul);
        box.appendChild(card);
        celkemVyplata+=vyplata;
      });
      box.appendChild(el('<div class="hint">Zdroj: mzdový systém Helios (oficiální zúčtování).</div>'));
      // Marti 7.6. večer: částka ani zámeček do hlavičky sekce NEPATŘÍ.
      if(_dS&&_dS.paska) _dS.paska.val.textContent="";
    });
  }

    row.appendChild(bp); row.appendChild(mid); row.appendChild(bn);

    function shift(days){
      try{ var d=new Date((inp.value||_locDate(0))+"T12:00:00"); d.setDate(d.getDate()+days);
           inp.value=d.getFullYear()+"-"+pad2(d.getMonth()+1)+"-"+pad2(d.getDate()); }catch(e){ return; }

  function _openAnnot(baseCanvas){
    var W=baseCanvas.width, H=baseCanvas.height;
    var cv=document.createElement("canvas"); cv.width=W; cv.height=H;
    var ctx=cv.getContext("2d");
    var strokes=[], cur=null, drawing=false;
    var color="#ff3b30";
    var thin=Math.max(2,Math.round(W/220)), thick=Math.max(5,Math.round(W/80)), lw=thick;
    function redraw(){ ctx.clearRect(0,0,W,H); ctx.drawImage(baseCanvas,0,0); ctx.lineCap="round"; ctx.lineJoin="round";
      for(var i=0;i<strokes.length;i++){ var s=strokes[i]; ctx.strokeStyle=s.color; ctx.lineWidth=s.width; ctx.beginPath();
        for(var j=0;j<s.pts.length;j++){ var p=s.pts[j]; if(j===0)ctx.moveTo(p.x,p.y); else ctx.lineTo(p.x,p.y); }
        if(s.pts.length===1)ctx.lineTo(s.pts[0].x+0.2,s.pts[0].y+0.2); ctx.stroke(); } }
    redraw();
    var ov=el('<div id="shotOverlay" style="position:fixed;inset:0;z-index:1000;background:#0a0c10;display:flex;flex-direction:column;"></div>');
    var tb=el('<div style="display:flex;align-items:center;gap:6px;padding:8px 10px;background:#11151c;border-bottom:1px solid var(--bord);flex-wrap:wrap;"></div>');
    var colors=["#ff3b30","#ffcc00","#34c759","#0a84ff","#ffffff","#111111"];
    colors.forEach(function(c){ var sw=el('<button class="swt" style="width:30px;height:30px;border-radius:50%;border:2px solid '+(c===color?"#fff":"transparent")+';background:'+c+';padding:0;"></button>'); sw.dataset.c=c; sw.addEventListener("click",function(){ color=c; refreshSw(); }); tb.appendChild(sw); });
    function refreshSw(){ Array.prototype.forEach.call(tb.querySelectorAll(".swt"),function(x){ x.style.borderColor=(x.dataset.c===color)?"#fff":"transparent"; }); }
    var wbtn=el('<button class="ghost" style="padding:4px 10px;">✏️ silné</button>');
    wbtn.addEventListener("click",function(){ lw=(lw===thick)?thin:thick; wbtn.textContent=(lw===thick)?"✏️ silné":"✏️ tenké"; });
    var ub=el('<button class="ghost" style="padding:4px 10px;">↶ Zpět</button>'); ub.addEventListener("click",function(){ strokes.pop(); redraw(); });
    var clb=el('<button class="ghost" style="padding:4px 10px;">🗑</button>'); clb.addEventListener("click",function(){ strokes=[]; redraw(); });
    var xb=el('<button class="warn" style="padding:4px 12px;margin-left:auto;">✕</button>'); xb.addEventListener("click",closeOv);
    tb.appendChild(wbtn); tb.appendChild(ub); tb.appendChild(clb); tb.appendChild(xb);
    var wrap=el('<div style="flex:1;overflow:auto;display:flex;align-items:flex-start;justify-content:center;background:#000;"></div>');
    cv.style.width="100%"; cv.style.height="auto"; cv.style.display="block"; cv.style.touchAction="none";
    wrap.appendChild(cv);
    var bb=el('<div style="padding:8px 10px calc(10px + env(safe-area-inset-bottom,0px));background:#11151c;border-top:1px solid var(--bord);display:flex;gap:8px;align-items:center;"></div>');
    var note=el('<input placeholder="Popisek (nepovinné)…" style="flex:1;background:#0e1117;border:1px solid var(--bord);border-radius:10px;color:#fff;padding:9px 10px;font-size:14px;">');
    var send=el('<button class="green" style="padding:10px 14px;white-space:nowrap;">📤 Claudovi</button>');
    send.addEventListener("click",doSend);
    bb.appendChild(note); bb.appendChild(send);
    ov.appendChild(tb); ov.appendChild(wrap); ov.appendChild(bb); document.body.appendChild(ov);
    function pt(ev){ var r=cv.getBoundingClientRect(); var kx=cv.width/r.width, ky=cv.height/r.height;
      var cx=(ev.touches&&ev.touches[0])?ev.touches[0].clientX:ev.clientX, cy=(ev.touches&&ev.touches[0])?ev.touches[0].clientY:ev.clientY;
      return {x:(cx-r.left)*kx, y:(cy-r.top)*ky}; }
    cv.addEventListener("pointerdown",function(ev){ ev.preventDefault(); drawing=true; cur={color:color,width:lw,pts:[pt(ev)]}; strokes.push(cur); redraw(); try{cv.setPointerCapture(ev.pointerId);}catch(e){} });
    cv.addEventListener("pointermove",function(ev){ if(!drawing)return; ev.preventDefault(); cur.pts.push(pt(ev)); redraw(); });
    cv.addEventListener("pointerup",function(){ drawing=false; });
    cv.addEventListener("pointercancel",function(){ drawing=false; });
    function closeOv(){ ov.remove(); window._shotOverlayBack=null; var fab=document.getElementById("shotFab"); if(fab)fab.style.display=""; }
    // Systémové Zpět = vrátit poslední tah (jako horní „↶ Zpět"); prázdné → zavřít.
    window._shotOverlayBack=function(){ if(strokes.length){ strokes.pop(); redraw(); return true; } closeOv(); return true; };
    function doSend(){
      send.disabled=true; send.textContent="⏳ Posílám…";
      var data; try{ data=cv.toDataURL("image/png"); }catch(e){ send.disabled=false; send.textContent="📤 Claudovi"; _shotToast("⚠️ Snímek nelze uložit (CORS)"); setTimeout(_shotToastHide,2200); return; }
      api("POST","/api/v1/erp/app/screenshot",{img_b64:data, note:(note.value||"").trim(), target:"claude"}).then(function(j){
        if(j&&j.ok){ closeOv(); _shotToast("✅ Odesláno Claudovi"); setTimeout(_shotToastHide,1800); }
        else { send.disabled=false; send.textContent="📤 Claudovi"; _shotToast("⚠️ "+((j&&j.error)||"nepodařilo se odeslat")); setTimeout(_shotToastHide,2600); }
      }).catch(function(){ send.disabled=false; send.textContent="📤 Claudovi"; _shotToast("⚠️ Nepodařilo se odeslat"); setTimeout(_shotToastHide,2600); });
    }

  function isdsLoadMsgs(accLabels){
    var box=document.getElementById("isdsMsgs"); if(!box)return;
    accLabels=accLabels||[];
    api("GET","/api/v1/erp/app/isds/messages","").then(function(j){
      var msgs=(j&&j.ok&&j.messages)?j.messages:[];
      if(!msgs.length && !accLabels.length){ box.innerHTML='<div class="hint" style="padding:6px 2px">Zatím žádné stažené zprávy.</div>'; return; }
      var open=(window._isdsOpen=window._isdsOpen||{});         // pamatuje rozbalení firem (do zavření appky)
      var PAL=["#3b82f6","#22c55e","#f59e0b","#a855f7","#ec4899","#14b8a6","#ef4444"];
      function pad(n){ return (n<10?"0":"")+n; }
      function plnew(n){ return n===1?"1 nová":((n>=2&&n<=4)?(n+" nové"):(n+" nových")); }
      function typeInfo(m){
        var t=(m.msg_type||"").toLowerCase(), su=(m.subject||"").toLowerCase();
        if(t.indexOf("neschop")>=0) return {ic:"🤒",tag:"ČSSZ neschopenka"};
        if(t==="ocr"||su.indexOf("očr")>=0||su.indexOf("ošetř")>=0) return {ic:"👶",tag:"ČSSZ OČR"};
        if(su.indexOf("daňov")>=0||su.indexOf("doklad")>=0) return {ic:"🧾",tag:"Daňový doklad"};
        if(su.indexOf("podán")>=0||su.indexOf("protokol")>=0||su.indexOf("hlášení")>=0) return {ic:"📄",tag:"ePodání"};
        if(su.indexOf("registr")>=0) return {ic:"🏛️",tag:"Registr"};
        return {ic:"✉️",tag:""};
      }
      var now=new Date(), today=new Date(now.getFullYear(),now.getMonth(),now.getDate());
      function parseDelivered(s){
        s=(s||"").trim(); if(!s) return null;
        var sp=s.split(" "), dp=(sp[0]||"").split("."), tp=sp[1]||"";
        if(dp.length<3) return null;
        var dd=+dp[0], mm=+dp[1], yy=+dp[2];
        if(!yy) return null;
        var dt=new Date(yy,mm-1,dd);
        var diff=Math.round((today-dt)/86400000);
        var lbl=(diff===0)?"Dnes":((diff===1)?"Včera":(pad(dd)+". "+pad(mm)+". "+yy));
        return {time:tp.slice(0,5), dayLabel:lbl};
      }
      // seskupení po firmách — tlačítko vznikne pro KAŽDOU datovku (i s 0 zprávami),
      // v pořadí podle seznamu firem; případné ostatní se přidají na konec.
      var byco={};
      function _grp(key){ var g=byco[key]; if(!g){ g={key:key,msgs:[],nnew:0}; byco[key]=g; } return g; }
      accLabels.forEach(function(lbl){ _grp(lbl||"(bez názvu)"); });
      msgs.forEach(function(m){
        var g=_grp(m.company_label||"(bez názvu)");
        g.msgs.push(m);
        if(((m.status||"").toLowerCase())==="new") g.nnew++;
      });
      var groups=[], seen={};

  function ucBarrier(f){ var c=(f.caption||"").toLowerCase(); if(c.indexOf("slovo")>=0)return"word"; if(c.indexOf("masy")>=0)return"mass"; if(c.indexOf("gradient")>=0)return"gradient"; if(f.source&&f.source.indexOf("electro")===0)return"mass"; return"none"; }
  function ucLoad(){
    var box=document.getElementById("ucBox"); if(box) box.innerHTML='<div class="hint" style="padding:20px;text-align:center;">Načítám…</div>';

  function ucRender(){
    var W=window._uc, box=document.getElementById("ucBox"); if(!box) return;
    var FR=W.FR;

      box.innerHTML='<div style="text-align:center;padding:28px 10px;"><div style="font-size:38px;color:var(--green);">✓</div><div style="font-size:17px;font-weight:700;margin:8px 0 4px;">Hotovo</div><div class="hint">Tři tlačítka, tvoje tempo — žádná bariéra nezůstala stát.</div></div>';

    }
    var f=FR[W.i];
    var dots=FR.map(function(_,k){return '<span style="width:7px;height:7px;border-radius:50%;display:inline-block;margin:0 3px;background:'+(k===W.i?"var(--blue,#4f8ef7)":(k<W.i?"var(--mut)":"var(--bord)"))+';"></span>';}).join("");
    var h='<div style="text-align:center;margin-bottom:10px;">'+dots+'</div>';
    h+='<div style="background:rgba(255,255,255,.03);border:1px solid var(--bord);border-radius:16px;padding:16px;">';
    if(f.caption) h+='<div style="font-size:13px;font-weight:600;color:var(--mut);margin-bottom:8px;">'+esc(f.caption)+'</div>';

  }
  setTimeout(autoCapturePhone, 1500);

  // ── Nová verze → lišta nahoře, klik = HARD reload (Marti 7.6.) ──────────
  // Marti 7.6. večer fix „detail Not Found": reload AŽ když /mobile odpoví 200.
  // Hned po deployi se primární API restartuje (~5 s) a Caddy spadne na
  // secondary (starší snapshot bez /mobile) → 404 bílá obrazovka. Sondujeme.
  var _verLoaded=null;
  function _verHardReload(){
    var done=false, started=false;
    var bar=document.getElementById("verBar");
    function probe(tries){
      if(done) return;
      if(bar) bar.textContent="⏳ Obnovuji… (čekám na server)";
      fetch("/mobile",{cache:"no-store",credentials:"same-origin"}).then(function(r){
        if(r&&r.ok){ if(!done){ done=true; try{location.reload();}catch(e){location.href="/mobile";} } }
        else if(tries<10){ setTimeout(function(){probe(tries+1);},2000); }
        else if(!done){ done=true; try{location.reload();}catch(e){} }
      }).catch(function(){
        if(tries<10){ setTimeout(function(){probe(tries+1);},2000); }
        else if(!done){ done=true; try{location.reload();}catch(e){} }
      });
    }
    function go(){ if(started)return; started=true; probe(0); }
    try{
      var ps=[];
      if(window.caches&&caches.keys) ps.push(caches.keys().then(function(ks){ return Promise.all(ks.map(function(k){ return caches.delete(k); })); }));
      if(navigator.serviceWorker&&navigator.serviceWorker.getRegistrations) ps.push(navigator.serviceWorker.getRegistrations().then(function(rs){ return Promise.all(rs.map(function(r){ return r.update(); })); }));
      Promise.all(ps).then(go,go); setTimeout(go,2500);
    }catch(e){ go(); }
  }
  function _verTick(){
    try{
      fetch("/api/v1/erp/app-version",{cache:"no-store",credentials:"same-origin"})
        .then(function(r){ return r.ok?r.json():null; })
        .then(function(j){
          var v=j&&j.version; if(!v||v==="unknown")return;
          if(_verLoaded===null){ _verLoaded=v; return; }
          if(v!==_verLoaded && !document.getElementById("verBar")){
            var b=el('<div id="verBar" style="position:fixed;top:74px;left:10px;right:10px;z-index:90;background:#3a2f12;border:1px solid #6e5326;border-radius:10px;box-shadow:0 6px 18px rgba(0,0,0,.4);color:#f0d98a;padding:11px 14px;font-size:13.5px;text-align:center;cursor:pointer;">🔄 Nová verze STRATEGIE — klepni pro obnovení</div>');
            b.addEventListener("click",_verHardReload); document.body.appendChild(b);
          }
        }).catch(function(){});
    }catch(e){}
  }
  setInterval(_verTick, 30000); setTimeout(_verTick, 1200);
})();
</script>
