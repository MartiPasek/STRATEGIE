<script>
/* Bílá smrt → viditelná chyba (Marti 7.6.). Chytá i parse error dalšího scriptu. */
window.onerror=function(msg,src,line){
  try{
    var d=document.getElementById("bootErr");
    if(!d){ d=document.createElement("div");
      d.id="bootErr";
      d.style.cssText="position:fixed;top:10px;left:10px;right:10px;z-index:99999;background:#3a1f24;border:1px solid #6e3540;border-radius:10px;padding:12px;color:#e08a8a;font:13px/1.5 system-ui;";
      document.body.appendChild(d); }
    d.innerHTML="⚠ Appka narazila na chybu — pošli mi prosím screenshot:<br><b>"
      +String(msg).replace(/</g,"&lt;")+"</b><br>řádek "+line
      +'<br><button onclick="location.reload()" style="margin-top:8px;padding:8px 14px;border:none;border-radius:8px;background:#4f8ef7;color:#fff;">🔄 Zkusit znovu</button>';
  }catch(e){}
  return false;
};
/* Marti 9.6.: promise chyby taky zviditelnit (onerror je nechytá). */
window.addEventListener("unhandledrejection", function(ev){
  try{ if(window.onerror) window.onerror("Promise: "+((ev&&ev.reason&&(ev.reason.message||ev.reason))||"?"),"",0); }catch(e){}
});
/* Boot watchdog: když appka do 7 s nenastartuje (prázdný shell / SW bílá smrt
   / parse error), ukaž záchranu s tlačítky místo bílé obrazovky. */
window.__stgBoot=false;
setTimeout(function(){
  if(window.__stgBoot) return;
  try{
    if(document.getElementById("bootErr")) return;
    var o=document.createElement("div");
    o.style.cssText="position:fixed;inset:0;z-index:99998;background:#0e1622;color:#e6edf5;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;text-align:center;font:16px/1.5 system-ui;";
    o.innerHTML='<div style="font-size:42px">🛠️</div><div style="font-size:18px;font-weight:700">Appka se nenačetla</div><div style="color:#9fb0c2;font-size:14px;max-width:300px">Nejspíš zůstala stará verze v paměti. Klepni na Vyčistit a načíst.</div>';
    var b=document.createElement("button");
    b.textContent="🧹 Vyčistit a načíst";
    b.style.cssText="background:#10b981;color:#04150e;border:0;border-radius:12px;padding:14px 22px;font-size:16px;font-weight:700;";
    b.onclick=function(){ (async function(){ try{var rs=await navigator.serviceWorker.getRegistrations();for(var i=0;i<rs.length;i++){await rs[i].unregister();}}catch(e){} try{var ks=await caches.keys();for(var j=0;j<ks.length;j++){await caches.delete(ks[j]);}}catch(e){} location.reload();})(); };
    o.appendChild(b);
    var b2=document.createElement("button");
    b2.textContent="🔄 Jen zkusit znovu";
    b2.style.cssText="background:#1b2738;color:#e6edf5;border:1px solid #2a3a4d;border-radius:12px;padding:12px 20px;font-size:15px;";
    b2.onclick=function(){ location.reload(); };
    o.appendChild(b2);
    document.body.appendChild(o);
  }catch(e){}
}, 7000);
</script>

  var _tapAC=null;
  function _tapFeedback(){
    try{ if(navigator.vibrate) navigator.vibrate(12); }catch(e){}
    try{
      _tapAC=_tapAC||new (window.AudioContext||window.webkitAudioContext)();
      if(_tapAC.state==="suspended") _tapAC.resume();
      // Marti 8.6.: jemněji — tišší, měkčí a kratší (sotva slyšitelný ťuk)
      var o=_tapAC.createOscillator(), g=_tapAC.createGain();
      o.type="sine"; o.frequency.value=620;
      g.gain.setValueAtTime(0.005,_tapAC.currentTime);
      g.gain.exponentialRampToValueAtTime(0.0004,_tapAC.currentTime+0.04);
      o.connect(g); g.connect(_tapAC.destination);
      o.start(); o.stop(_tapAC.currentTime+0.05);
    }catch(e){}
  }

  function api(method, path, body){
    // Marti 7.6. večer: během restartu API po deployi odpovídá starší secondary
    // 404 {"detail":"Not Found"} — přelož na lidskou hlášku místo ticha.
    function mk(t){
      var j=null; try{ j=t?JSON.parse(t):null; }catch(e){ return null; }
      if(j && j.detail==="Not Found") return {ok:false,error:"Server se právě aktualizuje — zkus to za pár vteřin."};
      return j;
    }
    if (canFetch){ try{ var t=B.authedFetch(method,path,body?JSON.stringify(body):""); return Promise.resolve(mk(t));}catch(e){return Promise.resolve(null);} }
    var o={method:method,credentials:"same-origin",headers:{}};
    if(body){o.headers["Content-Type"]="application/json";o.body=JSON.stringify(body);}
    return fetch(path,o).then(function(r){ return r.text().then(mk); }).catch(function(){return null;});
  }

  function _phoneVerifyCard(dev){
    var c=document.getElementById("homeVerify"); if(!c) return;
    c.innerHTML="";
    var card=el('<div class="doch-pulse" style="margin:10px 0;background:rgba(224,176,112,.10);border:1px solid #6e5326;border-radius:12px;padding:12px;"></div>');

        // Marti 8.6.: appka zkusí poslat SMS sama (B.sendSms), ALE novější
        // Androidy (Samsung S24) blokují SEND_SMS pro ne-výchozí SMS appku →
        // tiché selhání. Proto VŽDY otevřeme i Zprávy s předvyplněným textem
        // (Šárčin telefon) — uživatel jen klikne Odeslat. Funguje na 100 %.
        var sent=false;
        if(B && typeof B.sendSms==="function"){
          var r=""; try{ r=B.sendSms(j.send_to, j.body||j.token); }catch(e){ r="0"; }
          sent=(r==="1");
        }
        if(!sent){
          // Otevři Zprávy s předvyplněným tělem — spolehlivá cesta všude.
          openApp("sms:"+j.send_to+"?body="+encodeURIComponent(j.body||j.token));
        }
        st.textContent=sent?"📨 SMS odeslána — čekám na ověření…":"📨 V aplikaci Zprávy klikni Odeslat a vrať se — čekám…";
        var tries=0;
        var iv=setInterval(function(){
          if(!document.body.contains(card)){ clearInterval(iv); return; }
          if(++tries>45){ clearInterval(iv); b.disabled=false; st.textContent="⏳ SMS zatím nedorazila — zkus to znovu."; return; }
          api("GET","/api/v1/erp/app/phone-verify/status?token="+encodeURIComponent(j.token),"").then(function(r){
            if(r&&r.verified){
              clearInterval(iv);
              card.classList.remove("doch-pulse");

            }
          });
        },4000);
      });
    });
    card.appendChild(b); card.appendChild(st);
    c.appendChild(card);
  }

  function stDetail(exp,t){
    exp.innerHTML='<div class="hint" style="padding:8px;">Načítám…</div>';
    api("GET","/api/v1/erp/app/task/"+t.id,"").then(function(j){
      exp.innerHTML="";

      if(rr.length){ exp.appendChild(el('<div class="hint" style="padding:4px 6px;">Řešitelé: '+rr.map(function(x){return esc(x.jmeno)+' ('+esc(x.stav_txt)+')';}).join(', ')+'</div>')); }
      var arow=el('<div style="display:flex;gap:6px;flex-wrap:wrap;padding:8px 6px;"></div>');
      var ms=j.muj_stav;
      function sb(lbl,st,cl){ var b=el('<button class="'+(cl||"ghost")+'" style="margin:0;">'+lbl+'</button>'); b.addEventListener("click",function(){ stSetStav(t.id,st); }); arow.appendChild(b); }

      if(j.jsem_zadavatel) sb("🔒 Uzavřít",5,"ghost");
      if(arow.children.length) exp.appendChild(arow);
      exp.appendChild(el('<div style="padding:8px 6px 2px;font-weight:700;font-size:13px;color:#ffd9a8;">💬 Vlákno</div>'));
      var thread=el('<div style="display:flex;flex-direction:column;gap:6px;padding:6px;"></div>');
      var pz=(j.poznamky||[]).slice().reverse();
      if(!pz.length){ thread.appendChild(el('<div class="hint" style="text-align:center;padding:6px;">Zatím žádná zpráva. Napiš první.</div>')); }

    var lab={};
    function fmt(iso){ if(!iso) return ""; var d=new Date(iso); if(isNaN(d.getTime())) return String(iso).slice(0,16).replace("T"," "); return ("0"+d.getDate()).slice(-2)+"."+("0"+(d.getMonth()+1)).slice(-2)+". "+("0"+d.getHours()).slice(-2)+":"+("0"+d.getMinutes()).slice(-2); }
    function stMeta(st){ st=(st||"").toLowerCase(); if(st==="done"||st==="ok"||st==="finished") return {e:"✅",c:"#34d399"}; if(st==="error"||st==="failed"||st==="fail") return {e:"❌",c:"#f87171"}; if(st==="pending"||st==="ack") return {e:"⏳",c:"#fbbf24"}; return {e:"•",c:"var(--mut)"}; }

      api("GET","/api/v1/erp/app/ops/log","").then(function(j){
        hist.innerHTML="";

        if(!j.log.length){ hist.innerHTML='<div class="hint">Zatím nic nespuštěno.</div>'; return; }
        j.log.forEach(function(r){
          var m=stMeta(r.status); var nm=lab[r.action_key]||r.action_key;
          var sub=fmt(r.created_at)+(r.requested_by_name?(" · "+r.requested_by_name):"")+(r.finished_at?(" · hotovo "+fmt(r.finished_at)):"")+(r.status?(" · "+r.status):"");
          var resu=(r.result?('<div style="font-size:11px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">'+esc(String(r.result).slice(0,140))+'</div>'):'');

        });
      });
    }
    api("GET","/api/v1/erp/app/ops/actions","").then(function(j){
      acts.innerHTML="";
      if(!j||!j.ok){ acts.innerHTML='<div class="hint">Vidí jen rodiče.</div>'; loadLog(); return; }
      (j.actions||[]).forEach(function(a){ lab[a.action_key]=a.label; });
      (j.actions||[]).forEach(function(a){
        acts.appendChild(row("⚙️",a.label,"cíl: "+a.target,function(){

          api("POST","/api/v1/erp/app/ops/run",{action_key:a.action_key}).then(function(r){ alert(r&&r.ok?"Spuštěno ✓ (sleduj historii)":("Chyba: "+((r&&r.error)||"?"))); loadLog(); });
        }));
      });
      loadLog();
    });
  }

  function collSec(ulEl, title, defOpen, onToggle){
    var li=document.createElement("li");
    li.style.cssText="background:var(--surf);border:1px solid var(--bord);border-radius:12px;margin:0 0 10px;padding:0 8px;list-style:none;";
    var head=el('<div class="cthead" style="padding:13px 8px;"><span style="font-size:15px;font-weight:600;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;"></span><span class="cgv" style="color:var(--tx);font-weight:700;white-space:nowrap;"></span><span class="cgch" style="margin-left:6px;color:var(--mut);font-size:12px;">▼</span></div>');
    head.firstChild.textContent=title;
    var box=el('<div style="display:none;padding:0 8px 12px;"></div>');
    function close(){ box.style.display="none"; head.querySelector(".cgch").textContent="▼"; li.style.borderColor="var(--bord)"; li.style.background="var(--surf)"; if(onToggle)onToggle(false); }
    function setOpen(o){
      if(o){ (ulEl._secs||[]).forEach(function(s){ if(s.box!==box) s.close(); }); }
      box.style.display=o?"block":"none"; head.querySelector(".cgch").textContent=o?"▲":"▼";
      li.style.borderColor=o?"#2a4d80":"var(--bord)"; li.style.background=o?"rgba(79,142,247,.07)":"var(--surf)";
      if(onToggle)onToggle(o);
    }
    head.addEventListener("click",function(){ setOpen(box.style.display==="none"); });
    li.appendChild(head); li.appendChild(box); ulEl.appendChild(li);
    ulEl._secs=ulEl._secs||[]; ulEl._secs.push({box:box, close:close});
    if(defOpen) setOpen(true);
    return {box:box, val:head.querySelector(".cgv"), ttl:head.firstChild};
  }

      function martiMsgBuild(box){
        var ta=el('<textarea rows="3" placeholder="Jsem tu, tak povídej…" style="width:100%;background:#0f1620;border:1px solid var(--green);box-shadow:0 0 0 2px rgba(16,185,129,.18);border-radius:10px;padding:11px;color:var(--tx);font-size:15px;font-family:inherit;"></textarea>');

        // Marti 7.6. večer: scrollovací okno odpovědi + polling — odpověď dorazí
        // PŘÍMO sem do menu, i když to trvá déle (notifikace je jen bonus).
        var reply=el('<div style="display:none;margin-top:10px;background:rgba(79,142,247,.08);border:1px solid #2a4d80;border-radius:10px;padding:12px;font-size:14px;line-height:1.5;white-space:pre-wrap;max-height:45vh;overflow-y:auto;"></div>');
        function busy(t){ st.textContent=t; }
        var mmAfter=0;
        function showReply(txt){
          send.disabled=false; rec.disabled=false;
          reply.style.display="block"; reply.textContent=txt; ta.value="";
          try{ reply.scrollIntoView({behavior:"smooth",block:"nearest"}); }catch(e){}
        }
        function doSend(payload){
          busy("💭 Tvoje Marti přemýšlí…"); send.disabled=true; rec.disabled=true;
          api("GET","/api/v1/erp/app/marti-message/last","").then(function(b0){ mmAfter=(b0&&b0.id)||0; });
          api("POST","/api/v1/erp/app/marti-message",payload).then(function(j){
            if(j&&j.ok){
              busy("✅ Odpovězeno");
              showReply((payload.audio_b64&&j.transcript?("🎙 Rozuměla jsem: „"+j.transcript+"“\n\n"):"")+(j.reply||""));
            } else if(j&&j.error){ send.disabled=false; rec.disabled=false; busy("✗ "+j.error); }
            else { busy("⏳ Trvá to déle — odpověď se ukáže tady v Docházce…"); _mmStartPoll(mmAfter); }
          }).catch(function(){ busy("⏳ Trvá to déle — odpověď se ukáže tady v Docházce…"); _mmStartPoll(mmAfter); });
        }
        send.addEventListener("click",function(){ var t=(ta.value||"").trim(); if(t) doSend({text:t}); });
        var recState=null;
        function fileFallback(){
          var fi=el('<input type="file" accept="audio/*" capture style="display:none;">');
          fi.addEventListener("change",function(){
            var f=fi.files&&fi.files[0]; if(!f)return;
            if(f.size>6*1024*1024){ busy("✗ Nahrávka je moc velká (max ~6 MB)."); return; }
            var fr=new FileReader();
            fr.onload=function(){ doSend({audio_b64:String(fr.result).split(",")[1],mime:f.type||"audio/m4a",filename:f.name||"audio"}); };
            fr.readAsDataURL(f);

          if(recState){ try{recState.stop();}catch(e){} return; }
          if(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia&&window.MediaRecorder){
            navigator.mediaDevices.getUserMedia({audio:true}).then(function(stream){
              window.__micStream=stream;
              var chunks=[]; var mr=new MediaRecorder(stream);

              mr.onstop=function(){
                stream.getTracks().forEach(function(t){t.stop();}); window.__micStream=null;
                rec.textContent="🎙"; recState=null;
                var blob=new Blob(chunks,{type:mr.mimeType||"audio/webm"});

                fr.readAsDataURL(blob);
              };
              mr.start(); recState=mr;
              rec.textContent="⏹"; busy("🔴 Nahrávám… (klepni ⏹)");
            }).catch(function(){ if(B){ busy("🎙 Povol prosím mikrofon a klepni znovu."); } else { fileFallback(); } });
          } else if(B){ busy("🎙 Mikrofon tu není dostupný."); }
          else { fileFallback(); }

        box.appendChild(ta);
        brow.appendChild(send); brow.appendChild(rec); box.appendChild(brow);
        box.appendChild(st); box.appendChild(reply);

  function paskaLoad(y,m){
    var box=document.getElementById("paskaBox"); if(!box)return;
    api("POST","/api/v1/erp/app/payslip",{y:y||0,m:m||0,pin:_paskaPin||""}).then(function(j){
      box=document.getElementById("paskaBox"); if(!box)return;
      if(j&&j.error==="on_shift"){
        box.innerHTML='<div class="hint">💼 Teď jsi v práci — páska počká. Otevřeš ji po odchodu nebo na pauze.</div>';
        return;
      }
      if(j&&j.error==="pin_not_set"){ paskaPinSetup(); return; }
      if(j&&(j.error==="pin_required"||j.error==="pin_wrong"||j.error==="pin_locked")){ paskaPinEntry(j); return; }
      if(!j||!j.ok){ box.innerHTML='<div class="hint">Pásku se nepodařilo načíst.</div>'; return; }
      if(!j.items||!j.items.length){ box.innerHTML='<div class="hint">'+esc(j.note||"Zatím žádné pásky.")+'</div>'; if(_dS&&_dS.paska)_dS.paska.val.textContent=""; return; }
      var ps=j.periods||[]; var idx=-1;
      for(var i2=0;i2<ps.length;i2++){ if(ps[i2].y===j.y&&ps[i2].m===j.m){ idx=i2; break; } }
      var hd=el('<div style="display:flex;align-items:center;gap:8px;margin:2px 0 8px;"></div>');
      var bPrev=el('<button class="ghost sm">◀</button>');
      var bNext=el('<button class="ghost sm">▶</button>');
      hd.appendChild(bPrev);
      hd.appendChild(el('<div style="flex:1;text-align:center;font-weight:700;">'+esc(_CZ_MES[j.m]||j.m)+' '+j.y+'</div>'));
      hd.appendChild(bNext);
      // periods jsou DESC: další v poli = starší
      bPrev.disabled = idx < 0 || idx >= ps.length-1;
      bNext.disabled = idx <= 0;
      bPrev.addEventListener("click",function(){ var p=ps[idx+1]; if(p) paskaLoad(p.y,p.m); });
      bNext.addEventListener("click",function(){ var p=ps[idx-1]; if(p) paskaLoad(p.y,p.m); });
      box.innerHTML=""; box.appendChild(hd);
      // Marti 7.6.: dvě firmy = DVĚ samostatné pásky, každá s plnou hlavičkou.
      var firmy={}; var poradi=[];
      j.items.forEach(function(it){
        var k=it.firma||"?";
        if(!firmy[k]){ firmy[k]={nazev:it.firma_nazev||k, items:[]}; poradi.push(k); }
        firmy[k].items.push(it);
      });
      var celkemVyplata=0;
      poradi.forEach(function(fk){
        var f=firmy[fk];
        var card=el('<div style="background:var(--bg);border:1px solid var(--bord);border-radius:12px;padding:12px;margin-bottom:10px;"></div>');
        card.appendChild(el('<div style="font-weight:700;font-size:14.5px;">🏢 '+esc(f.nazev)+'</div>'));
        card.appendChild(el('<div class="hint" style="margin:2px 0 8px;">Výplatní páska · '+esc(j.jmeno||"")+' · '+esc(_CZ_MES[j.m]||j.m)+' '+j.y+'</div>'));
        // Marti 7.6.: lidská struktura — 1) co firma poskytla (vč. odvodů firmy)
        // 2) FIRMA DALA CELKEM (superhrubá) 3) červené srážky (sleva na dani +)
        // 4) zelená Výplata na účet. Klasifikace dle názvu — doladí Šárka.
        var dal=[], firmaOdvody=[], srazky=[], vyp=[];
        f.items.forEach(function(it){
          var n=(it.nazev||"").toLowerCase();
          if(it.kc===0 && !it.hod && !it.dny) return;          // nulové technické řádky skrýt
          if(n.substring(0,7)==="výplata"){ vyp.push(it); return; }
          if(n.indexOf("firma")>=0){ firmaOdvody.push(it); return; }  // odvody firmy → dolů červeně (Marti: „to je teprve síla")
          if(it.hruba || n.indexOf("paušál")>=0 || n.indexOf("pausal")>=0
             || n.indexOf("stravenk")>=0 || n.indexOf("benefit")>=0 || n.indexOf("náhrad")>=0
             || (!it.kc && (it.hod||it.dny))){ dal.push(it); return; }
          srazky.push(it);
        });
        function radek(it, mode){  // mode: 'plus' | 'minus' | 'sleva'
          var kc="";
          if(it.kc!=null){
            var v=Math.round(it.kc).toLocaleString("cs")+" Kč";
            kc = (mode==="minus") ? ("− "+v) : ((mode==="sleva") ? ("+ "+v) : v);
          }
          var col = (mode==="minus") ? "var(--red)" : ((mode==="sleva") ? "var(--green)" : "var(--tx)");
          var sub=(it.hod?(it.hod+" h"):"")+(it.dny?((it.hod?" · ":"")+it.dny+" dní"):"");
          return el('<li style="display:flex;justify-content:space-between;align-items:center;gap:8px;">'
            +'<span class="nt" style="font-size:13.5px;'+(mode==="minus"?'color:var(--red);':'')+'">'+esc(it.nazev)+(sub?('<div class="sub" style="color:var(--mut);font-size:11.5px;">'+esc(sub)+'</div>'):'')+'</span>'
            +'<span class="nm" style="margin:0;white-space:nowrap;color:'+col+';">'+esc(kc)+'</span></li>');
        }
        var ul=el('<ul></ul>');
        var superhruba=0;
        dal.forEach(function(it){ superhruba+=(it.kc||0); ul.appendChild(radek(it,"plus")); });
        firmaOdvody.forEach(function(it){ superhruba+=(it.kc||0); });  // do CELKEM patří, zobrazí se dole červeně
        ul.appendChild(el('<li style="display:flex;justify-content:space-between;align-items:center;gap:8px;background:rgba(79,142,247,.08);border-radius:8px;padding:12px 8px;">'
          +'<span class="nt" style="font-weight:700;font-size:13.5px;">🏢 Firma dala celkem (superhrubá)</span>'
          +'<span class="nm" style="margin:0;white-space:nowrap;font-weight:700;">'+Math.round(superhruba).toLocaleString("cs")+' Kč</span></li>'));
        firmaOdvody.forEach(function(it){ ul.appendChild(radek(it,"minus")); });
        srazky.forEach(function(it){
          var n=(it.nazev||"").toLowerCase();
          ul.appendChild(radek(it, n.indexOf("sleva")>=0 ? "sleva" : "minus"));
        });
        var vyplata=0;
        vyp.forEach(function(it){
          vyplata+=(it.kc||0);
          ul.appendChild(el('<li style="display:flex;justify-content:space-between;align-items:center;gap:8px;background:rgba(16,185,129,.10);border-radius:8px;padding:13px 8px;">'
            +'<span class="nt" style="font-weight:700;font-size:14px;">💚 '+esc(it.nazev)+'</span>'
            +'<span class="nm" style="margin:0;white-space:nowrap;font-weight:700;color:var(--green);font-size:15px;">'+Math.round(it.kc||0).toLocaleString("cs")+' Kč</span></li>'));
        });
        card.appendChild(ul);
        box.appendChild(card);
        celkemVyplata+=vyplata;
      });
      box.appendChild(el('<div class="hint">Zdroj: mzdový systém Helios (oficiální zúčtování).</div>'));
      // Marti 7.6. večer: částka ani zámeček do hlavičky sekce NEPATŘÍ.
      if(_dS&&_dS.paska) _dS.paska.val.textContent="";
    });
  }

    function excDialog(ex, mode){
      var isEdit=!!ex;
      var t=new Date(); var today=t.getFullYear()+"-"+("0"+(t.getMonth()+1)).slice(-2)+"-"+("0"+t.getDate()).slice(-2);

      var tgtBox=el('<div></div>'); bx.appendChild(tgtBox);
      function buildTgt(){
        tgtBox.innerHTML=''; tgtSel=null;
        if(isEdit||scopeType==='firma') return;
        var arr=scopeType==='group'?((targets&&targets.groups)||[]):((targets&&targets.people)||[]);
        var opts=arr.map(function(o){ var id=(scopeType==='group'?o.id:o.user_id); return '<option value="'+id+'">'+esc(o.name)+'</option>'; }).join('');
        tgtBox.appendChild(el('<label class="hint" style="display:block;margin:4px 0 2px;">'+(scopeType==='group'?'Skupina':'Osoba')+'</label>'));
        tgtSel=el('<select style="'+inS+'">'+opts+'</select>'); tgtBox.appendChild(tgtSel);
      }
      function ensureTargets(cb){ if(targets){ cb(); return; } api("GET","/api/v1/erp/app/plan/exception-targets","").then(function(j){ targets=(j&&j.ok)?j:{groups:[],people:[]}; cb(); }); }
      if(isEdit){
        scopeBox.appendChild(el('<div class="hint">Rozsah: <b>'+(ex.kind==='firma'?'Celá firma':((ex.scope_type==='group'?'Skupina — ':'Jednotlivec — ')+esc(ex.scope_name)))+'</b></div>'));
      } else if(mode==='scope'){
        scopeBox.appendChild(el('<label class="hint" style="display:block;margin:2px 0;">Rozsah</label>'));
        var sSel2=el('<select style="'+inS+'"><option value="group">Skupina</option><option value="user">Jednotlivec</option></select>');
        sSel2.addEventListener("change",function(){ scopeType=sSel2.value; ensureTargets(buildTgt); });
        scopeBox.appendChild(sSel2);
        ensureTargets(buildTgt);
      } else {
        scopeBox.appendChild(el('<div class="hint">Rozsah: <b>Celá firma</b></div>'));
      }
      bx.appendChild(el('<label class="hint" style="display:block;margin:6px 0 2px;">Datum</label>'));
      var dI=el('<input type="date" value="'+(isEdit?ex.date:today)+'" '+(isEdit?'disabled':'')+' style="'+inS+(isEdit?'opacity:.6;':'')+'">'); bx.appendChild(dI);
      bx.appendChild(el('<label class="hint" style="display:block;margin:8px 0 2px;">Hodiny (0 = volno · jinak počet odpracovaných hodin, i pracovní víkend)</label>'));
      var hI=el('<input type="number" min="0" max="12" step="0.5" value="'+(isEdit?ex.hours:0)+'" style="'+inS+'">'); bx.appendChild(hI);
      var rI=el('<input type="text" placeholder="Důvod (volitelné)" style="'+inS+'margin-top:8px;">'); bx.appendChild(rI);
      if(isEdit) rI.value=ex.reason||"";
      var bs=el('<div style="display:flex;gap:8px;margin-top:12px;"></div>');
      var cancel=el('<button class="ghost" style="flex:1;">Zavřít</button>');
      var save=el('<button class="green" style="flex:1;">Uložit</button>');
      cancel.addEventListener("click",function(){ ov.remove(); });
      save.addEventListener("click",function(){
        var hrs=parseFloat(hI.value)||0, reason=rI.value; save.disabled=true;
        var done=function(r){ if(r&&r.ok){ ov.remove(); renderExc(); } else { save.disabled=false; alert("Chyba: "+((r&&r.error)||"?")); } };
        if(isEdit){
          if(ex.kind==='firma') api("POST","/api/v1/erp/app/plan/exceptions",{date:ex.date,hours:hrs,reason:reason}).then(done);
          else api("POST","/api/v1/erp/app/plan/scope-exceptions",{scope_type:ex.scope_type,scope_id:ex.scope_id,date:ex.date,hours:hrs,reason:reason}).then(done);
        } else if(scopeType==='firma'){
          api("POST","/api/v1/erp/app/plan/exceptions",{date:dI.value,hours:hrs,reason:reason}).then(done);
        } else {
          if(!tgtSel||!tgtSel.value){ save.disabled=false; alert("Vyber "+(scopeType==='group'?'skupinu':'osobu')+"."); return; }
          api("POST","/api/v1/erp/app/plan/scope-exceptions",{scope_type:scopeType,scope_id:parseInt(tgtSel.value,10),date:dI.value,hours:hrs,reason:reason}).then(done);
        }
      });
      bs.appendChild(cancel); bs.appendChild(save); bx.appendChild(bs);
      if(isEdit){
        var del=el('<button class="ghost full" style="margin-top:8px;color:#f87171;border-color:#5a2b2b;">🗑 Smazat výjimku</button>');
        del.addEventListener("click",function(){
          if(!confirm("Smazat výjimku "+czd2(ex.date)+"?")) return; del.disabled=true;
          var done=function(r){ if(r&&r.ok){ ov.remove(); renderExc(); } else { del.disabled=false; alert("Chyba: "+((r&&r.error)||"?")); } };
          if(ex.kind==='firma') api("POST","/api/v1/erp/app/plan/exceptions/delete",{date:ex.date}).then(done);
          else api("POST","/api/v1/erp/app/plan/scope-exceptions/delete",{id:ex.id}).then(done);
        });
        bx.appendChild(del);
      }
      ov.appendChild(bx); document.body.appendChild(ov);
      ov.addEventListener("click",function(ev){ if(ev.target===ov) ov.remove(); });
    }
    renderPlan();
  }

  function render(){

    catch(e){

  window.__stgBoot=true;  // appka úspěšně nastartovala → watchdog se nespustí
  // ── Zámek sdíleného telefonu (Claude-24 + Kristý 11.6.2026): při otevření
  //    appky vyber profil + PIN. JEN sdílené telefony (shared_device_user) s
  //    aspoň jedním PINem. E-mailový únik vždy (i při rozbité SMS se nikdo
  //    nezamkne venku). Reuse /app/shared/users + /app/shared/switch.
  (function pinLockGate(){
    var LOGIN_URL="/api/v1/auth/sms-login?next=/mobile";
    // Právě ověřeno e-mailem/SMS? Server nastavil krátkodobý marker stg_pin_skip
    // → tenhle jeden start přeskoč zámek a marker smaž (další otevření zase zamkne).
    try{ if(/(?:^|;\s*)stg_pin_skip=1\b/.test(document.cookie||"")){ document.cookie="stg_pin_skip=; max-age=0; path=/"; return; } }catch(e){}
    var cover;
    try{ cover=el('<div id="pinLock" style="position:fixed;inset:0;z-index:99999;background:#040a12;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;text-align:center;"></div>'); document.body.appendChild(cover); }catch(e){ return; }
    function unlock(){ try{ cover.remove(); }catch(e){} }
    function emailBtn(label){ var b=el('<button class="ghost full" style="max-width:300px;opacity:.9;">'+label+'</button>'); b.addEventListener("click",function(){ location.href=LOGIN_URL; }); return b; }
    function loadAndRender(){
      cover.innerHTML='<div class="hint">Načítám…</div>';
      api("GET","/api/v1/erp/app/shared/users?dk="+encodeURIComponent(devKey()),"").then(function(j){
        var us=(j&&j.users)||[];
        var anyPin=us.some(function(u){ return u.has_pin; });
        if(!j||!j.ok||us.length<1||!anyPin){ unlock(); return; }  // jen sdílený telefon s aspoň 1 PINem
        renderPicker(us);
      }).catch(function(){ unlock(); });
    }
    function renderPicker(us){
      cover.innerHTML="";
      cover.appendChild(el('<div style="font-size:20px;font-weight:800;">🔒 Sdílený telefon</div>'));
      cover.appendChild(el('<div class="hint" style="max-width:300px;">Vyber sebe a zadej svůj PIN.</div>'));
      var list=el('<div style="display:flex;flex-direction:column;gap:8px;width:100%;max-width:300px;"></div>');
      us.forEach(function(u){
        var b=el('<button class="ghost full" style="display:flex;align-items:center;gap:10px;justify-content:flex-start;margin:0;"><div class="cav" style="background:'+avColor(u.jmeno||"?")+';">'+vyInitial(u.jmeno||"?")+'</div><div style="flex:1;text-align:left;">'+esc(u.jmeno||"")+'</div>'+(u.has_pin?"":'<span class="hint" style="font-size:11px;">bez PINu</span>')+'</button>');
        b.addEventListener("click",function(){ pickUser(u); });
        list.appendChild(b);
      });
      cover.appendChild(list);
      cover.appendChild(emailBtn("✉️ Přihlásit se e-mailem"));
    }
    function pickUser(u){
      cover.innerHTML="";
      cover.appendChild(el('<div style="font-size:18px;font-weight:700;">'+esc(u.jmeno||"")+'</div>'));
      if(!u.has_pin){
        cover.appendChild(el('<div class="hint" style="max-width:300px;">Tenhle profil zatím nemá PIN. Přihlas se e-mailem (PIN si pak nastavíš ve „Sdílený telefon").</div>'));
        cover.appendChild(emailBtn("✉️ Přihlásit se e-mailem"));
        var bk0=el('<button class="ghost" style="max-width:300px;">‹ Zpět na výběr</button>'); bk0.addEventListener("click",loadAndRender); cover.appendChild(bk0);
        return;
      }
      var st=el('<div class="hint" style="min-height:18px;max-width:300px;">Zadej svůj PIN.</div>'); cover.appendChild(st);
      var pin=el('<input type="tel" inputmode="numeric" maxlength="4" placeholder="••••" style="width:160px;text-align:center;font-size:24px;letter-spacing:10px;">'); cover.appendChild(pin);
      var ok=el('<button class="green full" style="max-width:240px;">Odemknout</button>'); cover.appendChild(ok);
      var bk=el('<button class="ghost" style="max-width:240px;">‹ Zpět na výběr</button>'); bk.addEventListener("click",loadAndRender); cover.appendChild(bk);
      cover.appendChild(emailBtn("✉️ Nejde to? Přihlásit se e-mailem"));
      function submit(){
        var pv=(pin.value||"").trim();
        if(!/^[0-9]{4}$/.test(pv)){ st.textContent="PIN jsou 4 číslice."; return; }
        ok.disabled=true; st.textContent="Ověřuji…";
        api("POST","/api/v1/erp/app/shared/switch",{device_key:devKey(),user_id:u.user_id,pin:pv}).then(function(r){
          if(r&&r.ok){ unlock(); try{ if(typeof render==="function") render(); }catch(e){} }
          else { ok.disabled=false; pin.value=""; var er=(r&&r.error)||"?"; st.textContent=(er==="pin_locked")?("Moc pokusů — zkus za "+((r&&r.minutes)||15)+" min, nebo se přihlas e-mailem."):"Špatný PIN. Zkus znovu, nebo se přihlas e-mailem."; }
        }).catch(function(){ ok.disabled=false; st.textContent="Chyba spojení."; });
      }
      ok.addEventListener("click",submit);
      pin.addEventListener("keydown",function(e){ if(e.key==="Enter") submit(); });
      try{ pin.focus(); }catch(e){}
    }
    loadAndRender();
  })();
  try{ _shotSyncBtn(); }catch(e){}
  // Marti 11.6.: SMS brána (naše strana) — když je telefon brána, čte příchozí
  // SMS přes most (B.getSmsLog) a STG- tokeny POSTne na /app/sms-inbound.
  // Nepotřebuje rebuild APK; běží dokud appka žije.
  function _gwSmsForward(){
    try{
      if(!(B && typeof B.getSmsLog==="function")) return;
      var on=false; try{ on=!!(B.isSmsGateway&&B.isSmsGateway()); }catch(e){}
      if(!on) return;
      var j=null; try{ j=B.getSmsLog(""); j=j?JSON.parse(j):null; }catch(e){ return; }
      var list=(j&&j.sms)||[];
      list.forEach(function(s){
        var body=s.body||""; if(!/STG-[A-Za-z]+-/.test(body)) return;
        var num=s.number||s.address||"";
        var key="stgfwd_"+num+"_"+(s.date||s.when||"")+"_"+body.replace(/\s/g,"").slice(0,16);
        try{ if(localStorage.getItem(key)) return; }catch(e){}
        api("POST","/api/v1/erp/app/sms-inbound",{from:num,body:body}).then(function(r){
          if(r&&r.ok){ try{ localStorage.setItem(key,"1"); }catch(e){} }
        });
      });
    }catch(e){}
  }
  try{ var _gwOn=false; try{ _gwOn=!!(native&&B&&B.isSmsGateway&&B.isSmsGateway()); }catch(e){}
       if(_gwOn){ _gwSmsForward(); setInterval(_gwSmsForward, 10000); } }catch(e){}

  // Auto-zachycení čísla telefonu ze SIM (Marti 6.6.) — ať se v párování číslo
  // ukáže samo, bez ručního kroku. Uloží jen když SIM číslo lze přečíst a změnilo se.
  function autoCapturePhone(){
    try{
      if(!(B&&typeof B.simNumber==="function"&&typeof B.deviceId==="function")) return;
      var sn=(B.simNumber()||"").trim();
      if(!sn || sn.replace(/[^0-9]/g,"").length<6) return;
      var last=""; try{last=localStorage.getItem("stg_saved_phone")||"";}catch(e){}
      if(sn===last) return;
      api("POST","/api/v1/erp/app/phone-set",{phone_number:sn,device_id:B.deviceId()}).then(function(j){
        if(j&&j.ok){ try{localStorage.setItem("stg_saved_phone",sn);}catch(e){} }
      }).catch(function(){});
    }catch(e){}
  }
  setTimeout(autoCapturePhone, 1500);

  // ── Nová verze → lišta nahoře, klik = HARD reload (Marti 7.6.) ──────────
  // Marti 7.6. večer fix „detail Not Found": reload AŽ když /mobile odpoví 200.
  // Hned po deployi se primární API restartuje (~5 s) a Caddy spadne na
  // secondary (starší snapshot bez /mobile) → 404 bílá obrazovka. Sondujeme.
  var _verLoaded=null;
  function _verHardReload(){
    var done=false, started=false;
    var bar=document.getElementById("verBar");
    function probe(tries){
      if(done) return;
      if(bar) bar.textContent="⏳ Obnovuji… (čekám na server)";
      fetch("/mobile",{cache:"no-store",credentials:"same-origin"}).then(function(r){
        if(r&&r.ok){ if(!done){ done=true; try{location.reload();}catch(e){location.href="/mobile";} } }
        else if(tries<10){ setTimeout(function(){probe(tries+1);},2000); }
        else if(!done){ done=true; try{location.reload();}catch(e){} }
      }).catch(function(){
        if(tries<10){ setTimeout(function(){probe(tries+1);},2000); }
        else if(!done){ done=true; try{location.reload();}catch(e){} }
      });
    }
    function go(){ if(started)return; started=true; probe(0); }
    try{
      var ps=[];
      if(window.caches&&caches.keys) ps.push(caches.keys().then(function(ks){ return Promise.all(ks.map(function(k){ return caches.delete(k); })); }));
      if(navigator.serviceWorker&&navigator.serviceWorker.getRegistrations) ps.push(navigator.serviceWorker.getRegistrations().then(function(rs){ return Promise.all(rs.map(function(r){ return r.update(); })); }));
      Promise.all(ps).then(go,go); setTimeout(go,2500);
    }catch(e){ go(); }
  }
  function _verTick(){
    try{
      fetch("/api/v1/erp/app-version",{cache:"no-store",credentials:"same-origin"})
        .then(function(r){ return r.ok?r.json():null; })
        .then(function(j){
          var v=j&&j.version; if(!v||v==="unknown")return;
          if(_verLoaded===null){ _verLoaded=v; return; }
          if(v!==_verLoaded && !document.getElementById("verBar")){
            var b=el('<div id="verBar" style="position:fixed;top:74px;left:10px;right:10px;z-index:90;background:#3a2f12;border:1px solid #6e5326;border-radius:10px;box-shadow:0 6px 18px rgba(0,0,0,.4);color:#f0d98a;padding:11px 14px;font-size:13.5px;text-align:center;cursor:pointer;">🔄 Nová verze STRATEGIE — klepni pro obnovení</div>');
            b.addEventListener("click",_verHardReload); document.body.appendChild(b);
          }
        }).catch(function(){});
    }catch(e){}
  }
  setInterval(_verTick, 30000); setTimeout(_verTick, 1200);
})();
