<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>💰 Mzdy & odvody — naúčtováno vs zaplaceno</title>
<style>
  :root{--bg:#0a1020;--card:#111a2e;--bord:#243049;--tx:#e6eefb;--mut:#90a0bd;--accent:#5b9dff;--ok:#22c55e;--warn:#f59e0b;--bad:#ef4444}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--tx);font-family:-apple-system,Segoe UI,Roboto,sans-serif;font-size:14px}
  .wrap{max-width:960px;margin:0 auto;padding:16px}
  h1{font-size:20px;margin:0 0 2px}
  .sub{color:var(--mut);font-size:13px;margin-bottom:12px;line-height:1.5}
  .tabs{display:flex;gap:6px;margin-bottom:14px}
  .tab{background:transparent;border:1px solid var(--bord);color:var(--tx);border-radius:9px;padding:7px 16px;font-size:13px;font-weight:700;cursor:pointer}
  .tab.on{background:var(--accent);border-color:var(--accent);color:#06101f}
  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin-bottom:16px}
  .stat{background:var(--card);border:1px solid var(--bord);border-radius:12px;padding:12px 14px}
  .stat .n{font-size:18px;font-weight:800} .stat .l{color:var(--mut);font-size:12px;margin-top:2px}
  .stat .z{font-size:12.5px;margin-top:4px} .z.ok{color:var(--ok)} .z.warn{color:var(--warn)}
  table{width:100%;border-collapse:collapse;margin-top:4px}
  th,td{border:1px solid var(--bord);padding:5px 8px;font-size:12.5px;text-align:right}
  th{background:#0f1830;color:#9fb2d4} td.l,th.l{text-align:left}
  td.zust{font-weight:700} .nz{color:var(--warn)}
  .hint{color:var(--mut);padding:18px;text-align:center} .err{color:var(--bad);padding:18px}
</style>
</head>
<body>
<div class="wrap">
  <h1>💰 Mzdy & odvody — naúčtováno vs zaplaceno</h1>
  <div class="sub">Mzdy počítá Helios; my je účtujeme do deníku a párujeme bankovní platby. Naúčtováno = závazek z deníku, Zaplaceno = úhrada z banky, Zůstatek = co ještě visí (typicky prosinec placený v lednu).</div>
  <div class="tabs" id="years"></div>
  <div id="view"><div class="hint">Načítám…</div></div>
</div>
<script>
function esc(s){return(s==null?"":String(s)).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c];});}
function kc(n){return (n==null?0:Math.round(n)).toLocaleString("cs-CZ");}
function api(p){return fetch(p,{credentials:"include"}).then(function(r){
  if(!r.ok){return{ok:false,error:r.status===403?"Vidí jen účetní a vedení.":("HTTP "+r.status)};}
  return r.json();}).catch(function(){return{ok:false,error:"Spojení selhalo."};});}
var V=document.getElementById("view");
var rok=2025;
var KATS=["333 čisté mzdy","336 pojištění","342 daň"];
var MES=["","leden","únor","březen","duben","květen","červen","červenec","srpen","září","říjen","listopad","prosinec"];
function years(){document.getElementById("years").innerHTML=[2025,2026].map(function(y){return '<button class="tab'+(y===rok?' on':'')+'" data-y="'+y+'">'+y+'</button>';}).join("");
  Array.prototype.forEach.call(document.querySelectorAll(".tab"),function(b){b.onclick=function(){rok=+b.getAttribute("data-y");years();load();};});}
function load(){
  V.innerHTML='<div class="hint">Načítám…</div>';
  api("/api/v1/erp/app/uctovani/mzdy?rok="+rok).then(function(j){
    if(!j.ok){V.innerHTML='<div class="err">'+esc(j.error)+'</div>';return;}
    var h='<div class="stats">';
    KATS.forEach(function(k){var c=j.celkem[k]||{nauctovano:0,zaplaceno:0,zustatek:0};
      var zok=Math.abs(c.zustatek)<1;
      h+='<div class="stat"><div class="l">'+esc(k)+'</div><div class="n">'+kc(c.nauctovano)+' Kč</div>'+
         '<div class="z '+(zok?"ok":"warn")+'">zaplaceno '+kc(c.zaplaceno)+' · visí '+kc(c.zustatek)+'</div></div>';
    });
    h+='</div>';
    h+='<table><tr><th class="l">Měsíc</th>';
    KATS.forEach(function(k){h+='<th colspan="3">'+esc(k.split(" ")[0])+'</th>';});
    h+='</tr><tr><th class="l"></th>';
    KATS.forEach(function(){h+='<th>naúčt.</th><th>zapl.</th><th>visí</th>';});
    h+='</tr>';
    (j.mesice||[]).forEach(function(row){
      h+='<tr><td class="l">'+esc(MES[row.mesic]||row.mesic)+'</td>';
      KATS.forEach(function(k){var d=row.kat[k]||{nauctovano:0,zaplaceno:0,zustatek:0};
        h+='<td>'+kc(d.nauctovano)+'</td><td>'+kc(d.zaplaceno)+'</td><td class="zust'+(Math.abs(d.zustatek)>=1?' nz':'')+'">'+kc(d.zustatek)+'</td>';
      });
      h+='</tr>';
    });
    h+='</table>';
    if(!(j.mesice||[]).length)h+='<div class="hint">Žádná data.</div>';
    V.innerHTML=h;
  });
}
years();load();
</script>
</body>
</html>
