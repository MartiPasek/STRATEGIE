<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Neschopenky — z datovky ČSSZ</title>
<style>
  :root{--bg:#0a1018;--card:#121a25;--bord:#1f2a38;--tx:#e6edf5;--mut:#8fa0b4;--accent:#4f8ef7;--green:#34d399;--amber:#fbbf24;--red:#f87171;}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
  .wrap{max-width:1000px;margin:0 auto;padding:18px}
  h1{font-size:21px;margin:0 0 2px;font-weight:800}
  .sub{color:var(--mut);font-size:13px;margin-bottom:12px}
  .card{background:var(--card);border:1px solid var(--bord);border-radius:12px;padding:6px 10px;margin-bottom:10px}
  table{width:100%;border-collapse:collapse}
  th{font-size:11px;color:var(--mut);text-align:left;padding:7px 8px}
  td{padding:8px;border-top:1px solid rgba(255,255,255,.05);font-size:13px}
  .pill{font-size:11px;padding:1px 8px;border-radius:8px;font-weight:700}
  .s-ukonceno{background:rgba(143,160,180,.18);color:var(--mut)}
  .s-trva{background:rgba(251,191,36,.18);color:var(--amber)}
  .s-vznik{background:rgba(248,113,113,.18);color:var(--red)}
  .hint{color:var(--mut)} .err{color:#ff8a8a}
  .nolink{color:var(--amber);font-size:11px}
  b{font-weight:700}
</style>
</head>
<body>
<div class="wrap">
  <h1>🤒 Neschopenky a OČR</h1>
  <div class="sub">Z datovek ČSSZ (eNeschopenka / ošetřování člena rodiny), sloučeno do jednoho záznamu na případ (Vznik → Trvání → Ukončení).</div>
  <div id="body"><div class="hint">Načítám…</div></div>
</div>
<script>
function esc(s){return(s==null?"":String(s)).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c];});}
function api(p){return fetch(p,{credentials:"include"}).then(function(r){return r.json();});}
function stavPill(s){var m={ukonceno:"ukončeno",trva:"trvá",vznik:"vznik"};return '<span class="pill s-'+esc(s)+'">'+esc(m[s]||s)+'</span>';}
api("/api/v1/erp/app/isds/neschopenky").then(function(j){
  if(!j||!j.ok){document.getElementById("body").innerHTML='<div class="err">'+esc((j&&j.error)||"chyba (rodič only)")+'</div>';return;}
  var r=j.polozky||[];
  if(!r.length){document.getElementById("body").innerHTML='<div class="card" style="padding:14px">Žádné neschopenky. Spusť sync datovek + zpracování.</div>';return;}
  var h='<div class="sub">'+r.length+' případů</div><div class="card"><table><thead><tr><th>Typ</th><th>Zaměstnanec</th><th>Od</th><th>Do</th><th>Dní</th><th>Stav</th><th>Detail</th><th>Lékař</th></tr></thead><tbody>';
  r.forEach(function(e){
    var jm=((e.emp_jmeno||"")+" "+(e.emp_prijmeni||"")).trim();
    var typPill=(e.typ==="ocr")?'<span class="pill" style="background:rgba(79,142,247,.18);color:var(--accent)">OČR</span>':'<span class="pill" style="background:rgba(248,113,113,.18);color:var(--red)">nemoc</span>';
    var detail=(e.typ==="ocr"&&e.osetrovana_osoba)?('ošetřuje: '+esc(e.osetrovana_osoba)):esc(e.druh_nemoci||"");
    h+='<tr><td>'+typPill+'</td><td><b>'+esc(jm)+'</b>'+(e.user_id?'':' <span class="nolink">⚠ nenapojen</span>')+(e.profese?'<div class="hint" style="font-size:11px">'+esc(e.profese)+'</div>':'')+'</td>'
      +'<td>'+esc(e.od||"")+'</td><td>'+esc(e.do||"—")+'</td><td>'+(e.dni!=null?e.dni:"")+'</td>'
      +'<td>'+stavPill(e.stav)+'</td><td>'+detail+'</td><td class="hint">'+esc(e.lekar_nazev||"")+'</td></tr>';
  });
  h+='</tbody></table></div>';
  document.getElementById("body").innerHTML=h;
});
</script>
</body>
</html>
