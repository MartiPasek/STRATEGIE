<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ověření dodavatele</title>
<style>
  :root{--bg:#0e1420;--card:#151d2b;--line:#263348;--tx:#e6edf6;--dim:#93a3b8;
        --grn:#1f7a4d;--grnbg:#12331f;--grnln:#2f9d5f66;--amb:#8a6d1a;--ambbg:#33280f;--ambln:#b8860b66;
        --red:#8a2a24;--redbg:#331312;--redln:#e0524a55;--acc:#4f8ef7;}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,Segoe UI,Roboto,sans-serif;font-size:15px}
  .wrap{max-width:760px;margin:0 auto;padding:22px 16px 60px}
  h1{font-size:22px;margin:0 0 4px;font-weight:800}
  .sub{color:var(--dim);font-size:13px;margin-bottom:18px}
  .search{display:flex;gap:8px;margin-bottom:18px}
  .search input{flex:1;background:var(--card);border:1px solid var(--line);border-radius:10px;color:var(--tx);
    padding:12px 14px;font-size:16px;outline:none}
  .search input:focus{border-color:var(--acc)}
  .btn{background:var(--acc);border:none;border-radius:10px;color:#04101f;font-weight:700;padding:12px 18px;
    font-size:15px;cursor:pointer}
  .btn:disabled{opacity:.5;cursor:default}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:0;overflow:hidden;margin-top:14px}
  .verdict{padding:14px 18px;font-weight:800;font-size:16px;display:flex;align-items:center;gap:10px}
  .v-ok{background:var(--grnbg);color:#8ff0b8;border-bottom:1px solid var(--grnln)}
  .v-amb{background:var(--ambbg);color:#ffd88a;border-bottom:1px solid var(--ambln)}
  .v-red{background:var(--redbg);color:#ffb3ae;border-bottom:1px solid var(--redln)}
  .sec{padding:14px 18px;border-top:1px solid var(--line)}
  .sec:first-of-type{border-top:none}
  .sec h3{margin:0 0 10px;font-size:12px;letter-spacing:.5px;text-transform:uppercase;color:var(--dim);font-weight:700}
  .row{display:flex;gap:10px;padding:4px 0;font-size:14px}
  .row .k{color:var(--dim);min-width:130px}
  .row .val{color:var(--tx);font-weight:600}
  .badge{display:inline-block;padding:2px 9px;border-radius:20px;font-size:12px;font-weight:700}
  .b-g{background:var(--grnbg);color:#8ff0b8;border:1px solid var(--grnln)}
  .b-a{background:var(--ambbg);color:#ffd88a;border:1px solid var(--ambln)}
  .b-r{background:var(--redbg);color:#ffb3ae;border:1px solid var(--redln)}
  .ucet{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:14px;padding:6px 10px;background:#0e1622;
    border:1px solid var(--line);border-radius:8px;margin:4px 0;display:inline-block}
  .foot{color:var(--dim);font-size:12px;padding:12px 18px;border-top:1px solid var(--line);background:#111826}
  .stamp{color:#8ff0b8;font-weight:700}
  .err{color:#ffb3ae;padding:14px 18px}
  .hint{color:var(--dim);font-size:13px;padding:10px 2px}
</style>
</head>
<body>
<div class="wrap">
  <h1>🔍 Ověření dodavatele</h1>
  <div class="sub">Zadej <b>IČO</b> nebo <b>DIČ</b> — dotáhneme identitu z ARES a daňový status + zveřejněné účty od Finanční správy. Naše vlastní ověření, nezávislé na Heliosu.</div>
  <div class="search">
    <input id="q" placeholder="IČO (např. 27373231) nebo DIČ (CZ27373231)" autofocus>
    <button class="btn" id="go">Ověřit</button>
  </div>
  <div id="out"></div>
</div>
<script>
var out=document.getElementById("out"), inp=document.getElementById("q"), btn=document.getElementById("go");
function esc(s){return (s==null?"":String(s)).replace(/[&<>]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;"}[c];});}
function badge(txt,cls){return '<span class="badge '+cls+'">'+esc(txt)+'</span>';}
function verdict(a,d){
  if(a&&a.ok&&a.nalezeno===false) return ['v-red','⛔','IČO nenalezeno v ARES — ověř číslo'];
  if(a&&a.aktivni===false) return ['v-red','⛔','FIRMA ZANIKLA — neplatit!'];
  if(d&&String(d.nespolehlivy).toUpperCase()==='ANO') return ['v-red','⛔','NESPOLEHLIVÝ PLÁTCE DPH — pozor, ručení §109!'];
  if(d&&d.je_platce_dph===false) return ['v-amb','⚠️','Není plátce DPH (nebo nenalezen v registru) — ověř'];
  if(a&&a.aktivni) return ['v-ok','✅','Firma aktivní, spolehlivý plátce DPH'];
  return ['v-amb','⚠️','Ověřeno částečně — zkontroluj níže'];
}
function render(j){
  if(!j||!j.ok){out.innerHTML='<div class="card"><div class="err">'+esc((j&&(j.error||j.detail))||"Chyba")+'</div></div>';return;}
  var a=j.ares||{}, d=j.dph||{};
  var v=verdict(a,d), h='<div class="card">';
  h+='<div class="verdict '+v[0]+'"><span>'+v[1]+'</span><span>'+esc(v[2])+'</span></div>';
  // identita
  h+='<div class="sec"><h3>Identita (ARES)</h3>';
  if(a.ok&&a.nalezeno!==false){
    h+='<div class="row"><span class="k">Název</span><span class="val">'+esc(a.nazev||"—")+'</span></div>';
    h+='<div class="row"><span class="k">IČO / DIČ</span><span class="val">'+esc(j.ico)+' / '+esc(a.dic||j.dic||"—")+'</span></div>';
    h+='<div class="row"><span class="k">Adresa</span><span class="val">'+esc(a.adresa||"—")+'</span></div>';
    h+='<div class="row"><span class="k">Vznik</span><span class="val">'+esc(a.datum_vzniku||"—")+'</span></div>';
    h+='<div class="row"><span class="k">Stav</span><span class="val">'+(a.aktivni?badge("AKTIVNÍ","b-g"):badge("ZANIKLA "+(a.datum_zaniku||""),"b-r"))+'</span></div>';
  } else { h+='<div class="hint">'+esc(a.error||"ARES nedohledal")+'</div>'; }
  h+='</div>';
  // dph
  h+='<div class="sec"><h3>Daňový status (Finanční správa · ADIS)</h3>';
  if(d.ok&&d.nalezeno!==false){
    h+='<div class="row"><span class="k">Plátce DPH</span><span class="val">'+(d.je_platce_dph?badge("ANO","b-g"):badge("NE / nenalezen","b-a"))+'</span></div>';
    var ns=String(d.nespolehlivy||"").toUpperCase();
    h+='<div class="row"><span class="k">Nespolehlivý plátce</span><span class="val">'+(ns==='ANO'?badge("ANO ⛔","b-r"):badge(ns==='NE'?"NE ✓":(d.nespolehlivy||"—"),ns==='NE'?"b-g":"b-a"))+'</span></div>';
    var u=d.zverejnene_ucty||[];
    h+='<div class="row"><span class="k">Zveřejněné účty</span><span class="val">'+(u.length?"":'<span class="hint">žádné zveřejněné</span>')+'</span></div>';
    u.forEach(function(x){
      var acc=((x.predcisli&&x.predcisli!=="0")?x.predcisli+"-":"")+(x.cislo||"")+"/"+(x.kod_banky||"");
      h+='<div class="ucet">'+esc(acc)+'</div> ';
    });
  } else { h+='<div class="hint">'+esc(d.error||"Finanční správa: bez dat / služba neodpověděla")+'</div>'; }
  h+='</div>';
  h+='<div class="foot">Ověřeno námi: <span class="stamp">'+esc(j.overeno_at||"")+'</span> · zdroje: ARES + Finanční správa (registr plátců DPH). Nezávislé na Heliosu.</div>';
  h+='</div>';
  out.innerHTML=h;
}
function run(){
  var q=(inp.value||"").trim();
  if(!q){inp.focus();return;}
  btn.disabled=true;btn.textContent="Ověřuji…";out.innerHTML='<div class="hint">Dotahuji z ARES a Finanční správy…</div>';
  fetch('/api/v1/erp/app/verify-supplier?q='+encodeURIComponent(q),{credentials:'same-origin',cache:'no-store'})
    .then(function(r){return r.json();}).then(render)
    .catch(function(e){out.innerHTML='<div class="card"><div class="err">Chyba spojení: '+esc(String(e))+'</div></div>';})
    .finally(function(){btn.disabled=false;btn.textContent="Ověřit";});
}
btn.onclick=run;
inp.addEventListener("keydown",function(e){if(e.key==="Enter")run();});
</script>
</body>
</html>
