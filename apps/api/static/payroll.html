<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mzdové podklady</title>
<style>
  :root{ --bg:#0b1020; --card:#16203c; --line:#26314f; --tx:#e8eef9; --mut:#9fb0d0; --acc:#5b8def; }
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
       background:linear-gradient(160deg,#0b1020,#0e1430 60%,#0b1020);color:var(--tx);min-height:100vh}
  .wrap{max-width:1200px;margin:0 auto;padding:14px 12px 50px}
  .hd{display:flex;align-items:center;gap:10px;margin:2px 2px 10px;flex-wrap:wrap}
  .hd .ic{font-size:22px}.hd h1{font-size:17px;margin:0;font-weight:700}
  .hd .sp{flex:1}
  select{padding:8px 10px;border-radius:9px;border:1px solid var(--line);background:#0e1530;color:var(--tx);font-size:14px}
  .muted{color:var(--mut);font-size:13px;margin:4px 2px}
  .tbl{width:100%;border-collapse:collapse;font-size:12.5px;margin-top:8px}
  .tbl th,.tbl td{padding:6px 7px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
  .tbl th{position:sticky;top:0;background:#101a33;color:#bcd0f5;font-weight:700;font-size:11.5px}
  .tbl td.nm,.tbl th.nm{text-align:left;position:sticky;left:0;background:#16203c}
  .tbl th.nm{background:#101a33;z-index:2}
  .tbl tr:hover td{background:rgba(255,255,255,.03)}
  .z{color:#41506e}
  .tot td{font-weight:800;border-top:2px solid var(--acc);background:rgba(91,141,239,.08)}
  .scroll{overflow:auto;border:1px solid var(--line);border-radius:12px}
  .pill{font-size:11px;color:var(--mut)}
  .tab{padding:5px 11px;border-radius:8px;border:1px solid var(--line);background:#0e1530;color:var(--mut);
       font-size:12.5px;cursor:pointer;user-select:none}
  .tab.on{background:rgba(91,141,239,.16);color:#cfe0ff;border-color:var(--acc)}
  .ok{color:#6ddf9b}.warn{color:#ffcf6b}.bad{color:#ff8a8a}
  .badge{font-size:10.5px;padding:1px 6px;border-radius:6px}
  .badge.n{background:rgba(255,138,138,.16);color:#ff8a8a}
  .badge.h{background:rgba(255,207,107,.16);color:#ffcf6b}
  .badge.rel{background:rgba(120,170,255,.16);color:#9fc0ff}
  .rel2{color:#9fc0ff}
</style>
</head>
<body>
<div class="wrap">
  <div class="hd"><span onclick="goBackApp()" style="cursor:pointer;font-size:15px;color:#9fc0ff;padding:2px 8px 2px 0;">← Zpět</span><div class="ic">💰</div><h1>Mzdové podklady</h1>
    <span class="tab on" id="tab_p" onclick="setTab('p')">Podklady</span>
    <span class="tab" id="tab_k" onclick="setTab('k')">Kontrola vs Helios</span>
    <div class="sp"></div>
    <select id="per"></select>
  </div>
  <div class="muted" id="sub">Měsíční souhrn z docházky Centrály (hybridní fáze). Hodiny: odpracováno = montáž+režie.</div>
  <div id="root"><div class="muted">Načítám…</div></div>
</div>
<script>
function goBackApp(){ location.href="/mobile"; }
try{ history.pushState({stg:1},""); window.addEventListener("popstate",function(){ location.href="/mobile"; }); }catch(e){}
const API="/api/v1/erp/app/payroll/summary";
const APIK="/api/v1/erp/app/payroll/kontrola";
const MN=["","leden","únor","březen","duben","květen","červen","červenec","srpen","září","říjen","listopad","prosinec"];
const root=document.getElementById("root"), per=document.getElementById("per"), sub=document.getElementById("sub");
async function j(u){const r=await fetch(u,{credentials:"include"});try{return await r.json()}catch(e){return{ok:false}}}
function esc(s){return(s==null?"":String(s)).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function n(v){if(v==null||v===0)return '<span class="z">·</span>';return (Math.round(v*10)/10).toString().replace(".",",");}
function nk(v){if(v==null)return '<span class="z">·</span>';return Math.round(v).toLocaleString("cs-CZ");}
let LOADED=false, TAB='p', CY=0, CM=0;
function setTab(t){
  TAB=t;
  document.getElementById("tab_p").classList.toggle("on",t==='p');
  document.getElementById("tab_k").classList.toggle("on",t==='k');
  if(t==='k'){ sub.textContent="Naše podklady (docházka) × Helios výplatnice. Hodiny = odpracováno+absence vs. Helios; ⚠ = chybí v jednom zdroji nebo rozdíl > 4 h."; loadK(CY,CM); }
  else { sub.textContent="Měsíční souhrn z docházky Centrály (hybridní fáze). Hodiny: odpracováno = montáž+režie."; load(CY,CM); }
}
async function loadK(y,m){
  root.innerHTML='<div class="muted">Načítám kontrolu…</div>';
  const q=(y&&m)?("?rok="+y+"&mesic="+m):"";
  const r=await j(APIK+q);
  if(!r||!r.ok){root.innerHTML='<div class="muted bad">'+((r&&r.error==="forbidden")?"Kontrola je pro rodiče a Jirku.":"Chyba načtení.")+'</div>';return;}
  CY=r.rok;CM=r.mesic;
  if(!(r.rows||[]).length){root.innerHTML='<div class="muted">Za '+MN[r.mesic]+' '+r.rok+' žádná data.</div>';return;}
  const RELL={osvc:"OSVČ",dohoda:"Dohoda",jednatel:"Jednatel"};
  let onlyN=0,onlyH=0,diffN=0,osvcN=0,davkaN=0;
  let body="";
  r.rows.forEach(row=>{
    let flag="", cls="";
    const rl=row.relation&&row.relation!=="zamestnanec"?RELL[row.relation]:null;
    const bigDiff=row.rozdil_abs!=null && Math.abs(row.rozdil_abs)>2;
    if(!row.v_helios && rl){flag='<span class="badge rel">'+rl+'</span>';osvcN++;}
    else if(!row.v_helios){flag='<span class="badge n">jen u nás</span>';onlyN++;}
    else if(!row.v_nas){flag='<span class="badge h">jen Helios</span>';onlyH++;}
    else if(bigDiff && row.davka){flag='<span class="badge rel">dlouhodobá dávka</span>';davkaN++;}
    else if(bigDiff){flag='<span class="badge h">absence Δ '+(row.rozdil_abs>0?"+":"")+n(row.rozdil_abs)+' h</span>';diffN++;cls="warn";}
    else flag='<span class="ok">✓</span>'+(rl?' <span class="badge rel">'+rl+'</span>':'');
    body+='<tr><td class="nm">'+esc(row.jmeno)+'</td>'+
      '<td>'+(row.v_nas?n(row.odprac):'<span class="z">·</span>')+'</td>'+
      '<td class="'+cls+'">'+(row.v_nas?n(row.absence):'<span class="z">·</span>')+'</td>'+
      '<td class="'+cls+'">'+(row.v_helios?n(row.hel_absence):'<span class="z">·</span>')+'</td>'+
      '<td>'+nk(row.hel_hruba)+'</td><td style="text-align:center">'+flag+'</td></tr>';
  });
  const head='<tr><th class="nm">Jméno</th>'+
    '<th>Odprac.<br><span class="pill">naše měřené</span></th>'+
    '<th>Absence<br><span class="pill">naše</span></th><th>Absence<br><span class="pill">Helios</span></th>'+
    '<th>Hrubá Kč</th><th style="text-align:center">Stav</th></tr>';
  const summary='<div class="muted" style="margin:6px 2px">'+
    'Osob: <b>'+r.rows.length+'</b> · '+
    '<span class="ok">✓ absence sedí: '+(r.rows.length-onlyN-onlyH-diffN-osvcN-davkaN)+'</span> · '+
    '<span class="warn">absence Δ: '+diffN+'</span> · '+
    '<span class="rel2">dlouhodobá dávka: '+davkaN+'</span> · '+
    '<span class="warn">jen Helios: '+onlyH+'</span> · '+
    '<span class="rel2">OSVČ/dohoda (bez pásky): '+osvcN+'</span> · '+
    '<span class="bad">jen u nás: '+onlyN+'</span></div>';
  root.innerHTML=summary+'<div class="scroll"><table class="tbl"><thead>'+head+'</thead><tbody>'+body+'</tbody></table></div>'+
    '<div class="muted" style="margin-top:8px">Kontrola míří na <b>absence</b> (dovolená/nemoc/lékař…) — obě strany měří tytéž reálné události, takže se mají shodovat. „Odprac." je naše měřená práce (Helios „Základní mzda" je nominální fond, neporovnáváme). Rozdíl absencí &gt; 2 h nebo chybějící osoba = ke kontrole před uzávěrkou (typicky mateřská/dlouhá nemoc, kterou platí Helios mimo píchačku).</div>';
}
async function load(y,m){
  root.innerHTML='<div class="muted">Načítám…</div>';
  const q=(y&&m)?("?rok="+y+"&mesic="+m):"";
  const r=await j(API+q);
  if(!r||!r.ok){root.innerHTML='<div class="muted" style="color:#ff8a8a">'+((r&&r.error==="forbidden")?"Přehled je pro rodiče a Jirku.":"Chyba načtení.")+'</div>';return;}
  CY=r.rok;CM=r.mesic;
  if(!LOADED){
    per.innerHTML=(r.periods||[]).map(p=>'<option value="'+p.rok+'-'+p.mesic+'"'+((p.rok===r.rok&&p.mesic===r.mesic)?' selected':'')+'>'+MN[p.mesic]+' '+p.rok+'</option>').join('');
    per.onchange=function(){const a=per.value.split("-");CY=+a[0];CM=+a[1];(TAB==='k'?loadK:load)(CY,CM);};
    LOADED=true;
  }
  if(!(r.rows||[]).length){root.innerHTML='<div class="muted">Za '+MN[r.mesic]+' '+r.rok+' žádná data.</div>';return;}
  const cols=[["fond","Fond"],["odprac","Odprac."],["prescas","Přesčas"],["dovolena","Dovolená"],["nemoc","Nemoc"],["sickday","Sick"],["ocr","OČR"],["lekar","Lékař"],["materska","Mateřská"],["nahr_volno","Náhr.v."],["nariz_volno","Nař.v."],["prekazka","Překážka"],["absence","Absence"]];
  const tot={}; cols.forEach(c=>tot[c[0]]=0);
  let body="";
  r.rows.forEach(row=>{
    body+='<tr><td class="nm">'+esc(row.jmeno)+'</td>';
    cols.forEach(c=>{ tot[c[0]]+=(row[c[0]]||0); body+='<td>'+n(row[c[0]])+'</td>'; });
    body+='<td>'+row.dni+'</td></tr>';
  });
  let totr='<tr class="tot"><td class="nm">CELKEM ('+r.rows.length+' osob)</td>';
  cols.forEach(c=>totr+='<td>'+n(tot[c[0]])+'</td>'); totr+='<td></td></tr>';
  let head='<tr><th class="nm">Jméno</th>'+cols.map(c=>'<th>'+c[1]+'</th>').join('')+'<th>Dní</th></tr>';
  root.innerHTML='<div class="scroll"><table class="tbl"><thead>'+head+'</thead><tbody>'+body+totr+'</tbody></table></div>'+
    '<div class="muted" style="margin-top:8px">Hodnoty v hodinách. „Odprac." = montáž + režie. „Fond" = fond pracovní doby.</div>';
}
load();
</script>
</body>
</html>
