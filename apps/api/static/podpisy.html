<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Podpisy smluv — STRATEGIE</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;background:#0d1017;color:#e6e9ef;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;padding:14px}
  h1{font-size:20px;color:#8fd6c8;margin:2px 2px 12px}
  .card{background:#151a24;border:1px solid #26303f;border-radius:13px;padding:16px 18px;margin-bottom:12px}
  label{display:block;font-size:12.5px;color:#9fb0c4;margin:10px 0 4px}
  input,textarea{width:100%;padding:10px 12px;border-radius:8px;background:#0d1017;color:#e6e9ef;border:1px solid #3a4a5a;font-size:14px}
  button{background:#2dd4bf;color:#06231f;border:0;padding:10px 16px;border-radius:9px;font-size:14px;font-weight:700;cursor:pointer;margin-top:10px}
  button.sec{background:#26303f;color:#e6e9ef}
  button:disabled{opacity:.5}
  .row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:11px 12px;border:1px solid #26303f;border-radius:10px;margin-bottom:8px;cursor:pointer}
  .row:hover{border-color:#2dd4bf}
  .badge{font-size:11px;padding:3px 9px;border-radius:20px;font-weight:700;white-space:nowrap}
  .b-draft{background:#2a2f3a;color:#9fb0c4}.b-sent{background:#243a52;color:#7cc0ff}
  .b-partially_signed{background:#3a3216;color:#fbbf24}.b-completed{background:#0f2f1e;color:#5ee6a8}
  .msg{margin-top:10px;padding:11px;border-radius:8px;display:none;font-size:13.5px}
  .ok{background:#0f2f1e;border:1px solid #2c6e3f;color:#a8e6bf}.err{background:#3a1414;border:1px solid #6e2c2c;color:#ffb38a}
  .mut{color:#7c8ca0;font-size:12.5px}
  a{color:#7cc0ff}
</style>
</head>
<body>
<h1>✍️ Podpisy smluv</h1>
<div class="card">
  <b>Nová smlouva k elektronickému podpisu</b>
  <label>Název</label><input id="title" type="text" placeholder="Licenční smlouva / smlouva o certifikaci…">
  <label>Naše strana (kdo podepisuje)</label>
  <input id="our" type="text" list="ourlist" value="STRATEGIE-System s.r.o.">
  <datalist id="ourlist">
    <option value="STRATEGIE-System s.r.o."></option>
    <option value="EUROSOFT-Control s.r.o."></option>
    <option value="INTERSOFT-Automation s.r.o."></option>
  </datalist>
  <label>Protistrana — jméno / firma</label><input id="cpn" type="text" placeholder="Jan Novák, Firma s.r.o.">
  <label>E-mail protistrany</label><input id="cpe" type="text" placeholder="kontakt@firma.cz">
  <label>PDF smlouvy</label><input id="file" type="file" accept="application/pdf">
  <button id="create" type="button">Vytvořit obálku</button>
  <div id="cmsg" class="msg"></div>
</div>
<div id="list"></div>
<div id="detail"></div>
<script src="/static/nav-back.js"></script>
<script>
(function(){
  var B="/api/v1/erp/app/sign";
  function esc(s){return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
  function api(m,u,b){return fetch(u,{method:m,credentials:"include",headers:b?{"Content-Type":"application/json"}:{},body:b?JSON.stringify(b):undefined}).then(function(r){return r.json();});}
  var STAV={draft:"koncept",sent:"odesláno",partially_signed:"částečně podepsáno",completed:"podepsáno",declined:"odmítnuto"};
  function loadList(){
    api("GET",B+"/list").then(function(j){
      var L=document.getElementById("list");
      if(!j||!j.ok){L.innerHTML='<div class="card err" style="display:block">Nemáš přístup (finanční/HR okruh).</div>';return;}
      if(!j.items.length){L.innerHTML='<div class="card mut">Zatím žádné smlouvy k podpisu.</div>';return;}
      L.innerHTML='<div class="card"><b>Přehled ('+j.items.length+')</b>'+j.items.map(function(it){
        return '<div class="row" onclick="SG.open('+it.id+')"><div><div><b>'+esc(it.title)+'</b></div>'+
          '<div class="mut">'+esc(it.counterparty_name||"")+' · '+esc(it.created||"")+'</div></div>'+
          '<span class="badge b-'+it.stav+'">'+(STAV[it.stav]||it.stav)+'</span></div>';
      }).join("")+'</div>';
    });
  }
  document.getElementById("create").addEventListener("click",function(){
    var f=document.getElementById("file").files[0];
    var m=document.getElementById("cmsg");
    function show(k,t){m.className="msg "+k;m.textContent=t;m.style.display="block";}
    if(!f){show("err","Vyber PDF smlouvy.");return;}
    var title=document.getElementById("title").value.trim();
    var our=document.getElementById("our").value.trim();
    var cpn=document.getElementById("cpn").value.trim();
    var cpe=document.getElementById("cpe").value.trim();
    if(!cpn||cpe.indexOf("@")<0){show("err","Vyplň jméno a e-mail protistrany.");return;}
    var btn=document.getElementById("create");btn.disabled=true;btn.textContent="Nahrávám…";
    var rd=new FileReader();
    rd.onload=function(){
      api("POST",B+"/create",{title:title,our_party:our,counterparty_name:cpn,counterparty_email:cpe,pdf_b64:String(rd.result)})
        .then(function(j){btn.disabled=false;btn.textContent="Vytvořit obálku";
          if(j&&j.ok){show("ok","✓ Vytvořeno.");document.getElementById("file").value="";document.getElementById("title").value="";loadList();SG.open(j.id);}
          else show("err","✗ "+((j&&j.error)||"chyba"));})
        .catch(function(e){btn.disabled=false;btn.textContent="Vytvořit obálku";show("err","✗ "+e);});
    };
    rd.readAsDataURL(f);
  });
  window.SG={open:function(id){
    api("GET",B+"/"+id).then(function(j){
      var D=document.getElementById("detail");
      if(!j||!j.ok){D.innerHTML="";return;}
      var e=j.envelope, parties=j.parties||[];
      var ours=parties.filter(function(p){return p.role==="internal";})[0]||{};
      var cp=parties.filter(function(p){return p.role==="counterparty";})[0]||{};
      var h='<div class="card"><b>'+esc(e.title)+'</b> <span class="badge b-'+e.stav+'">'+(STAV[e.stav]||e.stav)+'</span>';
      h+='<div class="mut" style="margin-top:6px">Protistrana: '+esc(e.counterparty_name||"")+' ('+esc(e.counterparty_email||"")+')</div>';
      h+='<div style="margin:10px 0"><div>'+(ours.signed?"✓":"○")+' Za nás: '+esc(ours.jmeno||"")+(ours.signed?(' — '+esc(ours.podpis_text||"")):"")+'</div>';
      h+='<div>'+(cp.signed?"✓":"○")+' Protistrana: '+esc(cp.jmeno||"")+(cp.signed?(' — podepsáno'):"")+'</div></div>';
      h+='<div id="pdfimgs" style="margin:8px 0;max-height:66vh;overflow:auto;border:1px solid #2a3350;border-radius:8px;background:#20242e;padding:6px"><div class="mut" style="padding:16px;text-align:center">Načítám náhled dokumentu…</div></div>';
      h+='<a class="sec" href="'+B+'/'+id+'/pdf" target="_blank" rel="noopener" style="display:inline-block;padding:8px 12px;text-decoration:none;border-radius:8px">⤓ Otevřít PDF v novém okně</a>';
      if(!ours.signed){
        h+='<label style="display:flex;gap:8px;align-items:center;margin:12px 0 4px;font-size:14px;cursor:pointer"><input type="checkbox" id="reviewChk"> Otevřel(a) jsem si dokument výše a přečetl(a) jsem si ho.</label>';
        h+='<div id="slidewrap" style="position:relative;height:52px;background:#1b2130;border:1px solid #2a3350;border-radius:26px;margin:6px 0;overflow:hidden;user-select:none;touch-action:none;opacity:.45;pointer-events:none"><div id="slidefill" style="position:absolute;left:0;top:0;bottom:0;width:52px;background:rgba(59,130,246,.22);border-radius:26px"></div><div id="slidelbl" style="position:absolute;left:0;right:0;top:0;bottom:0;display:flex;align-items:center;justify-content:center;color:#93a4c9;font-size:14px">Přetažením doprava podepište &#8594;</div><div id="slideh" style="position:absolute;left:3px;top:3px;width:46px;height:46px;border-radius:23px;background:#3b82f6;color:#fff;display:flex;align-items:center;justify-content:center;font-size:20px;cursor:grab">✍️</div></div>';
      }
      if(e.stav!=="completed") h+='<button onclick="SG.send('+id+')">📧 Odeslat protistraně</button>';
      h+='<div id="dmsg" class="msg"></div>';
      if((j.log||[]).length){h+='<div class="mut" style="margin-top:12px"><b>Auditní stopa:</b><br>'+j.log.map(function(l){return esc(l.at)+" — "+esc(l.akce)+" — "+esc(l.kdo||"")+(l.ip?(" ("+esc(l.ip)+")"):"");}).join("<br>")+'</div>';}
      h+='</div>';
      D.innerHTML=h; D.scrollIntoView({behavior:"smooth"});
      try{SG._loadPdfImgs(id);}catch(e){}
      if(!ours.signed){ try{SG._initSlider(id);}catch(e){} }
    });
  },
  _loadPdfImgs:function(id){
    var box=document.getElementById("pdfimgs"); if(!box)return;
    api("GET",B+"/"+id+"/pages").then(function(j){
      var n=(j&&j.ok)?(j.pages||1):1; if(n>30)n=30;
      var html='<div class="mut" style="font-size:11px;text-align:center;margin-bottom:6px">Klepnutím na stránku ji zvětšíte 🔍</div>';
      for(var i=0;i<n;i++){ html+='<img src="'+B+"/"+id+"/img/"+i+'" loading="lazy" onclick="SG._zoom('+id+','+i+')" style="display:block;width:100%;border-radius:4px;margin-bottom:8px;background:#fff;cursor:zoom-in" alt="strana '+(i+1)+'">'; }
      box.innerHTML=html;
    }).catch(function(){ box.innerHTML='<div class="mut" style="padding:16px;text-align:center">Náhled se nepodařilo načíst.</div>'; });
  },
  _zoom:function(id,page){
    var ov=document.createElement("div");
    ov.style.cssText="position:fixed;inset:0;z-index:99999;background:rgba(8,10,14,.97);overflow:auto;-webkit-overflow-scrolling:touch;padding:52px 8px 24px;text-align:center";
    var st={w:100};
    var img=new Image(); img.src=B+"/"+id+"/img/"+page+"?dpi=210";
    img.style.cssText="width:100%;max-width:1000px;display:inline-block;background:#fff;border-radius:4px";
    function setW(){ img.style.width=st.w+"%"; img.style.maxWidth=(st.w>100?"none":"1000px"); }
    var bar=document.createElement("div");
    bar.style.cssText="position:fixed;top:0;left:0;right:0;height:44px;display:flex;align-items:center;justify-content:center;gap:10px;background:rgba(0,0,0,.72)";
    function mk(t){ var b=document.createElement("button"); b.textContent=t; b.style.cssText="font-size:16px;min-width:46px;padding:7px 14px;border-radius:9px;border:1px solid #3a4358;background:#1b2130;color:#dbe4f5;cursor:pointer"; return b; }
    var bMinus=mk("−"),bPlus=mk("+"),bClose=mk("✕ Zavřít");
    bPlus.onclick=function(e){ e.stopPropagation(); st.w=Math.min(400,st.w+40); setW(); };
    bMinus.onclick=function(e){ e.stopPropagation(); st.w=Math.max(60,st.w-40); setW(); };
    function close(){ try{document.body.removeChild(ov);}catch(e){} }
    bClose.onclick=function(e){ e.stopPropagation(); close(); };
    ov.addEventListener("click",function(e){ if(e.target===ov) close(); });
    bar.appendChild(bMinus); bar.appendChild(bPlus); bar.appendChild(bClose);
    ov.appendChild(bar); ov.appendChild(img); document.body.appendChild(ov);
  },
  dmsg:function(k,t){var m=document.getElementById("dmsg");if(m){m.className="msg "+k;m.textContent=t;m.style.display="block";}},
  oursign:function(id){SG.dmsg("","Podepisuji…");api("POST",B+"/"+id+"/our-sign",{}).then(function(j){if(j&&j.ok){SG.dmsg("ok","✓ Podepsáno za nás.");SG.open(id);loadList();}else SG.dmsg("err","✗ "+((j&&j.error)||"chyba"));});},
  send:function(id){SG.dmsg("","Odesílám…");api("POST",B+"/"+id+"/send",{}).then(function(j){if(j&&j.ok){SG.dmsg("ok","✓ Odesláno protistraně"+(j.sent?" e-mailem.":" (e-mail se nezdařil, odkaz: "+j.odkaz+")"));SG.open(id);loadList();}else SG.dmsg("err","✗ "+((j&&j.error)||"chyba"));});},
  _initSlider:function(id){
    var chk=document.getElementById("reviewChk"),wrap=document.getElementById("slidewrap"),h=document.getElementById("slideh"),fill=document.getElementById("slidefill"),lbl=document.getElementById("slidelbl");
    if(!chk||!wrap||!h)return;
    chk.addEventListener("change",function(){ if(chk.checked){wrap.style.opacity="1";wrap.style.pointerEvents="auto";} else {wrap.style.opacity="0.45";wrap.style.pointerEvents="none";} });
    var dragging=false,startX=0,cur=0,max=0,done=false;
    function setX(x){ if(x<0)x=0; if(x>max)x=max; cur=x; h.style.left=(3+x)+"px"; fill.style.width=(46+x)+"px"; if(lbl)lbl.style.opacity=String(1-(x/(max||1))); }
    function px(e){ return (e.touches&&e.touches[0])?e.touches[0].clientX:e.clientX; }
    function down(e){ if(done)return; dragging=true; max=wrap.clientWidth-52; startX=px(e)-cur; h.style.cursor="grabbing"; }
    function move(e){ if(!dragging)return; if(e.cancelable)e.preventDefault(); setX(px(e)-startX); }
    function up(){ if(!dragging)return; dragging=false; h.style.cursor="grab"; if(cur>=max-5){ done=true; if(lbl)lbl.textContent="Podepisuji…"; setX(max); wrap.style.pointerEvents="none"; SG.oursign(id); } else { var a=setInterval(function(){ cur-=7; if(cur<=0){cur=0;clearInterval(a);} setX(cur); },12); } }
    h.addEventListener("mousedown",down); document.addEventListener("mousemove",move); document.addEventListener("mouseup",up);
    h.addEventListener("touchstart",down,{passive:false}); document.addEventListener("touchmove",move,{passive:false}); document.addEventListener("touchend",up);
  }
  };
  loadList();
})();
</script>
</body>
</html>
