<!DOCTYPE html>
<!-- redeploy: marker sloupec (X + tecky/sipka) na kraji, cloud retry 21.7. -->
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pokladny a karty</title>
<style>
  :root{color-scheme:light dark}
  body{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;margin:0;padding:16px;background:#0f1420;color:#e8edf6}
  h1{font-size:20px;margin:0 0 4px}
  .sub{color:#9fb0c8;font-size:13px;margin-bottom:16px}
  .card{background:#19202e;border:1px solid #26303f;border-radius:12px;padding:14px;margin-bottom:16px}
  .card h2{font-size:15px;margin:0 0 10px;color:#cdd9ea}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{text-align:left;padding:6px 8px;border-bottom:1px solid #232c3b;vertical-align:top}
  th{color:#8fa3bd;font-weight:600;font-size:12px}
  .tag{display:inline-block;padding:1px 7px;border-radius:10px;font-size:11px;font-weight:600}
  .tag.k{background:#3a2b14;color:#f0c674}
  .tag.p{background:#16324a;color:#7fc0ff}
  .eur{color:#9ad29a;font-weight:600}
  input,select{background:#0f1622;color:#e8edf6;border:1px solid #2c3850;border-radius:8px;padding:5px 7px;font-size:13px;width:100%;box-sizing:border-box}
  button{background:#2563eb;color:#fff;border:0;border-radius:9px;padding:8px 14px;font-size:13px;font-weight:600;cursor:pointer}
  button.sec{background:#27313f}
  button.mini{padding:5px 10px;font-size:12px}
  .pill{background:#27313f;color:#cdd9ea;border:1px solid #2c3850;border-radius:9px;padding:7px 12px;font-size:13px;font-weight:600;cursor:pointer;margin:0 6px 6px 0}
  .pill.act{background:#2563eb;color:#fff;border-color:#2563eb}
  .pill.sm{padding:5px 10px;font-size:12px}
  .pill.k{border-color:#5a4416}
  .pill.k.act{background:#b8860b;border-color:#b8860b;color:#1c1400}
  .firmbar{margin-bottom:10px}
  .druhbar{margin-bottom:12px}
  .pan{font-family:ui-monospace,Menlo,monospace;letter-spacing:.5px}
  .row-actions{white-space:nowrap}
  .ok{color:#7ee08a}.err{color:#ff8b8b}
  .muted{color:#8295ad;font-size:12px}
  .topbar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
  .doklwrap{overflow-x:auto;overflow-y:auto;max-height:calc(100vh - 320px);border:1px solid #2a3546;border-radius:8px}
  .doklwrap::-webkit-scrollbar{height:15px;width:15px}
  .doklwrap::-webkit-scrollbar-track{background:#0f1622;border-radius:8px}
  .doklwrap::-webkit-scrollbar-thumb{background:#41546f;border-radius:8px;border:3px solid #0f1622}
  .doklwrap::-webkit-scrollbar-thumb:hover{background:#5473a0}
  table.dokl{table-layout:fixed;border-collapse:collapse;font-size:12.5px;width:auto}
  table.dokl th,table.dokl td{border-right:1px solid #2a3546;border-bottom:1px solid #232c3b;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:5px 8px}
  table.dokl thead th{position:sticky;top:0;z-index:3;background:#1c2636;color:#ffffff;font-size:11px;font-weight:700;text-align:left;border-bottom:2px solid #34506f}
  table.dokl thead tr.frow td{position:sticky;top:24px;z-index:2;padding:3px 4px;background:#08090c;border-right:1px solid #24344f;border-bottom:1px solid #24344f}
  table.dokl tbody td{color:#f4f7fc}
  table.dokl th{position:relative}
  table.dokl th.r,table.dokl td.r{text-align:right}
  table.dokl thead th .dgrip{position:absolute;top:0;right:0;width:7px;height:100%;cursor:ew-resize;z-index:5;user-select:none}
  table.dokl .frow input{width:100%;box-sizing:border-box;padding:2px 6px;font-size:11px;border:1px solid #363b43;border-radius:4px;background:#0b0d10;color:#e9eef5}
  table.dokl .frow input::placeholder{color:#6a7078}
  table.dokl tbody tr{cursor:pointer}
  table.dokl tbody tr:hover{background:#131d2b}
</style>
</head>
<body>
<a href="/finance" style="display:inline-block;margin:10px 0 4px 14px;color:#2dd4bf;text-decoration:none;font-size:13px;font-weight:700">← Zpět na Finance</a>
<div class="topbar">
  <div><h1>🏦 Pokladny a karty</h1><div class="sub">Pokladny i kartové účty z Heliosu · registr platebních karet (maskovaný PAN z banky)</div></div>
  <div></div>
</div>

<div class="card">
  <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;margin-bottom:10px">
    <h2 style="margin:0">💰 Pokladny a kartové účty</h2>
    <div><span id="syncMsg" class="muted" style="margin-right:8px"></span><button class="sec mini" id="btnSyncAll" title="Znovu načíst zobrazená data">🔄 Aktualizovat</button></div>
  </div>
  <div class="firmbar" id="firmyBox"></div>
  <div class="druhbar" id="druhyBox"></div>
  <div id="obsahBox">Načítám…</div>
</div>

<div class="card">
  <h2>💳 Platební karty <span class="muted" id="cardsHint"></span></h2>
  <div id="cardsBox">Načítám…</div>
</div>

<script>
const API='';
let DATA={pokladny:[],karty:[],kartove_ucty:[]};
let FIRMA='EC';     // EC | ES
let SELPOK=null;    // vybraná pokladna (cislo) nebo null = Vše
async function j(url,opt){const r=await fetch(API+url,Object.assign({credentials:'include'},opt||{}));return r.json();}

function firmaOf(cislo){return (parseInt(cislo,10)||0) < 100 ? 'EC' : 'ES';}
function firmaLabel(f){return f==='EC' ? 'EUROSOFT‑Control' : 'EUROSOFT‑System';}
function druhyFirmy(){return DATA.pokladny.filter(p=>firmaOf(p.cislo)===FIRMA).sort((a,b)=>(''+a.cislo).localeCompare(''+b.cislo));}

function renderFirmy(){
  let h='';
  ['EC','ES'].forEach(f=>{h+=`<button class="pill${FIRMA===f?' act':''}" onclick="selFirma('${f}')">${firmaLabel(f)}</button>`;});
  document.getElementById('firmyBox').innerHTML=h;
}
function renderDruhy(){
  const list=druhyFirmy();
  if(!list.length){document.getElementById('druhyBox').innerHTML='<span class="muted">Žádné pokladny — klikni „Aktualizovat seznam".</span>';return;}
  let h='';
  list.forEach(p=>{
    const k=p.typ==='kartovy_ucet'?' k':'';
    h+=`<button class="pill sm${k}${SELPOK===p.cislo?' act':''}" onclick="selPok('${p.cislo}')">${p.cislo} · ${p.nazev}</button>`;
  });
  document.getElementById('druhyBox').innerHTML=h;
}
function renderObsah(){
  const list=druhyFirmy();
  const box=document.getElementById('obsahBox');
  if(!list.length){box.innerHTML='<div class="muted">Žádné pokladny — klikni „Aktualizovat seznam".</div>';return;}
  const p=list.find(x=>x.cislo===SELPOK)||list[0];
  let h=`<table>
    <tr><th style="width:110px">Číslo</th><td><b>${p.cislo}</b></td><th style="width:110px">Název</th><td>${p.nazev}</td></tr>
    <tr><th>Měna</th><td>${p.mena==='EUR'?'<span class="eur">EUR</span>':p.mena}</td><th>Typ</th><td><span class="tag ${p.typ==='kartovy_ucet'?'k':'p'}">${p.typ==='kartovy_ucet'?'kartový účet':'pokladna'}</span></td></tr>
    <tr><th>Účet MD/DAL</th><td>${[p.ucet_md,p.ucet_dal].filter(x=>x).join(' / ')||'—'}</td><th>Sborník</th><td>${p.sbornik||'—'}</td></tr>
  </table>
  <div style="font-weight:700;font-size:14px;margin:14px 0 8px">🧾 Doklady ${ROK}</div>
  <div id="doklBox" class="muted">Načítám…</div>`;
  box.innerHTML=h;
  loadDoklady(p.cislo);
}
const ROK=(new Date()).getFullYear();
function esc(s){return (''+(s==null?'':s)).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function fmt(n){try{return Number(n).toLocaleString('cs-CZ',{minimumFractionDigits:2,maximumFractionDigits:2});}catch(e){return n;}}
// ── Doklady: roztahovatelné + filtrovatelné sloupce (jako přijaté faktury) ──
const DCOLS=[
  {k:'uctovano',h:'Ú',tt:'Účtováno',t:'chk'},
  {k:'scan',h:'S',tt:'Scan (naskenovaný papír)',t:'chk'},
  {k:'pocet_polozek',h:'P',tt:'Má položku (řádek dokladu)',t:'chk'},
  {k:'bv',h:'B',tt:'BV (zadané číslo bankovního výpisu)',t:'chk'},
  {k:'bv_seznam',h:'BV seznam',tt:'Čísla bankovních výpisů'},
  {k:'poradove_cislo',h:'Doklad'},
  {k:'popis',h:'Popis'},
  {k:'typ_dokladu',h:'Typ dokladu',t:'typ'},
  {k:'dat_porizeni',h:'Datum pořízení',date:1},
  {k:'dat_pripad',h:'Datum případu',date:1},
  {k:'uhrada',h:'Úhrada',t:'m',r:1},
  {k:'saldo_dokladu',h:'Saldo dokladu',t:'m',r:1},
  {k:'castka_dokladu',h:'Částka dokladu',t:'m',r:1},
  {k:'utvar',h:'Útvar'},
  {k:'zakazka',h:'Číslo zakázky'},
  {k:'poznamka',h:'Poznámka vše'},
  {k:'stav_pokladny',h:'Zůstatek',t:'m',r:1},
  {k:'dat_porizeno',h:'Dat.pořízeno',date:1},
  {k:'autor',h:'Autor'}
];
const DCOLW_DEF={uctovano:30,scan:32,pocet_polozek:30,bv:30,bv_seznam:80,poradove_cislo:56,popis:190,typ_dokladu:86,dat_porizeni:94,dat_pripad:94,uhrada:90,saldo_dokladu:98,castka_dokladu:100,utvar:50,zakazka:88,poznamka:220,stav_pokladny:112,dat_porizeno:114,autor:80};
let DOKLW=(function(){try{return JSON.parse(localStorage.getItem('pokl_dokl_colw')||'{}')||{};}catch(_){return {};}})();
let DFIL={}, DACTIVE=null, DOKLADY=[];
let _doklSel={}, _doklLastIdx=null;
let DSORT={k:null,dir:1};  // řazení klikem na název sloupce
function _cmpDokl(a,b,col){var va=a[col.k],vb=b[col.k];
  if(col.date){var da=(_dnum(va)||_inum(va)),db=(_dnum(vb)||_inum(vb));da=(da==null?-1:da);db=(db==null?-1:db);return da<db?-1:(da>db?1:0);}
  if(col.r||col.t==='m'){var na=parseFloat((''+(va==null?'':va)).replace(/\s/g,'').replace(',','.')),nb=parseFloat((''+(vb==null?'':vb)).replace(/\s/g,'').replace(',','.'));na=isNaN(na)?-Infinity:na;nb=isNaN(nb)?-Infinity:nb;return na<nb?-1:(na>nb?1:0);}
  if(col.t==='chk'){var ca=va?1:0,cb=vb?1:0;return ca-cb;}
  return String(va==null?'':va).localeCompare(String(vb==null?'':vb),'cs');}
function resetDoklSort(){DSORT.k=null;DSORT.dir=1;renderDoklady();}
function clearDoklFilters(){DFIL={};DFILMODE={};VFILT=null;DACTIVE=null;renderDoklady();}
function dcw(k){return DOKLW[k]||DCOLW_DEF[k]||80;}
function dTotW(){var t=18;DCOLS.forEach(function(c){t+=dcw(c.k);});return t;}
function saveDCW(){try{localStorage.setItem('pokl_dokl_colw',JSON.stringify(DOKLW));}catch(_){}}
function bvNums(p){if(!p)return [];var m=(''+p).match(/BV\s?\d+/gi)||[];var out=[],seen={};m.forEach(function(x){var n=x.replace(/BV\s?/i,'');if(!seen[n]){seen[n]=1;out.push(n);}});return out;}
function dcell(d,c){
  if(c.k==='bv_seznam')return esc(d.bv_seznam==null?'':(''+d.bv_seznam));
  if(c.t==='m')return d[c.k]!=null?fmt(d[c.k]):'';
  if(c.t==='chk'){
    var ck='<span style="color:#7ee08a">✓</span>';
    if(c.k==='uctovano')return d.dat_uctovani?ck:'';
    if(c.k==='scan')return d.doc_path?('<a href="/api/v1/erp/app/bank/pokl-doklad-pdf?id='+encodeURIComponent(d.src_id)+'" target="_blank" rel="noopener" style="color:#7ee08a;text-decoration:none" title="Otevrit sken (PDF)">✓</a>'):'';
    if(c.k==='pocet_polozek')return d.pocet_polozek>0?ck:'';
    if(c.k==='bv')return (d.bv_seznam!=null&&(''+d.bv_seznam).trim()!=='')?ck:'';
    return '';
  }
  if(c.t==='typ')return d.saldo_dokladu<0?'Výdaj':(d.saldo_dokladu>0?'Příjem':'');
  if(c.k==='poradove_cislo')return '<b>'+esc(d.poradove_cislo==null?'':d.poradove_cislo)+'</b>';
  return esc(d[c.k]==null?'':(''+d[c.k]));
}
function _dnum(s){var m=(''+s).match(/(\d{1,2})\.(\d{1,2})\.(\d{4})/);return m?(parseInt(m[3],10)*10000+parseInt(m[2],10)*100+parseInt(m[1],10)):null;}
function _inum(s){var m=(''+s).match(/(\d{4})-(\d{2})-(\d{2})/);return m?(parseInt(m[1],10)*10000+parseInt(m[2],10)*100+parseInt(m[3],10)):null;}
function _isoCz(s){var m=(''+s).match(/(\d{4})-(\d{2})-(\d{2})/);return m?(m[3]+'.'+m[2]+'.'+m[1]):'';}
function _dateSummaryP(key){var od=DFIL[key+'_od'],dv=DFIL[key+'_do'];
  if(od&&dv)return od===dv?_isoCz(od):(_isoCz(od)+'–'+_isoCz(dv));
  if(od)return 'od '+_isoCz(od); if(dv)return 'do '+_isoCz(dv); return '';}
// Rychlé filtry sloupce přes pop-up menu (pravý klik do políčka filtru).
var DFILMODE={};
function _isEmptyVal(raw){return (raw==null)||(raw===false)||(String(raw).trim()==='');}
function openDoklFilterMenu(x,y,k,inp){
  closeDoklFilterMenu();
  var m=document.createElement('div'); m.id='dfiltm';
  m.style.cssText='position:fixed;z-index:400;background:#1c2636;border:1px solid #2a3546;border-radius:8px;padding:4px;box-shadow:0 12px 34px rgba(0,0,0,.55);font-size:13px;min-width:170px';
  m.innerHTML='<div class="dfit" data-a="empty">Jen prázdné</div>'
    +'<div class="dfit" data-a="nonempty">Jen neprázdné</div>'
    +'<div style="height:1px;background:#2a3546;margin:4px 2px"></div><div class="dfit" data-a="smaz">Smaž</div>'
    +'<div style="height:1px;background:#2a3546;margin:4px 2px"></div><div class="dfit" data-a="vlastni">Vlastní…</div>';
  [].forEach.call(m.querySelectorAll('.dfit'),function(it){it.style.cssText='padding:7px 12px;border-radius:5px;cursor:pointer;color:#e8edf6;white-space:nowrap';
    it.onmouseover=function(){it.style.background='#2563eb';};it.onmouseout=function(){it.style.background='';};});
  document.body.appendChild(m);
  var w=m.offsetWidth||180,h=m.offsetHeight||120;
  m.style.left=Math.max(6,Math.min(x,window.innerWidth-w-6))+'px';
  m.style.top=Math.max(6,Math.min(y,window.innerHeight-h-6))+'px';
  m.addEventListener('click',function(e){var it=e.target.closest('.dfit');if(!it)return;var a=it.getAttribute('data-a');
    if(a==='vlastni'){closeDoklFilterMenu();openCustomFilter(k);return;}
    if(a==='smaz'){delete DFILMODE[k];DFIL[k]='';if(inp)inp.value='';}
    else{DFILMODE[k]=a;DFIL[k]='';if(inp)inp.value=(a==='empty'?'(prázdné)':'(neprázdné)');}
    closeDoklFilterMenu();renderDoklady();});
}
function closeDoklFilterMenu(){var m=document.getElementById('dfiltm');if(m&&m.parentNode)m.parentNode.removeChild(m);}
document.addEventListener('click',function(e){if(!e.target.closest||!e.target.closest('#dfiltm'))closeDoklFilterMenu();});

// ── Vlastní filtr (Fáze 2): víc podmínek spojených A / NEBO ────────────────
var VFILT=null;  // [{join:'and'|'or'|null, k, op, val}]
var _VOPS=[['has','Obsahuje'],['nhas','Neobsahuje'],['eq','Rovná se'],['ne','Nerovná se']];
function _vfColOpts(sel){return DCOLS.map(function(c){return '<option value="'+c.k+'"'+(c.k===sel?' selected':'')+'>'+esc(c.h)+'</option>';}).join('');}
function _vfOpOpts(sel){return _VOPS.map(function(o){return '<option value="'+o[0]+'"'+(o[0]===sel?' selected':'')+'>'+o[1]+'</option>';}).join('');}
function openCustomFilter(prefK){
  closeCustomFilter();
  var p=document.createElement('div'); p.id='vfilt-panel';
  p.style.cssText='position:fixed;left:0;right:0;bottom:0;background:#141c28;border-top:2px solid #34506f;padding:10px 14px 12px;z-index:350;box-shadow:0 -10px 30px rgba(0,0,0,.55);max-height:60vh;overflow:auto';
  p.innerHTML='<div style="display:flex;align-items:center;gap:10px;margin-bottom:8px"><b style="color:#e8edf6">Vlastní filtr</b><span style="color:#8fa3bd;font-size:12px">více podmínek spojených A / NEBO</span><span style="flex:1"></span>'
    +'<button onclick="vfiltClearAll()">Smazat vše</button><button onclick="closeCustomFilter()" style="background:#1f6feb;color:#fff;border:0;border-radius:5px;padding:5px 12px;cursor:pointer">Zavřít</button></div>'
    +'<div id="vfilt-rows"></div>'
    +'<div style="margin-top:6px"><a href="#" onclick="vfiltAddRow();return false" style="color:#4fe0aa;text-decoration:none;font-weight:600">+ přidat podmínku</a></div>';
  document.body.appendChild(p);
  if(VFILT&&VFILT.length){VFILT.forEach(function(c){vfiltAddRow(c);});}
  else vfiltAddRow({k:prefK||(DCOLS[5]&&DCOLS[5].k),op:'has',val:''});
}
function closeCustomFilter(){var p=document.getElementById('vfilt-panel');if(p&&p.parentNode)p.parentNode.removeChild(p);}
function vfiltAddRow(c){c=c||{};var box=document.getElementById('vfilt-rows');if(!box)return;
  var first=box.children.length===0;
  var row=document.createElement('div'); row.className='vfrow'; row.style.cssText='display:flex;gap:6px;margin-bottom:6px;align-items:center;flex-wrap:wrap';
  row.innerHTML=(first?'<span style="width:60px;color:#8fa3bd;font-size:12px">kde</span>'
      :'<select class="vf-join" style="width:70px"><option value="and"'+(c.join==='or'?'':' selected')+'>A</option><option value="or"'+(c.join==='or'?' selected':'')+'>NEBO</option></select>')
    +'<select class="vf-col">'+_vfColOpts(c.k)+'</select>'
    +'<select class="vf-op">'+_vfOpOpts(c.op||'has')+'</select>'
    +'<input class="vf-val" value="'+esc(c.val||'')+'" placeholder="hodnota" style="flex:1;min-width:120px">'
    +'<button title="Odebrat podmínku" onclick="this.parentNode.remove();vfiltApply()">✕</button>';
  box.appendChild(row);
  [].forEach.call(row.querySelectorAll('select,input'),function(el){el.style.background='#0b0d10';el.style.border='1px solid #363b43';el.style.color='#e9eef5';el.style.borderRadius='5px';el.style.padding='5px 7px';el.style.fontSize='13px';
    el.addEventListener('input',vfiltApply);el.addEventListener('change',vfiltApply);});
}
function vfiltApply(){var out=[];[].forEach.call(document.querySelectorAll('#vfilt-panel .vfrow'),function(row,idx){
    var col=row.querySelector('.vf-col').value,op=row.querySelector('.vf-op').value,val=row.querySelector('.vf-val').value;
    var jn=row.querySelector('.vf-join');var join=idx===0?null:(jn?jn.value:'and');
    if(val==='')return;
    out.push({join:join,k:col,op:op,val:val});});
  VFILT=out.length?out:null; renderDoklady();}
function vfiltClearAll(){VFILT=null;closeCustomFilter();renderDoklady();}
function _norm(s){return String(s==null?'':s).toLowerCase().normalize('NFD').replace(/\p{Diacritic}/gu,'');}
function _vfPass(d){if(!VFILT||!VFILT.length)return true;var res=null;
  for(var vi=0;vi<VFILT.length;vi++){var cnd=VFILT[vi];var cell=_norm(d[cnd.k]),val=_norm(cnd.val),ok;
    if(cnd.op==='eq')ok=(cell===val);else if(cnd.op==='ne')ok=(cell!==val);else if(cnd.op==='has')ok=(cell.indexOf(val)>=0);else ok=(cell.indexOf(val)<0);
    if(vi===0)res=ok;else if(cnd.join==='or')res=res||ok;else res=res&&ok;}
  return res;}
function dmatch(d){
  if(!_vfPass(d))return false;
  for(var mk in DFILMODE){var mode=DFILMODE[mk];if(!mode)continue;
    var e2=_isEmptyVal(d[mk]);
    if(mode==='empty'&&!e2)return false;
    if(mode==='nonempty'&&e2)return false;}
  return DCOLS.every(function(c){
    if(c.date){var od=DFIL[c.k+'_od'],dv=DFIL[c.k+'_do'];if(!od&&!dv)return true;
      var dn=_dnum(d[c.k]);if(dn===null)return false;
      if(od){var o=_inum(od);if(o!==null&&dn<o)return false;}
      if(dv){var vv=_inum(dv);if(vv!==null&&dn>vv)return false;}
      return true;}
    var f=DFIL[c.k]; if(f==null||f==='')return true;
    var _rw=d[c.k];
    var v=_norm(_rw==null?'':(typeof _rw==='number'?_rw.toFixed(2):(''+_rw))).replace(/,/g,'.');
    return v.indexOf(_norm(f).replace(/,/g,'.'))>=0;
  });
}
function openDateFilterP(inp,key){
  var old=document.getElementById('dpopP');if(old)old.remove();
  var r=inp.getBoundingClientRect();
  var od=DFIL[key+'_od']||'',dv=DFIL[key+'_do']||'';
  var pop=document.createElement('div');pop.id='dpopP';
  pop.style.cssText='position:fixed;z-index:200;background:#141b28;border:1px solid #2a3546;border-radius:10px;padding:12px;box-shadow:0 10px 34px rgba(0,0,0,.55);width:230px;font-size:13px;color:#e8edf6';
  pop.style.left=Math.max(8,Math.min(r.left,window.innerWidth-246))+'px';
  pop.style.top=(r.bottom+4)+'px';
  var btn='display:inline-block;padding:5px 12px;border-radius:14px;cursor:pointer;font-size:12.5px';
  pop.innerHTML='<div style="font-weight:700;margin-bottom:8px">Výběr období</div>'+
    '<label style="display:block;margin-bottom:6px">Jeden den:<br><input type="date" id="dpp-one" style="width:100%"></label>'+
    '<div style="text-align:center;color:#8fa3bd;font-size:11px;margin:4px 0">— nebo rozsah —</div>'+
    '<label style="display:block;margin-bottom:6px">Datum OD:<br><input type="date" id="dpp-od" value="'+esc(od)+'" style="width:100%"></label>'+
    '<label style="display:block;margin-bottom:10px">Datum DO:<br><input type="date" id="dpp-do" value="'+esc(dv)+'" style="width:100%"></label>'+
    '<div style="display:flex;gap:6px;justify-content:flex-end">'+
      '<span id="dpp-clear" style="'+btn+';background:#27313f;color:#cdd9ea">vymazat</span>'+
      '<span id="dpp-cancel" style="'+btn+';background:#27313f;color:#cdd9ea">zrušit</span>'+
      '<span id="dpp-ok" style="'+btn+';background:#2563eb;color:#fff">OK</span></div>';
  document.body.appendChild(pop);
  document.getElementById('dpp-one').onchange=function(){document.getElementById('dpp-od').value=this.value;document.getElementById('dpp-do').value=this.value;};
  document.getElementById('dpp-ok').onclick=function(){DFIL[key+'_od']=document.getElementById('dpp-od').value;DFIL[key+'_do']=document.getElementById('dpp-do').value;pop.remove();renderDoklady();};
  document.getElementById('dpp-cancel').onclick=function(){pop.remove();};
  document.getElementById('dpp-clear').onclick=function(){delete DFIL[key+'_od'];delete DFIL[key+'_do'];pop.remove();renderDoklady();};
  setTimeout(function(){document.addEventListener('click',function _cl(e){if(!pop.contains(e.target)&&e.target!==inp){pop.remove();document.removeEventListener('click',_cl);}});},0);
}
function dAnyFilter(){return Object.keys(DFIL).some(function(k){return DFIL[k]!=null&&DFIL[k]!=='';});}
function renderDoklady(){
  const box=document.getElementById('doklBox'); if(!box) return;
  if(!DOKLADY.length){box.innerHTML='<div class="muted">Za rok '+ROK+' zatím žádné doklady. Klikni nahoře „Aktualizovat z Heliosu".</div>';return;}
  var rows=DOKLADY.filter(dmatch), anyF=dAnyFilter();
  if(DSORT.k){var _sc=null;for(var _i=0;_i<DCOLS.length;_i++)if(DCOLS[_i].k===DSORT.k){_sc=DCOLS[_i];break;}
    if(_sc)rows.sort(function(a,b){return _cmpDokl(a,b,_sc)*DSORT.dir;});}
  var h='<div class="doklwrap"><table class="dokl" style="width:'+dTotW()+'px"><colgroup><col data-dcol="_mark" style="width:18px">';
  DCOLS.forEach(function(c){h+='<col data-dcol="'+c.k+'" style="width:'+dcw(c.k)+'px">';});
  h+='</colgroup><thead><tr><th data-dcol="_mark" style="padding:0"></th>';
  DCOLS.forEach(function(c){h+='<th'+(c.r?' class="r"':'')+' data-dcol="'+c.k+'" data-sk="'+c.k+'"'+(c.tt?' title="'+esc(c.tt)+' — klik = seřadit"':' title="klik = seřadit"')+' style="cursor:pointer">'+esc(c.h)+(DSORT.k===c.k?(DSORT.dir>0?' ▲':' ▼'):'')+'<span class="dgrip" data-dcol="'+c.k+'" title="Táhni pro roztažení · dvojklik = výchozí šířka"></span></th>';});
  h+='</tr><tr class="frow"><td style="text-align:center;padding:2px 0;cursor:pointer;color:#8aa0bd;font-weight:700" title="Zrušit filtry sloupců (jen řádek filtru)" onclick="clearDoklFilters()">✕</td>';
  DCOLS.forEach(function(c){
    if(c.date)h+='<td><input data-dfcol="'+c.k+'" data-dfdate="1" readonly placeholder="datum…" value="'+esc(_dateSummaryP(c.k))+'" title="Filtr podle data — rozsah OD–DO nebo jeden den" style="cursor:pointer"></td>';
    else h+='<td><input data-dfcol="'+c.k+'" value="'+esc(DFIL[c.k]||'')+'"></td>';});
  h+='</tr></thead><tbody>';
  rows.forEach(function(d,idx){var _k=(d.poradove_cislo==null?('_'+idx):(''+d.poradove_cislo));
    h+='<tr class="drow" data-k="'+esc(_k)+'" data-idx="'+idx+'"'+(_doklSel[_k]?' style="background:rgba(88,166,255,.10)"':'')+'>';
    h+='<td style="text-align:center;padding:2px 0;color:#5aa0ff;font-weight:700">'+(idx===_doklLastIdx?'▶':(_doklSel[_k]?'•':''))+'</td>';
    DCOLS.forEach(function(c){
      var ti=(c.k==='poznamka'||c.k==='popis')?' title="'+esc(d[c.k]||'')+'"':'';
      h+='<td'+(c.r?' class="r"':'')+ti+'>'+dcell(d,c)+'</td>';
    });
    h+='</tr>';
  });
  h+='</tbody></table></div>';
  var _selN=(function(){var s=0;for(var k in _doklSel)if(_doklSel[k])s++;return s;})();
  var _rbtn=DSORT.k?('<a href="#" onclick="resetDoklSort();return false" title="Zpět na výchozí řazení" style="display:inline-block;background:#0f2a22;color:#4fe0aa;border:1px solid #2dd4bf;border-radius:5px;padding:2px 9px;margin-right:10px;font-size:11.5px;font-weight:600;text-decoration:none;vertical-align:middle">↺ výchozí řazení</a>'):'';
  var _vfb=(VFILT&&VFILT.length)?(' <a href="#" onclick="openCustomFilter();return false" title="Upravit vlastní filtr" style="display:inline-block;background:#0f2a22;color:#4fe0aa;border:1px solid #2dd4bf;border-radius:5px;padding:2px 9px;margin-left:8px;font-size:11.5px;font-weight:600;text-decoration:none">⚙ vlastní filtr ('+VFILT.length+')</a> <a href="#" onclick="vfiltClearAll();return false" title="Zrušit vlastní filtr" style="color:#e88;text-decoration:none;font-weight:700">✕</a>'):'';
  h+='<div class="muted" style="margin-top:6px">'+_rbtn+rows.length+(anyF?(' z '+DOKLADY.length):'')+' dokladů · vybráno: '+_selN+' · rok '+ROK+(anyF?' · <a href="#" id="dclear" style="color:#2dd4bf;text-decoration:none">zrušit filtr</a>':'')+_vfb+'</div>';
  box.innerHTML=h;
  bindDGrips(); bindDFilters(); bindDoklRows(); bindDoklSort();
  var dc=document.getElementById('dclear'); if(dc)dc.onclick=function(e){e.preventDefault();DFIL={};DACTIVE=null;renderDoklady();};
}
function bindDoklSort(){
  document.querySelectorAll('#doklBox table.dokl thead tr:first-child th[data-sk]').forEach(function(th){
    th.addEventListener('click',function(e){
      if(e.target.classList&&e.target.classList.contains('dgrip'))return;
      var sk=th.getAttribute('data-sk');
      if(DSORT.k!==sk){DSORT.k=sk;DSORT.dir=1;}
      else if(DSORT.dir>0){DSORT.dir=-1;}
      else {DSORT.k=null;DSORT.dir=1;}
      renderDoklady();});});
}
function bindDoklRows(){
  document.querySelectorAll('#doklBox table.dokl tbody tr.drow').forEach(function(tr){tr.onclick=function(e){
    if(e.target.closest('input,select,a,button,label'))return;
    var idx=parseInt(this.dataset.idx,10),k=this.dataset.k;
    if(e.shiftKey&&_doklLastIdx!=null&&!isNaN(idx)){
      var rows2=DOKLADY.filter(dmatch),a=Math.min(_doklLastIdx,idx),z=Math.max(_doklLastIdx,idx);
      for(var i=a;i<=z;i++){var dd=rows2[i];if(!dd)continue;var kk=(dd.poradove_cislo==null?('_'+i):(''+dd.poradove_cislo));_doklSel[kk]=true;}
    }else{ if(_doklSel[k])delete _doklSel[k]; else _doklSel[k]=true; }
    if(!isNaN(idx))_doklLastIdx=idx;
    renderDoklady();
  };});
}
function bindDGrips(){
  document.querySelectorAll('#doklBox table.dokl thead th .dgrip').forEach(function(g){
    g.onmousedown=function(e){e.preventDefault();e.stopPropagation();
      var col=g.dataset.dcol, th=g.parentNode, startX=e.clientX, startW=th.offsetWidth;
      document.body.style.cursor='ew-resize';
      function mv(ev){var w=Math.max(24,startW+(ev.clientX-startX));DOKLW[col]=w;
        var c=document.querySelector('#doklBox table.dokl col[data-dcol="'+col+'"]');if(c)c.style.width=w+'px';
        var tb=document.querySelector('#doklBox table.dokl');if(tb)tb.style.width=dTotW()+'px';}
      function up(){document.removeEventListener('mousemove',mv);document.removeEventListener('mouseup',up);document.body.style.cursor='';saveDCW();}
      document.addEventListener('mousemove',mv);document.addEventListener('mouseup',up);};
    g.ondblclick=function(e){e.preventDefault();e.stopPropagation();delete DOKLW[g.dataset.dcol];saveDCW();renderDoklady();};
  });
}
function bindDFilters(){
  document.querySelectorAll('#doklBox [data-dfcol]').forEach(function(el){
    var k=el.dataset.dfcol;
    el.oncontextmenu=function(ev){ev.preventDefault();openDoklFilterMenu(ev.clientX,ev.clientY,k,el);};
    if(el.dataset.dfdate){el.onclick=function(){openDateFilterP(el,k);};return;}
    el.oninput=function(){delete DFILMODE[k];DFIL[k]=el.value;DACTIVE=k;renderDoklady();};});
  if(DACTIVE){var e=document.querySelector('#doklBox input[data-dfcol="'+DACTIVE+'"]');
    if(e){e.focus();try{var n=e.value.length;e.setSelectionRange(n,n);}catch(_){}}}
}
async function loadDoklady(rada){
  const box=document.getElementById('doklBox'); if(!box) return;
  box.innerHTML='<div class="muted">Načítám doklady…</div>';
  DFIL={};DACTIVE=null;
  const r=await j('/api/v1/erp/app/bank/pokl-doklady?rada='+encodeURIComponent(rada)+'&rok='+ROK);
  if(!r.ok){box.innerHTML='<div class="err">'+(r.error||'chyba')+'</div>';return;}
  DOKLADY=r.doklady||[];
  renderDoklady();
}
function firstDruh(){const l=druhyFirmy();return l.length?l[0].cislo:null;}
function selFirma(f){FIRMA=f;SELPOK=firstDruh();renderFirmy();renderDruhy();renderObsah();}
function selPok(c){SELPOK=c;renderDruhy();renderObsah();}

function renderCards(){
  const ku=DATA.kartove_ucty;
  const opts=['<option value="">—</option>'].concat(ku.map(p=>`<option value="${p.cislo}">${p.cislo} · ${p.nazev} (${p.mena})</option>`)).join('');
  if(!DATA.karty.length){document.getElementById('cardsBox').innerHTML='<div class="muted">Žádné karty. Spusť načtení transakcí z banky — karty se objeví z plateb.</div>';return;}
  let h='<table><tr><th>Karta (PAN)</th><th>Profil / název</th><th>Držitel</th><th>Středisko</th><th>Kartový účet</th><th>Plateb</th><th></th></tr>';
  DATA.karty.forEach(c=>{
    h+=`<tr data-id="${c.id}">
      <td class="pan">${c.masked_pan}${c.aktivni?'':' <span class="muted">(neaktivní)</span>'}</td>
      <td><input data-f="nazev" value="${(c.nazev||'').replace(/"/g,'&quot;')}"></td>
      <td><input data-f="drzitel" value="${(c.drzitel||'').replace(/"/g,'&quot;')}" placeholder="kdo kartu má"></td>
      <td><input data-f="stredisko" value="${(c.stredisko||'').replace(/"/g,'&quot;')}" placeholder="středisko"></td>
      <td><select data-f="pokladna_cislo">${opts.replace('value="'+(c.pokladna_cislo||'')+'"','value="'+(c.pokladna_cislo||'')+'" selected')}</select></td>
      <td style="text-align:center">${c.pocet_plateb||0}</td>
      <td class="row-actions"><button class="mini" onclick="saveCard(${c.id},this)">Uložit</button> <span class="msg muted"></span></td>
    </tr>`;
  });
  h+='</table><div class="muted" style="margin-top:8px">Pozn.: karta je jen platební nástroj — zakázka/středisko se řídí tím, co se koupilo (na položce dokladu), ne držitelem. „Plateb" = počet kartových transakcí (KS 1178) na tuto kartu.</div>';
  document.getElementById('cardsBox').innerHTML=h;
  document.getElementById('cardsHint').textContent='('+DATA.karty.length+')';
}
async function saveCard(id,btn){
  const tr=btn.closest('tr');const body={};
  tr.querySelectorAll('[data-f]').forEach(el=>body[el.dataset.f]=el.value);
  const msg=tr.querySelector('.msg');msg.textContent='…';msg.className='msg muted';
  const r=await j('/api/v1/erp/app/bank/card/'+id,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
  if(r.ok){msg.textContent='✓ uloženo';msg.className='msg ok';}else{msg.textContent='✗ '+(r.error||'chyba');msg.className='msg err';}
}
function dedupeCislo(arr){const seen={};const out=[];(arr||[]).forEach(p=>{if(!seen[p.cislo]){seen[p.cislo]=1;out.push(p);}});return out;}
async function load(){
  const r=await j('/api/v1/erp/app/bank/pokladny');
  if(!r.ok){document.getElementById('obsahBox').innerHTML='<div class="err">'+(r.error||'Nedostupné (přihlas se jako rodič)')+'</div>';return;}
  const keepFirma=FIRMA, keepPok=SELPOK;
  DATA=r;
  DATA.pokladny=dedupeCislo(DATA.pokladny);
  DATA.kartove_ucty=DATA.pokladny.filter(p=>p.typ==='kartovy_ucet');
  FIRMA = DATA.pokladny.some(p=>firmaOf(p.cislo)===keepFirma) ? keepFirma : 'EC';
  SELPOK = (keepPok && druhyFirmy().some(p=>p.cislo===keepPok)) ? keepPok : firstDruh();
  const m=document.getElementById('syncMsg'); if(m){var _d=new Date();m.textContent='🕓 data k '+('0'+_d.getHours()).slice(-2)+':'+('0'+_d.getMinutes()).slice(-2);m.className='muted';}
  renderFirmy();renderDruhy();renderObsah();renderCards();
}
document.getElementById('btnSyncAll').onclick=async function(){
  // Jen obnovit = znovu načíst zobrazená data z DB (bez tahání z Heliosu). Peta 30.7.2026.
  const m=document.getElementById('syncMsg');m.textContent='⏳ Aktualizuji…';m.className='muted';
  const b=this;b.style.pointerEvents='none';b.style.opacity='0.6';
  await load();
  if(SELPOK){await loadDoklady(SELPOK);}
  b.style.pointerEvents='';b.style.opacity='';
};
load();
</script>

<script>
/* Kopírování buňky přes Ctrl+C (jako v Centrále): klik = aktivní buňka, Ctrl+C zkopíruje celý její text. Peta 30.7.2026. */
(function(){
  if(window.__cellCopyInit)return; window.__cellCopyInit=true;
  var st=document.createElement('style');
  st.textContent='td.cellact{outline:2px solid #4a9eff;outline-offset:-2px;} td.cellcopied{background:rgba(74,158,255,.45)!important;}';
  document.head.appendChild(st);
  function isDataTable(t){return t&&/\b(dokl|fakt|sumtab)\b/.test(t.className||'');}
  function clearActive(){var p=document.querySelector('td.cellact');if(p)p.classList.remove('cellact');}
  document.addEventListener('click',function(e){
    var td=e.target&&e.target.closest?e.target.closest('td'):null; if(!td)return;
    if(!isDataTable(td.closest('table')))return;
    if(td.classList.contains('mk')||td.classList.contains('ld'))return;
    if(td.querySelector('input,select,button'))return;
    clearActive(); td.classList.add('cellact');
  });
  function copyText(t){
    try{if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t);return;}}catch(_){}
    var ta=document.createElement('textarea');ta.value=t;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.focus();ta.select();try{document.execCommand('copy');}catch(_){}document.body.removeChild(ta);
  }
  document.addEventListener('keydown',function(e){
    if(!((e.ctrlKey||e.metaKey)&&(e.key==='c'||e.key==='C')))return;
    if(/(INPUT|TEXTAREA|SELECT)/.test((e.target&&e.target.tagName)||''))return;
    var sel=window.getSelection?String(window.getSelection()):''; if(sel&&sel.trim())return;
    var td=document.querySelector('td.cellact'); if(!td)return;
    var txt=(td.textContent||'').trim(); if(!txt)txt=td.getAttribute('title')||'';
    e.preventDefault(); copyText(txt);
    td.classList.add('cellcopied'); setTimeout(function(){td.classList.remove('cellcopied');},350);
  });
})();
</script>
