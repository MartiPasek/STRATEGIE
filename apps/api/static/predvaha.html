<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>📊 Obratová předvaha — náš deník vs Helios</title>
<style>
  :root{--bg:#0a1020;--card:#111a2e;--bord:#243049;--tx:#e6eefb;--mut:#90a0bd;--accent:#5b9dff;--ok:#22c55e;--warn:#f59e0b;--bad:#ef4444}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--tx);font-family:-apple-system,Segoe UI,Roboto,sans-serif;font-size:14px}
  .wrap{max-width:1000px;margin:0 auto;padding:16px}
  h1{font-size:20px;margin:0 0 2px}
  .sub{color:var(--mut);font-size:13px;margin-bottom:12px;line-height:1.5}
  .tabs{display:flex;gap:6px;margin-bottom:14px}
  .tab{background:transparent;border:1px solid var(--bord);color:var(--tx);border-radius:9px;padding:7px 16px;font-size:13px;font-weight:700;cursor:pointer}
  .tab.on{background:var(--accent);border-color:var(--accent);color:#06101f}
  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:16px}
  .stat{background:var(--card);border:1px solid var(--bord);border-radius:12px;padding:12px 14px}
  .stat .n{font-size:20px;font-weight:800} .stat .l{color:var(--mut);font-size:12px;margin-top:2px}
  .stat.ok .n{color:var(--ok)} .stat.warn .n{color:var(--warn)}
  table{width:100%;border-collapse:collapse;margin-top:4px}
  th,td{border:1px solid var(--bord);padding:5px 8px;font-size:12.5px;text-align:right}
  th{background:#0f1830;color:#9fb2d4;position:sticky;top:0} td.l,th.l{text-align:left}
  tr.ok td{background:rgba(34,197,94,.06)} tr.gap td{background:rgba(239,68,68,.06)}
  .d-pos{color:var(--warn)} .d-bad{color:var(--bad)} .d-ok{color:var(--ok)}
  .hint{color:var(--mut);padding:18px;text-align:center} .err{color:var(--bad);padding:18px}
  .chk{margin:0 0 10px;font-size:13px;color:var(--mut)}
</style>
</head>
<body>
<div class="wrap">
  <h1>📊 Obratová předvaha — náš deník vs Helios</h1>
  <div class="sub">Cíl: ladit předkontace a doklady, dokud se náš obraz stavů účtů nevyrovná Heliosu (EC). Zelená = účet sedí, červená = rozdíl.</div>
  <div class="tabs" id="years"></div>
  <label class="chk"><input type="checkbox" id="onlyGap"> jen účty s rozdílem</label>
  <div id="view"><div class="hint">Načítám…</div></div>
</div>
<script>
function esc(s){return(s==null?"":String(s)).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c];});}
function kc(n){return (n==null?0:Math.round(n)).toLocaleString("cs-CZ");}
function api(p){return fetch(p,{credentials:"include"}).then(function(r){
  if(!r.ok){return{ok:false,error:r.status===403?"Vidí jen účetní a vedení.":("HTTP "+r.status)};}
  return r.json();}).catch(function(){return{ok:false,error:"Spojení selhalo."};});}
var V=document.getElementById("view");
var rok=2025;
function years(){document.getElementById("years").innerHTML=[2025,2026].map(function(y){return '<button class="tab'+(y===rok?' on':'')+'" data-y="'+y+'">'+y+'</button>';}).join("");
  Array.prototype.forEach.call(document.querySelectorAll(".tab"),function(b){b.onclick=function(){rok=+b.getAttribute("data-y");years();load();};});}
document.getElementById("onlyGap").addEventListener("change",load);
function load(){
  V.innerHTML='<div class="hint">Načítám…</div>';
  api("/api/v1/erp/app/uctovani/predvaha?rok="+rok).then(function(j){
    if(!j.ok){V.innerHTML='<div class="err">'+esc(j.error)+'</div>';return;}
    var s=j.souhrn, onlyGap=document.getElementById("onlyGap").checked;
    var pct=s.uctu_helios?Math.round(100*s.uctu_sedi/s.uctu_helios):0;
    var h='<div class="stats">';
    h+='<div class="stat"><div class="n">'+s.uctu_helios+'</div><div class="l">účtů v Heliosu '+rok+'</div></div>';
    h+='<div class="stat '+(pct>=90?"ok":"warn")+'"><div class="n">'+s.uctu_sedi+' ('+pct+'%)</div><div class="l">účtů sedí s Heliosem</div></div>';
    h+='<div class="stat ok"><div class="n">'+kc(s.trzby_h)+'</div><div class="l">Tržby (60x) — firemní obrat</div></div>';
    h+='<div class="stat"><div class="n">'+kc(s.hmd)+'</div><div class="l">hrubý průtok deníku (vč. poč. stavů a převodů)</div></div>';
    h+='</div>';
    h+='<table><tr><th class="l">Účet</th><th>Helios MD</th><th>Helios DAL</th><th>náš MD</th><th>náš DAL</th><th>Δ MD</th><th>Δ DAL</th></tr>';
    var rows=j.ucty.filter(function(r){return (r.hmd||r.hdal||r.nmd||r.ndal);});
    if(onlyGap)rows=rows.filter(function(r){return !r.ok;});
    rows.forEach(function(r){
      function dcell(d){if(Math.abs(d)<1)return '<td class="d-ok">0</td>';return '<td class="'+(Math.abs(d)>1?"d-bad":"d-pos")+'">'+kc(d)+'</td>';}
      h+='<tr class="'+(r.ok?"ok":"gap")+'"><td class="l"><b>'+esc(r.ucet)+'</b></td><td>'+kc(r.hmd)+'</td><td>'+kc(r.hdal)+'</td><td>'+kc(r.nmd)+'</td><td>'+kc(r.ndal)+'</td>'+dcell(r.dmd)+dcell(r.ddal)+'</tr>';
    });
    h+='</table>';
    if(!rows.length)h+='<div class="hint">Žádné účty.</div>';
    V.innerHTML=h;
  });
}
years();load();
</script>
</body>
</html>
