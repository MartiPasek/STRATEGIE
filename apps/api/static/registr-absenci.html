<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Registr absencí</title>
<style>
  /* Peťa 21.7.2026: jednotný vzhled velkých přehledů — vzor pokladny.html / platby.html.
     Rámeček kolem tabulky, přilepená hlavička VELKÝMI, filtry POD názvy sloupců,
     roztahovací sloupce (dvojklik = zpět na výchozí). Šířky se ZÁMĚRNĚ neukládají
     do prohlížeče — po obnovení stránky je všem stejné výchozí nastavení. */
  :root{color-scheme:dark}
  *{box-sizing:border-box}
  body{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;margin:0;padding:12px 12px 24px;
       background:#0f141a;color:#e8edf6}
  h1{font-size:17px;margin:0 0 2px}
  .sub{color:#9fb0c8;font-size:12px;margin-bottom:10px}
  .bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
  .b{background:transparent;border:1px solid #3a4656;color:#cdd9ea;border-radius:9px;padding:5px 11px;
     font-size:12.5px;cursor:pointer;font-family:inherit}
  .b.on{background:#2563eb;border-color:#2563eb;color:#fff}
  .muted{color:#8fa3bd;font-size:12.5px}
  .err{color:#fecaca;background:rgba(220,38,38,.15);border:1px solid #ef4444;border-radius:9px;padding:9px 11px}
  .tag{font-size:10.5px;padding:1px 7px;border-radius:8px;white-space:nowrap}
  .tag.ok{background:#123c26;color:#8fe0a0}
  .tag.wait{background:#3b2f12;color:#fbd38d}
  .tag.no{background:#3b1418;color:#fca5a5}
  .tag.st{background:#1d2440;color:#a5b4fc}
  .tag.ec{background:#3b2f12;color:#fbd38d}

  #wrap{border:1px solid #2a3546;border-radius:8px;overflow:auto;max-height:calc(100vh - 118px)}
  #wrap::-webkit-scrollbar{width:12px;height:12px}
  #wrap::-webkit-scrollbar-track{background:#141b26}
  #wrap::-webkit-scrollbar-thumb{background:#3a4656;border-radius:6px}
  #wrap::-webkit-scrollbar-thumb:hover{background:#4a586b}

  table.abs{table-layout:fixed;border-collapse:collapse;font-size:12.5px;width:auto}
  table.abs th,table.abs td{border-right:1px solid #2a3546;border-bottom:1px solid #232c3b;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:5px 8px}
  table.abs thead th{position:sticky;top:0;z-index:3;background:#1c2636;color:#fff;font-size:11px;
    font-weight:700;text-transform:uppercase;letter-spacing:.3px;text-align:left;
    border-bottom:2px solid #34506f;position:sticky}
  table.abs thead tr.frow td{position:sticky;top:25px;z-index:2;padding:3px 4px;background:#08090c;
    border-right:1px solid #24344f;border-bottom:1px solid #24344f}
  table.abs tbody td{color:#f4f7fc}
  table.abs th{position:relative}
  table.abs th.r,table.abs td.r{text-align:right}
  table.abs th.c,table.abs td.c{text-align:center}
  table.abs thead th .grip{position:absolute;top:0;right:0;width:7px;height:100%;cursor:ew-resize;z-index:5;user-select:none}
  table.abs .frow input{width:100%;box-sizing:border-box;padding:2px 6px;font-size:11px;
    border:1px solid #363b43;border-radius:4px;background:#9fb2c8;color:#0b0d10}
  table.abs .frow input::placeholder{color:#4a5462}
  table.abs tbody tr:hover{background:#131d2b}
</style>
</head>
<body>
<h1>🏖 Registr absencí</h1>
<div class="sub">Všechny nepřítomnosti — naše i ze staré Centrály. Sloupec <b>Zdroj</b> říká, kde se záznam pořídil.</div>
<div class="bar" id="bar"></div>
<div id="box"><div class="muted">Načítám…</div></div>

<script>
var ROWS=[], FIL={}, ACTIVE=null, ROK=(new Date()).getFullYear(), VSE=false;
/* Výchozí šířky sloupců — měnit TADY. Tažení za okraj je jen dočasné, po obnovení
   stránky se vrátí sem (schválně se neukládají do prohlížeče). */
var COLDEF={sch:88,cis:60,jm:190,druh:150,od:92,do:92,mn:96,aut:130,por:126,zp:220,vp:220,zdr:92};
var COLW={};
var COLS=[
  ["sch","Schváleno","c"],["cis","Čís.","r"],["jm","Příjmení a jméno",""],["druh","Druh",""],
  ["od","Od","c"],["do","Do","c"],["mn","Dní / hodin","r"],["aut","Autor",""],
  ["por","Pořízeno","c"],["zp","Poznámka zaměstnance",""],["vp","Poznámka vedoucího",""],
  ["zdr","Zdroj","c"]
];
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function w(k){return COLW[k]||COLDEF[k]||100;}
function totW(){var t=0;COLS.forEach(function(c){t+=w(c[0]);});return t;}
function dt(s){if(!s)return '';var p=String(s).split('-');return p.length===3?(+p[2])+'.'+(+p[1])+'.'+p[0]:s;}
function mnozstvi(r){
  // Naše žádosti mají hodiny/den, Centrála počet dnů (a hodiny jako součet).
  if(r.dnu!=null) return r.dnu+' D';
  if(r.hodin!=null) return (Number(r.hodin).toFixed(2).replace('.',','))+' h/den';
  return '';
}
function stav(r){
  if(r.stav==='approved') return '<span class="tag ok">✓ ano</span>';
  if(r.stav==='rejected') return '<span class="tag no">✗ ne</span>';
  if(r.stav==='info')     return '<span class="tag wait">? info</span>';
  return '<span class="tag wait">čeká</span>';
}
function cell(r,k){
  if(k==='sch')  return stav(r);
  if(k==='cis')  return esc(r.cislo_zam);
  if(k==='jm')   return esc(r.jmeno);
  if(k==='druh') return esc(r.druh);
  if(k==='od')   return dt(r.od);
  if(k==='do')   return dt(r.do);
  if(k==='mn')   return esc(mnozstvi(r));
  if(k==='aut')  return esc(r.autor);
  if(k==='por')  return esc(r.porizeno);
  if(k==='zp')   return esc(r.zam_pozn);
  if(k==='vp')   return esc(r.ved_pozn);
  if(k==='zdr')  return r.zdroj==='Centrála'
      ? '<span class="tag ec">🏛 Centrála</span>' : '<span class="tag st">STRATEGIE</span>';
  return '';
}
function plain(r,k){
  var h=cell(r,k);
  return String(h).replace(/<[^>]*>/g,'').toLowerCase();
}
function match(r){
  for(var k in FIL){
    var v=(FIL[k]||'').trim().toLowerCase();
    if(!v) continue;
    if(plain(r,k).indexOf(v)<0) return false;
  }
  return true;
}
function render(){
  var box=document.getElementById('box');
  var rows=ROWS.filter(match);
  var h='<div id="wrap"><table class="abs" style="width:'+totW()+'px"><colgroup>';
  COLS.forEach(function(c){h+='<col data-col="'+c[0]+'" style="width:'+w(c[0])+'px">';});
  h+='</colgroup><thead><tr>';
  COLS.forEach(function(c){
    h+='<th class="'+c[2]+'">'+esc(c[1])+'<span class="grip" data-col="'+c[0]+'"></span></th>';});
  h+='</tr><tr class="frow">';
  COLS.forEach(function(c){
    h+='<td><input data-fcol="'+c[0]+'" placeholder="filtr" value="'+esc(FIL[c[0]]||'')+'"></td>';});
  h+='</tr></thead><tbody>';
  if(!rows.length) h+='<tr><td colspan="'+COLS.length+'" class="muted" style="padding:14px;">Nic nenalezeno.</td></tr>';
  rows.forEach(function(r){
    h+='<tr>';
    COLS.forEach(function(c){h+='<td class="'+c[2]+'" title="'+esc(plain(r,c[0]))+'">'+cell(r,c[0])+'</td>';});
    h+='</tr>';
  });
  h+='</tbody></table></div>';
  h+='<div class="muted" style="margin-top:6px;">Zobrazeno '+rows.length+' z '+ROWS.length+' záznamů.</div>';
  box.innerHTML=h;
  bindGrips();bindFilters();
}
function bindGrips(){
  document.querySelectorAll('table.abs thead th .grip').forEach(function(g){
    g.onmousedown=function(e){
      e.preventDefault();e.stopPropagation();
      var col=g.dataset.col,th=g.parentNode,x0=e.clientX,w0=th.offsetWidth;
      document.body.style.cursor='ew-resize';
      function mv(ev){
        var nw=Math.max(30,w0+(ev.clientX-x0));COLW[col]=nw;
        var c=document.querySelector('table.abs col[data-col="'+col+'"]');if(c)c.style.width=nw+'px';
        var tb=document.querySelector('table.abs');if(tb)tb.style.width=totW()+'px';
      }
      function up(){document.removeEventListener('mousemove',mv);document.removeEventListener('mouseup',up);
        document.body.style.cursor='';}
      document.addEventListener('mousemove',mv);document.addEventListener('mouseup',up);
    };
    g.ondblclick=function(e){e.preventDefault();e.stopPropagation();delete COLW[g.dataset.col];render();};
  });
}
function bindFilters(){
  document.querySelectorAll('[data-fcol]').forEach(function(el){
    el.oninput=function(){FIL[el.dataset.fcol]=el.value;ACTIVE=el.dataset.fcol;render();};
  });
  if(ACTIVE){
    var e=document.querySelector('input[data-fcol="'+ACTIVE+'"]');
    if(e){e.focus();try{var n=e.value.length;e.setSelectionRange(n,n);}catch(_){}}
  }
}
function renderBar(){
  var b=document.getElementById('bar');
  var y=(new Date()).getFullYear(),h='';
  for(var i=y;i>=y-2;i--)
    h+='<button class="b'+((!VSE&&ROK===i)?' on':'')+'" data-rok="'+i+'">'+i+'</button>';
  h+='<button class="b'+(VSE?' on':'')+'" data-vse="1">Vše</button>';
  h+='<button class="b" data-reload="1">↻ Načíst znovu</button>';
  b.innerHTML=h;
  b.querySelectorAll('[data-rok]').forEach(function(x){
    x.onclick=function(){ROK=parseInt(x.dataset.rok,10);VSE=false;renderBar();load();};});
  b.querySelector('[data-vse]').onclick=function(){VSE=true;renderBar();load();};
  b.querySelector('[data-reload]').onclick=function(){load();};
}
function load(){
  document.getElementById('box').innerHTML='<div class="muted">Načítám…</div>';
  var u='/api/v1/erp/app/absence-registr?'+(VSE?'vse=1':'rok='+ROK);
  fetch(u,{credentials:'same-origin'}).then(function(r){return r.json();}).then(function(j){
    if(!j||!j.ok){
      document.getElementById('box').innerHTML='<div class="err">'
        +esc((j&&j.error==='forbidden')?'Na registr absencí nemáš právo.':((j&&j.error)||'chyba'))+'</div>';
      return;
    }
    ROWS=j.rows||[];render();
  }).catch(function(e){
    document.getElementById('box').innerHTML='<div class="err">'+esc(String(e))+'</div>';
  });
}
renderBar();load();
</script>
</body>
</html>
