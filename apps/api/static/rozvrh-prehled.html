<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rozvrh — přehled po ročnících</title>
<style>
  :root{--bg:#0a1018;--card:#121a25;--bord:#1f2a38;--tx:#e6edf5;--mut:#8fa0b4;--accent:#4f8ef7;
        --green:#34d399;--amber:#fbbf24;--cj3:#a78bfa;}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--tx);font:13px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
  .wrap{max-width:none;margin:0;padding:12px}
  h1{font-size:18px;margin:0 0 2px;font-weight:800}
  .sub{color:var(--mut);font-size:12px;margin-bottom:10px}
  .bar{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:8px}
  .chip{border:1px solid var(--bord);background:transparent;color:var(--tx);border-radius:9px;padding:5px 11px;font-size:13px;font-weight:700;cursor:pointer}
  .chip.on{background:var(--accent);border-color:var(--accent);color:#06101f}
  .chip.r{border-radius:20px}
  .leg{display:flex;gap:12px;flex-wrap:wrap;margin:6px 0 10px;font-size:11px;color:var(--mut)}
  .dot{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:middle}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
  .cls{background:var(--card);border:1px solid var(--bord);border-radius:12px;padding:8px 9px}
  .cls h3{margin:0 0 6px;font-size:14px;font-weight:800;color:#bcd0e6}
  .cls .ob{font-size:10.5px;color:var(--mut);font-weight:500}
  table{border-collapse:collapse;width:100%;table-layout:fixed}
  td,th{border:1px solid #16202f;padding:1px 2px;font-size:9.5px;vertical-align:top;height:18px;overflow:hidden}
  th{background:#0f1830;color:#7f93b0;text-align:center;font-weight:700}
  td.h,th:first-child{background:#0f1830;color:#7f93b0;text-align:center;width:16px;font-weight:700}
  .b{border-radius:3px;padding:0 2px;margin:1px 0;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;cursor:pointer}
  .ovl{display:none;position:fixed;inset:0;background:rgba(4,8,14,.6);z-index:50;align-items:center;justify-content:center}
  .dcard{background:var(--card);border:1px solid #2a3a55;border-radius:14px;max-width:380px;width:92%;padding:16px 18px;box-shadow:0 12px 40px rgba(0,0,0,.5)}
  .dttl{font-size:17px;font-weight:800;margin-bottom:10px;color:#dce8f7}
  .drow{display:flex;gap:10px;padding:5px 0;border-bottom:1px solid #1b2738;font-size:13.5px}
  .dk{color:var(--mut);min-width:100px;font-weight:600}.dv{color:var(--tx);flex:1;word-break:break-word}
  .dx{margin-top:14px;text-align:right}.dx button{background:var(--accent);border:0;color:#06101f;border-radius:8px;padding:8px 16px;font-size:14px;font-weight:700;cursor:pointer}
  .j1,.j2,.j3,.tv{background:rgba(239,68,68,.22)} .pr{background:rgba(143,160,180,.16)}
  .psplit{display:flex;gap:2px;align-items:stretch;border:1px dashed rgba(124,92,252,.45);border-radius:4px;padding:1px}
  .psplit .ph{flex:1;min-width:0;display:flex;flex-direction:column}
  .psplit .pg{font-size:7.5px;font-weight:800;color:#c4b5fd;text-align:center;line-height:1.1}
  .psplit .b{margin:0}
  .hint{color:var(--mut)} .err{color:#ff8a8a}
</style>
</head>
<body>
<div class="wrap" id="root"><div class="hint" style="padding:24px">Načítám…</div></div>
<div class="ovl" id="detail"><div class="dcard"><div id="dbody"></div><div class="dx"><button id="dclose">Zavřít</button></div></div></div>
<script>
function esc(s){return(s==null?"":String(s)).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c];});}
function api(p){return fetch(p,{credentials:"include"}).then(function(r){
   if(!r.ok){var m=r.status===401?"Nejsi přihlášen — přihlas se prosím znovu.":(r.status===403?"Tento přehled vidí jen vedení a učitelé školy.":("Server vrátil chybu HTTP "+r.status+"."));return{ok:false,error:m};}
   return r.json();}).catch(function(){return{ok:false,error:"Nepodařilo se spojit se serverem."};});}
var DNI=["Po","Út","St","Čt","Pá"], HMAX=10;
var R=document.getElementById("root");
var ST={verze:[],vid:null,rocnik:null,cells:[],tridy:[],mode:"trida"};
var DET=[];
function showDetail(c){
  if(!c) return;
  var dni=["Pondělí","Úterý","Středa","Čtvrtek","Pátek"];
  var rows=[];
  function row(k,v){ if(v||v===0) rows.push('<div class="drow"><span class="dk">'+esc(k)+'</span><span class="dv">'+esc(v)+'</span></div>'); }
  var nazev=c.pred||c.predzkr||c.zkr||"Hodina";
  row("Den a hodina", dni[c.den-1]+" · "+c.hod+". hodina");
  if(c.blok==="jazyky"){
    row("Typ","Cizí jazyk"); row("Jazyk", c.zkr);
    row("Úroveň", c.cj===1?"1. cizí jazyk (AJ)":(c.cj===2?"2. cizí jazyk":(c.cj===3?"3. cizí jazyk (mezitřídní)":"")));
    if(c.spoj) row("Skupina", c.spoj);
  } else if(c.blok==="tv"){
    row("Typ","Tělocvik"); row("Kdo", c.zkr);
    row("Cyklus", c.cykl==="L"?"lichý týden":(c.cykl==="S"?"sudý týden":"každý týden"));
    if(c.spoj && (c.tridy||[]).length>1) row("Spojené třídy","ano ("+c.spoj+")");
  } else { row("Typ","Odborný předmět"); if(c.zkr) row("Skupina", c.zkr); }
  row("Učitel", (c.ucitel||c.uk||"")+(c.uk&&c.ucitel&&c.ucitel!==c.uk?" ("+c.uk+")":""));
  if(c.mist) row("Učebna", c.mist);
  row("Třídy", (c.tridy||[]).join(", "));
  document.getElementById("dbody").innerHTML='<div class="dttl">'+esc(nazev)+'</div>'+rows.join("");
  document.getElementById("detail").style.display="flex";
}
function closeDetail(){ document.getElementById("detail").style.display="none"; }
document.getElementById("dclose").onclick=closeDetail;
document.getElementById("detail").onclick=function(e){ if(e.target===this) closeDetail(); };
document.addEventListener("keydown",function(e){ if(e.key==="Escape") closeDetail(); });
// obor = část za tečkou; pořadí oborů
var OBP={"GD":1,"MI":2,"CR":3,"VO":4,"ZO":5,"A":6,"B":7,"O":8,"L":9};
function obor(t){var p=(t||"").split(".");return p[1]||"";}
function rocnik(t){var m=(t||"").match(/^(\d)/);return m?m[1]:"?";}
function load(){
  api("/api/v1/erp/app/rozvrh/verze").then(function(j){
    if(!j||!j.ok){R.innerHTML='<div class="err" style="padding:24px">'+esc((j&&j.error)||"Neznámá chyba")+'</div>';return;}
    if(!(j.verze||[]).length){R.innerHTML='<div class="hint" style="padding:24px">Zatím žádné varianty.</div>';return;}
    ST.verze=j.verze; ST.vid=j.verze[0].id; loadGrid();
  });
}
function loadGrid(){
  api("/api/v1/erp/app/rozvrh/grid?verze="+ST.vid+"&pohled=trida&klic=").then(function(j){
    if(!j||!j.ok){R.innerHTML='<div class="err" style="padding:24px">'+esc((j&&j.error)||"Neznámá chyba")+'</div>';return;}
    ST.cells=j.cells||[]; ST.tridy=j.tridy||[];
    var rs=[]; ST.tridy.forEach(function(t){var r=rocnik(t); if(rs.indexOf(r)<0)rs.push(r);}); rs.sort();
    if(!ST.rocnik||rs.indexOf(ST.rocnik)<0) ST.rocnik=rs[0];
    render(rs);
  });
}
function cellClass(c){ if(c.blok==="tv")return"tv"; if(c.blok==="predmet")return"pr"; return c.cj===1?"j1":(c.cj===2?"j2":"j3"); }
function ucColor(uk){ if(!uk)return""; if(uk==="UNS6G")return"#ff8ad1"; var hsh=0; for(var i=0;i<uk.length;i++){hsh=(hsh*31+uk.charCodeAt(i))>>>0;} return "hsl("+(hsh%360)+","+(62+(hsh>>9)%22)+"%,74%)"; }
function cellLabel(c){ if(c.blok==="predmet"){var w=c.predzkr||((c.pred||"").split(" ")[0]); return w+(c.zkr?(" "+c.zkr):"")+(c.mist?(" "+c.mist):"");} if(c.blok==="tv")return c.predzkr||c.zkr||"TV"; return (c.zkr||"JAZ"); }
function chip(c){ var lb=cellLabel(c), cl=cellClass(c);
  var stl=(c.blok==="predmet"&&c.uk)?(' style="color:'+ucColor(c.uk)+'"'):"";
  return '<span class="b '+cl+'" data-ci="'+(DET.push(c)-1)+'"'+stl+' title="'+esc((c.pred||c.zkr||"")+(c.ucitel?(" · "+c.ucitel):"")+(c.mist?(" · "+c.mist):""))+'">'+esc(c.blok==="jazyky"?"JAZ":lb)+'</span>'; }
function tchip(c){ // pohled učitele: předmět + třída + učebna
  var p=c.predzkr||((c.pred||"").split(" ")[0]); if(c.blok==="tv")p="TV"; if(c.blok==="jazyky")p=(c.zkr||"JAZ");
  var tr=(c.tridy||[]).join(","); var lb=p+(c.zkr&&c.blok==="predmet"?(" "+c.zkr):"")+(tr?(" "+tr):"")+(c.mist?(" "+c.mist):"");
  return '<span class="b '+cellClass(c)+'" data-ci="'+(DET.push(c)-1)+'" title="'+esc((c.pred||"")+" · "+tr+(c.mist?(" · "+c.mist):""))+'">'+esc(lb)+'</span>'; }
function gridCellTrida(arr){
  var h="";
  var grp=[],rest=[],seen={};
  arr.forEach(function(c){ if(c.blok==="predmet"&&c.zkr) grp.push(c); else { var k=cellClass(c)+"|"+(c.blok==="jazyky"?"JAZ":cellLabel(c)); if(!seen[k]){seen[k]=1;rest.push(c);} } });
  rest.forEach(function(c){ h+=chip(c); });
  if(grp.length){
    var byg={},og=[]; grp.forEach(function(c){ if(!byg[c.zkr]){byg[c.zkr]=[];og.push(c.zkr);} byg[c.zkr].push(c); });
    h+='<span class="psplit">';
    og.forEach(function(g){ h+='<span class="ph"><span class="pg">'+esc(g)+'</span>'; byg[g].forEach(function(c){h+=chip(c);}); h+='</span>'; });
    h+='</span>';
  }
  return h;
}
function miniGrid(title,titleColor,cells,cellFn){
  var grid={}; cells.forEach(function(c){ ((grid[c.den]=grid[c.den]||{})[c.hod]=grid[c.den][c.hod]||[]).push(c); });
  var h='<div class="cls"><h3'+(titleColor?(' style="color:'+titleColor+'"'):'')+'>'+title+'</h3><table><tr><th></th>';
  for(var d=1;d<=5;d++) h+='<th>'+DNI[d-1]+'</th>';
  h+='</tr>';
  for(var hh=1;hh<=HMAX;hh++){
    h+='<tr><td class="h">'+hh+'</td>';
    for(var d=1;d<=5;d++){ h+='<td>'+cellFn((grid[d]&&grid[d][hh])||[])+'</td>'; }
    h+='</tr>';
  }
  return h+'</table></div>';
}
function render(rs){
  DET=[];
  var h='<h1>🗓️ Rozvrh — přehled '+(ST.mode==="ucitel"?"po učitelích":"po ročnících")+'</h1><div class="sub">Nerudovka 2026/2027 · vyber variantu a '+(ST.mode==="ucitel"?"prohlédni úvazek každého učitele.":"ročník, vidíš všechny třídy oboru vedle sebe.")+'</div>';
  h+='<div class="bar">';
  ST.verze.forEach(function(v){ h+='<button class="chip'+(v.id===ST.vid?' on':'')+'" data-v="'+v.id+'">'+esc(v.nazev)+'</button>'; });
  h+='</div>';
  h+='<div class="bar"><button class="chip'+(ST.mode==="trida"?" on":"")+'" data-m="trida">📚 Třídy</button><button class="chip'+(ST.mode==="ucitel"?" on":"")+'" data-m="ucitel">👩‍🏫 Učitelé</button></div>';
  if(ST.mode==="ucitel"){
    var teach={};
    ST.cells.forEach(function(c){ if(!c.uk)return; (teach[c.uk]=teach[c.uk]||{nm:(c.ucitel||c.uk),cells:[]}).cells.push(c); });
    var tks=Object.keys(teach).sort(function(a,b){return teach[a].nm.toLowerCase().localeCompare(teach[b].nm.toLowerCase());});
    h+='<div class="grid">';
    tks.forEach(function(uk){
      var hod=teach[uk].cells.filter(function(c){return c.blok==="predmet"||c.blok==="tv"||c.blok==="jazyky";}).length;
      // dedup spojené (stejný slot+label) pro počet
      h+=miniGrid(esc(teach[uk].nm), ucColor(uk), teach[uk].cells, function(arr){
        var seen={},out="";
        arr.forEach(function(c){ var k=c.den+"|"+c.hod+"|"+(c.pred||c.zkr)+"|"+(c.tridy||[]).join(","); if(seen[k])return; seen[k]=1; out+=tchip(c); });
        return out;
      });
    });
    h+='</div>';
    if(!tks.length) h+='<div class="hint">Žádní učitelé.</div>';
  } else {
    h+='<div class="bar">';
    rs.forEach(function(r){ h+='<button class="chip r'+(r===ST.rocnik?' on':'')+'" data-r="'+esc(r)+'">'+esc(r)+'. ročník</button>'; });
    h+='</div>';
    h+='<div class="leg"><span><span class="dot" style="background:#ef4444"></span><b>1. blok — jazyky + tělocvik</b> (hotovo)</span><span><span class="dot" style="background:#8fa0b4"></span>2. blok — odborné (chystá se)</span></div>';
    var cls=ST.tridy.filter(function(t){return rocnik(t)===ST.rocnik;});
    cls.sort(function(a,b){return (OBP[obor(a)]||99)-(OBP[obor(b)]||99) || a.localeCompare(b);});
    h+='<div class="grid">';
    cls.forEach(function(t){
      var cc=ST.cells.filter(function(c){return (c.tridy||[]).indexOf(t)>=0;});
      var ob=esc(({GD:"grafický design",MI:"multimédia",CR:"cestovní ruch",VO:"vnitřní obchod",ZO:"zahraniční obchod",A:"aranžér",L:"lyceum",B:"?",O:"?"})[obor(t)]||"");
      h+=miniGrid(esc(t)+' <span class="ob">'+ob+'</span>', null, cc, gridCellTrida);
    });
    h+='</div>';
    if(!cls.length) h+='<div class="hint">V tomto ročníku nejsou třídy.</div>';
  }
  R.innerHTML=h;
  R.onclick=function(e){ var el=e.target.closest&&e.target.closest(".b[data-ci]"); if(el){ showDetail(DET[+el.getAttribute("data-ci")]); } };
  Array.prototype.forEach.call(document.querySelectorAll(".chip[data-v]"),function(b){b.onclick=function(){ST.vid=+b.getAttribute("data-v");loadGrid();};});
  Array.prototype.forEach.call(document.querySelectorAll(".chip[data-r]"),function(b){b.onclick=function(){ST.rocnik=b.getAttribute("data-r");render(rs);};});
  Array.prototype.forEach.call(document.querySelectorAll(".chip[data-m]"),function(b){b.onclick=function(){ST.mode=b.getAttribute("data-m");render(rs);};});
}
load();
</script>
</body>
</html>
