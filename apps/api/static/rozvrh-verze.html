<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Varianty rozvrhu — Nerudovka</title>
<style>
  :root{--bg:#0a1018;--card:#121a25;--bord:#1f2a38;--tx:#e6edf5;--mut:#8fa0b4;--accent:#4f8ef7;
        --green:#34d399;--amber:#fbbf24;--aj:#4f8ef7;--cj2:#34d399;--cj3:#a78bfa;}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
  .wrap{max-width:1200px;margin:0 auto;padding:14px}
  h1{font-size:19px;margin:0 0 2px;font-weight:800}
  .sub{color:var(--mut);font-size:12.5px;margin-bottom:12px}
  .bar{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
  .chip{border:1px solid var(--bord);background:transparent;color:var(--tx);border-radius:9px;padding:6px 12px;font-size:13px;font-weight:700;cursor:pointer}
  .chip.on{background:var(--accent);border-color:var(--accent);color:#06101f}
  .chip .b{font-size:10.5px;opacity:.8;margin-left:5px;font-weight:600}
  .seg{display:inline-flex;border:1px solid var(--bord);border-radius:9px;overflow:hidden}
  .seg button{background:transparent;color:var(--tx);border:0;padding:6px 12px;font-size:13px;font-weight:700;cursor:pointer}
  .seg button.on{background:#16223a;color:var(--accent)}
  select{background:#0a1226;color:var(--tx);border:1px solid #2b3a5c;border-radius:8px;padding:7px 10px;font-size:14px}
  table{border-collapse:collapse;width:100%;margin-top:8px}
  th,td{border:1px solid var(--bord);padding:4px 5px;font-size:12px;vertical-align:top;text-align:left}
  th{background:#0f1830;color:#9fb2d4;font-weight:700;text-align:center;white-space:nowrap}
  td.h{background:#0f1830;color:#9fb2d4;font-weight:700;text-align:center;width:34px}
  .cell{border-radius:6px;padding:3px 5px;margin:1px 0;font-size:11.5px;line-height:1.35}
  .l1{background:rgba(79,142,247,.18);border-left:3px solid var(--aj)}
  .l2{background:rgba(52,211,153,.16);border-left:3px solid var(--cj2)}
  .l3{background:rgba(167,139,250,.16);border-left:3px solid var(--cj3)}
  .cell b{font-size:12px} .cell .m{color:var(--mut);font-size:10.5px}
  .hint{color:var(--mut)} .err{color:#ff8a8a}
  .leg{display:flex;gap:12px;flex-wrap:wrap;margin:8px 0;font-size:11.5px;color:var(--mut)}
  .dot{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:middle}
  @media(max-width:640px){.wrap{padding:8px} th,td{font-size:11px;padding:3px}}
</style>
</head>
<body>
<div class="wrap" id="root"><div class="hint" style="padding:24px">Načítám…</div></div>
<script>
function qs(k){var v=new URLSearchParams(location.search).get(k);if(v)return v;
  try{if(window.__opcUrl)return new URL(window.__opcUrl,location.origin).searchParams.get(k);}catch(e){}return null;}
function esc(s){return(s==null?"":String(s)).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c];});}
function api(p){return fetch(p,{credentials:"include"}).then(function(r){return r.json();}).catch(function(){return{ok:false,error:"spojení"};});}
var DNI=["Po","Út","St","Čt","Pá"], HMAX=9;
var R=document.getElementById("root");
var ST={verze:[], vid:null, pohled:"trida", klic:"", tridy:[], ucitele:[]};

function load(){
  api("/api/v1/erp/app/rozvrh/verze").then(function(j){
    if(!j||!j.ok){R.innerHTML='<div class="err" style="padding:24px">'+esc((j&&j.error==="forbidden")?"🔒 Vidí jen vedení a učitelé školy.":((j&&j.error)||"Chyba"))+'</div>';return;}
    ST.verze=j.verze||[];
    if(!ST.verze.length){R.innerHTML='<div class="hint" style="padding:24px">Zatím žádné vygenerované varianty.</div>';return;}
    ST.vid=ST.verze[0].id;
    loadGrid();
  });
}
function loadGrid(){
  var u="/api/v1/erp/app/rozvrh/grid?verze="+ST.vid+"&pohled="+ST.pohled+"&klic="+encodeURIComponent(ST.klic);
  api(u).then(function(j){
    if(!j||!j.ok){R.innerHTML='<div class="err" style="padding:24px">'+esc((j&&j.error)||"Chyba")+'</div>';return;}
    ST.tridy=j.tridy||[]; ST.ucitele=j.ucitele||[];
    if(!ST.klic){ ST.klic = (ST.pohled==="trida") ? (ST.tridy[0]||"") : ((ST.ucitele[0]&&ST.ucitele[0].kod)||"");
      if(ST.klic){ return loadGrid(); } }
    render(j.cells||[]);
  });
}
function render(cells){
  var v=ST.verze.filter(function(x){return x.id===ST.vid;})[0]||{};
  var h='<h1>🗓️ Varianty rozvrhu — Nerudovka 2026/2027</h1>'
    +'<div class="sub">Vygenerovaná jazyková kostra (iterace 1: cizí jazyky). Porovnej varianty, přepínej pohled tříd/učitelů.</div>';
  // verze chipy
  h+='<div class="bar">';
  ST.verze.forEach(function(vz){
    h+='<button class="chip'+(vz.id===ST.vid?' on':'')+'" data-vid="'+vz.id+'">'+esc(vz.nazev)
      +'<span class="b">skóre '+vz.skore+(vz.neumisteno?(' · '+vz.neumisteno+' neum.'):'')+'</span></button>';
  });
  h+='</div>';
  // pohled + picker
  h+='<div class="bar"><span class="seg"><button data-p="trida" class="'+(ST.pohled==="trida"?"on":"")+'">📚 Třídy</button>'
    +'<button data-p="ucitel" class="'+(ST.pohled==="ucitel"?"on":"")+'">👩‍🏫 Učitelé</button></span>';
  h+='<select id="pick">';
  if(ST.pohled==="trida"){ ST.tridy.forEach(function(t){h+='<option value="'+esc(t)+'"'+(t===ST.klic?' selected':'')+'>'+esc(t)+'</option>';}); }
  else { ST.ucitele.forEach(function(u){h+='<option value="'+esc(u.kod)+'"'+(u.kod===ST.klic?' selected':'')+'>'+esc(u.jmeno)+'</option>';}); }
  h+='</select></div>';
  h+='<div class="leg"><span><span class="dot" style="background:var(--aj)"></span>1. cizí jazyk (AJ)</span>'
    +'<span><span class="dot" style="background:var(--cj2)"></span>2. cizí jazyk (Z)</span>'
    +'<span><span class="dot" style="background:var(--cj3)"></span>3. cizí jazyk (D)</span></div>';
  // mřížka
  var grid={};
  cells.forEach(function(c){ (grid[c.den]=grid[c.den]||{})[c.hod]=(grid[c.den][c.hod]||[]); grid[c.den][c.hod].push(c); });
  h+='<table><tr><th>hod</th>';
  for(var d=1;d<=5;d++) h+='<th>'+DNI[d-1]+'</th>';
  h+='</tr>';
  for(var hh=1;hh<=HMAX;hh++){
    h+='<tr><td class="h">'+hh+'.</td>';
    for(var d=1;d<=5;d++){
      h+='<td>';
      var arr=(grid[d]&&grid[d][hh])||[];
      arr.forEach(function(c){
        var cls=c.cj===1?"l1":(c.cj===2?"l2":"l3");
        var right = ST.pohled==="trida" ? esc(c.ucitel) : esc((c.tridy||[]).join(", "));
        h+='<div class="cell '+cls+'"><b>'+esc(c.zkr||c.pred)+'</b> <span class="m">'+right+'</span></div>';
      });
      h+='</td>';
    }
    h+='</tr>';
  }
  h+='</table>';
  h+='<div class="sub" style="margin-top:10px">Varianta „'+esc(v.nazev||"")+'" · skóre '+(v.skore||0)+' (nižší = lepší) · neumístěno '+(v.neumisteno||0)+'. Iterace 1 = jen cizí jazyky; ostatní předměty, učebny a obědy přibudou v dalších krocích.</div>';
  R.innerHTML=h;
  Array.prototype.forEach.call(document.querySelectorAll(".chip[data-vid]"),function(b){ b.onclick=function(){ ST.vid=+b.getAttribute("data-vid"); loadGrid(); }; });
  Array.prototype.forEach.call(document.querySelectorAll(".seg button[data-p]"),function(b){ b.onclick=function(){ ST.pohled=b.getAttribute("data-p"); ST.klic=""; loadGrid(); }; });
  var pk=document.getElementById("pick"); if(pk) pk.onchange=function(){ ST.klic=this.value; loadGrid(); };
}
load();
</script>
</body>
</html>
