<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Učení — Ano / Možná / Ne</title>
<style>
  :root{--bg:#0a0e1a;--pan:#121828;--pan2:#0e1422;--bord:#1f2940;--tx:#e7edf7;--mut:#8a98b5;
        --blue:#4f8ef7;--green:#34d399;--amber:#fbbf24;--red:#f87171;--vio:#a78bfa}
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--tx);
    font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif;line-height:1.55}
  .wrap{max-width:520px;margin:0 auto;padding:16px 14px 40px}
  .tabs{display:flex;gap:8px;margin-bottom:14px}
  .tab{flex:1;padding:9px 4px;border:1px solid var(--bord);border-radius:11px;background:var(--pan2);
       color:var(--mut);font-size:12.5px;font-weight:600;text-align:center;cursor:pointer;line-height:1.2}
  .tab.on{color:var(--tx);border-color:var(--blue);background:rgba(79,142,247,.12)}
  .dots{display:flex;gap:5px;justify-content:center;flex-wrap:wrap;margin-bottom:14px}
  .dot{width:7px;height:7px;border-radius:50%;background:var(--bord)}
  .card{background:linear-gradient(180deg,var(--pan),var(--pan2));border:1px solid var(--bord);
        border-radius:18px;padding:18px;min-height:300px}
  .cap{font-size:13px;font-weight:600;color:var(--mut);letter-spacing:.3px;margin-bottom:8px}
  .desc{font-size:16px;line-height:1.6;margin-bottom:12px}
  .desc b{color:#fff}
  .q{font-size:18px;font-weight:600;margin:8px 0 16px}
  .media{margin:4px 0 14px;background:var(--pan2);border:1px solid var(--bord);border-radius:12px;padding:10px}
  .btns{display:flex;justify-content:space-between;gap:8px}
  .btns button{flex:1;padding:14px 6px;border-radius:12px;border:1px solid var(--bord);
    background:var(--pan2);font-size:16px;font-weight:600;cursor:pointer}
  .b-ano{color:var(--green);border-color:rgba(52,211,153,.5)}
  .b-mozna{color:var(--amber);border-color:rgba(251,191,36,.5)}
  .b-ne{color:var(--red);border-color:rgba(248,113,113,.5)}
  .fb{margin-top:14px}
  .fbx{background:var(--pan2);border:1px solid var(--bord);border-radius:12px;padding:12px;font-size:14px;color:var(--mut)}
  .nextb{margin-top:10px;width:100%;padding:13px;border-radius:12px;border:1px solid var(--blue);
    background:rgba(79,142,247,.12);color:var(--tx);font-size:15px;font-weight:600;cursor:pointer}
  .done{text-align:center;padding:30px 10px}
  .done .ic{font-size:40px;color:var(--green)}
  .muted{color:var(--mut);font-size:12px;text-align:center;margin-top:12px}
  a{color:var(--blue)}
</style>
</head>
<body>
<div class="wrap">
  <div class="tabs" id="tabs">
    <div class="tab on" data-src="electro_intro">Co je elektřina</div>
    <div class="tab" data-src="mp_strag_komun">Jak se učit</div>
    <div class="tab" data-src="electro_rozvadec">Rozváděče</div>
  </div>
  <div class="dots" id="dots"></div>
  <div class="card" id="card"><p class="muted">Načítám…</p></div>
  <p class="muted">Neinvazivní výuka — vše jen na třech tlačítkách. Tvoje tempo.</p>
</div>
<script>
var ALL=[], FR=[], src="electro_intro", i=0, GL={};
function esc(x){return (x||"")}
function barrierOf(f){
  var c=(f.caption||"").toLowerCase();
  if(c.indexOf("slovo")>=0) return "word";
  if(c.indexOf("masy")>=0||c.indexOf("masa")>=0) return "mass";
  if(c.indexOf("gradient")>=0) return "gradient";
  if(f.source && f.source.indexOf("electro")===0) return "mass";
  return "none";
}
function currentSVG(){
  var p="M24 40 H118 l8 -15 l11 30 l11 -30 l11 30 l11 -30 l8 15 H276";
  var e=[0,0.66,1.33].map(function(b){return '<circle r="4" fill="#4f8ef7"><animateMotion dur="2s" begin="'+b+'s" repeatCount="indefinite" path="'+p+'"/></circle>';}).join("");
  return '<svg viewBox="0 0 300 78" width="100%"><path d="'+p+'" fill="none" stroke="#8a98b5" stroke-width="2" stroke-linejoin="round"/>'+
    '<rect x="14" y="28" width="10" height="24" rx="2" fill="none" stroke="#8a98b5" stroke-width="2"/>'+
    '<rect x="276" y="28" width="10" height="24" rx="2" fill="none" stroke="#8a98b5" stroke-width="2"/>'+
    '<text x="150" y="70" text-anchor="middle" style="font-size:11px;fill:#8a98b5">napětí tlačí proud, odpor (klikatá část) ho brzdí</text>'+e+'</svg>';
}
function mediaHTML(f){
  if(f.media && f.media.length){
    return f.media.map(function(m){
      if(m.kind==="video") return '<div class="media"><video src="'+m.url+'" controls playsinline style="width:100%;border-radius:8px"></video>'+(m.caption?'<div class="muted">'+m.caption+'</div>':'')+'</div>';
      return '<div class="media"><img src="'+m.url+'" alt="'+(m.caption||'')+'" style="width:100%;border-radius:8px">'+(m.caption?'<div class="muted">'+m.caption+'</div>':'')+'</div>';
    }).join("");
  }
  if(barrierOf(f)==="mass") return '<div class="media">'+currentSVG()+'</div>';
  return "";
}
function renderDots(){
  document.getElementById('dots').innerHTML=FR.map(function(_,k){
    var c=k===i?'var(--blue)':(k<i?'var(--mut)':'var(--bord)');
    return '<span class="dot" style="background:'+c+'"></span>';}).join("");
}
function render(){
  renderDots();
  var card=document.getElementById('card');
  if(i>=FR.length){
    card.innerHTML='<div class="done"><div class="ic">&#10004;</div>'+
      '<p style="font-size:18px;font-weight:600;margin:10px 0 4px">Hotovo</p>'+
      '<p class="muted">Takhle se učí bez tlaku — tři tlačítka, tvoje tempo, žádná bariéra nezůstane stát.</p>'+
      '<button class="nextb" onclick="i=0;render()" style="margin-top:16px">Znovu od začátku</button></div>';
    return;
  }
  var f=FR[i];
  var h="";
  if(f.caption) h+='<div class="cap">'+esc(f.caption)+'</div>';
  if(f.description_html) h+='<div class="desc">'+f.description_html+'</div>';
  h+=mediaHTML(f);
  if(f.question) h+='<div class="q">'+f.question+'</div>';
  h+='<div class="btns">'+
     '<button class="b-ano" data-a="ano">Ano</button>'+
     '<button class="b-mozna" data-a="mozna">Možná</button>'+
     '<button class="b-ne" data-a="ne">Ne</button></div>'+
     '<div class="fb" id="fb"></div>';
  card.innerHTML=h;
  Array.prototype.forEach.call(card.querySelectorAll('button[data-a]'),function(b){
    b.onclick=function(){answer(b.getAttribute('data-a'),f);};
  });
}
function answer(a,f){
  if(a==="ano"){ i++; render(); return; }
  var b=barrierOf(f), fb=document.getElementById('fb');
  var msg, ic;
  if(b==="word"){ msg="Žádný problém — vyjasníme slovo a jedeme dál. To je přesně ta správná zpětná vazba."; ic="&#128214;"; }
  else if(b==="mass"){ msg="Proto je tu „masa“ — podívej se na obrázek/animaci/video nad otázkou. Co nevidíš, to si těžko představíš."; ic="&#128444;"; }
  else if(b==="gradient"){ msg="Díky, že jsi to řekl. Zpomalíme, vrátíme se o krok a přidáme procvičení. Tvoje tempo je správné tempo."; ic="&#129496;"; }
  else { msg="Nic se neděje — vrátíme se, až budeš chtít. Žádný tlak."; ic="&#128075;"; }
  var pre=(a==="ne")?"":"V pohodě, nejistota je v pořádku. ";
  fb.innerHTML='<div class="fbx">'+ic+'&nbsp; '+pre+msg+'</div>'+
    '<button class="nextb" onclick="i++;render()">Rozumím, pokračovat &#8594;</button>';
}
function load(){
  document.getElementById('card').innerHTML='<p class="muted">Načítám…</p>';
  fetch('/api/v1/erp/app/learn/frames?source='+encodeURIComponent(src),{credentials:'include'})
    .then(function(r){ if(r.status===401){throw new Error('auth');} return r.json(); })
    .then(function(d){
      if(!d.ok){throw new Error('err');}
      ALL=d.frames||[]; FR=ALL; (d.glossary||[]).forEach(function(g){GL[g.term]=g.definition_html;});
      i=0; render();
    })
    .catch(function(e){
      document.getElementById('card').innerHTML= (e.message==='auth')
        ? '<div class="done"><p>Nejdřív se přihlas.</p><p><a href="/chat?return=/uceni">Přihlásit se &#8594;</a></p></div>'
        : '<div class="done"><p class="muted">Nepodařilo se načíst obsah.</p></div>';
    });
}
Array.prototype.forEach.call(document.querySelectorAll('.tab'),function(t){
  t.onclick=function(){
    Array.prototype.forEach.call(document.querySelectorAll('.tab'),function(x){x.classList.remove('on');});
    t.classList.add('on'); src=t.getAttribute('data-src'); load();
  };
});
load();
</script>
</body>
</html>
