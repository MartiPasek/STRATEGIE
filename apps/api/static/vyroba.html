<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>🏭 Plánovač výroby</title>
<style>
  :root{ --bg:#0b1016; --pan:#121a24; --pan2:#0f1620; --tx:#e6edf3; --mut:#9fb0c0;
         --bd:#22303f; --grn:#10b981; --blue:#3b82f6; --amb:#f59e0b; --red:#ef4444; }
  *{ box-sizing:border-box; }
  body{ font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif; background:var(--bg);
        color:var(--tx); margin:0; padding:0 0 60px; line-height:1.5; }
  .wrap{ max-width:1000px; margin:0 auto; padding:14px; }
  h1{ font-size:1.35rem; margin:6px 0 2px; }
  .sub{ color:var(--mut); font-size:.85rem; margin-bottom:14px; }
  .card{ background:var(--pan); border:1px solid var(--bd); border-radius:12px;
         padding:12px 14px; margin-bottom:12px; }
  .pname{ font-weight:600; font-size:1.05rem; }
  .pmeta{ color:var(--mut); font-size:.82rem; margin-top:2px; }
  .arow{ display:flex; align-items:flex-start; gap:8px; padding:8px 0; border-top:1px solid var(--bd); }
  .arow:first-of-type{ border-top:none; }
  .ord{ font-weight:600; color:#cfe3ff; }
  .pokyn{ color:var(--mut); font-size:.86rem; margin-top:2px; }
  .ozvat{ color:var(--amb); font-size:.82rem; margin-top:1px; }
  .sp{ flex:1; min-width:0; }
  button{ font-family:inherit; cursor:pointer; border:none; border-radius:9px;
          padding:8px 12px; font-size:14px; color:#fff; background:#1e2a38; }
  button.grn{ background:var(--grn); } button.blue{ background:var(--blue); }
  button.red{ background:transparent; color:var(--red); border:1px solid var(--red); padding:5px 9px; font-size:13px; }
  button.gh{ background:transparent; color:var(--mut); border:1px solid var(--bd); }
  button.sm{ padding:4px 8px; font-size:13px; }
  input,textarea,select{ width:100%; background:var(--pan2); border:1px solid var(--bd);
        border-radius:9px; padding:9px 11px; color:var(--tx); font-size:14px; font-family:inherit; margin-top:6px; }
  .assignBox{ margin-top:10px; padding:10px; background:var(--pan2); border:1px solid var(--bd); border-radius:10px; }
  .hint{ color:var(--mut); font-size:.82rem; }
  .res b{ color:#cfe3ff; }
  .pick{ display:block; width:100%; text-align:left; margin-top:6px; background:#16202c; }
  .pick.on{ outline:2px solid var(--grn); }
  .fb{ border-top:1px solid var(--bd); padding:7px 0; font-size:.9rem; }
  .fb b{ color:#cfe3ff; } .fb .t{ color:var(--mut); font-size:.78rem; }
  .toast{ position:fixed; left:50%; bottom:18px; transform:translateX(-50%);
          background:#10b981; color:#04150e; padding:9px 16px; border-radius:10px;
          font-weight:600; opacity:0; transition:.25s; pointer-events:none; }
  .toast.show{ opacity:1; }
  .gate{ text-align:center; color:var(--mut); padding:40px 16px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>🏭 Plánovač výroby</h1>
  <div class="sub">Přiřazuj lidem zakázky, piš pokyny, sleduj zpětnou vazbu. Plán z Excelu je podklad — tady ho ladíš.</div>
  <div id="gate" class="gate" style="display:none;">Tahle obrazovka je jen pro vedoucího výroby a jeho zástupce.</div>
  <div id="content" style="display:none;">
    <div class="card" id="fbCard">
      <div style="display:flex;align-items:center;gap:8px;">
        <b>🛠 Zpětná vazba z výroby</b>
        <span class="hint" id="fbCount"></span>
        <span style="flex:1;"></span>
        <button class="gh sm" id="reload">↻ Obnovit</button>
      </div>
      <div id="fb"></div>
    </div>
    <div id="people"></div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
var API="/api/v1/erp";
function api(m,u,b){ return fetch(API+u,{method:m,credentials:"include",cache:"no-store",
  headers:b?{"Content-Type":"application/json"}:{},body:b?JSON.stringify(b):undefined})
  .then(function(r){return r.json().catch(function(){return{ok:false};});}); }
function esc(s){ return String(s==null?"":s).replace(/[&<>"]/g,function(c){
  return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]; }); }
function toast(t){ var e=document.getElementById("toast"); e.textContent=t; e.classList.add("show");
  setTimeout(function(){e.classList.remove("show");},1800); }

function loadFeedback(){
  api("GET","/app/vyroba/zpravy","").then(function(j){
    var box=document.getElementById("fb"); box.innerHTML="";
    var z=(j&&j.zpravy)||[];
    document.getElementById("fbCount").textContent=z.length?("("+z.length+")"):"(zatím nic)";
    z.slice(0,15).forEach(function(m){
      box.appendChild(elHtml('<div class="fb"><b>'+esc(m.jmeno)+'</b>'
        +(m.cislo?(' · '+esc(m.cislo)):'')+' <span class="t">'+esc(m.kdy)+'</span><br>'+esc(m.text)+'</div>'));
    });
  });
}
function elHtml(h){ var d=document.createElement("div"); d.innerHTML=h; return d.firstChild; }

function loadPeople(){
  api("GET","/app/vyroba/lidi","").then(function(j){
    var box=document.getElementById("people"); box.innerHTML="";
    var lidi=(j&&j.lidi)||[];
    if(!lidi.length){ box.innerHTML='<div class="hint">Žádní lidé v plánu. Spusť ⚙ sync plánu výroby.</div>'; return; }
    lidi.forEach(function(p){ box.appendChild(personCard(p)); });
  });
}

function personCard(p){
  var c=elHtml('<div class="card"></div>');
  c.appendChild(elHtml('<div class="pname">'+esc(p.jmeno)+'</div>'));
  c.appendChild(elHtml('<div class="pmeta">'+(p.dnes?('Dnes v plánu: '+esc(p.dnes)):'Dnes bez plánu')+'</div>'));
  var list=elHtml('<div style="margin-top:6px;"></div>'); c.appendChild(list);
  (p.prirazeni||[]).forEach(function(a,i){
    var row=elHtml('<div class="arow"></div>');
    var sp=elHtml('<div class="sp"></div>');
    sp.appendChild(elHtml('<div class="ord">📌 '+esc(a.cislo)+(a.nazev?(' — '+esc(a.nazev)):'')+'</div>'));
    if(a.pokyn) sp.appendChild(elHtml('<div class="pokyn">📋 '+esc(a.pokyn)+'</div>'));
    if(a.kdy_ozvat) sp.appendChild(elHtml('<div class="ozvat">⏰ ozvi se: '+esc(a.kdy_ozvat)+'</div>'));
    row.appendChild(sp);
    var up=elHtml('<button class="gh sm" title="nahoru">▲</button>');
    up.onclick=function(){ reorder(p,a,-1); };
    var dn=elHtml('<button class="gh sm" title="dolů">▼</button>');
    dn.onclick=function(){ reorder(p,a,1); };
    var x=elHtml('<button class="red" title="zrušit">✕</button>');
    x.onclick=function(){ api("POST","/app/vyroba/prirazeni/"+a.id+"/zrusit",{}).then(function(r){
      if(r&&r.ok){ toast("Zrušeno"); loadPeople(); } }); };
    row.appendChild(up); row.appendChild(dn); row.appendChild(x);
    list.appendChild(row);
  });
  var addBtn=elHtml('<button class="grn sm" style="margin-top:8px;">➕ Přiřadit zakázku</button>');
  var boxWrap=elHtml('<div></div>');
  addBtn.onclick=function(){
    if(boxWrap.firstChild){ boxWrap.innerHTML=""; return; }
    boxWrap.appendChild(assignBox(p));
  };
  c.appendChild(addBtn); c.appendChild(boxWrap);
  return c;
}

function reorder(p,a,dir){
  var arr=p.prirazeni||[]; var idx=arr.indexOf(a); var j=idx+dir;
  if(j<0||j>=arr.length) return;
  var other=arr[j];
  // prohodit poradi
  api("POST","/app/vyroba/prirazeni/"+a.id+"/poradi",{poradi:other.poradi});
  api("POST","/app/vyroba/prirazeni/"+other.id+"/poradi",{poradi:a.poradi}).then(function(){ loadPeople(); });
}

function assignBox(p){
  var box=elHtml('<div class="assignBox"></div>');
  box.appendChild(elHtml('<div class="hint">Najdi zakázku (číslo / název):</div>'));
  var si=elHtml('<input placeholder="🔍 např. VR106… nebo název">');
  var res=elHtml('<div class="res" style="margin-top:6px;"></div>');
  var chosen={cislo:null};
  var pokyn=elHtml('<textarea rows="2" placeholder="Pokyn — co tam má dělat"></textarea>');
  var ozvat=elHtml('<input placeholder="Kdy se ozvat / kdy přejít na další (volitelné)">');
  var go=elHtml('<button class="grn" style="margin-top:8px;">Přiřadit</button>');
  go.disabled=true; go.style.opacity=".5";
  function load(){
    var q=(si.value||"").trim();
    api("GET","/app/zakazky"+(q?("?q="+encodeURIComponent(q)):""),"").then(function(j){
      res.innerHTML=""; var list=(j&&j.zakazky)||[];
      list.slice(0,12).forEach(function(z){
        var b=elHtml('<button class="pick sm">'+(z.typ==="REZIE"?"🧰 ":"🧾 ")+esc(z.cislo)+" — "+esc(z.nazev||"")+'</button>');
        b.onclick=function(){
          chosen.cislo=z.cislo;
          Array.prototype.forEach.call(res.children,function(x){x.classList.remove("on");});
          b.classList.add("on"); go.disabled=false; go.style.opacity="1";
        };
        res.appendChild(b);
      });
    });
  }
  var tmr=null; si.addEventListener("input",function(){ clearTimeout(tmr); tmr=setTimeout(load,300); });
  go.onclick=function(){
    if(!chosen.cislo) return;
    go.disabled=true;
    api("POST","/app/vyroba/prirazeni",{user_id:p.user_id,cislo_zakazky:chosen.cislo,
        pokyn:(pokyn.value||"").trim(),kdy_ozvat:(ozvat.value||"").trim()}).then(function(r){
      if(r&&r.ok){ toast("Přiřazeno + odesláno"); loadPeople(); }
      else { toast("Chyba: "+((r&&r.error)||"?")); go.disabled=false; }
    });
  };
  box.appendChild(si); box.appendChild(res);
  box.appendChild(pokyn); box.appendChild(ozvat); box.appendChild(go);
  load();
  return box;
}

function start(){
  api("GET","/app/vyroba/can-manage","").then(function(j){
    if(!(j&&j.ok&&j.can_manage)){ document.getElementById("gate").style.display="block"; return; }
    document.getElementById("content").style.display="block";
    loadFeedback(); loadPeople();
  });
}
document.getElementById("reload").onclick=function(){ loadFeedback(); loadPeople(); toast("Obnoveno"); };
start();
</script>
</body>
</html>
